# humor-collector settings. Relative paths are relative to the project directory.

[general]
db_path = "data/humor.db"
log_dir = "data/logs"
export_dir = "data/exports"
# Identify the bot honestly. Put a contact URL or e-mail here so operators can reach you.
user_agent = "humor-collector/0.1 (personal research; respects robots.txt)"
request_timeout = 20.0        # seconds per request
max_retries = 3               # retries for timeouts / connection errors / 429 / 5xx
backoff_base = 2.0            # 2s, 4s, 8s (+ jitter); Retry-After is honoured (capped at 120s)
default_delay = 3.0           # minimum seconds between requests to the same host
respect_robots = true         # robots.txt Disallow and Crawl-delay (protego)
blocked_cooldown_hours = 12   # after a CAPTCHA/challenge the source pauses this long
detail_max_attempts = 3       # retries of a failed post page across runs
check_cache_hours = 24        # per-author checks (Bluesky visibility declaration) before storing a new post
recheck_cache_hours = 168     # ... and when `refresh` re-checks stored posts

[output]
# Posts with these flags are hidden from `top` and `export` unless --all is given.
exclude_flags = ["off_topic", "nsfw", "politics", "sensitive"]

[scoring]
weights = { likes = 0.5, comments_count = 0.25, views = 0.25 }
shrink_k = 10.0               # percentile shrinkage toward 0.5 for sources with few posts
dislike_penalty = 0.15
rank_weight = 0.15
rank_horizon = 100
cross_source_bonus = 0.05     # per extra community where the same post was found
cross_source_bonus_max = 0.10

[dedup]
title_ratio = 90.0            # rapidfuzz ratio of normalized titles (0-100)
body_jaccard = 0.6            # 3-gram Jaccard of bodies, together with title_ratio
body_only_jaccard = 0.85      # bodies alone (both >= long_body_len chars)
min_body_len = 30
long_body_len = 150
min_exact_title_len = 8       # image/list-only posts: identical normalized title of >= 8 chars
window_days = 30

[trends]
# `python main.py trends`: phrases repeated in titles of several recent posts (meme / 짤 names)
window_days = 7               # "recent" window
baseline_days = 28            # earlier period used to tell bursts from always-common words
min_docs = 3                  # distinct posts (re-uploads count once) ...
min_sources_if_two_docs = 2   # ... or 2 posts from 2+ different communities
min_ratio = 3.0               # recent rate / baseline rate (only once a baseline exists)
extra_stop_phrases = []       # add generic words that keep showing up, e.g. ["아이폰"]

[youtube]
# `python main.py youtube search ...` and `trends --youtube N`. Needs your own free API key in the
# YOUTUBE_API_KEY environment variable (never put the key in this file) and a one-time
# `python main.py youtube accept-terms`. Display-only lookups run by you: no scheduled
# harvesting, results kept apart from community posts, never scored or merged.
api_key_env = "YOUTUBE_API_KEY"
region = "KR"
language = "ko"
days = 7                      # videos published in the last N days (`youtube search`)
trend_days = 30               # window for `trends --youtube N`
short_only = true             # videoDuration=short (< 4 min, includes Shorts)
max_results = 25
cache_hours = 24              # reuse an answer for the same search; deleted after this (max 29 days)
max_rows = 500                # cap on cached rows
daily_search_cap = 90         # local stop below YouTube's 100 search calls/day

# --------------------------------------------------------------------------- sources
# Listing overrides: [sources.<name>.listings.<listing>] max_pages = N / enabled = false
# `python main.py sources` shows every listing name.

[sources.ruliweb]
enabled = true
delay = 3.0
allowed_boards = ["300143"]   # 300143 = 유머 게시판; 힛갤 also contains game/hobby boards
min_likes = 10                # 유머 BEST "now" list includes posts that just entered (few likes)

[sources.bobaedream]
enabled = true
delay = 3.0
allowed_categories = ["유머게시판", "신유머/이슈/움짤"]

[sources.dogdrip]
enabled = true
delay = 10.0                  # robots.txt Crawl-delay: 10
min_likes = 20

[sources.bluesky]
enabled = true
feeds = ["jaem_30_reposts", "ko_most_reposted"]   # see collectors/bluesky.py DEFAULT_FEEDS
page_size = 50
languages = ["ko"]
delay = 3.0
retention_days = 90           # stored Bluesky posts are deleted 90 days after first seen
# extra_feeds = [{ name = "my_feed", uri = "at://did:plc:.../app.bsky.feed.generator/...", label = "..." }]

[sources.lemmy]
enabled = true
instance = "https://lemmy.world"
communities = ["funny@lemmy.world", "jokes@lemmy.world"]
recent_sorts = ["TopDay", "TopWeek"]
archive_sorts = ["TopAll"]
page_size = 20
max_pages = 1
# lemmy.world robots.txt Crawl-delay: 60 -> one request per minute (applied automatically)

[studio]
# `python main.py plot ...` / `script ...`: 수집한 글 -> 캐릭터 없는 4컷 플롯 -> 캐릭터를 입힌 대본.
classics_path = "reference/classics.toml"   # 쓸 수 있는 개그·신조어와 쓰면 안 되는 밈
panels = 4
max_roles = 3
max_lines_per_panel = 2       # 컷당 말풍선 수
max_line_chars = 24           # 말풍선 하나의 글자 수(띄어쓰기 포함). 휴대폰에서 읽어 보고 조정하세요
max_narration_chars = 30
max_hook_chars = 20           # 1컷 위에 얹는 한 줄
max_hashtags = 5              # 인스타그램이 2025년 12월에 게시물당 5개로 줄인다고 알림
max_classics = 1              # 한 편에 쓰는 고전 개그 수(가끔만)
max_slang = 2                 # 한 편에 쓰는 신조어 수
classic_cooldown = 15         # 최근 N개 플롯에서 쓴 고전 개그는 피함
variants = 3                  # 초안 수(반전형, 공감형, 대화형). API를 쓸 때만 해당
max_fix_rounds = 2            # 자동 검사에 걸린 것을 다시 쓰게 하는 횟수
max_source_chars = 3000       # 글 본문을 여기까지만 LLM에 보냄(넘으면 알림)
min_body_chars = 60           # 이보다 짧은 글은 소재 후보에서 뺌
# 원문과의 겹침: 이 값 이상이면 오류(베낀 것으로 봄)
max_common_run = 12           # 띄어쓰기를 뺀 연속 일치 글자 수
max_line_ratio = 85.0         # 대사 한 줄이 원문과 닮은 정도(0~100)
warn_jaccard = 0.30           # 전체 글의 3글자 조각 겹침(경고만)
# 금지 밈 목록의 낱말 중 평범한 말로도 쓰여서 막지 않을 것
not_banned = ["합시다", "쓰레기", "골목식당"]

[studio.llm]
# 유료입니다. 켜기 전에는 어떤 API도 부르지 않습니다. 키는 환경변수 ANTHROPIC_API_KEY로 줍니다(이 파일에 쓰지 않음).
# 끈 채로도 `--prompt-only`로 지시문을 받아 쓰던 채팅 LLM에 붙여 넣는 방식으로 전부 쓸 수 있습니다.
enabled = false
model = "claude-opus-5-5"
effort = "high"
max_tokens = 32000

[studio.format]
# 그림 규격. 대본 끝에 그대로 적혀 나갑니다. 플롯에는 들어가지 않습니다.
layout = "carousel"           # carousel: 한 컷이 한 장 / single: 4컷을 한 장에
canvas = "1080x1440"          # 3:4. 인스타그램이 2025년 5월부터 지원
safe_margin_x = 34            # 글자와 중요한 그림을 가장자리에서 띄우는 여백(계산값, 공식 규격 아님)
safe_margin_y = 45
min_text_px = 48              # 추정값. 휴대폰에서 읽어 보고 조정하세요
closing_slide = false         # 계정 안내 장을 마지막에 붙일지

[studio.production]
# 만드는 방식. 대본의 "올릴 때 확인"에 적혀 나갑니다.
art = "ai"                    # ai | human | mixed
script = "llm+human"
disclosure = "그림과 글에 AI를 사용했습니다."   # 본문 끝에 붙일 문구. 빈 문자열이면 생략
