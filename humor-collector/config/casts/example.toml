# 캐릭터 묶음 예시. 이 파일을 복사해 이름, 생김새, 성격, 말투를 바꿔 쓰세요.
# 같은 플롯에 다른 파일을 주면 다른 캐릭터로 대본이 나옵니다.
#   python main.py script cast <플롯 번호> --cast config/casts/example.toml
name = "분식 친구들 (예시)"
world = "음식들이 사람처럼 학교와 회사에 다니는 동네. 가게와 소품은 음식 세계에 맞게 바꾼다."
# style과 look은 그림 지시문(script prompts)에 그대로 들어갑니다. 몸 모양, 색, 눈에 띄는 특징을 적을수록 그림이 덜 흔들립니다.
style = "굵은 외곽선, 단순한 얼굴, 납작한 색면, 파스텔 배경의 귀여운 만화체."

