caution = "문구에 상표 '쿠쿠'가 들어가므로 로고, 제품 디자인, 실제 녹음 음성은 쓰지 말고 필요하면 '밥솥이 맛있는 밥을 완성했습니다'처럼 바꾼다. 정확한 문구가 확인되지 않아 원문 인용처럼 표기하지 않는다. 2010년 이전부터 쓰인 음성일 수 있어 조사 범위에 맞는지 애매하다. 쿠쿠 광고모델이던 김수현은 2025년 3월 고 김새론과 미성년 시절 교제했다는 의혹에 휩싸였다. 이후 쿠쿠는 홍보를 중단하고 김수현과 소속사를 상대로 20억 원대 손해배상 소송을 냈고, 김수현 측은 의혹을 부인하고 있다. 그러니 이 문구를 쓸 때 김수현을 닮은 캐릭터나 그의 출연작 대사를 섞지 않는다."
