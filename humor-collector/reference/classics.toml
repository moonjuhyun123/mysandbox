caution = "말 자체가 일상 표현이 되었으므로 실존 개그맨의 이름이나 얼굴과 연결하지 않고 표현만 쓴다. 개그콘서트 방송 화면은 KBS 저작물이다. 원조로 알려진 개그맨 유상무는 2016년 강간미수 혐의로 경찰이 기소의견으로 검찰에 송치했다. 검찰은 2016년 12월 불기소(혐의없음) 처분을 내렸다. 그러니 이 표현을 유상무나 개그콘서트 코너와 연결하는 설명, 해시태그, 캡션은 붙이지 않는다. 이번 검색에서도 개그콘서트가 원조라는 근거는 확인되지 않았다."
