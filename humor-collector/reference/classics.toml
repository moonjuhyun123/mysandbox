fame_evidence = "스포츠경향(2012.6.27) 기사 제목이 '어딜가나 대세는 개콘 고~뤠 스크린도 접수'였다. 김준현은 애니메이션 <모모와 다락방의 수상한 요괴들> 더빙 대사에 이 유행어를 넣었다."
caution = "김준현은 실존 인물이다. 체형을 소재로 삼아 비하로 읽히지 않게 한다. KBS 영상은 쓰지 않는다. 김준현은 2026년 2월 방송국 출근길 영상으로 '팬 무시' 태도 논란이 보도됐고(옹호 의견도 있음), 2026년 3월 SM C&C와 재계약하지 않고 결별했다. '고뤠?'를 인사를 무시하는 장면, 팬을 냉대하는 장면, 윗사람에게만 굽히는 장면에 쓰지 않는다. 김준현을 떠올리게 하는 체형이나 외모로 캐릭터를 그리지 않는다."
verified = "verified"
notes = "내용은 맞다. 처음 쓴 회차는 미확인이고, 표기는 '고뤠에??', '고~뤠' 등으로 여러 가지다."
sources = ["https://sports.khan.co.kr/article/201206272017023", "https://namu.moe/w/비상대책위원회(개그콘서트)"]
caution_sources = ["https://www.heraldk.com/article/2026021715455521402", "https://sports.khan.co.kr/article/202602172232003", "https://www.tenasia.com/amp/2026031911434"]

[[classic]]
