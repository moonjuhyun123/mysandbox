origin = "'달고 짠 맛'의 줄임말이다. 2014년 출시된 허니버터칩이 인기를 끈 뒤 단짠 신제품이 잇따랐고, 토요경제 2016년 6월 21일 기사가 '2030세대에게 익숙한 단어'라고 보도했다."
meaning = "단맛과 짠맛을 번갈아 먹어 계속 손이 가는 중독적인 조합을 뜻한다. 비유적으로 좋은 일과 나쁜 일이 번갈아 오는 상황에도 쓴다."
use_when = "달달한 간식과 짭짤한 간식을 번갈아 먹으며 멈추지 못하는 컷, 기분이 오르내리는 상황에 맞는다."
food_fit = "초콜릿 캐릭터와 감자칩 캐릭터가 손을 잡고 '단짠 콤비'를 결성하는 장면, 허니버터 계열 과자 캐릭터 장면에 잘 맞는다."
fame = 4
fame_evidence = "토요경제 2016년 6월 기사가 단짠을 2030세대에게 익숙한 신조어로 소개하고, 프링글스·세븐일레븐·맥도날드의 단짠 신제품을 다뤘다."
caution = "허니버터칩 등 실제 제품명과 포장 디자인은 상표이므로 그대로 그리지 않는다. 그 밖의 민감 요소는 없다."
verified = "verified"
risk_checked = true
notes = "말이 처음 쓰인 곳과 시점은 미확인이다. 그 밖의 내용은 기사와 일치한다."
sources = ["https://www.sateconomy.co.kr/news/view/179588842174893"]

[[slang]]
name = "아샷추"
aliases = ["아이스티에 샷 추가", "복숭아 아샷추"]
category = "음식"
year = "미확인 (2018년 기사 용례)"
origin = "'아이스티에 샷 추가'의 줄임말로, 아이스티에 에스프레소 샷을 넣은 음료를 이른다. 우리말샘 용례인 매일경제 2018년 4월 기사는 블로그·커뮤니티 인증 글과 함께 시험 기간 대학생 사이에서 입소문을 탔다고 적었으며, 최초 시점은 미확인이다."
meaning = "달콤한 아이스티에 쓴 커피 샷을 더한 의외의 조합 음료이자 그 조합 자체를 가리키는 말이다."
use_when = "의외의 조합이 잘 어울리는 장면, 서로 다른 성격의 두 캐릭터가 손을 잡는 장면, 카페 주문 장면에 어울린다."
food_fit = "복숭아 아이스티 캐릭터와 에스프레소 샷 캐릭터가 처음엔 어색해하다가 합쳐져 '아샷추'로 변신하는 장면으로 바로 쓸 수 있다."
fame = 4
fame_evidence = "우리말샘 표제어이며 매일경제 2018년 4월부터 일간스포츠 2025년 8월까지 용례가 이어진다."
caution = "특정 아이스티 브랜드나 카페 프랜차이즈의 로고와 컵 디자인을 그대로 쓰지 않는다."
verified = "partial"
risk_checked = true
notes = "카테고리를 '음식'으로 고쳤다. 정식 메뉴화한 프랜차이즈와 최초 시점은 나무위키 접근이 막히고 검색 한도가 소진되어 확인하지 못했다."
sources = ["https://opendict.korean.go.kr/dictionary/view?sense_no=1666521"]

[[slang]]
name = "수능 금지곡"
aliases = ["링딩동", "수능 금지곡 (중독성 곡)"]
category = "음악·챌린지"
year = "2009 (곡 발매), 밈은 2010년대 이후 매년 수능 시즌 유행"
origin = "한 번 들으면 머릿속에서 떠나지 않아 수험생이 피해야 한다는 중독성 곡을 부르는 말이다. 2009년 10월 14일 발매된 샤이니 '링딩동'이 수험생 투표에서 여러 차례 1위 수능 금지곡으로 꼽혔다. 표현이 처음 생긴 시점은 미확인이다."
meaning = "너무 중독적이라 공부나 일에 집중을 방해하는 노래나 소리를 가리킨다."
use_when = "캐릭터 머릿속에서 노래가 무한 반복되는 장면, 수능 시즌 응원 장면, 시험 전날 집중하지 못하는 장면에 어울린다."
food_fit = "수능 응원 간식인 엿·찹쌀떡 캐릭터가 귀를 막거나, 중독성 있는 CM송을 흥얼거리는 캐릭터를 말리는 장면으로 쓸 수 있다."
fame = 5
fame_evidence = "영문 위키백과가 '링딩동'이 수험생들에게 여러 차례 1위 수능 금지곡으로 뽑혔다고 적고 있고, 고구마팜 2025년 밈 총결산(2025.12.17)은 새 밈에 '링딩동을 잇는 수능 금지곡'이라는 별명이 붙었다고 소개했다."
caution = "곡 가사와 음원은 저작권 대상이므로 제목이나 의성어 수준으로만 인용한다. 샤이니 멤버 고(故) 종현과 관련된 묘사는 피하고 곡과 개념만 활용한다."
verified = "partial"
risk_checked = true
notes = "고구마팜 2025 결산에 '링딩동을 잇는 수능 금지곡'이라는 별도 카테고리가 있는 것이 아니라, 안무가 카니의 즉흥 암기송 밈이 그런 별명을 얻었다고 소개한 것이다. 원곡 발매는 2009년이다."
sources = ["https://gogumafarm.kr/?p=48285", "https://en.wikipedia.org/wiki/Ring_Ding_Dong_(Shinee_song)"]

[[slang]]
name = "뿜뿜 (모모랜드)"
aliases = ["뿜뿜", "매력 뿜뿜"]
category = "음악·챌린지"
year = "2018 (2018.1.3 발매, 같은 해 유행)"
origin = "모모랜드 세 번째 미니앨범 'GREAT!'의 타이틀곡 '뿜뿜'(2018.1.3 발매, 신사동호랭이 작곡). 좋아하는 사람에게 매력을 발산하겠다는 가사이고, 발매 쇼케이스에서 멤버들이 '에너지가 뿜뿜 넘친다', '매력을 뿜뿜 뿜어내겠다'고 말했다. 이 곡 때문에 '매력 뿜뿜'이 퍼졌다는 근거는 미확인."
meaning = "매력이나 에너지가 마구 넘쳐흐르는 상태."
use_when = "캐릭터가 매력을 발산하며 반짝이는 컷."
food_fit = "탄산음료 거품이나 팝콘이 매력을 '뿜뿜' 터뜨리는 장면."
fame = 4
fame_evidence = "경북매일(2018.1.4) 쇼케이스 기사 제목이 '저희는 에너지가 뿜뿜 넘치는 걸그룹'이다. 뮤직비디오는 2018년 7월 2억 뷰를 넘었다(텐아시아). 다만 유행어로 퍼졌다는 기사는 찾지 못했다."
caution = "이미 일상어처럼 쓰여서 밈으로 안 읽힐 수 있다. 음원, 안무 영상, 멤버 초상은 쓰지 않는다. 김생민의 '그뤠잇' 추임새는 본인 논란이 있으니 함께 쓰지 않는다. 작곡가 신사동호랭이는 2024년 2월 23일 세상을 떠났으므로, 작곡가나 제작 과정을 농담 소재로 삼지 않는다. 발매 직후 러시아 그룹 세레브로의 '미미미' 표절 논란 보도가 있었으니 멜로디나 후렴 리듬을 흉내 내지 않는다. 2022년 대선 때 더불어민주당 로고송으로도 쓰였으므로 선거철에는 피한다."
verified = "partial"
risk_checked = true
notes = "곡 정보와 '뿜뿜'의 뜻은 확인했다. '이 곡 이후 매력 뿜뿜이 퍼졌다'는 통설은 이번에도 근거를 찾지 못했다(곡보다 먼저 쓰였는지도 미확인)."
sources = ["https://ko.wikipedia.org/wiki/뿜뿜", "https://kbmaeil.com/article/201801040210962", "https://www.tenasia.co.kr/article/2018071377604", "https://www.ajunews.com/view/20180423105604958"]
caution_sources = ["https://www.hankyung.com/amp/2024022365457", "https://sports.khan.co.kr/article/201801251738003", "https://www.seoul.co.kr/news/2022/02/11/20220211500139"]

[[slang]]
name = "TMI"
aliases = ["Too much information", "티엠아이"]
category = "인터넷·커뮤니티"
year = "미확인 (국내 유행 2018)"
origin = "영어 표현 'Too much information'의 약자로, 묻지 않은 과한 정보를 늘어놓을 때 쓴다. 2018년 국내 대표 신조어로 자리 잡았으며, 국내에서 처음 퍼진 곳은 미확인이다."
meaning = "듣는 사람이 궁금해하지 않는 지나치게 사소하거나 사적인 정보를 뜻한다."
use_when = "한 캐릭터가 아무도 묻지 않은 정보를 길게 늘어놓아 주변이 질려하는 장면, 자기소개가 쓸데없이 상세한 장면에 맞는다."
food_fit = "라면이 '나 사실 면발 다 이으면 몇 미터야' 같은 TMI를 늘어놓거나, 과자가 원재료명을 줄줄 읊어 주변 음식들이 지루해하는 장면에 쓸 수 있다."
fame = 5
fame_evidence = "인크루트 '2018 유행어 설문조사' 관련 매일신문 결산(2018.12.24)에서 갑분싸, 인싸와 함께 그해 젊은 층의 유행어로 소개되었다."
caution = "일반 약어여서 권리 문제는 적다. 실존 인물의 사생활 정보를 TMI로 소재 삼지 않아야 한다."
verified = "partial"
risk_checked = true
notes = "2018년 유행은 확인했으나 국내 확산 경로와 첫 사용처는 미확인이다(검색 한도 초과로 추가 확인 불가)."
sources = ["https://www.imaeil.com/page/view/2018122413365425381"]

[[slang]]
name = "~맛집 (얼굴 맛집·노래 맛집)"
aliases = ["얼굴 맛집", "○○ 맛집", "노래 맛집"]
category = "인터넷·커뮤니티"
year = "미확인 (2026년 국립국어원 조사 보도에서 확인)"
origin = "'맛집'을 음식점이 아니라 '무엇을 아주 잘하거나 수준이 높은 곳·사람'이라는 뜻으로 넓혀 쓰는 표현이다. 국립국어원 '2025년 국어 사용 실태 조사' 보도(2026.02.05)에서 '얼굴 맛집'이 일상 표현의 예로 소개되었으며, 처음 쓰인 시점은 미확인이다."
meaning = "'○○ 맛집'은 그 분야를 매우 잘하는 곳이나 사람을 칭찬하는 말이다."
use_when = "누군가의 장기나 외모를 칭찬하는 장면, 가게 간판을 '리액션 맛집'이나 '눈물 맛집'으로 패러디하는 장면에 쓴다."
food_fit = "음식 캐릭터가 자기 가게 간판을 '○○ 맛집'으로 바꿔 다는 컷이나, 진짜 맛집인데 '얼굴 맛집'으로 소문나는 반전에 바로 쓸 수 있다."
