caution = "실존 인물 박지훈의 초상권에 주의하고, 손동작과 멘트만 캐릭터로 재현한다. 프로듀스 투표 조작 사건은 언급하지 않는다."
verified = "verified"
notes = "'국민저장남' 애칭은 텐아시아가 아니라 맥스무비(2025) 기사에서 확인했다. 텐아시아 기사에는 '윙크남', '완판남'만 나온다."
