caution = "출연자 실명·얼굴과 KBS 방송 화면은 그대로 쓰지 말 것. 2015년 발연기 장면의 김주혁은 2017년 세상을 떠났으므로 그 장면 패러디는 피할 것. 시즌2(2012) 이후는 나영석 PD 연출이 아님. 2014~2015년 시즌3 까나리카노 회차의 고정 멤버 정준영은 2020년 9월 집단 성폭행 등으로 징역 5년이 확정됐다. 2019.12.8 시즌4 첫 회 '100잔 복불복' 멤버 중 라비는 뇌전증을 연기한 병역비리로 징역 1년·집행유예 2년이 확정됐고, 김선호는 2021년 사생활 논란으로 하차했다. 이 회차들의 장면이나 멤버 구도는 재현하지 말고 '색이 같은 음료 복불복'이라는 장치만 쓸 것."
verified = "verified"
