aliases = ["달고나 뽑기", "달고나 챌린지", "우산 모양 달고나", "무궁화 꽃이 피었습니다", "영희 인형", "깐부", "우린 깐부잖아"]
category = "드라마·영화"
year = "2021"
origin = "넷플릭스 '오징어 게임' 시즌1(2021.9.17 공개). 1화 '무궁화 꽃이 피던 날'의 거대 인형 게임, 두 번째 게임인 달고나 뽑기, 6화 '깐부'의 '깐부'라는 말이 세계적 밈이 됐다. 달고나 회차는 3화 '우산을 쓴 남자'로 보이나 직접 확인하지는 못했다."
meaning = "움직이면 탈락하는 얼음 상황, 깨지면 끝인 아슬아슬한 작업, 끈끈한 동료를 뜻하는 '깐부'."
use_when = "냉장고 문이 열리자 얼음이 되는 컷, 조마조마한 미션 컷, 우정을 확인하는 컷."
food_fit = "달고나 캐릭터가 깨질까 봐 벌벌 떠는 셀프 개그, 오징어 캐릭터가 인형처럼 '무궁화 꽃이~', 과자끼리 '우린 깐부잖아'."
fame = 5
fame_evidence = "넷플릭스 역대 최다 시청 시리즈가 됐고 프라임타임 에미상 6개를 받았다. Reuters와 NYT(2021.10)는 달고나 노점 매출 2배를, YTN은 해외의 달고나 만들기와 무궁화 게임 패러디 확산을 보도했다. 시즌2(2024.12)와 시즌3(2025.6)까지 이어졌다."
caution = "데스게임이 원작이라 총격이나 '탈락=사망' 묘사는 넣지 않는다. 인형, 핑크 경비원, 초록 트레이닝복 디자인은 넷플릭스 IP라 패러디 수준으로만 쓴다. 오일남 역 오영수 배우는 2022년 강제추행 혐의로 기소돼 1심에서 유죄를 받았지만, 2025년 11월 2심에서 무죄를 받았고 2026년 6월 대법원에서 무죄가 확정됐다. 피해자 측이 판결에 반발한 사안이니 '깐부'를 쓸 때 배우가 떠오르지 않게 한다. '깐부'는 실제 치킨 프랜차이즈 '깐부치킨'의 상호다. 2025년 10월 30일 젠슨 황·이재용·정의선의 '깐부치킨 회동' 뒤 이 브랜드는 'AI 깐부' 세트까지 내놨다. 치킨이나 음식 캐릭터가 '깐부'를 외치는 장면이 이 브랜드나 재계 회동 패러디로 읽히지 않게 하고, 상호나 간판처럼 쓰지 않는다."
verified = "partial"
risk_checked = true
notes = "1화 제목은 '무궁화 꽃이 피던 날'이고 게임 이름이 '무궁화 꽃이 피었습니다'다. 달고나가 3화라는 점과 '우린 깐부잖아'의 정확한 대사는 이번에 원문으로 확인하지 못했다(웹검색 한도 소진). '2024 시즌2 홍보 때 파리·시드니 재현'과 '이베이 키트 판매'도 출처를 확인하지 못해 뺐다."
sources = ["https://ko.wikipedia.org/wiki/오징어_게임", "https://en.wikipedia.org/wiki/Dalgona", "https://en.wikipedia.org/wiki/List_of_Squid_Game_episodes", "https://www.ytn.co.kr/_ln/0106_202110030407200126"]
caution_sources = ["https://www.dailian.co.kr/news/view/1571763/", "https://sports.khan.co.kr/article/202511111608013", "https://www.segye.com/newsView/20260626514455", "https://supple.kr/news/cmquooosi0025eof8riizpg5h", "https://www.etoday.co.kr/news/view/2520900", "https://www.smarttoday.co.kr/ko-kr/articles/95346", "https://m.seoul.co.kr/news/2025/11/04/20251104500223"]

