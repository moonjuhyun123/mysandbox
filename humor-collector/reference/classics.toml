meaning = "추워도 아이스 음료를 포기하지 못하는 고집, 또는 취향을 굽히지 않는 태도다."
use_when = "겨울 에피소드(11월 시즌에 맞음), 카페 장면, 덜덜 떨면서 아이스를 주문하는 컷에 쓴다."
food_fit = "아이스 아메리카노 캐릭터가 패딩을 입고 눈보라 속에서 얼음을 고집하고, 따뜻한 라떼 캐릭터가 걱정한다."
fame = 5
fame_evidence = "경향 레이디(2023.1)가 '역시즌 트렌드의 대표 사례'로 소개하며 스타벅스의 11~2월 아이스 음료 비중이 60%를 넘는다고 썼다. 한국교육신문은 2020년 스타벅스 조사의 '10명 중 6명 아이스'를 인용했다. 위키낱말사전에도 올라 있다."
verified = "partial"
risk_checked = true
notes = "'2018년 트위터의 얼어 죽어도 아이스 커피 협회 선언문' 기원설은 출처에서 확인되지 않아 미확인이다. '61%'는 출처상 '60% 넘음' 또는 '10명 중 6명'으로만 확인된다. 나무위키는 403으로 열리지 않았고, 검색 한도가 소진돼 추가 확인을 못 했다."
sources = ["https://lady.khan.co.kr/issue/article/202301101030011", "https://www.hangyo.com/mobile/article.html?no=96556", "https://en.wiktionary.org/wiki/얼죽아"]

[[slang]]
