food_fit = "유통기한 지난 우유나 시커멓게 탄 토스트를 젓가락이나 식재료 운구단이 관에 메고 춤추며 나간다."
fame = 4
fame_evidence = "틱톡 코리아 공식 뉴스룸이 2020년 6월 '#관짝밈'을 소개했다. DI today는 국내 커뮤니티 확산을 보도했고, 2020년 8월에는 의정부고 졸업사진 패러디가 기사화될 만큼 학생층까지 퍼졌다."
