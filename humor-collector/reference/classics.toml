risk_checked = true
sources = ["https://ko.wikipedia.org/wiki/화질구지"]

[[slang]]
name = "확찐자"
aliases = ["확찐자 (집콕 체중 증가)", "살천지"]
category = "인터넷·커뮤니티"
year = "2020"
origin = "코로나19로 집에 머무는 시간이 늘면서 살이 급격히 찐 사람을 '확진자'에 빗댄 2020년 유행어다. 전북일보(2020.10.15) NIE 칼럼은 경향신문 기사(2020.10.1)를 인용해 '집콕', '홈트', '코로나블루'와 함께 대표 코로나 신조어로 소개했다. 최초 사용자는 미확인이다."
meaning = "집에만 있다가 살이 확 찐 상태를 자조적으로 이르는 말이다."
use_when = "캐릭터가 오랜 휴식 끝에 체중계에 올라 놀라는 장면, 연휴나 방학 뒤 몸이 불어난 자신을 보는 장면에 어울린다."
food_fit = "부풀어 오른 찐빵, 반죽이 발효되어 커진 빵, 팝콘처럼 튀겨 커진 캐릭터가 '나 확찐자'라고 자조하는 장면으로 자연스럽게 쓸 수 있다."
fame = 4
fame_evidence = "전북일보 2020년 10월 15일 칼럼 '코로나 신조어로 본 2020 대한민국'에 대표 신조어로 실렸다."
caution = "'확진자'를 비튼 말이라 감염병 환자나 유족에게 불쾌감을 줄 수 있으므로 환자나 방역 상황을 연상시키는 연출은 피하고 캐릭터 자신의 자조로만 쓴다. 다른 사람의 체형을 두고 쓰면 외모 비하가 될 수 있다. 2020년 맥락의 말이라 지금은 다소 지난 유행으로 느껴질 수 있다. 대법원은 2021년 9월 30일, 청주시청 공무원이 부하 직원의 몸을 찌르며 '확찐자가 여기 있네'라고 말한 사건에서 벌금 100만원을 확정했다(2021도9253). 1·2심 재판부는 '확찐자'가 외모를 비하하고 부정적인 사회적 평가를 담은 말이라며 모욕죄를 인정했다. 법원이 모욕 표현으로 본 말이므로 캐릭터끼리라도 한 캐릭터가 다른 캐릭터를 '확찐자'라고 부르거나 놀리는 연출은 피하고, 캐릭터가 자기 자신을 두고 하는 자조로만 쓴다."
verified = "verified"
risk_checked = true
sources = ["https://www.jjan.kr/article/20201015718336"]
caution_sources = ["https://www.lawtimes.co.kr/news/173291"]

[[slang]]
name = "홧김비용 (시발비용)"
aliases = ["시발비용", "ㅅㅂ비용", "sibal biyong"]
category = "인터넷·커뮤니티"
year = "2016 (밈 유행 2017)"
origin = "2016년 11월 한 트위터 사용자(신원 미확인)가 '스트레스를 받지 않았다면 쓰지 않았을 비용'이라는 정의와 예시를 올리면서 알려졌다. 서울신문 2017년 2월 기사는 해당 게시물이 2만 회 넘게 리트윗되었다고 전했다."
meaning = "스트레스를 받아 홧김에 쓰는 돈, 즉 화가 나지 않았다면 쓰지 않았을 지출을 이른다."
use_when = "야근이나 상사의 꾸중 뒤 충동적으로 배달 음식을 시키거나 택시를 타는 장면, 지친 하루 끝에 자신을 위로하는 소비 장면에 어울린다."
food_fit = "야근 뒤 주문된 치킨 캐릭터가 '나는 오늘의 홧김비용이야'라고 자기소개하거나, 마카롱 캐릭터가 홧김에 팔려 가는 장면으로 쓸 수 있다. 서울신문 기사에도 홧김에 시킨 치킨과 마카롱이 예로 나온다."
fame = 4
fame_evidence = "위키백과 단독 항목이 있고, 2019년 Foreign Policy가 sibal biyong으로 소개하며 여러 국내 매체가 '올해의 신조어'로 꼽았다고 적었다. 서울신문 2017년 기사에는 인크루트 설문에서 성인 10명 중 8명이 홧김에 지출한 경험이 있다고 나온다."
caution = "원어에 욕설이 들어 있으므로 만화에서는 방송처럼 '홧김비용'으로 표기한다. 원조 트윗 작성자는 일반인이므로 계정이나 캡처를 노출하지 않는다."
verified = "verified"
risk_checked = true
notes = "대표 표기를 '홧김비용'으로 바꾸었다. 트윗 작성자와 정확한 날짜는 여전히 미확인이다."
sources = ["https://ko.wikipedia.org/wiki/시발_비용", "https://ko.wikipedia.org/wiki/대한민국의_인터넷_신조어_목록", "http://www.seoul.co.kr/news/newsView.php?id=20170211500003", "https://foreignpolicy.com/2019/07/04/why-young-koreans-love-to-splurge/"]

[[slang]]
name = "폼 미쳤다"
category = "게임·스트리머"
year = "미확인 (밈 유행 2023년 초)"
origin = "축구 경기를 해설하는 인터넷 방송인(BJ) '이스타'가 선수의 기량과 컨디션을 칭찬하며 쓴 말에서 시작되었다(캐릿, 2023.1.19). 최초 방송 회차와 날짜는 미확인이다."
meaning = "사람이나 사물의 상태, 실력, 외모가 최고조일 때 감탄하며 쓰는 말이다."
use_when = "캐릭터가 뜻밖에 활약하거나 한껏 꾸미고 등장해 주변이 감탄하는 컷에 맞는다."
food_fit = "갓 튀겨 윤기가 도는 치킨이나 치즈가 쭉 늘어나는 피자를 보고 다른 음식 캐릭터가 '폼 미쳤다'고 외치는 장면으로 쓸 수 있다."
fame = 4
fame_evidence = "캐릿이 2023년 1월 SNS에서 자주 보인 밈으로 소개했다. 가수 영탁이 2023년 8월 1일 발매한 정규 2집 《FORM》에 '폼미쳤다(FORM)'를 수록했다."
caution = "문구만 쓰고 원조 방송인의 얼굴, 방송 화면, 말투를 그대로 옮기지 않는다. 영탁의 곡명과 같지만 일반 표현이라 문구 사용은 무방하다."
verified = "partial"
risk_checked = true
notes = "원조가 축구 해설 BJ '이스타'라는 점만 확인했다. 최초 방송 시점과 2022년 시작 여부는 확인하지 못했다(캐릿 본문 뒷부분이 유료이고 웹 검색 한도가 소진됨). 영탁 곡은 '폼미쳤다(FORM)'이며, 발매일 2023.8.1은 앨범 발매일 기준이다."
sources = ["https://www.careet.net/985", "https://ko.wikipedia.org/wiki/영탁"]

[[slang]]
name = "GOAT (그저 GOAT)"
aliases = ["그저 GOAT", "고트", "염소"]
category = "스포츠"
year = "1990년대 해외 (국내 확산은 2010년대, 국내 언론 용례는 2016년 10월이 가장 이르다)"
origin = "영어 'Greatest Of All Time'의 약자다. 고구마팜(2025.4.2)은 이 말이 1990년대 해외에서 무하마드 알리를 가리키며 퍼졌고, 국내에서는 2010년대 마이클 조던을 부르며 쓰이기 시작해 메시와 호날두로 넓어졌다고 설명한다. 우리말샘은 '고트'를 체육 분야 표제어로 싣고 스타뉴스(2016.10, NBA 선수 기사)를 용례로 든다."
meaning = "어떤 분야의 역대 최고를 가리키는 감탄 표현이다. 발음이 같은 염소(goat)를 이모티콘이나 그림으로 곁들여 쓰기도 한다."
use_when = "캐릭터가 엄청난 활약을 했을 때 '그저 GOAT'라고 감탄하는 컷, 시상식이나 최애 투표 장면에 쓴다."
food_fit = "최애 음식 캐릭터에게 염소 뿔이나 염소 이모티콘을 왕관처럼 씌우는 연출이 좋다. 야식 순위를 매기는 컷에서 1위 음식에 붙이기 쉽다."
fame = 4
fame_evidence = "고구마팜 '고전 인기 밈 총정리'(2025.4.2)에 실렸고 하나카드 트래블GO 카드와 왓챠 광고 활용 사례가 소개됐다. 우리말샘에도 표제어로 올라 있다."
caution = "메시, 조던 같은 실존 선수의 얼굴이나 이름은 쓰지 않는다. 일반 영어 약어라 상표 위험은 낮지만, 하나카드 광고의 염소 연출을 그대로 베끼지는 않는다."
verified = "partial"
risk_checked = true
notes = "고구마팜이 설명한 1990년대 무하마드 알리 유래를 더하고, 우리말샘의 2016년 언론 용례로 국내 사용 시점을 보강했다. 알리 유래는 고구마팜의 설명이며 원출처는 확인하지 못했다. 카테고리를 스포츠로 정리했다."
sources = ["https://gogumafarm.kr/?p=37247", "https://opendict.korean.go.kr/search/searchResult?focus_name_top=query&query=고트", "https://opendict.korean.go.kr/dictionary/view?sense_no=1499756&viewType=confirm"]

[[slang]]
name = "돌직구"
aliases = ["돌직구를 날리다", "돌직구 화법", "돌직구남", "돌직구녀"]
category = "스포츠"
year = "미확인 (오승환의 삼성 라이온즈 시절 별명에서 유래, 일상어로 퍼진 시점은 미확인)"
origin = "삼성 라이온즈 시절 오승환이 던지던, 돌처럼 무거운 직구를 부르던 말에서 나왔다. 처음 쓴 사람과 시기, 일상어로 퍼진 시기는 미확인이다."
meaning = "상대 입장을 돌아보지 않고 거침없이 직설적으로 하는 말을 뜻한다. 표준국어대사전에 해당하는 우리말샘에도 이 뜻이 실려 있다."
use_when = "한 캐릭터가 눈치 없이 팩트를 날려 상대가 충격받는 장면, '돌직구 날린다'는 대사가 들어가는 장면에 맞는다."
food_fit = "감자나 주먹밥 같은 둥근 음식 캐릭터가 투구 자세로 말풍선을 던지고, 맞은 캐릭터가 휘청거리는 연출로 쓸 수 있다."
fame = 4
fame_evidence = "우리말샘에 야구 뜻과 '직설적인 말'이라는 비유 뜻, 파생어 '돌직구남·돌직구녀'가 모두 올라 있다. 위키낱말사전에도 일상적인 뜻으로 실려 있다."
caution = "실존 인물인 오승환의 얼굴이나 등번호, 구단 유니폼과 로고를 그대로 쓰지 않는다. 말 자체는 일반명사라 큰 문제가 없다. 유래 인물인 오승환은 2014년 11월 마카오 카지노 원정도박으로 2016년 1월 벌금 1000만원 약식명령을 받았고, KBO는 국내 복귀 시 시즌 경기 수의 50% 출장정지 징계를 내렸다. 캡션이나 해설에서 '오승환의 돌직구'처럼 유래를 밝히거나 기리지 말고, 카지노·도박을 연상시키는 소품과 함께 쓰지 않는다."
verified = "partial"
risk_checked = true
notes = "'2011 무렵'이라는 시점을 뒷받침하는 자료를 찾지 못해 미확인으로 바꾸었다. 이번 실행에서는 웹 검색 한도가 다 차서 확산 시기를 추가로 확인하지 못했다."
sources = ["https://ko.wikipedia.org/wiki/오승환", "https://ko.wiktionary.org/wiki/돌직구", "https://opendict.korean.go.kr/search/searchResult?query=돌직구"]
caution_sources = ["https://www.kukinews.com/article/view/kuk201601160001", "https://newstomato.com/ReadNews.aspx?no=612472", "https://www.dailian.co.kr/news/view/550391/"]

[[slang]]
name = "빠던 (빠따 던지기)"
aliases = ["빠던", "빠따 던지기", "배트 플립", "이 주의 빠던"]
category = "스포츠"
year = "미확인 (해외 매체 주목 2016, ESPN 중계 2020)"
origin = "KBO 타자들이 홈런 등을 친 뒤 방망이를 화려하게 던지는 배트 플립을 이르는 말이다. 노컷뉴스(2020.6.10)에 따르면 ESPN 캐스터는 2020년 5월 5일 NC-삼성 개막전에서 모창민의 배트 플립에 환호했고, 이후 ESPN이 '이 주의 빠던'을 선정했다."
meaning = "홈런을 친 뒤 방망이를 멋지게 던지는 세리머니이다. 큰일을 해낸 뒤 과하게 자축하는 동작을 가리키기도 한다."
use_when = "캐릭터가 한 방을 해낸 뒤 들고 있던 물건을 쿨하게 던지는 컷에 맞는다."
food_fit = "대파나 바게트로 공을 쳐낸 뒤 휙 던지는 컷으로 쓸 수 있다. 치킨 다리를 다 먹고 뼈를 빠던처럼 던지는 자축 컷도 가능하다."
fame = 4
fame_evidence = "노컷뉴스(2020.6.10)는 ESPN이 130개국에 KBO 경기를 중계하면서 '이 주의 빠던'을 선정한다고 보도했다. The World(2016.10.6)는 한국의 배트 플립 문화를 미국 독자에게 소개했다. 야구 팬이 아닌 20~30대에게 얼마나 알려졌는지 보여 주는 자료는 확인하지 못했다."
caution = "실존 선수의 이름과 얼굴, 구단 로고와 유니폼은 쓰지 않는다. 방망이를 던지는 방향이 사람이나 캐릭터를 향하지 않게 그린다."
verified = "partial"
risk_checked = true
notes = "MLB.com 두 페이지가 406 오류로 열리지 않아, '2015년 5월 롯데 정훈 빠던 영상'이 소개됐다는 내용은 확인하지 못했다. The World 기사는 홍성흔·이용규 등을 다뤘지만 '빠던'이라는 한국어 표현은 쓰지 않았다. 국내에서 '빠던'이 쓰이기 시작한 시점은 미확인이다. 인지도는 판단이 갈릴 수 있는 경계선(fame 4)으로 보았다."
sources = ["https://www.nocutnews.co.kr/news/5358468", "https://theworld.org/stories/2016/10/06/korean-bat-flips-are-what-country-needs"]

[[slang]]
name = "티키타카"
aliases = ["티키타카가 잘 된다", "티키타카 케미"]
category = "스포츠"
year = "미확인 (축구 용어로는 스페인의 2010 월드컵 우승과 함께 거론, 일상어 확산 시점 미확인)"
origin = "짧은 패스를 빠르게 주고받는 축구 전술 용어로, 스페인어 'tiqui-taca'(탁구공이 왔다 갔다 한다는 뜻)에서 왔다. FC 바르셀로나가 애용했고 스페인 대표팀이 이 전술로 2010년 월드컵에서 우승했으며, 이후 대화가 척척 오가는 모습을 뜻하는 말로 넓어졌다."
meaning = "두 사람이 말을 주고받는 호흡이 잘 맞는다는 뜻으로 쓴다. '티키타카가 잘 된다', '티키타카 케미' 꼴로 예능 자막에 자주 쓰인다."
use_when = "두 캐릭터가 빠르게 농담을 주고받는 장면, 명콤비의 호흡을 보여주는 컷에 어울린다."
food_fit = "치킨과 맥주, 떡볶이와 튀김 같은 단짝 음식이 대사를 탁구공처럼 주고받는 장면, 혹은 실제 탁구를 치며 말싸움하는 연출로 쓸 수 있다."
fame = 4
fame_evidence = "영어 위키낱말사전에 축구 용어와 별도로 '대화가 잘 오간다'는 속어 뜻이 올라 있다. 한국어 위키백과에는 축구 뜻만 있고, 결산 기사 근거는 확보하지 못했다."
caution = "실존 축구 선수나 구단 엠블럼, 경기 영상은 쓰지 않는다. 일반 어휘라 그 밖의 민감성은 낮다."
verified = "partial"
risk_checked = true
notes = "분류를 '신조어'에서 '스포츠'로 바꿨다. 한국어 위키백과에서 어원(탁구공이 오가는 모양)과 스페인의 2010 월드컵 우승을 확인했으나, 일상어로 번진 시점은 이번에도 확인하지 못했다."
sources = ["https://en.wiktionary.org/wiki/티키타카", "https://ko.wikipedia.org/wiki/티키타카"]

[[slang]]
name = "갑질"
aliases = ["갑을관계", "갑질 손님", "갑질하다"]
category = "기타"
year = "2007년 이후 생성, 2013~2014 확산"
origin = "갑을관계의 '갑'에 '-질'을 붙인 말로, 2007년 이후 인터넷에 등장했다. 2013년 5월 남양유업 대리점 강매·막말 녹취 공개와 2014년 12월 5일 대한항공 '땅콩 회항'으로 크게 알려졌다."
meaning = "지위나 권한이 우월한 쪽이 약자에게 부당하게 횡포를 부리는 행위를 뜻한다."
use_when = "손님, 상사, 선배 캐릭터가 무리한 요구를 하거나 으스대는 장면에 쓴다."
food_fit = "비싼 메인 요리(한우, 랍스터)가 반찬이나 라면 캐릭터에게 으스대는 장면으로 쓸 수 있다."
fame = 5
fame_evidence = "위키백과 갑질 문서는 땅콩 회항을 '한국의 갑질문화가 세계적으로 알려지는 계기'로 적고 있다. 2015년 2월 로이터 보도도 언급되어 있다."
caution = "땅콩 회항, 남양유업 같은 실제 사건과 기업, 관련 실존 인물을 떠올리게 하는 연출(땅콩 캐릭터와 비행기 조합 등)은 명예훼손이나 상표 문제가 될 수 있어 피한다. 일반 개념으로만 쓴다."
verified = "verified"
risk_checked = true
notes = "남양유업 사태는 2013년 5월, 땅콩 회항은 2014년 12월 5일로 확인했다. 제보자의 설명은 맞다."
sources = ["https://ko.wikipedia.org/wiki/갑질"]

[[slang]]
name = "갓생"
aliases = ["갓생 살기", "갓생러"]
