sources = ["https://ko.wikipedia.org/wiki/TMT", "https://ko.wikipedia.org/wiki/박찬호", "https://en.wikipedia.org/wiki/Park_Chan-ho"]

[[slang]]
name = "혼밥·혼술"
aliases = ["혼밥", "혼술", "혼-", "나홀로족", "혼영", "혼행"]
category = "기타"
year = "2016 (밈 유행 2016~2017, 단어 첫 사용 시기 미확인)"
origin = "1인 가구가 늘면서 2030세대를 중심으로 혼밥·혼술·혼행·혼영 같은 '혼-' 신조어가 퍼졌다(노컷뉴스 2016.12.30). tvN 드라마 '혼술남녀'(2016.9.5~10.25)는 매회 도입부에 혼술 장면을 넣었다. 처음 쓰인 곳은 미확인이다."
meaning = "혼자 밥을 먹거나 술을 마시는 일, 또는 남과 어울리지 않고 혼자 즐기는 생활 방식을 말한다."
use_when = "혼자 식당에 들어가거나 1인석에서 먹는 장면, 퇴근 후 혼자 한잔하는 장면, '혼밥 레벨'처럼 스스로를 놀리는 개그에 어울린다."
food_fit = "1인분 도시락이나 컵라면 캐릭터가 '오늘도 혼밥'이라고 말하거나, 소주병·맥주캔 캐릭터가 혼자 술상에 앉는 컷에 바로 쓸 수 있다."
fame = 5
fame_evidence = "사람인이 성인 948명에게 물은 2016년 공감 신조어 조사에서 '나홀로족'이 1위였다(32.3%, 20대 35.8%, 30대 34.8%). 같은 기사에 혼밥·혼술이 관련어로 나온다. GQ 코리아의 2017년 유행어 결산에도 '혼-'이 있고, 2016년에는 '혼술남녀' 드라마까지 방영되었다."
caution = "일반 어휘라 권리 문제는 거의 없다. 혼자 먹는 사람을 불쌍하게만 그리면 반감을 살 수 있다."
verified = "partial"
risk_checked = true
notes = "원래 메모 내용은 맞다. 사람인 조사는 성인 948명이 대상이었고, 혼밥·혼술은 기사 본문에 관련어로 나온다. 처음 쓰인 곳은 여전히 미확인이다. 웹 검색 한도가 다 차서 추가 확인은 하지 못했다."
sources = ["https://www.nocutnews.co.kr/news/4709846", "https://www.gqkorea.co.kr/?p=102353", "https://ko.wikipedia.org/wiki/혼술남녀"]

[[slang]]
name = "열정페이"
category = "기타"
year = "2011년 말 온라인 사용 (2015년 1~3월 사회적 논란으로 확산)"
origin = "정확한 기원은 미확인이며, 2011년 말 이미 온라인에서 쓰였다. 2014년 10월 한 디자이너 업체의 견습 10만 원, 인턴 30만 원 급여 글이 SNS에 퍼졌고, 2015년 1월 해당 디자이너가 사과했다. 같은 달 고용노동부가 특별감독을 발표했고, 3월 7일 KBS 2TV '추적 60분'이 방영되었으며, 같은 달 서울패션위크 기간에 항의 기자회견이 열렸다."
meaning = "열정과 경험을 핑계로 청년에게 정당한 보수를 주지 않는 관행을 비꼬는 말이다."
use_when = "말도 안 되는 보수로 일을 시키는 상사나 사장, '경험이 돈'이라며 일을 떠넘기는 장면에 맞는다."
food_fit = "빵집 사장 캐릭터가 신입 반죽 캐릭터에게 월급 봉투 대신 '열정' 스티커를 붙여 주는 장면으로 쓸 수 있다."
fame = 4.5
fame_evidence = "위키백과에 독립 문서가 있다. 2015년 고용노동부 특별감독, 추적 60분 방영, 서울패션위크 항의 등 사회적 반향이 기록되어 있다."
caution = "위키백과에 실명으로 나오는 디자이너나 업체, 연예인 가게 사례를 직접 암시하지 않는다. 노동 착취를 풍자하는 쪽으로만 쓰고 피해 청년을 웃음거리로 삼지 않는다. 이 말은 최근에도 실제 인물의 사건에 붙어 쓰였다. 2023년 5월 문재인 전 대통령의 평산책방이 무급 자원봉사자 모집 공고로 '열정페이' 논란을 겪다 모집을 철회했고, 국민의힘 대변인이 이를 공개 비판했다. 2026년 5월에는 가수 우즈(WOODZ)가 해외 투어 무급 스태프 모집 논란으로 사과했다. 책방·정치인·공연 팬 스태프처럼 이 사건들을 떠올리게 하는 설정은 피해 정치적·팬덤 논쟁에 휘말리지 않게 한다."
verified = "verified"
risk_checked = true
notes = "날짜를 보강했다(2015년 1월 14일 디자이너 사과, 2015년 3월 7일 추적 60분 방영, 2015 F/W 서울패션위크 기간 항의). 항의 기자회견의 정확한 날짜는 미확인이다."
sources = ["https://ko.wikipedia.org/wiki/열정페이"]
caution_sources = ["https://www.etoday.co.kr/news/view/2246978", "https://www.ytn.co.kr/_ln/0101_202305080900046566", "https://www.dailian.co.kr/news/view/1231501/", "https://www.asiae.co.kr/en/article/2026050814115353272"]

[[slang]]
name = "급식체"
aliases = ["휴먼급식체", "ㅇㅈ? ㅇ ㅇㅈ", "인정? 어 인정", "동의? 어 보감", "오지고 지리고"]
category = "기타"
year = "2017년 무렵 유행 (최초 시점 미확인)"
origin = "2017년 무렵 10대들이 SNS에서 놀이처럼 쓴 말투로, 이름은 한글 프로그램 '휴먼체' 글꼴과 10대 비하어 '급식충'을 합친 '휴먼급식체'에서 나왔다. 2017년 CU 디저트 이름(ㅇㅈ?ㅇㅇㅈ), 2017년 10월 SNL코리아 시즌9 꼭지로 화제가 됐다."
meaning = "[신조어] '인정? 어 인정', '오지고 지리고' 같은 10대식 과장·라임 말투."
use_when = "학창 시절 말투를 흉내 내거나 일부러 오글거리게 과장하는 대사 한 줄."
food_fit = "급식판 위 반찬 캐릭터들이 \"ㅇㅈ? ㅇ ㅇㅈ\" 하고 맞장구치는 장면 정도로 가볍게 쓸 수 있다."
fame = 4
fame_evidence = "2017년 위키트리·데일리안·GQ코리아 기사, CU 상품명, SNL코리아 꼭지로 대중적으로 알려짐. 지금 20대는 학창 시절 말투로 기억함."
caution = "분류: 신조어. 이름이 10대 비하어 '급식충'에서 왔으므로 만화에 '급식충'이라는 말은 쓰지 말고 표현만 빌릴 것. 지금은 다소 낡은 말투라 복고 개그로 쓰는 게 낫다. 2018년 3월 13일 방송통신심의위원회 방송심의소위원회가 SNL코리아9 '급식체 특강' 코너에 권고 조치를 내렸다. 소개된 신조어 가운데 여성 성기를 비하하는 표현과 일본 성인 동영상에서 빌려 온 말이 섞여 있었기 때문이다. 급식체 단어 묶음에는 이런 성적 비속어가 함께 들어 있으므로 'ㅇㅈ? ㅇ ㅇㅈ', '동의? 어 보감'처럼 문제없는 표현만 쓴다. 급식체 단어를 더 넣으려면 하나씩 유래를 확인하고, 유래가 성적이거나 비속한 말은 빼야 한다."
verified = "verified"
risk_checked = true
notes = "2015~2017년 유행이라는 이전 메모 중 2015~2016년 시작 시점은 미확인이고, 확인되는 유행 정점은 2017년. 현재는 약하다는 메모는 맞음."
sources = ["https://www.wikitree.co.kr/articles/243809", "https://www.dailian.co.kr/news/view/670233/", "https://www.gqkorea.co.kr/?p=102353", "https://v.daum.net/v/LzxqSQmkH3"]
caution_sources = ["https://www.tenasia.co.kr/article/2018031321974", "https://www.dailian.co.kr/news/view/670233/"]

[[slang]]
name = "뇌섹남"
aliases = ["뇌가 섹시한 남자", "뇌섹녀"]
category = "기타"
year = "2015"
origin = "'뇌가 섹시한 남자'의 줄임말로 2015년 히트 신조어가 되었다(세계일보 2016.1.19). 같은 해 2월 26일 첫 방송한 tvN '뇌섹시대-문제적 남자'가 제목에 '뇌섹'을 썼지만, 이 프로그램이 말을 처음 만들었는지는 미확인이다."
meaning = "지적이고 말을 잘해서 매력적인 사람을 말한다. 여성은 뇌섹녀라고 한다."
use_when = "캐릭터가 퀴즈를 풀거나 박식함을 뽐내는 장면, 안경을 치켜올리며 아는 척하는 장면에 어울린다."
food_fit = "뇌 모양 호두나 안경 쓴 블루베리 같은 두뇌 음식 캐릭터를 '뇌섹남'으로 소개하는 말장난이 자연스럽다."
fame = 4
fame_evidence = "세계일보 2016.1.19 칼럼이 2015년 히트 신조어로 맨 먼저 꼽았다. tvN '뇌섹시대-문제적 남자'는 2015년부터 2020년까지 방송되었다."
caution = "'섹시'라는 말이 들어가지만 성적인 뜻은 없다. 프로그램 로고나 출연자 얼굴은 쓰지 않는다. 2015년 유행어라 다소 낡게 느껴질 수 있다."
verified = "partial"
risk_checked = true
notes = "세계일보 칼럼에는 유래나 프로그램 언급이 없다. 처음 쓰인 곳은 미확인이며, tvN 프로그램은 위키백과에서 방송 기간만 확인했다. 웹 검색 한도가 다 차서 추가 확인은 하지 못했다."
sources = ["https://www.segye.com/newsView/20160119003943", "https://ko.wikipedia.org/wiki/뇌섹시대_-_문제적_남자"]

[[slang]]
name = "뇌절"
aliases = ["뇌절하다", "1절만 해"]
category = "기타"
year = "2017 추정 (2018년 이후 확산)"
origin = "노래를 1절만 부르라는 '1절만 해'에서 이어진 말장난으로, 〈나루토〉 카카시의 기술 이름 '뇌절'을 붙인 것. 위키 설명으로는 2017년 무렵 디시인사이드 만화 갤러리에서 시작돼 2018년 롤(LoL) 방송·커뮤니티로 퍼졌다."
meaning = "[신조어] 같은 드립이나 행동을 지나치게 반복해서 선을 넘는 것."
use_when = "한 캐릭터가 같은 개그나 행동을 계속 반복해서 주변이 질려 하는 장면."
food_fit = "소스나 토핑을 끝없이 더 뿌리는 캐릭터에게 \"그만해 뇌절이야\" 같은 대사로 잘 맞는다."
fame = 4
fame_evidence = "나무위키 단독 문서가 있고 네이버 지식백과 신조어 등재 언급이 있음. 다만 뉴스 기사 근거는 이번 검색에서 확인하지 못함."
caution = "분류: 신조어. 단어만 쓰고 나루토·카카시 캐릭터 그림이나 치도리 연출 차용은 저작권 문제로 피할 것."
verified = "partial"
risk_checked = true
notes = "유래 설명은 위키 자료에만 근거하며 원조 글 시점(2017년)은 추정이라 미확인."
sources = ["https://namu.wiki/w/%EB%87%8C%EC%A0%88(%EC%9D%B8%ED%84%B0%EB%84%B7%20%EC%9A%A9%EC%96%B4)", "https://thewiki.kr/w/뇌절", "https://namu.moe/w/%EC%A0%88"]

[[slang]]
name = "뉴트로"
aliases = ["신복고", "New-tro", "new+retro"]
category = "기타"
year = "2018 (트렌드 키워드 2019)"
origin = "'New'와 'Retro'를 합친 말로, 겪어 보지 못한 옛것을 새롭게 즐기는 유행을 뜻한다. 위키백과는 서울대 소비트렌드분석센터 김난도 교수가 2019년 트렌드 키워드 중 하나로 예측했다고 적었고, 뉴스1 2018년 12월 기사도 이듬해 소비 트렌드로 소개했다."
meaning = "옛날 디자인이나 감성을 지금 세대가 새로운 멋으로 즐기는 현상을 이른다."
use_when = "옛날 포장이나 복고풍 소품이 등장하는 장면, 부모 세대 물건을 젊은 세대가 신기해하는 장면에 어울린다."
food_fit = "옛날 과자나 약과, 바나나우유 같은 캐릭터가 복고풍 옷차림으로 '요즘 우리가 뉴트로래'라고 말하거나, 레트로 간판 아래 줄 선 장면으로 쓸 수 있다."
fame = 4
fame_evidence = "위키백과 단독 항목이 있고 2019년 트렌드 키워드로 선정되었다고 적혀 있다. 곰표 밀가루 디자인 화장품, 단종 제품 재출시 등 식품업계 사례도 실려 있다."
caution = "곰표 등 실제 브랜드의 로고나 포장 디자인을 그대로 쓰면 상표 문제가 생길 수 있으므로 가상의 디자인으로 바꾼다. 뉴트로 대표 사례인 '곰표 밀맥주'를 두고 대한제분과 제조사 세븐브로이 사이에 갈등이 있었다. 2023년 상표권 계약 종료 뒤 레시피 도용 의혹, 가처분, 채무부존재확인 소송 등 갑을 분쟁이 3년간 이어졌다. 2026년 4월 중기부 조정으로 화해했고, 대한제분이 상생협력기금 23억 원을 낸다. 그러므로 뉴트로 예시로 곰표나 곰 캐릭터 밀가루 포장을 떠올리게 하는 연출도 피한다."
verified = "verified"
risk_checked = true
notes = "카테고리를 '기타'로 고쳤다. 위키백과는 단종된 인기 제품 재출시를 일반적으로만 언급하고 특정 과자 이름은 적지 않았다. 처음 만든 사람과 '트렌드 코리아 2019' 책 수록 여부는 페이지에서 확인되지 않았다."
sources = ["https://ko.wikipedia.org/wiki/뉴트로", "https://ko.wikipedia.org/wiki/대한민국의_인터넷_신조어_목록", "http://news1.kr/articles/?3509710"]
caution_sources = ["https://dealsite.co.kr/articles/160385", "https://www.segye.com/newsView/20260416525202", "https://v.daum.net/v/20250513101122688"]

[[slang]]
name = "동학개미"
aliases = ["동학개미운동", "서학개미"]
category = "기타"
year = "2020"
origin = "2020년 초 코로나19로 증시가 급락할 때 외국인 매도 물량을 받아낸 국내 개인투자자를 1894년 동학농민운동에 빗댄 말이다. 2020년 1월 20일부터 3월 31일까지 개인은 코스피에서 19조9000억 원을 순매수했다. 해외 주식에 직접 투자하는 개인을 가리키는 '서학개미'도 여기서 파생되었다."
meaning = "외국인이나 기관에 맞서 주식을 사 모으는 개인투자자 집단을 가리킨다."
use_when = "캐릭터들이 떨어지는 가격에 우르르 몰려가 사들이는 장면, 해외 직구파와 국내파를 나누는 장면에 어울린다."
food_fit = "개미 모양 쌀알이나 깨 캐릭터들이 폭락한 '삼겹살 주식'을 사러 몰려가는 장면, 수입 과일 '서학개미'와 국산 과일 '동학개미'의 대결 구도로 쓸 수 있다."
fame = 4
fame_evidence = "2020년 연말 결산 기사(경북매일 2020.12.29)와 머니투데이 기획 보도에 대표 신조어로 실렸다. 같은 기간 고객예탁금은 28조1000억 원에서 43조 원으로 늘었다."
caution = "특정 종목을 추천하거나 투자를 권하는 것처럼 보이지 않게 한다. 손실을 본 투자자를 조롱하지 않는다. 동학농민운동은 역사적 사건이므로 이를 희화화하지 않는다. 별칭 '서학개미'는 2025년 11월 고환율 책임 공방의 소재가 되었다. 당시 이창용 한국은행 총재가 해외투자가 '쿨하다'고 여겨진다는 취지로 말했고, 정부가 해외주식 세제 조치를 언급했다. 이 일로 '청년 서학개미 탓' 비판과 여야 정치 공방이 이어졌다. 따라서 서학개미를 환율·세금·정부 정책과 엮거나 특정 세대를 탓하는 방향으로 쓰지 않는다."
verified = "verified"
risk_checked = true
notes = "예탁금이 '27조원에서 65조원으로' 늘었다는 수치는 제시된 출처에서 확인되지 않았다. 경북매일에 따르면 2020년 1월 20일 28조1000억 원에서 3월 31일 43조 원으로 늘었다."
sources = ["https://kbmaeil.com/article/202012280295730", "https://www.mt.co.kr/mtreport/530"]
caution_sources = ["https://www.hankyung.com/article/2025112425871", "https://biz.newdaily.co.kr/site/data/html/2025/12/01/2025120100151.html", "https://news.mtn.co.kr/news-detail/2026042114455619596"]

[[slang]]
name = "삼포세대"
aliases = ["N포세대", "오포세대", "칠포세대"]
category = "기타"
year = "2011 (경향신문 2011년 5월 11일 기사)"
origin = "경향신문 기획 '복지국가를 말한다' 1부② 「과부하 걸린 한국의 가족」(2011년 5월 11일 입력, 유정인·박은하 기자)에서 연애·결혼·출산을 포기한 세대라는 뜻으로 쓰였다. 이 말을 처음 만든 개인은 미확인이다."
meaning = "연애·결혼·출산을 포기한 청년 세대를 가리킨다. 나중에 포기하는 항목이 늘면서 오포·칠포·N포세대로 번졌다."
use_when = "모든 걸 포기했지만 사소한 하나만은 못 버린다는 자조 개그 장면에 맞는다. 예를 들면 'N포세대지만 야식은 포기 못 해' 같은 대사다."
food_fit = "지친 직장인 음식 캐릭터가 '연애·결혼·출산'에 X를 치고 마지막 '치킨' 칸만 동그라미 치는 연출로 쓸 수 있다."
fame = 4
fame_evidence = "영어 위키백과에 독립 문서(Sampo generation)가 있고, 이 말이 여러 매체와 인터넷으로 빠르게 퍼진 뒤 정치권에서도 쓰였다고 적혀 있다. 한국어 위키백과에도 문서가 있다."
caution = "청년 빈곤과 저출생이라는 실제 사회 문제를 다룬 말이므로 당사자를 비웃는 방향은 피한다. 정치 구호처럼 쓰이지 않게 자조 유머 선에서만 쓴다."
verified = "verified"
risk_checked = true
notes = "처음 쓰인 기사를 「과부하 걸린 한국의 가족」(2011년 5월 11일 입력, 5월 18일 수정)으로 좁혔다. 이 기사 부제에 '연애·결혼·출산 포기 삼포세대'라는 표현이 있다. 영어 위키백과는 날짜를 5월 18일로 적었는데, 이는 수정일이다."
sources = ["https://en.wikipedia.org/wiki/Sampo_generation", "https://ko.wikipedia.org/wiki/삼포세대", "https://www.khan.co.kr/article/201105112139085"]

[[slang]]
name = "영끌"
aliases = ["영혼까지 끌어모아", "영끌족", "빚투"]
category = "기타"
year = "2020 (밈 유행 2020~2021)"
origin = "'영혼까지 끌어모으다'의 줄임말로, 빚까지 내서 가진 돈을 모두 모아 주식이나 아파트에 투자한다는 뜻이다. 2020년 코로나19 장기화와 저금리 속에서 2030세대를 중심으로 퍼졌으며, 비슷한 말로 빚을 내서 투자하는 '빚투'가 있다. 최초 사용자는 미확인이다."
meaning = "무언가를 위해 가진 자원을 남김없이 끌어모은다는 뜻이며, 일상에서는 '영끌해서 샀다'처럼 과장된 농담으로도 쓴다."
use_when = "비싼 물건을 사려고 지갑, 저금통, 동전까지 탈탈 터는 장면, 무리하게 큰 결심을 하는 장면에 어울린다."
food_fit = "남은 소스 한 방울까지 긁어모으는 장면, 냉장고 속 자투리 재료를 '영끌'해 요리 하나를 완성하는 장면 등 음식과 쉽게 연결된다."
fame = 4
fame_evidence = "경기일보는 2020년 12월 7일 칼럼 '영끌 시대'에서 2030세대의 54%가 주식을 하고 그중 90%가 2020년에 시작했다고 전했다."
caution = "2022년 이후 금리 인상으로 실제 대출 피해를 본 사람들이 있으므로 영끌 투자자를 조롱하지 말고, 음식이나 일상 소비처럼 가벼운 맥락에서만 쓴다. 2025년 10·15 부동산 대책으로 대출 규제가 강화되었다. 그 직후 이상경 국토교통부 1차관이 '집값 떨어지면 그때 사면 된다'는 취지로 발언했고, 이어 배우자의 갭투자 의혹이 나왔다. 이 일로 여야가 사퇴를 요구했고 차관은 사의를 표명했다. 내 집 마련과 대출은 정치 공방 소재이므로 영끌을 집값·대출 규제·정부 정책과 연결하지 않는다."
verified = "verified"
risk_checked = true
notes = "제시된 출처에는 '벼락거지'가 나오지 않으므로 짝을 이루는 말이라는 설명은 이 출처로 확인되지 않았다. 출처의 정의는 대출에 한정하지 않고 '빚을 내서라도 가진 돈을 모두 모아 투자'하는 것으로 되어 있다."
sources = ["https://www.kyeonggi.com/article/202012071148161"]
caution_sources = ["https://www.khan.co.kr/article/202510231630011/", "https://www.heraldk.com/article/2025102221395030782", "https://www.dt.co.kr/article/12024779"]

[[slang]]
name = "점메추"
aliases = ["점심 메뉴 추천", "저메추", "저녁 메뉴 추천"]
category = "기타"
year = "미확인 (2022년 무렵 기사에 신조어로 등장)"
origin = "'점심 메뉴 추천'의 줄임말로, 오늘 점심 뭐 먹을지 남에게 추천해 달라고 할 때 쓴다. 2022년 노컷뉴스가 '저메추'와 함께 MZ세대 신조어로 소개했고, 잡플래닛 컴퍼니타임스는 같은 이름의 점심 메뉴 추천 코너를 연재 중이다. 최초 사용처는 미확인."
meaning = "[신조어] \"점심 메뉴 추천 좀\"을 줄인 말."
use_when = "점심시간에 뭘 먹을지 고민하는 장면의 첫 컷 대사."
food_fit = "음식 캐릭터들이 \"점메추\" 요청에 서로 자기를 뽑아 달라고 어필하는 구도로 음식 만화와 가장 잘 맞는다."
fame = 4
fame_evidence = "2022년 노컷뉴스 신조어 기사, 우리말샘 풀이를 인용한 자료, 잡플래닛의 연재 코너 이름으로 쓰일 만큼 직장인 사이에 흔함."
caution = "분류: 신조어. 일반 줄임말이라 권리 문제 없음."
