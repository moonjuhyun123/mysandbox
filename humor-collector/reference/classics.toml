caution_sources = ["https://view.asiae.co.kr/article/2026061014351034763", "https://fruitnet.com/asiafruit/ngo-scare-hits-shine-muscat-sales-in-thailand/263283.article", "https://www.segye.com/newsView/20221016512483"]

