fame_evidence = "공식 유튜브 클립이 300만~400만 회에 육박했고, 박해수 회차 하이라이트는 약 424만 회를 기록했다(2023.1 기준). 업무 중 이어폰 착용을 두고 온라인 토론이 벌어졌고, '90년생이 온다' 저자 임홍택도 의견을 냈다."
caution = "김아영·주현영은 실존 배우이므로 얼굴·의상을 그대로 옮기지 말고 '이어폰 낀 해맑은 신입' 콘셉트만 쓴다. SNL 방송 화면은 쿠팡플레이 저작물이다. 젊은 직원, 특히 젊은 여성을 조롱한다는 비판과 '여자들 기싸움' 지적이 있었으니 세대·성별을 비하하는 방향은 피한다. 김아영은 2024년 10월 19일 SNL 코리아 시즌6에서 한강 작가를 연기하며 외모를 희화화했다는 비판을 받았다. 같은 회차의 뉴진스 하니 패러디(지예은)도 외국인 말투 조롱 논란이 됐다. 실존 인물의 외모나 말투를 흉내 내는 방향은 피한다. 또 '맑눈광' 캐릭터는 퍼시스 광고처럼 김아영이 직접 출연한 상업 협업에 쓰였다. 브랜드 계정이 김아영을 떠올리게 하는 모습으로 쓰면 허락 없이 광고를 흉내 낸 것처럼 보일 수 있다."
