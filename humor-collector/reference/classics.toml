origin = "'치킨'과 '하느님'을 합친 인터넷 신조어다. SNS에 '치느님 십계명' 같은 글이 돌면서 퍼졌다(이투데이 2015.7). 처음 쓴 곳과 시기는 미확인이다."
meaning = "치킨을 신처럼 떠받드는 농담 섞인 극존칭이다."
