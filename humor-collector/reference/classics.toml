meaning = "한 입에 최대한 많이 욱여넣는 과장된 먹방, 또는 '한 입만 줘'라는 간절한 부탁."
use_when = "친구 음식을 노리거나 한 입에 왕창 먹을 때."
food_fit = "아주 잘 맞음. 햄버거 캐릭터가 거대한 입 앞에서 '한입만이라며!'라고 겁먹는 장면."
fame = 4
fame_evidence = "2024.2.7 스포츠경향 [간밤TV] 기사 본문에 '맛있는 녀석들도 놀랄 한입만'이라는 표현이 나온다. 다른 프로그램을 다루는 기사에서도 통할 만큼 이 프로그램을 대표하는 말이다."
caution = "'한입만'은 원래 일상어이므로 과장된 한 입 연출이 있어야 패러디로 읽힌다. 출연진(김준현·문세윤 등 실존 인물)을 닮게 그리거나 방송 화면을 쓰지 말 것. 현 출연진 김준현은 2026년 2월 KBS 출근길에 응원하는 팬들을 그냥 지나치고 방송 관계자에게만 인사했다는 '팬 무시' 태도 논란이 보도됐다. 3월에는 소속사 SM C&C가 재계약하지 않았다(논란과의 인과는 미확인). 그러니 김준현을 떠올리게 하는 요소는 더 피한다. 또 유튜브는 2026년 9월 무렵 폭식·과식을 조장하는 먹방의 수익 창출을 제한하기 시작했다고 보도됐다. '과장된 한 입' 연출이 폭식 조장처럼 보이지 않게, 한 입의 간절함을 개그 포인트로 삼는다."
verified = "verified"
notes = "인용한 2024년 기사의 제목은 '[간밤TV] ‘돈쭐’ 먹방 크리에이터도 놀랄 강호동 햄버거 원샷'이고, '맛있는 녀석들도 놀랄 한입만'은 제목이 아니라 본문 문장이다. 정규 방송 시작일은 2015.3.13이다."
sources = ["https://ko.wikipedia.org/wiki/맛있는_녀석들", "https://sports.khan.co.kr/article/202402071819003/amp"]
caution_sources = ["https://sports.khan.co.kr/article/202602172232003", "https://www.heraldk.com/article/2026021715455521402", "https://www.dailian.co.kr/news/view/1694781/"]

