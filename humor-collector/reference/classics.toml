category = "드라마·영화"
year = "2003"
origin = "박찬욱 감독의 영화 '올드보이'(2003년 11월 개봉)에서 오대수(최민식)는 15년 동안 갇혀 매일 중국집 군만두만 먹는다. 풀려난 뒤에는 그 맛을 단서로 '청룡' 중국집을 찾아다니고, 일식집에서 산낙지를 먹는다."
meaning = "같은 음식만 지겹도록 먹는 상황, 오래 갇혀 지내다 나온 사람을 빗댄다."
use_when = "같은 메뉴만 반복되는 컷, 오래 갇혀 있다 나온 컷, 복수를 다짐하는 컷"
food_fit = "냉동실에 15년 갇혀 있던 군만두 캐릭터가 탈출하며 복수를 다짐하는 장면"
fame = 4
fame_evidence = "2004년 칸영화제에서 한국영화 최초로 심사위원대상을 받았다. 2021년 세계일보는 산낙지 장면을 최민식의 명연기 압권으로 다시 다뤘다."
caution = "영화 결말 소재가 무거운 청소년관람불가 작품이니 군만두 설정만 빌려 쓸 것. 산 낙지를 먹는 묘사는 거부감을 줄 수 있으니 피할 것. 최민식 얼굴도 그리지 말 것."
verified = "verified"
notes = "인용된 기사들은 '패러디 단골'이라고 직접 말하지 않는다. 명장면이라는 평가만 확인했다. '누구냐 넌'은 별칭으로만 두었고 출처로는 확인하지 못했다."
sources = ["https://segye.com/view/20211119511028", "https://inews24.com/view/103057", "https://ko.wikipedia.org/wiki/올드보이_(영화)"]

[[classic]]
