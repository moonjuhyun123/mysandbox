meaning = "화끈하고 털털한 센 언니 캐릭터를 부르는 애칭."
use_when = "센 언니 캐릭터가 팀을 이끌거나 화를 꾹 참는 컷."
food_fit = "식빵 캐릭터 그 자체로 쓸 수 있다. 털털한 식빵 언니가 다른 빵들을 이끄는 장면."
fame = 5
fame_evidence = "스포츠경향(2019.8.20) \"유튜브 시작한 김연경, 채널 이름이 '식빵언니'인 이유\", 스포츠경향(2024.7.1) \"김연경 '한일전서 식빵 언니 탄생'\". 도쿄올림픽 취재진 사이트에 영문 별명 'Bread Unnie'로 소개됐다."
caution = "비속어를 순화한 말이 유래이므로 욕설을 연상시키는 대사나 연출(입 가리기, 삐 처리)은 피한다. 실존 인물 초상과 유튜브 채널 로고는 쓰지 않는다. '식빵언니'는 김연경 본인을 가리키는 식별 표지다. 2021년 8월 파리바게뜨·SPC삼립은 김연경을 모델로 뽑고 '식빵언니' 이름의 빵 제품을 냈다. 같은 시기 제3자가 '식빵언니'를 43류(카페·식당업) 상표로 출원한 사실도 보도됐다. 2022년 6월 8일 시행된 부정경쟁방지법 제2조 제1호 타목은 널리 알려진 사람의 성명 등 식별 표지를 허락 없이 영업에 쓰는 행위를 규제한다. 그래서 브랜드형 음식 캐릭터 계정에서는 식빵 캐릭터의 이름, 제목, 해시태그로 '식빵언니'를 쓰지 않는다. 협찬이나 보증 광고로 오인될 수 있기 때문이다. 꼭 써야 하면 법률 검토를 먼저 받는다. 또 2023년 8~11월 이다영이 SNS에서 김연경의 괴롭힘·갑질을 주장했다. 이 주장은 사실로 확인되지 않았고, 김연경 측은 법적 대응을 밝혔다. 따돌림이나 갑질을 연상시키는 '센 언니' 연출과는 묶지 않는다."
