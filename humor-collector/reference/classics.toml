notes = "'한우' 채끝살인지는 확인한 기사(데일리안)에 나오지 않아 '채끝살'로만 적었다. 롯데마트 순위는 3월에 짜파게티가 1위, 4월에 너구리가 1위였다. 기생충의 '제시카 징글'과 '너는 계획이 다 있구나'는 따로 떨어진 밈인데, 이번에 출처를 확인하지 못해 이 항목에서 뺐다(웹검색 한도 소진)."
