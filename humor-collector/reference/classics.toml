category = "게임·스트리머"
year = "2022"
origin = "2022 롤드컵 그룹스테이지에서 DRX가 로그에 진 뒤, 10월 9일(한국시간) 뉴욕 인터뷰에서 데프트(김혁규)가 '우리끼리만 안 무너지면 충분히 이길 수 있다'고 말했다. 쿠키뉴스 문대찬 기자가 이 말을 '꺾이지 않는 마음'으로 정리했고, 데프트도 우승 직후 SNS에 이 문구를 썼다."
meaning = "지거나 불리해도 포기하지 않는 마음. 응원 문구로 쓴다."
use_when = "실패 직후 다시 일어나는 컷, 시험이나 다이어트 각오, 응원 현수막이나 태극기 소품."
food_fit = "부러진 빼빼로, 금 간 쿠키, 안 부러지는 스파게티 면이 '중요한 건 꺾이지 않는 마음'이라고 말하는 '꺾임' 말장난."
fame = 5
fame_evidence = "카타르 월드컵 포르투갈전(12.3)에서 16강에 오른 뒤 선수들이 이 문구가 적힌 태극기를 들어 올렸고, 쿠키뉴스(2022.12.11)는 이 말이 '전 국민에게 각인됐다'고 썼다. 위키백과에는 2022 LCK 어워드 '올해의 밈상' 수상이 기재돼 있다."
caution = "실존 선수와 축구 국가대표의 이름, 얼굴은 쓰지 않고 문구만 빌릴 것. 너무 많이 쓰여 식상할 수 있다."
verified = "verified"
notes = "'중꺾마'라는 줄임말을 누가 처음 만들었는지는 미확인이다. 쿠키뉴스 기사 제목이 정확히 '중요한 건 꺾이지 않는 마음'이었는지는 직접 확인하지 못했다. 본문 기준으로는 기자가 '꺾이지 않는 마음'이라고 썼다. LCK 밈상의 보도 매체와 연합뉴스·SBS·JTBC 보도도 미확인이다(웹검색 한도 소진)."
sources = ["https://v.daum.net/v/20221109132802286", "https://v.daum.net/v/20221211060702312", "https://ko.wikipedia.org/wiki/데프트"]

