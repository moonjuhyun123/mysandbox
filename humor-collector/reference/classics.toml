fame = 4
fame_evidence = "매일신문의 '유행어로 살펴본 2011년 대중문화계'에 실렸다. iMBC(2016.7.29) '무한도전 유행어 BEST 5'에서 3위다. OSEN(2011.8.20)도 정형돈의 대표 유행어로 소개했다."
caution = "'지드래곤', '조인성' 같은 실존 인물 이름 대신 음식 이름으로 바꿔 쓴다. '조인성 보고 있나?'를 퍼뜨린 길은 2017년 세 번째 음주운전으로 징역 6월에 집행유예 2년을 받았다. 지드래곤은 2023년 마약 의혹을 받았으나 경찰이 '혐의없음'으로 불송치했다. 별칭 속 실존 인물 이름 버전(지드래곤·조인성 보고 있나)은 쓰지 않고, 길의 SNS 게시물도 인용하지 않는다."
verified = "verified"
notes = "원조는 길이 아니다. 2011.4.30 정형돈의 '드래곤 보고 있나'가 먼저이고 2011년 당시 기사들도 그를 원조로 본다. 길의 '조인성 보고 있나?'(조정 특집)는 iMBC가 시작점으로 소개한 후속 사례다."
sources = ["https://www.imaeil.com/page/view/2011121817124019986", "https://www.hankyung.com/amp/2011043014477", "https://www.osen.co.kr/article/C1108200032", "https://enews.imbc.com/News/RetrieveNewsInfo/187982"]
caution_sources = ["https://mobile.busan.com/view/busan/view.php?code=20171013000118", "https://www.kyeonggi.com/article/20231219580037", "https://www.hankyung.com/amp/2011043014477"]

