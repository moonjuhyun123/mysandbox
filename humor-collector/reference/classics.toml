risk_checked = true
notes = "연구자가 낸 레이디경향 기사(2023.3.24)는 화보 기사여서 조롱 논란 근거가 되지 못한다. 논란 근거는 다음(v.daum.net, 2023.1.7) 기사다. 시즌3 첫 방송일은 미확인."
sources = ["https://enews.imbc.com/News/ViewAmp/369887", "https://v.daum.net/v/20230107154505706?x_trkm=t", "https://lady.khan.co.kr/entertainment/article/202303240721011"]
