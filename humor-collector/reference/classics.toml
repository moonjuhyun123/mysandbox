[[slang]]
name = "킹받네"
aliases = ["킹받다", "킹받게 하네", "왕위계승(변형)"]
category = "기타"
year = "2018년 말 등장 (2021~2022년 널리 유행, 대중화 정확 시점 미확인)"
origin = "'열받네'의 '열'을 'King'으로 바꿔 강조한 말. 2018년 말 무렵 침착맨(이말년) 방송의 말버릇에서 유행했다는 설명이 여러 자료에 있으나 1차 출처는 미확인. 2021~2022년에는 '왕위계승' 같은 말장난 변형까지 나왔다."
meaning = "[신조어] 진짜 화나기보다 얄밉고 약 올라서 웃기게 열받는 상태."
use_when = "상대가 얄밉게 굴어서 화는 나는데 웃긴 상황, 장난스러운 짜증 대사."
food_fit = "과자 봉지를 뜯었더니 질소만 가득할 때, 마지막 남은 튀김을 친구가 먹었을 때 \"아 킹받네\" 대사로 딱 맞다."
fame = 5
fame_evidence = "Z세대 트렌드 매체 캐릿, 트렌드 뉴스레터가 반복적으로 다뤘고 우리말샘 풀이를 인용한 자료가 있음. 2026년에도 '킹받으면 좋겠어' 변형 챌린지가 소개됨."
caution = "분류: 신조어. 침착맨 유래설이 있으므로 단어만 쓰고 인물 얼굴·말투 흉내 연출은 피할 것. 유래설이 있는 침착맨이 2026년 9월 펄볶이 시식 방송에서 여성 흉내 목소리로 '맛이 참 썩을 년'이라고 말해 여성혐오 논란이 일었다. 영상은 사과 없이 편집됐다. 음식 캐릭터 만화는 이 장면과 겹쳐 보일 수 있다. 그러니 침착맨 말투나 방송 장면 패러디는 하지 않고, 음식 맛을 비하어로 표현하는 대사와 함께 쓰지 않는다."
verified = "partial"
risk_checked = true
notes = "이전 메모의 '출처 근거 약함'과 달리 침착맨 말버릇 유래설이 복수 자료에 있으나 최초 방송 회차는 미확인. 일부 블로그의 '이말년 유튜브 대중화' 설명도 단일 출처라 미확인."
sources = ["https://maily.so/trendaword/posts/jknrj3n4old", "https://maily.so/trendaword/posts/l1zq6ekeo5x", "https://www.careet.net/526"]
caution_sources = ["https://m.go.seoul.co.kr/news/life/2026/09/28/20260928500153", "https://isplus.com/article/view/isp202609300167"]

