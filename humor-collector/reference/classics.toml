use_when = "캐릭터가 부탁하거나 용서를 빌며 억지 애교를 부리는 컷, 또는 귀여운 척이 민망해지는 반전 컷에 쓴다."
food_fit = "1+1 행사 상품 캐릭터들이 '1 더하기 1은~' 손동작을 하는 연출이 잘 맞는다. 떡이나 찐빵처럼 동그란 캐릭터가 볼에 손가락을 대는 애교 포즈도 자연스럽다."
