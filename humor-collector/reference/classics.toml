food_fit = "치킨 캐릭터에게 후광과 성가대 효과를 넣고, 다른 음식 캐릭터들이 절하는 장면."
fame = 5
fame_evidence = "위키트리가 2015년 7월 14일 '대한민국 5대 느님'으로 꼽았고, 이투데이도 2015년 7월 22일 기사에서 설명했다. 위키백과 신조어 목록에도 실려 있다."
caution = "종교 비하로 읽히지 않게 가볍게 쓴다."
verified = "partial"
