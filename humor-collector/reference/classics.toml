meaning = "터무니없거나 맥락 없는 농담, 또는 그런 말을 던지는 일을 뜻한다. 흔히 '개드립 치지 마'처럼 상대 말을 일축할 때 쓴다."
use_when = "한 캐릭터가 엉뚱한 농담을 던지고 다른 캐릭터가 정색하며 받아치는 컷에 쓴다."
food_fit = "드립 커피와 말장난이 된다. 드리퍼나 원두 캐릭터가 '드립 치는' 장면으로 쓸 수 있다."
fame = 4
fame_evidence = "경향신문 2012.9.7 '디스·개드립·짤방' 기사에서 대표 신조어로 다루었다. 강원도민일보 2010.8.2 칼럼 '신조어 개드립'에서도 다루었다. '드립 치다'는 지금도 일상어로 쓰인다."
caution = "'개' 접두어 때문에 비속어로 읽힐 수 있다. 같은 이름의 커뮤니티 사이트(개드립넷)가 있으므로 그 로고나 디자인은 패러디하지 않는다."
verified = "partial"
risk_checked = true
notes = "위키백과는 출처를 디시인사이드 '코미디 프로그램 갤러리'로 적고 있다. '개'는 '개 같은'(경향)으로도, 폄하 접두어(위키백과·강원도민일보)로도 풀이된다. 처음 생긴 해는 확인하지 못했다(웹 검색 한도 소진으로 추가 검색 불가)."
sources = ["https://www.khan.co.kr/article/201209072147545", "http://www.kado.net/news/articleView.html?idxno=475110", "https://ko.wikipedia.org/wiki/대한민국의_인터넷_신조어_목록"]

[[slang]]
name = "개이득"
aliases = ["개이득각"]
category = "인터넷·커뮤니티"
year = "미확인"
origin = "강조의 '개-'를 '이득'에 붙여 큰 이득을 보았다는 뜻으로 쓰는 신조어이다. 처음 쓰인 곳과 시점은 미확인이다."
meaning = "생각지도 못한 이득을 크게 보았을 때 쓰는 감탄 표현이다."
use_when = "1+1 행사, 덤, 서비스처럼 뜻밖에 좋은 것을 얻는 장면에 맞는다."
food_fit = "치킨을 시켰는데 다리가 하나 더 들어 있거나 감자튀김이 서비스로 오자 캐릭터가 \"개이득!\"을 외치는 장면으로 쓸 수 있다."
fame = 4
fame_evidence = "위키백과 신조어 목록에 '큰 이득을 보았다는 뜻'으로 실려 있지만 출처 각주는 없다."
caution = "'개-' 접두사가 비속어처럼 들릴 수 있다. 브랜드 협업 게시물에서는 순화한 표현을 고려한다."
verified = "partial"
risk_checked = true
notes = "'개꿀'은 이 말의 별칭이 아니라 뜻이 비슷한 별개 신조어여서 별칭에서 뺐다. 기원 시점은 미확인이다."
sources = ["https://ko.wikipedia.org/wiki/대한민국의_인터넷_신조어_목록"]

[[slang]]
name = "그 잡채"
category = "인터넷·커뮤니티"
year = "2021년 말 (밈 유행 2022)"
origin = "'그 자체'의 '자체'를 음식 이름 '잡채'로 바꾼 말장난이다. 2021년 말 무렵 여러 커뮤니티에서 쓰이기 시작했고 2022년 방송과 광고 문구로 퍼졌다. 최초 사용자는 미확인이다."
meaning = "어떤 성질을 지녔음을 '그 자체'보다 장난스럽게 강조하는 말이다."
use_when = "무엇이 어떤 성질 그 자체라고 과장해서 말할 때 맞는다(예: 귀여움 그 잡채)."
food_fit = "잡채 캐릭터가 직접 '나는 귀여움 그 잡채'라고 말하면 이름이 곧 말장난이 되어 음식 만화와 특히 잘 맞는다."
fame = 4
fame_evidence = "트렌드어워드(2022.10.13)는 거의 모든 사람이 쓰는 말이 되었고 유퀴즈, 놀토, 지락실 등 예능에서도 쓰였다고 전했다. 코리아중앙데일리(2022.12.15)도 대표 신조어로 다뤘다."
caution = "특정 인물과 관련이 없어 특별한 주의점은 없다."
verified = "verified"
risk_checked = true
notes = "최초 사용자는 미확인이다. 나머지 정보는 출처와 일치한다."
sources = ["https://maily.so/trendaword/posts/wjzd592mo3p", "https://www.koreajoongangdaily.com/korea/think-english-ep1/11828301"]

[[slang]]
name = "극대노"
aliases = ["극대노 짤", "극대노함"]
category = "인터넷·커뮤니티"
year = "2001(위키백과 기재, 원문 미확인) / 2010년 이후 재유행 시점 미확인"
origin = "위키백과 신조어 목록은 이 말이 2001년 SBS 시트콤 《웬만해선 그들을 막을 수 없다》(2000.12.18~2002.2.22)에서 나왔다고 적고, 2001년 3월 29일 동아일보 TV가이드를 출처로 든다. 그 기사 원문과, 어느 인물의 어떤 장면에서 나왔는지는 미확인이다."
meaning = "'극도로 크게 화를 냄'을 뜻하며, 매우 화난 상태를 과장해 표현하는 말이다."
use_when = "캐릭터가 참다가 폭발하는 컷, 얼굴이 빨개지고 머리에서 김이 나는 과장된 분노 리액션 장면에 맞다."
food_fit = "끓어 넘치는 냄비, 펄펄 끓는 찌개, 매운 고추 캐릭터의 분노 표정과 잘 어울린다."
fame = 4
fame_evidence = "위키백과 신조어 목록에 표제어로 실려 있다. 2010년 이후 인터넷이나 방송 자막에서 얼마나 쓰이는지는 이번 조사에서 확인하지 못했다."
caution = "일반 어휘라 권리 문제는 적다. 실존 인물 사진으로 만든 '극대노 짤'을 그대로 쓰면 초상권 문제가 있으므로 말만 빌리는 편이 안전하다."
verified = "partial"
risk_checked = true
notes = "시트콤의 방영 기간과 방송사(SBS)는 확인했다. 그러나 '극대노'가 실제로 그 시트콤에서 나왔는지와 2010년 이후 다시 유행했는지는 확인하지 못했다. 동아일보 사이트에 접근할 수 없었고 검색 한도도 소진되었으므로 범위 판단에 추가 검증이 필요하다."
sources = ["https://ko.wikipedia.org/wiki/대한민국의_인터넷_신조어_목록", "https://ko.wikipedia.org/wiki/웬만해선_그들을_막을_수_없다"]

[[slang]]
name = "금사빠"
aliases = ["금방 사랑에 빠지는 사람", "금사빠 체질"]
category = "인터넷·커뮤니티"
year = "미확인 (언론 용례는 2016년 2월이 가장 이르다)"
origin = "'금방 사랑에 빠지는 사람'을 줄인 말이다. 처음 쓴 사람과 시점은 미확인이며, 우리말샘에 실린 용례는 뉴스1(2016.2)과 OSEN(2016.3)의 드라마 기사다."
meaning = "누군가에게 쉽게, 금방 반하는 사람이나 그런 성향을 가리킨다."
use_when = "캐릭터가 새로운 상대나 물건을 볼 때마다 첫눈에 반하는 장면, 소개팅이나 썸 에피소드에 쓴다."
food_fit = "편의점 신상이나 계절 한정 메뉴만 나오면 하트 눈이 되는 캐릭터에게 잘 맞는다. '신메뉴 금사빠'처럼 음식 취향에 붙이기 쉽다."
fame = 4
fame_evidence = "우리말샘에 '금사빠'와 '금사빠녀'가 표제어로 올라 있고 2016년 연예 기사 용례가 있다. 영어 위키낱말사전에도 한국어 속어로 실려 있다."
caution = "실존 인물과 관련된 말이 아니어서 위험이 낮다. '금사빠녀'처럼 성별 꼬리표를 붙이면 비하로 읽힐 수 있으므로 피한다."
verified = "partial"
risk_checked = true
notes = "뜻과 2016년 언론 용례를 우리말샘으로 확인했다. 처음 쓰인 시점과 처음 쓴 사람은 확인하지 못했다. 웹검색 한도 소진으로 결산 기사는 찾지 못했다."
sources = ["https://en.wiktionary.org/wiki/금사빠", "https://opendict.korean.go.kr/search/searchResult?focus_name_top=query&query=금사빠", "https://opendict.korean.go.kr/dictionary/view?sense_no=1368605"]

[[slang]]
name = "급발진"
aliases = ["급발진하다"]
category = "인터넷·커뮤니티"
year = "미확인"
origin = "자동차가 운전자 의도와 달리 갑자기 가속하는 '급발진'에서 빌린 말로, 갑자기 화를 내거나 흥분하는 것을 이르는 속어 뜻이 생겼다. 처음 쓴 곳과 시점은 미확인이다."
meaning = "대화 중 맥락 없이 갑자기 화를 내거나 감정이 폭발하는 상황을 이른다."
use_when = "평온하던 캐릭터가 사소한 말 한마디에 갑자기 버럭하는 반전 컷, 또는 다른 캐릭터가 '왜 급발진해?'라고 받아치는 컷에 쓴다."
food_fit = "뚜껑이 들썩이며 끓어 넘치는 냄비나 라면, 갑자기 터지는 팝콘 캐릭터가 '급발진'하는 장면으로 표현하기 좋다."
fame = 4
fame_evidence = "영어 위키낱말사전 '급발진' 항목에 'sudden anger'라는 속어 뜻이 실려 있다. 기원 관련 자료는 확인하지 못했다."
caution = "실제 급발진 사고는 피해자와 소송이 얽힌 민감한 사안이므로 자동차 사고 장면이나 차량 이미지는 쓰지 않고 감정 폭발의 뜻으로만 쓴다."
verified = "partial"
risk_checked = true
notes = "속어 뜻만 확인되었고 기원과 유행 시점은 확인하지 못했다. 이번 작업에서는 웹 검색 한도가 소진되고 나무위키 접속이 403으로 막혀 추가 검증을 하지 못했다."
sources = ["https://en.wiktionary.org/wiki/급발진"]

[[slang]]
name = "까방권 (까임방지권)"
aliases = ["까임방지권", "까방권 획득", "평생 까방권", "까방권이 날아갔다"]
category = "인터넷·커뮤니티"
year = "2010년 이전 등장(2010.2.9 기사에 소개), 2018 러시아 월드컵 때 확산"
origin = "'까임 방지권'을 줄인 누리꾼 신조어로, 한 번 크게 활약하면 다른 잘못에 대한 비난을 면제받는다는 뜻이다(아시아경제 2010.2.9). 2018 러시아 월드컵 독일전 중 이영표 해설위원의 '독일을 이긴 우리 선수들에게 까방권을 줘야 한다'는 말이 인터넷에서 화제가 됐다(SBS 2018.7.2)."
meaning = "큰 공을 세운 사람의 앞으로의 실수를 봐주자는 우스갯소리 면죄부다. 실수가 반복되어 이를 잃으면 '까방권이 날아갔다'고 한다."
use_when = "큰 활약을 한 캐릭터에게 다른 캐릭터들이 '평생 까방권'을 수여하는 컷에 맞는다. 곧바로 실수해 까방권을 잃는 반전 컷도 가능하다."
food_fit = "야근을 버티게 해 준 치킨에게 '평생 까방권' 증서를 주는 컷으로 쓸 수 있다. 숙취를 풀어 준 해장국이 까방권을 받는 컷도 가능하다."
fame = 4
fame_evidence = "매일신문(2018.7.2)은 '젊은층은 아는데 기성세대는 잘 몰라'라는 제목 아래 '젊은층에게는 익숙한 단어'라고 소개했다. SBS(2018.7.2)는 디시인사이드의 '까방권을 주고 싶은 월드컵 스타' 투표에서 조현우가 1위를 했다고 보도했다."
caution = "실존 선수의 이름이나 얼굴과 함께 쓰지 않는다. '까다'는 비난한다는 뜻의 속어이므로 실존 인물을 겨냥하지 않도록 주의한다. 일반 신조어라 상표 문제는 없다."
verified = "verified"
risk_checked = true
notes = "아시아경제 기사 입력일은 2010년 2월 9일이다. 이영표 해설위원 발언은 매일신문이 아니라 SBS 기사에서 확인했다. 처음 쓰인 정확한 시점은 미확인이다."
sources = ["https://www.asiae.co.kr/article/2010020813132898706", "https://www.imaeil.com/page/view/2018070218073493874", "https://news.sbs.co.kr/news/endPage.do?news_id=N1004828969"]

[[slang]]
name = "깨알 (깨알 같은 재미)"
aliases = ["깨알 같은 재미", "깨알 디테일", "깨알같다"]
category = "인터넷·커뮤니티"
year = "미확인"
origin = "깨의 낱알을 뜻하는 '깨알'이 작지만 눈에 띄는 재미나 디테일을 이르는 속어로 쓰인다. 처음 쓴 곳과 시점은 미확인이다."
meaning = "작고 사소하지만 알차서 웃음이나 감탄을 주는 요소를 이른다."
use_when = "배경 구석에 숨겨 둔 작은 장치나 소품을 짚는 컷, 또는 캐릭터가 '깨알 디테일'이라며 감탄하는 컷에 쓴다."
food_fit = "참깨 캐릭터가 직접 '깨알 같은 재미'를 자처하거나, 깨가 솔솔 뿌려진 음식에 말장난으로 붙이기 좋다."
fame = 4
fame_evidence = "영어 위키낱말사전 '깨알' 항목에 속어 뜻이 따로 실려 있으나 뜻풀이는 비어 있다. 한국어 위키낱말사전에는 본뜻만 있다."
caution = "일반 어휘라 초상권이나 저작권 문제는 없다. 다만 2010년 이후에 유행했는지는 확인하지 못했다."
verified = "partial"
risk_checked = true
notes = "속어 뜻이 있다는 사실만 확인했고, 그 뜻풀이와 유행 시점, 2010년 이후 유행 여부는 확인하지 못했다. 이번 작업에서는 웹 검색 한도가 소진되어 추가 검증을 하지 못했다."
sources = ["https://en.wiktionary.org/wiki/깨알", "https://ko.wiktionary.org/wiki/깨알"]

[[slang]]
name = "꾸안꾸"
aliases = ["꾸민 듯 안 꾸민 듯", "꾸안꾸 룩"]
category = "인터넷·커뮤니티"
year = "미확인 (2017년 기사 용례, 유행 2020 전후)"
origin = "'꾸민 듯 안 꾸민 듯하다'의 줄임말이다. 우리말샘 용례는 이코노믹리뷰 2017년 8월 기사부터 시작하며, 처음 쓴 사람과 시점은 미확인이다."
meaning = "힘을 많이 준 티가 나지 않으면서도 자연스럽게 멋을 낸 차림이나 스타일을 이른다."
use_when = "외출 준비에 오래 걸려 놓고 대충 나온 척하는 장면, 소개팅이나 약속 전 옷 고르는 장면에 어울린다."
food_fit = "토핑을 다 걷어 내고 '오늘은 꾸안꾸 룩'이라고 말하는 플레인 베이글이나, 파슬리 한 잎만 얹은 파스타 캐릭터로 쓸 수 있다."
fame = 4
fame_evidence = "우리말샘 표제어이며 이코노믹리뷰(2017), 패션엔(2020), 헤럴드팝(2020) 등 패션 기사 용례가 이어진다."
caution = "실존 인물과 관련이 없다. 외모 평가나 체형 비하로 이어지지 않게 쓴다."
verified = "partial"
risk_checked = true
notes = "카테고리를 '인터넷·커뮤니티'로 고쳤다. 나무위키 접근이 막혀 최초 사용처는 미확인으로 남겼다."
sources = ["https://opendict.korean.go.kr/dictionary/view?sense_no=1425284"]

[[slang]]
name = "낄끼빠빠"
aliases = ["낄 땐 끼고 빠질 땐 빠져라"]
category = "인터넷·커뮤니티"
year = "미확인 (2015년 기사 용례)"
origin = "'낄 때 끼고 빠질 때 빠져라'의 줄임말이다. 한국일보 2015년 9월 19일 기사가 청소년·젊은 층 줄임말의 예로 들었으며, 처음 쓴 사람과 시점은 미확인이다."
meaning = "모임이나 대화에 눈치껏 끼어들고 빠질 때를 알라는 뜻으로, 눈치 없는 사람에게 핀잔을 줄 때 쓴다."
use_when = "둘만의 분위기에 눈치 없이 끼어드는 캐릭터, 반대로 적절히 자리를 비켜 주는 캐릭터가 나오는 장면에 어울린다."
food_fit = "치킨과 맥주가 다정한 자리에 콜라 캐릭터가 끼어들자 '낄끼빠빠 좀'이라고 하거나, 눈치 빠른 소스 캐릭터가 스스로 접시에서 빠지는 장면으로 쓸 수 있다."
fame = 4
fame_evidence = "위키백과 신조어 목록에 한국일보 2015년 기사 인용과 함께 실려 있고, 우리말샘에도 표제어로 올라 있다."
caution = "한국일보 기사는 부정적인 줄임말의 예로 소개했다. 특정 캐릭터를 따돌리는 장면으로 보이지 않게 가볍게 쓴다."
verified = "partial"
risk_checked = true
notes = "한국일보 2015년 9월 19일 기사 출처를 확인했다. 최초 사용처는 미확인이다."
sources = ["https://ko.wikipedia.org/wiki/대한민국의_인터넷_신조어_목록", "https://www.hankookilbo.com/News/Read/201509190490516840", "https://opendict.korean.go.kr/search/searchResult?query=낄끼빠빠"]

[[slang]]
name = "날먹"
aliases = ["날로 먹기", "날먹하다"]
category = "인터넷·커뮤니티"
year = "미확인 (언론 용례는 2020년 11월이 가장 이르다)"
origin = "관용구 '날로 먹다'를 줄인 말로, 우리말샘은 주로 게임에서 노력 없이 쉽게 결과를 얻을 때 쓴다고 풀이한다. 처음 쓴 사람과 시점은 미확인이며, 우리말샘에 실린 용례는 인벤(2020.11)과 위키트리(2021.12) 기사다."
meaning = "노력은 하지 않고 성과나 이득만 쉽게 챙기는 일을 가리킨다. 조별과제 무임승차처럼 남의 수고에 묻어가는 상황에 쓴다."
use_when = "팀플에서 한 캐릭터만 아무것도 하지 않고 이름을 올릴 때, 남이 다 차린 밥상에 숟가락만 얹을 때 쓴다."
food_fit = "'날로 먹다'와 글자 뜻이 겹쳐 회·육회·날달걀 캐릭터의 말장난에 잘 맞는다. 남이 끓인 라면에 젓가락만 얹는 캐릭터도 자연스럽다."
fame = 4
fame_evidence = "국립국어원 우리말샘에 표제어로 올라 있고 2020~2021년 인터넷 매체 용례가 있다. 영어 위키낱말사전도 한국어 속어로 싣고 조별과제 무임승차를 예문으로 든다."
caution = "특정 인물과 엮인 말이 아니어서 초상권이나 저작권 문제는 없다. 게임 커뮤니티의 비난조 어감이 있으므로 실존 인물을 겨냥하지 말고 캐릭터끼리의 장난으로만 쓴다."
verified = "partial"
risk_checked = true
notes = "뜻은 우리말샘으로 확인했고, 주로 게임에서 쓰인다는 풀이를 더했다. 줄임말이 처음 쓰인 시점은 확인하지 못했다. 웹검색 한도가 소진되고 나무위키가 403으로 막혀 우리말샘과 위키낱말사전만 확인했다."
sources = ["https://en.wiktionary.org/wiki/날먹", "https://opendict.korean.go.kr/search/searchResult?focus_name_top=query&query=날먹", "https://opendict.korean.go.kr/dictionary/view?sense_no=1527866&viewType=confirm"]

[[slang]]
name = "넘나 ~한 것"
aliases = ["넘나 좋은 것", "넘나 맛있는 것"]
category = "인터넷·커뮤니티"
year = "2015~2016 (미확인, 2016년 6월 노래 제목 사용 확인)"
origin = "'너무나'를 '넘나'로 줄이고 문장을 '~한 것'으로 끝내는 SNS 말투다. 걸그룹 소나무가 2016년 6월 29일 '넘나 좋은 것'을 미니앨범 타이틀곡으로 냈으며, 말투의 정확한 기원은 미확인이다."
meaning = "감탄을 '넘나 ~한 것'이라는 명사형 말투로 귀엽게 표현하는 말이다."
use_when = "맛있거나 귀여운 것을 보고 감탄하는 장면에 맞는다."
food_fit = "첫입을 먹은 캐릭터가 눈을 반짝이며 '넘나 맛있는 것'이라고 말하는 시식 컷에 그대로 쓸 수 있다."
fame = 4
fame_evidence = "위키백과에 따르면 소나무가 2016년 6월 29일 미니앨범 '넘나 좋은 것'을 냈고, 우리말샘에 '넘나'가 '너무나'의 구어 준말로 실려 있다."
caution = "노래 제목과 같은 짧은 말투 인용은 부담이 적지만 음원이나 뮤직비디오 장면은 쓰지 않는다."
verified = "partial"
risk_checked = true
notes = "소나무 곡의 발매일(2016년 6월 29일)은 확인했으나 2015년 하반기 SNS 유행 시작 시점, 글자 수 제한설, 도티 사용 사례는 미확인이다."
sources = ["https://ko.wikipedia.org/wiki/소나무_(음악_그룹)", "https://opendict.korean.go.kr/search/searchResult?focus_name=query&query=넘나"]

[[slang]]
name = "뇌피셜"
aliases = ["지인피셜", "~피셜"]
category = "인터넷·커뮤니티"
year = "미확인 (2020년 1월 신조어 정리에 수록)"
origin = "'뇌'와 영어 'Official'을 합친 말로, 매일신문 2020년 1월 기사가 중급 신조어로 소개했다. 처음 쓰인 곳과 시점은 미확인이다."
meaning = "검증되지 않은 자기 생각을 사실처럼 말하는 것을 뜻한다. 지인의 말만 근거로 삼으면 '지인피셜'이라고 한다."
use_when = "한 캐릭터가 근거 없는 주장을 자신 있게 늘어놓고, 다른 캐릭터가 '그거 뇌피셜이잖아'라고 받아치는 컷에 맞는다."
food_fit = "'민트초코는 치약 맛'이나 '탕수육은 부먹이 정답' 같은 음식 논쟁에서 반박 대사로 쓸 수 있다. '빵피셜', '면피셜'처럼 바꿔 쓰는 것도 가능하다."
fame = 4
fame_evidence = "매일신문 2020년 1월 신조어 기사의 중급 항목에 실렸고, '지인피셜'이 비슷한 말로 함께 소개되었다."
caution = "특별한 민감 요소는 없다. 실제 인물의 발언을 '뇌피셜'로 지목하는 데는 쓰지 않는다."
verified = "partial"
risk_checked = true
notes = "'지인피셜'은 기사에서 별도 항목이 아니라 뇌피셜 설명 속 비슷한 말로 언급되었다. 최초 사용처와 시점은 미확인이다."
sources = ["https://www.imaeil.com/page/view/2020012000392764264"]

[[slang]]
name = "느좋"
aliases = ["느낌 좋다", "느좋 카페", "느좋남", "느좋녀"]
category = "인터넷·커뮤니티"
year = "2024(최초 사용 시점 미확인)"
origin = "'느낌 좋다'의 줄임말로 '예쁘다·멋지다·감성적이다' 대신 쓰며, '느좋 카페 발견'처럼 쓴다(캐릿 2024.08.28). 캐릿은 '최근 SNS에서 자주 보이는' 단어라고만 했고, 최초 사용처는 미확인이다."
meaning = "분위기와 감성이 좋아 호감이 간다는 뜻의 줄임말이다. '느좋남·느좋녀'는 외모나 스펙보다 분위기, 말투, 태도, 센스로 호감을 주는 사람을 이른다."
use_when = "감성 카페, 분위기 있는 장소나 사람을 소개하는 장면, 허세 섞인 감성샷을 찍는 장면에 쓴다."
food_fit = "라테아트 커피나 크로플 같은 감성 디저트 캐릭터가 창가에서 분위기를 잡는 '느좋 카페' 컷, 또는 무심한 듯 센스 있는 '느좋남 아메리카노' 캐릭터에 잘 맞는다."
fame = 4
fame_evidence = "캐릿이 2024년 8월 '요즘 뜨는 최신 유행어 3'에 넣었고, 2024년 10월 'Z세대가 정말 쓰는 유행어 vs 안 쓰는 유행어'에서도 실제로 쓰이는 표현으로 다뤘다. 우리말샘 참여자 제안에 느좋·느좋남·느좋녀가 올라 있다."
caution = "실존 인물이나 상표와 무관한 일반 줄임말이다. '느좋남·느좋녀'를 성별 대결 구도로 쓰지 않는다."
verified = "partial"
risk_checked = true
notes = "캐릿 1492(2024.10.29)에서 '한차례 화제가 된 줄임말'이라는 문구는 확인하지 못했다. 해당 기사는 느좋을 멋지다·감성적이다의 대체어로 활용되고 있다고 설명하고 '느좋과 함께 최근에는 깊생'이라고 이었다. 캐릿 1451은 '느무(너무) 좋다'가 아니라 '느낌 좋다'의 줄임말이라고 밝혔다. 최초 사용처는 확인하지 못했다(검색 한도 소진)."
sources = ["https://www.careet.net/1451", "https://www.careet.net/1492", "https://opendict.korean.go.kr/search/searchResult?query=느좋&infoType=suggest"]

[[slang]]
name = "돈쭐"
aliases = ["돈쭐내다", "돈쭐 내러 왔다"]
category = "인터넷·커뮤니티"
year = "2019 (진짜파스타 사례), 밈 유행 2021"
origin = "'돈'과 '혼쭐'을 합친 말. 나무위키는 2019년 7월 홍대 '진짜파스타'의 결식아동 무료 식사가 알려지며 문화가 시작됐다고 본다. 2021년 2~3월 철인7호 치킨 홍대점 사장이 형편이 어려운 형제에게 무료로 치킨을 준 일이 퍼지며 '돈쭐' 주문이 몰렸다. 단어를 처음 쓴 사람과 시점은 미확인."
meaning = "선행을 한 가게의 물건을 일부러 많이 사 주며 보상한다는 반어적 표현이다."
use_when = "착한 일을 한 캐릭터에게 손님이 몰려들어 '돈쭐 내러 왔다'고 하는 장면."
food_fit = "좋음. 몰래 선행한 떡볶이·치킨 캐릭터 가게 앞에 손님이 줄 서는 컷에 바로 쓸 수 있다."
fame = 4
fame_evidence = "2021년 아시아경제·SBS·노컷뉴스 등 주요 언론이 '돈쭐'이라는 표현을 그대로 썼다. 착한 가게 미담 기사의 단골 표현이다."
caution = "실제 가게(철인7호, 진짜파스타)의 이름·간판·사장 얼굴은 쓰지 말 것. 주문이 몰려 영업을 잠시 멈춘 사례도 있어, 실존 가게를 연상시키지 말고 가상의 가게로만 그린다. 철인7호 홍대점 사장은 화제가 된 뒤 공황장애와 우울증을 겪었다고 밝혔다. 동정심을 악용해 돈을 요구하는 협박도 받았다(2022년 보도). 2025년 4월에는 윤석열 파면 감사 문구를 내건 치킨집이 별점 테러를 당했고, 반대편에서 '돈쭐' 응원이 몰렸다. 이처럼 진영 대결 구도에서도 쓰인 말이다. 정치적 문구, '별점 테러 대 돈쭐' 구도, 선행 당사자를 다시 주목받게 하는 연출은 피한다."
verified = "partial"
risk_checked = true
notes = "단어의 최초 사용 시점·출처는 미확인. 카테고리 목록에 '신조어'가 없어 인터넷·커뮤니티로 두었으며, 사용자 요청대로 별도 '신조어' 묶음으로 분류해야 한다. 이전 메모의 '인지도 4 미만'은 2021년 언론 보도량을 볼 때 4로 상향."
sources = ["https://namu.moe/w/%EB%8F%88%EC%AD%90", "https://www.asiae.co.kr/en/article/2021030110160372465", "https://www.yugacrew.com/yugawiki/%EB%8F%88%EC%AD%90", "https://nocutnews.co.kr/news/5627812"]
caution_sources = ["https://seoul.co.kr/news/life/2022/08/21/20220821500097", "https://nocutnews.co.kr/news/6322157"]

[[slang]]
name = "동공지진"
category = "인터넷·커뮤니티"
year = "미확인 (우리말샘 신문 용례로 2016년 7월 이전부터 쓰인 것은 확인)"
origin = "당황해서 눈동자가 흔들리는 모습을 지진에 빗댄 말이다. 처음 쓴 곳(프로그램이나 사이트), 사람, 시기는 미확인이다."
meaning = "몹시 당황하거나 놀라서 눈동자가 떨리는 모습을 과장해서 이르는 말이다."
use_when = "거짓말이 들키거나 예상하지 못한 질문을 받고 얼어붙는 컷에 쓴다. 클로즈업한 눈에 떨림 효과선을 넣는 반응 컷에 잘 맞는다."
food_fit = "달걀 프라이 노른자나 푸딩, 젤리 캐릭터가 출렁이며 눈동자가 흔들리는 연출이 자연스럽다. 몰래 먹다 들킨 간식 캐릭터에도 쓸 수 있다."
fame = 4
fame_evidence = "국립국어원 우리말샘에 '동공 지진(瞳孔地震)'으로 실려 있고, 조선일보(2016년 7월)와 아주경제(2016년 11월) 기사 용례가 붙어 있다."
caution = "실제 연예인의 '동공지진 짤'이나 방송 캡처를 쓰지 말고 캐릭터 표정으로만 그린다. 실제 지진 피해 소식이 있는 시기에는 '지진' 표현을 쓰지 않는다."
verified = "partial"
risk_checked = true
notes = "카테고리 '반응어/반응짤 자막'은 허용 목록에 없어 '인터넷·커뮤니티'로 바꿨다. '예능 자막에서 퍼졌다'는 설명은 출처로 확인하지 못했다. 웹 검색 한도가 소진되고 나무위키가 403으로 막혀 최초 사용처는 추가로 확인하지 못했다."
sources = ["https://opendict.korean.go.kr/search/searchResult?query=동공지진", "https://opendict.korean.go.kr/dictionary/view?sense_no=1369140"]

[[slang]]
name = "될놈될"
aliases = ["될 놈은 된다"]
category = "인터넷·커뮤니티"
year = "미확인 (2024년 캐릿 기사 기준 약 10년 전 유행, 2010년대 중반 추정)"
origin = "'될 놈은 된다'의 줄임말이다. 캐릿은 2024년 기사에서 이 말을 '이생망'과 함께 약 10년 전 유행한 자조적 유행어로 소개했다. 처음 쓴 곳은 미확인이다."
meaning = "노력과 상관없이 잘될 사람은 결국 잘된다는 뜻으로, 체념이나 부러움을 담아 쓴다."
use_when = "대충 한 캐릭터가 오히려 성공하고 열심히 한 캐릭터가 허탈해하는 반전 컷에 쓴다."
food_fit = "대충 끓였는데도 맛있는 라면, 아무렇게나 섞었는데 대박 난 조합 메뉴를 보고 다른 음식들이 '될놈될'이라며 허탈해하는 장면에 쓰기 좋다."
fame = 4
fame_evidence = "캐릿 '될놈될부터 원영적 사고까지 밈으로 보는 Z세대의 가치관'(2024-09-03)이 이 말을 10년 전 대표 유행어로 다루었고, 2025년 밈 트렌드 기사(캐릿 1756)도 이 기사를 다시 언급했다."
caution = "일반 어휘라 초상권이나 저작권 문제는 없다."
verified = "partial"
risk_checked = true
notes = "발견자가 든 캐릿 1756은 링크 제목에서만 이 말을 언급하므로, 실제 설명이 있는 캐릿 1456을 근거로 보강했다. 처음 쓴 곳과 정확한 연도는 확인하지 못했다."
sources = ["https://www.careet.net/1456", "https://www.careet.net/1756"]

[[slang]]
name = "뜬금포"
aliases = ["뜬금포로", "뜬금없다"]
category = "인터넷·커뮤니티"
year = "미확인"
origin = "야구에서 예상하지 못한 홈런을 이르던 말이 인터넷에서 갑작스럽고 뜬금없는 일이라는 뜻으로 넓어졌다. 처음 쓴 시점은 미확인이다."
meaning = "맥락 없이 갑자기 튀어나온 말이나 사건을 이르며, 주로 '뜬금포로'처럼 부사로 쓴다."
use_when = "대화 흐름과 상관없는 말이나 인물이 갑자기 끼어드는 컷, 예상 밖의 반전 결말 컷에 맞는다."
food_fit = "떡볶이 냄비에 갑자기 들어온 파인애플, 짜장면 사이에 뜬금포로 나타난 민트초코 캐릭터처럼 쓸 수 있다."
fame = 4
fame_evidence = "영어 위키낱말사전에 야구 은어와 인터넷 은어 두 뜻으로 실려 있다. 그 밖의 인지도 자료는 이번 검증에서 확인하지 못했다."
caution = "특별한 민감 요소는 없다. 야구 중계 화면이나 구단 로고를 배경으로 쓰면 저작권과 상표 문제가 생기므로 쓰지 않는다."
verified = "partial"
risk_checked = true
notes = "영어 위키낱말사전은 '포'를 捕로 적었다. 홈런을 '포'로 부르는 말이라 砲일 가능성이 높아 보이지만 한자는 미확인이다. 야구 용어가 처음 쓰인 시점과 인터넷으로 퍼진 시점도 미확인이어서 2010년 이후 유행 여부를 확인하지 못했다."
sources = ["https://en.wiktionary.org/wiki/뜬금포", "https://en.wiktionary.org/wiki/Category:Korean_internet_slang"]

[[slang]]
name = "레알"
aliases = ["레알 진짜"]
category = "인터넷·커뮤니티"
year = "발생 시점 미확인, 2010~2011 대중화"
origin = "디시인사이드 해외축구 갤러리에서 생긴 말이다. '레알 마드리드'의 Real을 '레알'로 읽는 데서 '진짜'라는 뜻이 됐다(한국어 위키백과). 스포츠경향(2011.3.20)은 왜 '리얼'이 아니라 '레알'로 읽느냐는 질문이 디시에 반복된 것을 계기로 들었다. 처음 쓰인 시점은 미확인이다."
meaning = "'진짜, 정말'이라는 뜻이다. '레알?'은 '진짜야?'라고 되묻는 말이다."
use_when = "놀라운 소식에 '레알?' 하고 되묻는 장면, 한 입 먹고 '레알 맛있다'고 감탄하는 장면에 쓴다."
food_fit = "새 메뉴를 맛본 캐릭터가 '레알 미쳤다'고 리액션하거나, 1+1 소식에 '레알?' 하고 되묻는 장면에 쓴다."
fame = 4
fame_evidence = "스포츠경향 2011년 신조어 기사에 온라인발 신조어로 실렸다. 한국어 위키백과 '대한민국의 인터넷 신조어' 문서에도 항목이 있다."
caution = "레알 마드리드의 엠블럼과 유니폼은 상표이므로 소품으로 그리지 않는다."
verified = "partial"
risk_checked = true
notes = "위키백과는 발생지를 디시인사이드 '해외축구 갤러리'로 특정한다. 발생 연도는 확인하지 못했다."
sources = ["https://sports.khan.co.kr/article/201103202038133", "https://ko.wikipedia.org/wiki/대한민국의_인터넷_신조어"]

[[slang]]
name = "마기꾼"
aliases = ["마스크 사기꾼", "마해자"]
category = "인터넷·커뮤니티"
year = "미확인(마스크 착용이 일상화된 코로나19 시기에 유행한 것으로 보이나 출처 미확인)"
origin = "'마스크'와 '사기꾼'을 합친 인터넷 은어다. 반대말로 마스크 때문에 손해 보는 사람을 뜻하는 '마해자'가 있다. 처음 쓴 시점은 미확인이다."
meaning = "마스크를 썼을 때 실제보다 훨씬 잘생기거나 예뻐 보이는 사람을 이르는 말이다."
use_when = "무언가를 벗기거나 걷어 냈을 때 기대와 다른 모습이 드러나는 반전 컷에 맞는다."
food_fit = "포장지나 호일을 벗기자 모양이 무너져 있는 김밥, 사진과 실물이 다른 배달 음식, 과대포장 과자를 '포기꾼(포장 사기꾼)'처럼 바꿔 쓸 수 있다."
fame = 4
fame_evidence = "영어 위키낱말사전에 한국어 인터넷 은어로 실려 있고 반대말 '마해자'까지 등재돼 있다. 그 밖의 인지도 자료는 이번 검증에서 확인하지 못했다."
caution = "외모 평가 농담이므로 실존 인물 사진이나 독자의 얼굴에 붙이지 말고 음식의 포장과 실물 대비로만 쓴다. 코로나19 피해나 마스크 착용 자체를 조롱하지 않는다."
verified = "partial"
risk_checked = true
notes = "뜻과 반대말 '마해자'는 확인했다. 최초 사용 시점은 미확인이며 코로나19 시기 유행이라는 점도 출처로 확인하지 못했다."
sources = ["https://en.wiktionary.org/wiki/마기꾼", "https://en.wiktionary.org/wiki/Category:Korean_internet_slang"]

[[slang]]
name = "만반잘부"
aliases = ["만나서 반가워 잘 부탁해"]
category = "인터넷·커뮤니티"
year = "미확인(우리말샘 용례 2018년 7월)"
origin = "'만나서 반가워. 잘 부탁해.'의 줄임말이다. 최초 사용처와 시점은 미확인이며, 우리말샘 용례는 국민일보(2018년 7월)와 위키트리(2023년 1월)다."
meaning = "처음 만난 상대에게 반갑다며 잘 부탁한다고 건네는 인사를 줄인 말이다."
use_when = "새 캐릭터가 처음 등장해 자기소개를 하는 장면, 전학생이나 신입이 인사하는 장면에 쓴다."
food_fit = "새로 합류한 음식 캐릭터(신메뉴, 새로 들어온 반찬)가 냉장고나 식탁 친구들에게 '만반잘부!'라고 인사하는 첫 컷에 어울린다."
fame = 4
fame_evidence = "우리말샘 표제어이며 2018년 국민일보와 2023년 위키트리 용례가 있다. 2018년 용례는 이 말을 쓰는 행동을 풍자적으로 본다고 적어, 대표적 신조어로 인식됐음을 보여 준다."
caution = "실존 인물이나 상표와 무관하다. 2018년 무렵 유행한 말이라 다소 지난 신조어로 느껴질 수 있어, 일부러 옛 신조어를 쓰는 설정으로 쓰면 자연스럽다."
verified = "partial"
risk_checked = true
notes = "우리말샘에 실린 용례는 2건(국민일보 2018년 7월, 위키트리 2023년 1월)이다. '2018년부터 2023년까지 언론 용례가 이어진다'는 표현은 중간 연도 용례가 없으므로 '2018년과 2023년 용례'로 고쳤다. 최초 사용처는 확인하지 못했다(검색 한도 소진). 인지도는 경계선인 4로 판단했다."
sources = ["https://opendict.korean.go.kr/dictionary/view?sense_no=1523692"]

[[slang]]
name = "많관부"
aliases = ["많은 관심 부탁드립니다"]
category = "인터넷·커뮤니티"
year = "미확인(우리말샘 용례 2020년 11월)"
origin = "'많은 관심 부탁드립니다'의 줄임말로, 연예인이 새 활동을 알릴 때 인사말로 흔히 쓴다. 최초 사용처와 시점은 미확인이며, 우리말샘 용례는 일간스포츠(2020년 11월)가 처음이다. 톱스타뉴스(2021년 12월)와 엠비시연예(2023년 7월) 용례도 실려 있다."
meaning = "새로 시작하는 활동이나 결과물에 관심을 가져 달라고 가볍고 귀엽게 부탁하는 인사말이다."
use_when = "신제품·신메뉴 출시, 새 연재 시작, 이벤트 공지처럼 무언가를 홍보하며 마무리하는 컷에 쓴다."
food_fit = "신메뉴나 시즌 한정 메뉴 캐릭터가 데뷔 무대처럼 등장해 '많관부!'라고 인사하는 마지막 컷에 잘 맞는다. 만화 자체의 홍보 문구로도 쓸 수 있다."
fame = 4
fame_evidence = "우리말샘 표제어이며 2020·2021·2023년 연예 기사 용례가 연달아 실려 있다."
caution = "실존 인물이나 상표와 무관한 일반 줄임말이라 사용 부담이 적다."
verified = "partial"
risk_checked = true
notes = "뜻과 우리말샘 용례 3건(2020년 11월, 2021년 12월, 2023년 7월)은 확인했다. 최초 사용처는 확인하지 못했다(검색 한도 소진, 나무위키 접근 차단). 카테고리를 '인터넷·커뮤니티'로 바꿨다."
sources = ["https://opendict.korean.go.kr/dictionary/view?sense_no=1531800"]

[[slang]]
name = "머쓱타드"
aliases = ["머쓱"]
category = "인터넷·커뮤니티"
year = "미확인 (우리말샘 신문 용례로 2019년 8월 이전부터 쓰인 것은 확인)"
origin = "'머쓱'과 '머스터드'의 소리가 비슷한 데서 나온 인터넷 말장난이다. 처음 쓴 곳, 사람, 그리고 흔히 함께 쓰이는 이미지의 출처는 미확인이다."
meaning = "어색하고 민망한 장면이나 상황을 익살스럽게 이르는 말이다."
use_when = "착각해서 인사했다가 무안해지거나, 혼자 들떴다가 분위기가 식은 컷에서 뒷머리를 긁는 포즈와 함께 쓴다."
food_fit = "머스터드 소스 통 캐릭터가 머쓱하게 뒷머리를 긁는 장면에 그대로 쓸 수 있다. 핫도그 위 머스터드나 케첩 옆에서 소외된 머스터드도 소품으로 좋다."
fame = 4
fame_evidence = "우리말샘에 '주로 인터넷상에서' 쓰는 명사로 실려 있고, 비욘드포스트(2019년 8월)와 디지틀조선일보(2020년 2월) 용례가 있다."
caution = "머스터드 통은 실제 브랜드의 라벨, 로고, 병 모양을 따라 하지 말고 가상의 디자인으로 그린다. 인터넷에 도는 기존 머쓱타드 이미지도 원작자를 알 수 없으니 그대로 쓰지 않는다."
verified = "partial"
risk_checked = true
notes = "카테고리 '채팅 유행어(말장난)'는 '인터넷·커뮤니티'로 바꿨다. 말이 생긴 원리(머쓱+머스터드)는 사전에서 확인했지만 최초 사용처는 확인하지 못했다."
sources = ["https://opendict.korean.go.kr/search/searchResult?query=머쓱타드", "https://opendict.korean.go.kr/dictionary/view?sense_no=1425241"]

[[slang]]
name = "문송합니다"
aliases = ["문과라서 죄송합니다", "문송하다", "문송"]
category = "인터넷·커뮤니티"
year = "2015년경 (시점은 발견자 기록, 미확인)"
origin = "취업이 어려운 문과생들이 '문과라서 죄송합니다'를 줄여 스스로를 자조하며 쓴 말이다. 우리말샘에 '문송하다'로 실려 있으며, 처음 쓰인 시점과 장소는 미확인이다."
meaning = "'문과라서 죄송하다'는 뜻으로, 이공계 위주 채용 속에서 문과생이 자신을 자조하는 말이다."
use_when = "취업, 면접, 진로 고민 장면이나 자기 전공이 쓸모없게 느껴지는 자조 컷에 맞는다."
food_fit = "문어 캐릭터가 면접장에서 고개를 숙이며 '문송합니다'라고 말하는 말장난으로 쓸 수 있다."
fame = 4
fame_evidence = "국립국어원 우리말샘에 '문송하다'가 '취직이 어려운 문과생들이 스스로를 자조적으로 이르는 말'로 등재되어 있다. 방송과 일간지 사용 사례는 확인하지 못했다."
caution = "'센송합니다' 파생설은 민족 비하 표현과 얽혀 있으므로 유래로 언급하지 않는다. 정치인 발언 사례는 인용하지 않고, 특정 전공 비하가 아닌 자조 톤을 유지한다."
verified = "partial"
risk_checked = true
notes = "뜻은 우리말샘으로 확인했으나, 2015년 SNS 기원, '센송합니다' 파생설, 2018년 유시민 방송 사용 사례는 미확인이다. 별칭 '이송합니다'는 확인하지 못해 '문송하다'로 바꿨다."
sources = ["https://opendict.korean.go.kr/search/searchResult?focus_name=query&query=문송하다"]

[[slang]]
name = "반박 시 니 말이 맞음"
aliases = ["반박 시 님 말이 맞음", "반박 시 맛알못"]
category = "인터넷·커뮤니티"
year = "미확인(2021년 9월 뉴스레터에서 이미 흔히 쓰이는 표현으로 소개)"
origin = "글 끝에 붙여 꼬투리 잡는 반박과 논쟁을 피하는 인터넷 커뮤니티 문구로, 한 짤방에서 시작됐다고 알려졌으나 최초 출처는 미확인이다. '반박 시 맛알못' 같은 변형은 '침펄토론'에서 쓰이기 시작했다는 소개가 있다."
meaning = "내 의견은 이렇지만 반박하면 그냥 당신 말이 맞다고 해 주겠다며 논쟁을 피하는 말이다."
use_when = "한 캐릭터가 주장을 늘어놓은 뒤 마지막 컷에서 상대가 입을 열려 하자 재빨리 꼬리를 붙이는 장면에 맞는다."
food_fit = "부먹·찍먹, 민트초코 같은 음식 논쟁에서 주장을 끝낸 뒤 '반박 시 니 말이 맞음' 또는 '반박 시 맛알못' 팻말을 드는 컷으로 쓸 수 있다."
fame = 4
fame_evidence = "2021년 9월 30일 트렌드 뉴스레터가 인터넷에서 자주 쓰이는 회피 표현으로 소개했다. 2024년 6월 클리앙 글에서 이 표현의 무례함을 두고 조회 3만여 건, 댓글 100개의 논쟁이 이어졌다."
caution = "상대를 무시하는 말로 받아들이는 사람도 있으므로 독자와 실제 논쟁하는 공지나 댓글에서는 쓰지 말고 캐릭터 대사로만 쓴다. 커뮤니티에 있던 비속어 변형('반박 시 고자' 등)은 쓰지 않는다."
verified = "partial"
risk_checked = true
notes = "클리앙 글은 2024년 6월 18일 글이다. 댓글에는 디시인사이드, 루리웹, 웃대 기원설과 '반박시 골룸' 같은 앞선 표현의 순화형이라는 설이 있으나 모두 미확인이다. 최초 출처와 시점도 미확인이다."
sources = ["https://maily.so/trendaword/posts/4wdr98l9olx", "https://www.clien.net/service/board/park/18748242"]

[[slang]]
name = "방구석 여포"
aliases = ["방구석 OO", "키보드 워리어"]
category = "인터넷·커뮤니티"
year = "미확인"
origin = "'방구석'과 삼국지의 맹장 '여포'를 합친 인터넷 은어다. 처음 쓴 시점은 미확인이다."
meaning = "현실에서는 소심하지만 온라인이나 혼자 있을 때만 큰소리치고 싸움꾼이 되는 사람을 이르는 말이다."
use_when = "댓글창이나 단톡방에서는 큰소리치던 캐릭터가 실제로 마주치자 작아지는 반전 컷에 맞는다."
food_fit = "냉장고 안에서는 '내가 제일 맵다'고 큰소리치던 고추가 식탁에 오르자 조용해지는 장면처럼 쓸 수 있다. '냉장고 여포', '접시 위 여포'로 바꿔 써도 된다."
fame = 4
fame_evidence = "영어 위키낱말사전에 한국어 인터넷 은어로 실려 있다(2021년 6월 편집). 그 밖의 인지도 자료는 이번 검증에서 확인하지 못했다."
caution = "특정 네티즌이나 실제 댓글 작성자를 지목하는 용도로 쓰지 않는다. 여포는 역사 인물이라 초상권 문제는 없다."
verified = "partial"
risk_checked = true
notes = "뜻과 구성은 확인했다. 최초 사용 시점은 미확인이어서 2010년 이후 유행 여부도 확인하지 못했다."
sources = ["https://en.wiktionary.org/wiki/방구석_여포", "https://en.wiktionary.org/wiki/Category:Korean_internet_slang"]

[[slang]]
name = "버카충"
aliases = ["뻐카충"]
category = "인터넷·커뮤니티"
year = "미확인"
origin = "'버스 카드 충전'의 줄임말이다. 처음 쓰인 시기와 장소, 퍼뜨린 계층은 미확인이다."
meaning = "버스 카드에 돈을 충전하는 일을 줄여 부르는 말로, 학생들이 쓰던 대표적인 줄임말로 기억된다."
use_when = "학창 시절 회상 장면, 줄임말을 못 알아듣는 세대 차이 개그, 교통카드 잔액이 모자란 장면에 맞는다."
food_fit = "편의점 앞에서 떡볶이 캐릭터가 '버카충 하고 올게'라고 말하는 학생 시절 회상 컷 정도로 쓸 수 있으나, 음식과 직접 이어지지는 않는다."
fame = 4
fame_evidence = "우리말샘에 일반어로 실려 있고, 위키백과 '대한민국의 인터넷 신조어'에 표제어로 있다. 확산 시기를 보여 주는 기사는 확인하지 못했다."
caution = "특별한 권리 문제는 없다. 교통카드 브랜드 로고는 쓰지 않는다."
verified = "partial"
risk_checked = true
notes = "우리말샘에 '버스 카드 충전을 줄여 이르는 말'로 실려 있음을 새로 확인했다. 유래와 시기는 여전히 미확인이다. 웹 검색 한도가 다 찼고 나무위키 접속이 막혀 추가 확인을 하지 못했다."
sources = ["https://ko.wikipedia.org/wiki/대한민국의_인터넷_신조어", "https://opendict.korean.go.kr/search/searchResult?query=버카충"]

[[slang]]
name = "세 줄 요약"
aliases = ["세줄요약 좀", "3줄 요약", "한 줄 요약"]
category = "인터넷·커뮤니티"
year = "미확인 (디시인사이드에서 발생, 2010년 이전일 가능성 있음)"
origin = "위키백과에 따르면 디시인사이드에 사건 관련 글이 쏟아질 때 상황을 모르는 이용자들이 '요약좀', '세줄요약좀' 같은 댓글을 달았다. 이것이 긴 글 맨 앞이나 맨 뒤에 요약을 미리 넣는 문화로 굳었으며, 생겨난 시기는 미확인이다."
meaning = "긴 내용을 핵심 세 줄로 줄여 달라, 또는 줄였다는 뜻으로 영어권의 TL;DR에 해당한다. 한 줄, 두 줄 요약 같은 변형도 쓰인다."
use_when = "마지막 컷에서 앞 세 컷의 상황을 세 줄로 정리하는 캡션, 장황하게 말하는 캐릭터에게 '세줄요약 좀'이라고 하는 장면에 맞다."
food_fit = "레시피를 길게 늘어놓는 요리 캐릭터에게 '세 줄 요약: 끓인다, 넣는다, 먹는다'로 받아치는 구도에 잘 맞는다."
fame = 4
fame_evidence = "한국어 위키백과에 단독 문서가 있으며, 문서는 이 문화를 현재형으로 서술하고 변형 표현까지 소개한다."
caution = "일반 표현이라 권리 문제나 민감성 문제는 거의 없다."
verified = "partial"
risk_checked = true
notes = "디시인사이드 유래는 위키백과로 확인했지만 발생 연도는 미확인이다. 2000년대에 생겼을 가능성이 있어 2010년 이후 범위에 드는지는 확인하지 못했다(검색 한도 소진)."
sources = ["https://ko.wikipedia.org/wiki/세_줄_요약"]

[[slang]]
name = "손민수"
aliases = ["손민수하다", "손민수템"]
category = "인터넷·커뮤니티"
year = "미확인 (웹툰 '치즈인더트랩' 2010년대 연재 중 유행)"
origin = "네이버 웹툰 '치즈인더트랩'에서 주인공 홍설의 패션, 헤어스타일, 태도를 따라 하는 등장인물 손민수에서 나온 말이다. 유행이 시작된 정확한 시점과 연재 회차는 미확인이다."
meaning = "남의 취향, 옷, 물건을 그대로 따라 하는 행위를 가리키며, '손민수했다'처럼 동사로도 쓴다."
use_when = "한 캐릭터가 다른 캐릭터의 옷이나 말투를 똑같이 따라 하는 장면, 유행템을 너도나도 따라 사는 장면에 어울린다."
food_fit = "한 김밥이 옆 김밥의 토핑 구성을 똑같이 따라 하거나, 디저트들이 유행하는 장식을 서로 따라 하는 장면으로 쓸 수 있다."
fame = 4
fame_evidence = "위픽레터는 오래전부터 쓰여 온 이 말이 지금도 '추구미'와 함께 활발히 쓰인다고 설명했다. 구체적인 사용량 지표는 확인하지 못했다."
caution = "'치즈인더트랩'은 작가 순끼와 네이버웹툰의 저작물이므로 원작 그림이나 캐릭터 외형을 재현하지 않는다. 드라마판 배우의 사진도 쓰지 않는다. 남을 집요하게 따라 하는 인물을 비꼬는 뉘앙스가 있으니 실존 인물에게 쓰지 않는다."
verified = "partial"
risk_checked = true
notes = "웹툰 기원과 뜻은 확인되었으나 연재 연도, 손민수 등장 회차, 밈으로 유행한 시점은 미확인이다. 검색 한도 소진으로 추가 확인은 하지 못했다."
sources = ["https://letter.wepick.kr/post/2237"]

[[slang]]
name = "스불재"
aliases = ["스스로 불러온 재앙"]
category = "인터넷·커뮤니티"
year = "미확인 (2022년 말 기준 유행어)"
origin = "'스스로 불러온 재앙'의 첫 글자를 딴 줄임말이다. 최초 사용자, 게시처, 시점은 미확인이며, 2022년 12월 코리아중앙데일리가 요즘 쓰는 신조어로 소개했다."
meaning = "막을 수도 있었던 곤란한 일을 자기 행동으로 불러왔을 때 자조하며 쓰는 말이다."
use_when = "자기 선택 때문에 곤란해진 캐릭터를 보여 주는 마지막 반전 컷에 맞는다."
food_fit = "매운맛 단계를 최고로 골라 땀범벅이 된 라면 캐릭터나, 새벽에 야식을 시켜 놓고 후회하는 캐릭터가 '스불재'라고 중얼거리는 장면이 된다."
fame = 4
fame_evidence = "코리아중앙데일리(2022.12.15)가 '그 잡채'와 함께 요즘 대화의 대표 신조어로 다뤘다."
caution = "특정 인물과 관련이 없어 특별한 주의점은 없다."
verified = "partial"
risk_checked = true
notes = "뜻은 확인했다. 최초 사용자와 시점은 미확인이며, 웹 검색 한도가 소진되어 추가로 확인하지 못했다."
sources = ["https://www.koreajoongangdaily.com/korea/think-english-ep1/11828301"]

[[slang]]
name = "시고르자브종"
aliases = ["시골 잡종"]
category = "인터넷·커뮤니티"
year = "미확인"
origin = "'시골 잡종'을 유럽 고급 품종 이름처럼 들리게 바꿔 부르는 말로, 시골 믹스견을 귀엽게 이르는 유머 표현이다. 처음 쓰인 곳과 시기는 미확인이다. 위키백과는 진돗개가 미국에 진출할 때 외국인이 '시골잡종'을 품종명으로 오해해 생겼다는 설을 소개하지만, 출처가 없는 전언이다."
meaning = "흔하고 투박한 것을 고급 외래어 이름처럼 그럴듯하게 포장해 부르는 말장난이다. 시골 믹스견을 애정 있게 부를 때 주로 쓴다."
use_when = "평범한 캐릭터를 명품 혈통처럼 소개하는 장면, 시골 출신 캐릭터가 도시에서 고급스러운 척하는 장면."
food_fit = "시골 감자·고구마·옥수수 캐릭터를 '시고르자브 감자'처럼 유럽 귀족 품종인 양 소개하는 이름 패러디로 쓰기 좋다. 강아지 모양 붕어빵이나 핫도그 캐릭터에도 붙일 수 있다."
fame = 4
fame_evidence = "한국어 위키백과 '잡종견' 문서에 이 표현의 유래 설명이 실려 있다. 영어 위키낱말사전에도 '똥개'의 유머 동의어로 등재되어 있다. 언론 기사로 인지도를 확인하지는 못했고, 인지도 점수는 검증자의 판단이다."
caution = "실존 인물이나 상표와 관련된 문제는 적다. 다만 '잡종'이라는 표현이 믹스견 비하로 읽힐 수 있으므로, 애정 어린 맥락에서 쓰는 것이 좋다."
verified = "partial"
risk_checked = true
notes = "위키백과의 '진돗개 미국 진출' 유래설에는 각주가 없어 사실로 확정할 수 없다. 처음 쓰인 곳과 시기는 끝내 미확인이다. 웹 검색 한도가 소진되어 뉴스 기사로 교차 확인하지 못했다."
sources = ["https://ko.wikipedia.org/wiki/잡종견", "https://en.wiktionary.org/wiki/시고르자브종"]

[[slang]]
name = "시월드 / 처월드"
aliases = ["시월드", "처월드"]
category = "인터넷·커뮤니티"
year = "미확인"
origin = "시댁이나 시집살이에 '월드'를 붙여, 부정적인 느낌을 농담으로 바꾼 인터넷 신조어이다. 처가를 가리키는 '처월드'도 함께 쓰인다. 처음 쓰인 시기와 장소는 미확인이다."
meaning = "'시가'(남편의 집안)를 속되게 이르는 말로, 시댁이 낯설고 어려운 별세계라는 뉘앙스가 담겨 있다. '처월드'는 아내 쪽 집안을 가리킨다."
use_when = "명절에 배우자 집안을 방문해 긴장하는 장면, 낯선 집안 규칙에 당황하는 장면에 맞는다."
food_fit = "명절 전이나 송편 캐릭터가 '시월드' 간판이 걸린 거대한 놀이공원 문 앞에서 긴장하는 배경 패러디로 쓸 수 있다."
fame = 4
fame_evidence = "우리말샘에 '시가를 속되게 이르는 말'로 실려 있고, 위키백과에 독립 문서가 있다. 우리말샘에 '처월드'는 없다."
caution = "고부 갈등과 명절 성 역할 문제와 이어져 댓글에서 성별 갈등으로 번지기 쉽다. 한쪽 집안이나 한쪽 성별을 탓하지 않는 가벼운 긴장감 정도로만 쓴다."
verified = "partial"
risk_checked = true
notes = "처음 쓰인 시기와 출처는 위키백과와 우리말샘 어디에도 없어 미확인으로 두었다. 나무위키는 접속이 막혀 확인하지 못했고, 웹 검색 한도가 다 차서 추가 검색도 하지 못했다."
sources = ["https://ko.wikipedia.org/wiki/시월드", "https://opendict.korean.go.kr/search/searchResult?query=시월드"]

[[slang]]
name = "쌉가능"
aliases = ["쌉인정", "쌉-(강조 접두어)"]
category = "인터넷·커뮤니티"
year = "미확인(2019년 9월 기업 채용 안내 문자 논란 때 이미 유행)"
origin = "'가능' 앞에 '완전'이라는 뜻의 강조어 '쌉'을 붙인 신조어다. 2019년 9월 17일 LG CNS 인사 담당자가 지원자에게 보낸 문자에 '제출 후에도 수정 쌉가능!'이라고 써 논란이 되고 회사가 사과했다. '쌉'은 비속어 '씹'을 순화했다는 설과 '삽질'에서 왔다는 설이 있으나 어원은 미확인이다."
meaning = "충분히, 아주 쉽게 할 수 있다는 뜻을 강하게 나타내는 말이다."
use_when = "부탁이나 도전을 받은 캐릭터가 자신만만하게 엄지를 드는 컷, 무리한 요구도 흔쾌히 받는 컷에 맞는다."
food_fit = "'곱빼기 가능?'이라는 질문에 짜장면 캐릭터가 '쌉가능'이라고 답하거나, 라면이 '야식 한 그릇 더 쌉가능'이라고 외치는 컷으로 쓸 수 있다."
fame = 4
fame_evidence = "2019년 대기업 채용 문자에 쓰여 기사화될 만큼 퍼져 있었고, 이투데이 2020년 8월 12일 기사가 이 사례를 다시 다뤘다. 2026년 9월 브라보마이라이프 '요즘말' 기사에도 일상 표현으로 소개됐다."
caution = "'쌉'이 비속어에서 왔다는 설이 있어 기업 협찬이나 공식 문구에서는 불쾌감 논란이 생길 수 있다(2019년 LG CNS 사례). 캐릭터 대사로만 쓴다. 2020년 8월 LG유플러스가 배너 광고에 '샵가능!'이라고 썼다가 '쌉가능'을 연상시킨다는 비판을 받았다. 국립국어원 관계자도 기업 문구에서는 비속어에 가까운 신조어를 조심해야 한다고 말했다. 브랜드 계정의 게시물은 만화라도 회사 문구로 읽힐 수 있으므로 게시물 제목, 캡션, 해시태그, 프로모션 문구에는 쓰지 않고 말풍선 대사로만 쓴다. 발음이 비슷한 말장난(예: '샵가능')도 피한다."
verified = "partial"
risk_checked = true
notes = "논란이 된 것은 2020년 채용 공고가 아니라 2019년 9월 17일 LG CNS 채용 안내 문자다. 2020년 8월 이투데이 기사는 이 사례를 LG유플러스 '샵가능' 광고 문구와 비교한 기사다. '쌉'의 어원과 최초 사용 시점은 미확인이다."
sources = ["https://www.etoday.co.kr/news/view/1928809", "https://bravo.etoday.co.kr/view/atc_view/19953"]
caution_sources = ["https://www.etoday.co.kr/news/view/1928809"]

[[slang]]
name = "안물안궁"
aliases = ["안 물어봤고 안 궁금해", "어쩔티비", "어쩔TV", "저쩔티비", "어쩔냉장고"]
category = "인터넷·커뮤니티"
year = "미확인 (2010년대)"
origin = "'안 물어봤고, 안 궁금하다'의 줄임말이다. 한국어 위키백과는 '안 물었고 안 궁금해'의 줄임말로 적는다. 처음 쓰인 곳과 시기는 미확인이다."
meaning = "상대의 자랑이나 장황한 말에 관심이 없다는 뜻을 가볍게 드러낸다."
use_when = "한 캐릭터가 묻지도 않은 자랑을 늘어놓을 때 옆 캐릭터가 무심하게 말을 끊는 장면에 쓴다."
food_fit = "자기 칼로리나 원산지를 자랑하는 음식 캐릭터에게 다른 캐릭터가 '안물안궁' 팻말을 드는 장면을 만들 수 있다."
fame = 4
fame_evidence = "이투데이 브라보마이라이프(2026.3.23) '요즘말 사전'이 젊은 세대가 흔히 쓰는 신조어로 소개했다. 한국어 위키백과 신조어 문서에도 항목이 있다."
caution = "상대를 무시하는 말이므로 실존 인물을 겨냥하지 않는다. 캐릭터끼리의 가벼운 티키타카로만 쓴다."
verified = "partial"
risk_checked = true
notes = "제시된 출처는 2026년 3월 23일자 기사 하나뿐이며, 2019년 기사는 확인하지 못했다. 기원과 시기는 검색 한도 소진으로 추가 확인하지 못했다. 10대 중심 신조어라는 이전 메모는 맞음. 최초 출처·발화자는 미확인."
sources = ["https://bravo.etoday.co.kr/view/atc_view/18738", "https://ko.wikipedia.org/wiki/대한민국의_인터넷_신조어", "https://maily.so/trendaword/posts/2x1zg5d9oqg", "https://www.careet.net/779", "https://www.incheon.go.kr/moo/MOO030101/2086225", "https://www.insight.co.kr/news/374814"]

[[slang]]
name = "야민정음"
aliases = ["댕댕이", "띵작", "커엽다", "머대리", "쀼"]
category = "인터넷·커뮤니티"
year = "1990~2000년대 통신체에서 비롯, 2014 무렵 야갤에서 확산, 2018 전후 대중화"
origin = "모양이 비슷한 글자로 바꿔 쓰는 말장난(멍멍이→댕댕이, 명작→띵작). 이름은 디시인사이드 국내야구 갤러리(야갤)와 훈민정음을 합친 것이다. 나무위키는 2014년 초 야갤 유저들이 엠엘비파크에 '대/머'를 바꿔 쓴 낚시 글을 올리며 크게 알려졌다고 적었다. 최초 창작자와 시점은 미확인."
meaning = "글자 모양이 비슷한 다른 글자로 바꿔 써서 웃음을 주는 표기 놀이다."
use_when = "간판, 메뉴판, 자막 같은 글자 소품을 비틀어 쓸 때. 대사보다는 배경 글씨에 어울린다."
food_fit = "보통. 강아지 간식 캐릭터를 '댕댕이'로 부르거나 메뉴판에 '띵작 라면'이라고 쓰는 정도로 쓸 수 있다."
fame = 4
fame_evidence = "'띵작'이 2018년 스포츠경향 신조어 정리에 실렸고, 강남구청이 '댕댕이 학교'로 홍보할 만큼 '댕댕이'가 굳어졌다. 영어 위키백과에도 문서가 있다."
caution = "'숲튽훈'처럼 실존 인물 이름을 비튼 예시는 쓰지 말 것. 실제 브랜드명·로고를 야민정음으로 비틀면 상표 패러디 문제가 생길 수 있다. 한글 파괴 논란이 있는 말이다. 2019년 팔도가 한정판 상품명을 '괄도네넴띤'으로 내놓았는데, 화제가 되자 한글 파괴 비판이 커졌다. 기업이나 브랜드가 쓰면 비판이 더 커질 수 있다. 계정명, 상품명, 한글날 무렵 게시물에는 쓰지 않는다."
verified = "partial"
risk_checked = true
notes = "야갤에서 처음 생긴 말은 아니고, 야갤에서 많이 쓰여 이름이 붙었다. 정확한 기원은 미확인. 용어 자체보다 댕댕이·띵작 같은 개별 단어가 더 유명하다. 사용자 요청대로 '신조어' 묶음으로 분류할 것(목록에 없는 카테고리라 인터넷·커뮤니티로 둠)."
sources = ["https://namu.moe/w/%EC%95%BC%EB%AF%BC%EC%A0%95%EC%9D%8C", "https://Www.wikipedia.org/wiki/Yaminjeongeum", "https://aimatters.co.kr/news-report/25580/", "https://sports.khan.co.kr/article/201812281745003"]
caution_sources = ["https://sgsg.hankyung.com/article/2019071296091"]

[[slang]]
name = "억까"
aliases = ["억지로 까기", "억지로 깜"]
category = "인터넷·커뮤니티"
year = "미확인 (우리말샘 신문 용례로 2020년 10월 이전부터 쓰인 것은 확인)"
origin = "'억지로 깜'을 줄인 인터넷 신조어다. 처음 쓴 커뮤니티나 시기는 미확인이며, 2021년에는 정치 기사에도 인용될 만큼 퍼졌다."
meaning = "그럴듯한 이유 없이 남의 흠을 들추어 비난하는 일을 이르는 말이다."
use_when = "말도 안 되는 이유로 트집을 잡히는 캐릭터가 억울해하는 컷에 쓴다. 사소한 실수에 과하게 몰려드는 비난을 패러디할 때도 맞는다."
food_fit = "민트초코나 하와이안 피자처럼 호불호가 갈리는 음식 캐릭터가 '억까 그만'이라고 항변하는 장면에 어울린다. 칼로리 때문에 늘 욕먹는 튀김 캐릭터에도 쓸 수 있다."
fame = 4
fame_evidence = "우리말샘에 명사로 실려 있고, 톱스타뉴스(2020년 10월)와 서울신문(2021년 6월, 정치인이 '젊은 사람들은 이런 것을 억까라고 한다'고 발언) 용례가 있다."
caution = "실제 정치인, 연예인, 특정 집단을 억까 대상이나 가해자로 그리지 않는다. 음식 취향 같은 가벼운 소재에만 쓰고 정치 맥락과 엮지 않는다."
verified = "partial"
risk_checked = true
notes = "카테고리 '채팅 유행어(줄임말)'는 '인터넷·커뮤니티'로 바꿨다. 사전 페이지에서 확인되는 신문 용례는 2020년, 2021년 두 건이며, 최초 사용처는 확인하지 못했다."
sources = ["https://opendict.korean.go.kr/search/searchResult?query=억까", "https://opendict.korean.go.kr/dictionary/view?sense_no=1570778"]

[[slang]]
name = "억텐"
aliases = ["억지 텐션"]
category = "인터넷·커뮤니티"
year = "미확인(우리말샘 용례 2021년 1월)"
origin = "'억지 텐션'의 줄임말로, 분위기를 띄우려고 억지로 꾸민 고양된 감정 상태를 속되게 이르는 말이다. 최초 사용처와 시점은 미확인이며, 우리말샘 용례는 서울경제(2021년 1월)와 스포츠경향(2026년 3월)이다."
meaning = "속으로는 신나지 않는데 분위기를 맞추려고 억지로 텐션을 끌어올린 상태를 이른다."
use_when = "재미없는 상황에서 억지로 리액션하는 장면, 회식이나 행사에서 과하게 밝은 척하는 장면에 쓴다."
food_fit = "유통기한이 임박한 음식이나 식어 가는 음식이 억지로 '저 아직 바삭해요!'라며 밝은 척하는 컷, 또는 회식 자리에서 억지로 건배하는 술병 캐릭터에 어울린다."
fame = 4
fame_evidence = "우리말샘 표제어이며 용례가 2021년부터 2026년 3월 연예 기사까지 이어진다."
caution = "실존 인물이 연관되지 않은 일반 신조어다. 실제 연예인의 리액션을 '억텐'이라 지목하면 비하로 받아들여질 수 있으므로 가상 캐릭터에만 쓴다."
verified = "partial"
risk_checked = true
notes = "뜻과 우리말샘 용례(서울경제 2021년 1월, 스포츠경향 2026년 3월)는 확인했다. 최초 사용처는 확인하지 못했다. 웹 검색 한도가 소진됐고 나무위키는 접근이 차단돼 더 확인하지 못했다. 카테고리를 '인터넷·커뮤니티'로 바꿨다."
sources = ["https://opendict.korean.go.kr/dictionary/view?sense_no=1666928"]

[[slang]]
name = "엄근진"
aliases = ["엄격 근엄 진지", "엄격 진지 근엄", "엄근진 모드"]
category = "인터넷·커뮤니티"
year = "미확인"
origin = "'엄격·근엄·진지'의 앞 글자를 딴 인터넷 신조어이다. 국립국어원 우리말샘에 명사로 올라 있다. 처음 쓰인 곳과 시기는 미확인이다."
meaning = "엄격하고 근엄하고 진지한 태도를 이른다. 사소한 일에 지나치게 진지하게 구는 모습을 놀리듯 말할 때 주로 쓴다."
use_when = "별것 아닌 일에 혼자 과하게 진지해진 캐릭터를 비출 때 쓴다. 웃긴 상황에서 혼자 정색하는 반전 컷에도 맞다."
food_fit = "두부나 식빵 캐릭터가 라면 물을 계량컵으로 재며 '엄근진' 표정을 짓는 컷이 어울린다. 디저트 품평회에서 심사위원 역의 음식이 근엄하게 앉아 있는 장면에도 쓸 수 있다."
fame = 4
fame_evidence = "우리말샘에 '엄격, 근엄, 진지를 아울러 이르는 말'로 등재되어 있어 일반 어휘로 자리 잡았음을 보여 준다. 널리 쓰인다는 판단은 이 등재 사실과 검증자의 판단에 근거한다."
caution = "특정 인물이나 방송과 연결되지 않은 일반어라 위험 요소가 적다. 유래가 확인되지 않았으니 특정 커뮤니티에서 나왔다고 단정해 쓰지 않는다."
verified = "partial"
risk_checked = true
notes = "뜻은 우리말샘으로 확인했다. 디시인사이드 유래설, 처음 쓰인 시기, '엄근진 빨고' 같은 변형은 나무위키가 열리지 않고(403) 검색 한도가 소진되어 확인하지 못했다."
sources = ["https://opendict.korean.go.kr/search/searchResult?query=엄근진"]

[[slang]]
name = "에바"
aliases = ["에바야", "그건 좀 에바", "에반데", "애바"]
category = "인터넷·커뮤니티"
year = "미확인 (위키백과가 인용한 2011년 5월 조선일보 기사 제목에 '애바' 사용이 나옴)"
origin = "청소년 사이에서 '지나치다'는 뜻으로 퍼진 은어이다. 우리말샘은 어원을 'error over'로 표기하고, 위키백과는 '오바' 발음 변형설, 골프 용어설, 장애인 비하어('애자') 설 등을 함께 소개한다. 정설은 미확인이다."
meaning = "정도를 넘어 지나치다는 뜻으로, '이건 좀 아니다' 싶을 때 쓰는 말이다."
use_when = "캐릭터가 과식, 과한 리액션, 무리한 부탁처럼 지나친 행동을 할 때 옆 캐릭터가 '그건 좀 에바'라고 받아치는 장면에 맞다."
food_fit = "토핑을 산더미처럼 올린 피자나 무리한 음식 조합을 보고 다른 음식 캐릭터가 '이건 에바지'라고 하는 대사로 쓰기 쉽다."
fame = 4
fame_evidence = "우리말샘과 네이버 국어사전에 표제어로 실려 있고, 한국어 위키백과에도 단독 문서가 있다."
caution = "장애인 비하어에서 왔다는 설이 거론되므로 장애와 관련된 맥락에서는 쓰지 말고, 브랜드 계정이라면 자주 쓰지 않는 편이 좋다. 특정 인물이나 작품과 무관한 일반 어휘라 초상권·저작권 문제는 없다."
verified = "partial"
risk_checked = true
notes = "우리말샘은 어원을 'error over'로 적어, 발견자가 쓴 '오바 변형설'과 다르다. 어원은 여러 설이 공존해 확정할 수 없고 유행 시점도 미확인이다. 조선일보 기사 원문은 열어 보지 못했다(사이트 접근 불가)."
sources = ["https://ko.wikipedia.org/wiki/에바_(신조어)", "https://opendict.korean.go.kr/search/searchResult?query=%EC%97%90%EB%B0%94"]

[[slang]]
name = "열폭"
aliases = ["열등감 폭발", "열폭하다"]
category = "인터넷·커뮤니티"
year = "생성 시점 미확인 (2010.2 언론 소개 시 이미 통용, 2010년대 계속 사용)"
origin = "'열등감 폭발'의 줄임말이다. 위키백과는 지나치게 흥분해 비방이나 욕설을 하는 것으로 풀이한다. 처음 쓴 곳과 해는 미확인이다."
meaning = "남의 자랑이나 성공에 열등감을 느껴 과하게 흥분하거나 깎아내리는 반응을 뜻한다."
use_when = "친구의 자랑을 듣고 질투로 부들부들하며 과하게 반응하는 장면에 쓴다."
food_fit = "'열'과 '폭발'을 살려 열을 받아 터지는 팝콘, 김을 뿜는 압력밥솥, 부글부글 끓는 찌개로 표현할 수 있다."
fame = 4
fame_evidence = "조선일보 2010.2.7 인터넷 신조어 기사(방종임)가 위키백과 각주로 달려 있다. 기사 원문은 직접 열람하지 못했다. 2020년대 댓글 등에서도 쓰이는 것으로 보이지만 근거는 확보하지 못했다."
caution = "상대를 깎아내리는 말이다. 실존 인물이나 특정 집단(성별 등)을 향하면 비하나 젠더 갈등으로 읽힐 수 있어 캐릭터끼리의 가벼운 질투로만 쓴다."
verified = "partial"
risk_checked = true
notes = "조선일보 기사 원문은 사이트 접근이 막혀 확인하지 못했다(날짜는 각주 URL 기준). 2010년 이전부터 쓰인 말이라 2010년 이후 유행이라는 범위 기준에는 경계선에 있다."
sources = ["https://ko.wikipedia.org/wiki/대한민국의_인터넷_신조어_목록"]

[[slang]]
name = "오운완"
aliases = ["오늘 운동 완료"]
category = "인터넷·커뮤니티"
year = "미확인 (해시태그 급성장 2022)"
origin = "'오늘의 운동 완료'의 줄임말로, 운동을 마친 뒤 인스타그램 등에 인증 사진을 올릴 때 다는 해시태그다. 메타는 2022년 연말결산에서 #오운완을 가장 큰 성장세를 보인 해시태그로 꼽았다. 최초 사용자와 시작 시점은 미확인이다."
meaning = "오늘 할 운동을 다 했다는 인증이자 '갓생'을 산다는 자기 과시의 표현이다."
use_when = "운동을 마치고 인증샷을 찍는 장면, 또는 운동 뒤 보상으로 폭식하는 반전에 맞는다."
food_fit = "닭가슴살이나 프로틴 셰이크 캐릭터가 거울 셀카를 찍으며 '#오운완'을 다는 장면, 운동을 마치자마자 치킨을 시키는 반전으로 쓸 수 있다."
fame = 4
fame_evidence = "뉴시스(2022.12.13)와 전자신문(2022.12.21)이 인스타그램 연말결산에서 #오운완이 #만보걷기와 함께 가장 큰 성장세를 보인 해시태그로 꼽혔다고 보도했다."
caution = "특정 인물과 관련이 없다. 인스타그램 UI를 그릴 때 로고를 그대로 쓰지 않고 비슷한 모양으로 처리하는 편이 안전하다."
verified = "partial"
risk_checked = true
notes = "'국내 3대 트렌드 해시태그'라는 설명은 정확하지 않다. 기사에 따르면 #오운완은 '가장 큰 성장세를 보인 해시태그'였고, #공스타그램 등은 팔로워가 많은 상위권 해시태그로 따로 소개되었다. 해시태그가 처음 생긴 시점은 미확인이다."
sources = ["https://www.newsis.com/view/NISX20221213_0002121171", "https://m.etnews.com/20221221000287"]

[[slang]]
name = "오징어 (잘생긴 사람 옆에 서면 오징어 된다)"
aliases = ["오징어 되다", "○○ 옆에 있으면 그냥 오징어"]
category = "인터넷·커뮤니티"
year = "미확인 (2016년 용례 확인)"
origin = "잘생긴 사람 옆에 선 평범한 사람이 상대적으로 초라해 보인다는 뜻으로 '오징어'라고 부르는 표현이다. 2016년 3월 서울신문의 '우리말 겨레말' 칼럼이 '송중기 옆에 있으면 그냥 오징어'를 용례로 소개했으며, 처음 쓰인 시점과 출처는 미확인이다."
meaning = "압도적으로 멋진 사람 옆에서 평범한 사람이 초라해 보이는 상황을 자조적으로 이르는 말이다."
use_when = "잘생긴 캐릭터 옆에서 다른 캐릭터들이 초라해지는 장면, 단체 사진에서 한 명만 빛나는 장면에 쓴다."
food_fit = "진짜 오징어 캐릭터가 나와 '나는 원래 오징어인데?'라고 되묻거나, 화려한 디저트 옆에 선 캐릭터가 오징어로 변하는 연출이 가능하다."
fame = 4
fame_evidence = "서울신문(2016.03.24) 칼럼이 일상 용례로 소개했다. 그 밖의 확산 근거는 검색 한도가 소진되어 확인하지 못했다."
caution = "외모를 비교하는 표현이므로 특정인이나 실존 인물을 '오징어'로 지목하면 비하가 될 수 있다. 자조하는 형태로만 쓰고 실존 연예인의 이름과 얼굴은 넣지 않는다."
verified = "partial"
risk_checked = true
notes = "서울신문 기사는 표현의 기원을 다루지 않고, 오징어의 어원과 남북한 명칭 차이를 주로 다룬다. 기원과 최초 유행 시점은 미확인이다."
sources = ["https://www.seoul.co.kr/news/plan/2016/03/24/20160324500241"]

[[slang]]
name = "월급루팡"
category = "인터넷·커뮤니티"
year = "2011 무렵 (최초 사용 미확인)"
origin = "취업포털 인크루트가 2011년 7월 소개한 직장인 신조어로, 경향신문(2011.7.29)에 보도되었다. 제 몫을 하지 않는 직원을 도둑의 대명사 '루팡'에 빗댄 말이며 처음 쓴 사람은 미확인이다."
meaning = "회사에서 일은 하지 않고 월급만 받아 가는 직원이나 그런 행동을 뜻한다."
use_when = "회사원 캐릭터가 일하는 척하며 딴짓을 하거나 퇴근 시간만 기다리는 장면에 어울린다."
food_fit = "사무실의 음식 캐릭터가 모니터 뒤에서 몰래 간식을 먹으며 가면과 망토를 두른 '루팡' 차림을 하는 연출이 가능하다."
fame = 4
fame_evidence = "경향신문 2011.7.29 기사에 직장인 신조어로 소개되었고, 위키백과 신조어 목록에도 실려 있다."
caution = "원작 소설의 뤼팽 이미지는 무난하지만, 애니메이션 '루팡 3세'의 캐릭터 디자인은 모방하지 않는다."
verified = "verified"
risk_checked = true
notes = "'월급님 퍼가요'는 월급이 들어오자마자 각종 명세서로 빠져나간다는 뜻의 별개 신조어라 별칭에서 뺐다(같은 경향신문 기사)."
sources = ["https://www.khan.co.kr/article/201107292133575", "https://ko.wikipedia.org/wiki/대한민국의_인터넷_신조어_목록"]

[[slang]]
name = "응 아니야"
aliases = ["응 아니야 짤", "ㅇㅇㄴㅇ"]
category = "인터넷·커뮤니티"
year = "미확인"
origin = "'응'으로 맞장구치는 척하다가 곧바로 '아니야'로 부정하는 비꼬는 대답이다. 처음 쓴 사람과 시점, 연관 짤은 미확인이다."
meaning = "상대의 기대나 주장을 가볍게 비꼬며 부정하는 대답이다. 약어로 'ㅇㅇㄴㅇ'라고도 쓴다."
use_when = "한 캐릭터가 자신만만하게 묻거나 착각할 때 다른 캐릭터가 단칼에 반박하는 반전 컷에 어울린다."
food_fit = "'오늘은 다이어트하지?'라는 물음에 치킨이 '응 아니야'로 답하거나, 자기가 제일 인기 있다는 반찬에게 다른 반찬이 받아치는 장면에 쓸 수 있다."
fame = 4
fame_evidence = "영어 위키낱말사전에 비꼬는 부정 대답 속어로 올라 있고 약어 'ㅇㅇㄴㅇ'도 함께 적혀 있다. 결산 기사 근거는 확보하지 못했다."
caution = "비꼬는 말투이므로 실존 인물을 겨냥하지 말고 캐릭터끼리 가볍게 주고받는 장면에만 쓴다. 인터넷 말투에 익숙하지 않은 사람에게는 상대를 무시하는 말로 읽혀 꽤 불쾌하게 느껴질 수 있다는 설명이 있다. 그러니 브랜드 계정이 독자 댓글에 답하거나 DM·공지에서 독자에게 직접 쓰는 일은 하지 않는다."
verified = "partial"
risk_checked = true
notes = "영어 위키낱말사전은 이 말이 영어 'yeah, no'를 옮긴 말이 아니라고 적고 있으며, 약어 'ㅇㅇㄴㅇ'를 별칭으로 추가했다. 기원과 시점은 이번에도 확인하지 못했다(웹검색 한도 소진)."
sources = ["https://en.wiktionary.org/wiki/응_아니야"]
caution_sources = ["https://namu.wiki/w/%EC%9D%91%20%EC%95%84%EB%8B%88%EC%95%BC?uuid=2875b6e9-b365-487e-9def-307c50d7b4a0", "https://ko.hinative.com/questions/20004775"]

[[slang]]
name = "의문의 1승"
aliases = ["의문의 1패", "의문의 일승"]
category = "인터넷·커뮤니티"
year = "미확인 (2016년 신조어 기사에 소개, 2017년 드라마 제목에 쓰임)"
origin = "처음 쓴 사람, 커뮤니티, 시기는 미확인이다. 위키백과는 2016년 5월 중앙일보의 20대 신조어 기사를 근거로 들며(본문은 열람 실패), 2017년 11월~2018년 1월 방영된 SBS 드라마 제목 《의문의 일승》에도 이 표현이 쓰였다."
meaning = "아무것도 하지 않았는데 남의 실수나 상황 덕분에 뜻밖의 이득을 본 경우를 말한다. 반대로 영문도 모르게 손해를 보면 '의문의 1패'라고 한다."
use_when = "두 캐릭터가 다투는 사이 제3자가 덕을 보는 장면, 남의 실수 덕에 비교당해 좋아 보이게 된 컷에 맞다."
food_fit = "라면과 떡볶이가 야식 자리를 놓고 싸우다 둘 다 탈락해 옆에 있던 샐러드가 '의문의 1승'을 거두거나, 냉장고 속 음식이 상해서 다른 음식이 선택받는 장면으로 쓸 수 있다."
fame = 4
fame_evidence = "위키백과 신조어 목록에 실려 있고, 2016년 일간지 신조어 기사에 소개되었으며, 2017년 지상파 드라마 제목에 패러디로 쓰일 만큼 널리 알려졌다."
caution = "일반 표현이라 권리 문제는 적지만, SBS 드라마 포스터나 장면을 패러디하면 저작권 문제가 생긴다. 한일전 같은 국가 대항 맥락에 쓰면 상대국 비하로 읽힐 수 있어 주의한다."
verified = "partial"
risk_checked = true
notes = "카테고리 '신조어'를 '인터넷·커뮤니티'로 바꿨다. 유래는 확인하지 못했다(검색 한도 소진, 중앙일보 기사 열람 실패). SBS 드라마 《의문의 일승》(2017.11.27~2018.1.30)이 이 표현을 제목에 쓴 사실을 덧붙였다."
sources = ["https://ko.wikipedia.org/wiki/대한민국의_인터넷_신조어_목록", "https://ko.wikipedia.org/wiki/의문의_1승", "https://ko.wikipedia.org/wiki/의문의_일승"]

[[slang]]
name = "이생망"
aliases = ["이번 생은 망했어", "이번 생은 망했다"]
category = "인터넷·커뮤니티"
year = "미확인 (우리말샘 신문 용례로 2016년 2월 이전부터 쓰인 것은 확인)"
origin = "'이번 생은 망했다'를 줄인 말로, 주로 젊은 층이 자조적으로 쓴다. 처음 쓴 곳과 시기는 미확인이다."
meaning = "일이 계속 꼬일 때 이번 인생은 틀렸다고 가볍게 자조하는 말이다."
use_when = "사소한 불운이 연달아 겹친 뒤 마지막 컷에서 체념하는 장면에 쓴다. 자학 개그 톤의 결말에 맞는다."
food_fit = "새카맣게 탄 토스트, 유통기한이 하루 지난 우유, 바닥에 떨어진 아이스크림 캐릭터가 '이생망'을 외치는 장면에 쓰기 좋다."
fame = 4
fame_evidence = "우리말샘에 '주로 젊은 층이 자조적으로 쓴다'는 설명과 함께 실려 있고, 경향신문(2016년 2월)과 한겨레(2020년 5월) 용례가 있다."
caution = "청년층의 절망을 다루는 맥락(우리말샘 용례도 헬조선, 불법 도박 기사)과 이어지므로 자해나 극단적 선택을 떠올리게 하는 연출과는 섞지 않는다. 가벼운 불운 개그로만 쓴다."
verified = "partial"
risk_checked = true
notes = "카테고리 '채팅 유행어(자조)'는 '인터넷·커뮤니티'로 바꿨다. 뜻과 용례 연도는 확인했지만 최초 사용처는 확인하지 못했다."
sources = ["https://opendict.korean.go.kr/search/searchResult?query=이생망", "https://opendict.korean.go.kr/dictionary/view?sense_no=1368838"]

[[slang]]
name = "자강두천"
aliases = ["자존심 강한 두 천재의 대결"]
category = "인터넷·커뮤니티"
year = "미확인(우리말샘 용례 2020년 6월, 2021년 1월 '요즘 많이 쓰이는 신조어')"
origin = "'자존심 강한 두 천재의 대결'의 줄임말로, 수준이 비슷한 두 사람끼리의 경쟁을 비꼬는 말이다. 최초 사용처와 시점은 미확인이며, 우리말샘 용례는 박문성 칼럼(2020년 6월)과 스포츠동아(2021년 1월)다."
meaning = "서로 잘났다고 겨루지만 실은 둘 다 고만고만한 수준인 대결을 비꼬는 말이다."
use_when = "두 캐릭터가 사소한 일로 자존심 싸움을 벌이다가 둘 다 손해를 보는 장면, 또는 누가 더 못하는지 겨루는 듯한 대결 장면에 쓴다."
food_fit = "짜장면과 짬뽕, 부먹과 찍먹 탕수육처럼 라이벌 음식이 서로 잘났다고 우기다가 같이 식어 버리는 컷에 '자강두천' 자막을 넣을 수 있다."
fame = 4
fame_evidence = "우리말샘 표제어이며, 스포츠동아(2021년 1월) 용례가 '요즘 많이 쓰이는 신조어 중 하나'라고 적었다."
caution = "실존 인물이 연관되지 않은 일반 신조어다. 실제 유명인 두 명을 지목해 비꼬는 용도로 쓰면 조롱이 될 수 있으므로 가상 캐릭터끼리만 쓴다."
verified = "partial"
risk_checked = true
notes = "뜻과 우리말샘 용례(2020년 6월 칼럼, 2021년 1월 스포츠동아)는 확인했다. 최초 출처는 확인하지 못했다. 웹 검색 한도가 소진됐고 나무위키는 접근이 차단돼(403) 더 확인하지 못했다. 카테고리를 허용 목록인 '인터넷·커뮤니티'로 바꿨다."
sources = ["https://opendict.korean.go.kr/dictionary/view?sense_no=1465696"]

[[slang]]
name = "자낳괴"
aliases = ["자본주의가 낳은 괴물"]
category = "인터넷·커뮤니티"
year = "미확인"
origin = "'자본주의가 낳은 괴물'의 세 단어 첫 글자를 딴 인터넷 신조어다. 처음 쓴 곳과 시점은 미확인이다."
meaning = "돈이 되면 무엇이든 하는 사람을 장난스럽게 이르는 말로, 스스로를 낮추는 농담으로도 쓴다."
use_when = "광고나 보상을 제안받자마자 태도를 바꾸는 캐릭터, 돈 이야기에 눈이 반짝이는 컷에 맞는다."
food_fit = "'협찬'이라는 말에 갑자기 포장지를 반짝이며 포즈를 잡는 과자 캐릭터, 웃돈을 주면 곱빼기로 변신하는 국수 캐릭터에 '자낳괴 모드' 자막을 붙일 수 있다."
fame = 4
fame_evidence = "영어 위키낱말사전에 한국어 신조어이자 유머러스한 인터넷 은어로 실려 있다. 그 밖의 대중 인지도 자료는 이번 검증에서 확인하지 못했다."
caution = "특정 실존 인물이나 업체를 '자낳괴'로 지목하지 말고 캐릭터의 자기 풍자로 쓴다. '괴물'이라는 비하가 담겨 있어 독자를 향해 쓰지 않는다."
verified = "partial"
risk_checked = true
notes = "뜻과 어원은 확인했다. 최초 사용처와 유행 시기는 미확인이다. 웹 검색 한도가 소진되고 나무위키가 403으로 막혀 추가 확인을 하지 못했다."
sources = ["https://en.wiktionary.org/wiki/자낳괴", "https://en.wiktionary.org/wiki/Category:Korean_internet_slang"]

[[slang]]
name = "자만추"
aliases = ["자연스러운 만남 추구"]
category = "인터넷·커뮤니티"
year = "미확인 (2019년 기사 용례)"
origin = "'자연스러운 만남을 추구하다'의 줄임말이다. 우리말샘 용례는 한 연예인이 '소개팅은 부담스럽고 저는 자만추 스타일'이라고 말한 한국경제TV 2019년 10월 기사이며, 처음 쓴 사람과 시점은 미확인이다."
meaning = "소개팅처럼 주선된 만남보다 일상에서 자연스럽게 만나는 연애를 원한다는 뜻이다."
use_when = "소개팅 제안을 거절하는 장면, 우연한 만남을 기다리는 캐릭터나 연애 스타일을 묻는 장면에 어울린다."
food_fit = "소개팅 자리에 억지로 앉은 떡볶이 캐릭터가 '저는 자만추라서요'라고 말하고, 나중에 분식집에서 순대와 자연스럽게 마주치는 구도로 쓸 수 있다."
fame = 4
fame_evidence = "우리말샘 표제어이며 한국경제TV(2019)와 중앙일보(2021) 용례가 있다."
caution = "우리말샘 용례 속 연예인 발언을 실명과 함께 인용하지 않는다. 선정적으로 바꾼 변형 표현은 쓰지 않는다. 2020년 12월 충주시 유튜브 '충TV'가 고등학생과 찍은 신조어 퀴즈에서 '자만추'를 '자기만족 추미애'로 풀이했다. 정치적 발언이라는 비판을 받아 영상을 지우고 사과했다. 실존 정치인 이름을 넣은 변형 풀이는 쓰지 않는다."
verified = "partial"
risk_checked = true
notes = "카테고리를 '인터넷·커뮤니티'로 고쳤다. 나무위키 접근이 막혀 최초 사용처와 유행 계기는 미확인이다."
sources = ["https://opendict.korean.go.kr/dictionary/view?sense_no=1410554"]
caution_sources = ["https://www.ytn.co.kr/_ln/0103_202012020925075142"]

[[slang]]
name = "주접 (주접 떨다)"
aliases = ["주접 떨다", "주접 댓글", "주접 멘트"]
category = "인터넷·커뮤니티"
year = "미확인 (새 뜻의 언론 용례는 2019년 10월이 가장 이르다)"
origin = "본래 '생물이 제대로 자라지 못함', '옷차림이 초라함'을 뜻하던 말이다. 우리말샘은 '부끄러운 기색 없이 과장하여 늘어놓는 말이나 행동'이라는 새 뜻을 따로 싣고 있으며, 그 용례로 한국일보(2019.10)의 '주접 멘트' 기사와 스포츠동아(2022.7) 기사를 든다. 새 뜻이 처음 퍼진 곳은 미확인이다."
meaning = "좋아하는 대상을 부끄러움 없이 우스울 만큼 과장해 칭찬하는 말이나 행동이다. 팬덤에서는 애정 표현으로 '주접 댓글', '주접 멘트'라고 쓴다."
use_when = "캐릭터가 좋아하는 대상을 과하게 찬양하는 장면, 댓글창 패러디 컷, 친구끼리 칭찬을 과장하는 장면에 쓴다."
food_fit = "음식 캐릭터가 등장하면 팬들이 과장된 칭찬 댓글을 다는 댓글창 패러디로 쓰기 좋다. 맛있는 음식을 먹고 과하게 감탄하는 리액션 컷에도 맞는다."
fame = 4
fame_evidence = "우리말샘에 새 뜻이 별도 표제어로 올라 있고 2019년, 2022년 언론 용례가 있다. 영어 위키낱말사전에도 '과장된 팬질'이라는 속어 뜻이 있다."
caution = "'주접스럽다', '주접떨다'의 본래 뜻은 염치없는 행동을 낮잡는 말이어서 맥락 없이 쓰면 비하로 읽힐 수 있다. 실존 연예인 팬 댓글 원문은 그대로 옮기지 않는다."
verified = "partial"
risk_checked = true
notes = "새 뜻과 2019년 언론 용례를 우리말샘으로 확인했다. 처음 퍼진 곳과 시점은 확인하지 못했다. 고구마팜 글에서 '주접'은 개별 밈이 아니라 분류 표현으로만 나온다."
sources = ["https://en.wiktionary.org/wiki/주접", "https://opendict.korean.go.kr/search/searchResult?focus_name_top=query&query=주접", "https://opendict.korean.go.kr/dictionary/view?sense_no=1626107&viewType=confirm"]

[[slang]]
name = "차도남 (차가운 도시 남자)"
aliases = ["차가운 도시 남자", "차도녀", "따도남", "까도남"]
category = "인터넷·커뮤니티"
year = "2008 (밈 유행 2010)"
origin = "조석의 네이버 웹툰 '마음의 소리'(2008년 9월)에 나온 \"난 워크홀릭에 빠진 차가운 도시남자, 하지만 내 여자에겐 따뜻하겠지?\"에서 나왔다. 같은 해 11월 KBS 라디오 '유희열의 라디오 천국'의 코너 제목으로 쓰이며 퍼졌고, 2010년 드라마 남자 주인공들을 가리키는 말로 크게 유행했다."
meaning = "겉으로는 차갑고 세련된 도시 남자를 뜻한다. 차도녀·따도남·까도남 같은 파생어도 생겼다."
use_when = "새침하게 무심한 척하는 캐릭터, 혼자 멋있는 척하다 허당이 드러나는 장면에 맞다."
food_fit = "냉면이나 아이스 아메리카노 캐릭터를 '차도남'으로, 뜨끈한 국밥 캐릭터를 '따도남'으로 맞세우는 식으로 쓸 수 있다."
fame = 4
fame_evidence = "전북일보(2010.12)와 스포츠경향(2010.12)의 연말 결산이 2010년 유행어로 다뤘다. 스포츠경향(2011.3)은 차도녀·따도남·따도녀 같은 파생어도 소개했다."
caution = "'마음의 소리'의 장면과 캐릭터 그림은 조석 작가의 저작물이므로 쓰지 않고 단어만 빌린다. 2010년 무렵 유행어라 20대 초반에게는 조금 옛말로 느껴질 수 있다."
verified = "verified"
risk_checked = true
notes = "처음 쓰인 시기는 2010년이 아니라 2008년 9월(웹툰)과 11월(라디오)이고, 크게 유행한 것은 2010년이다. 전북일보 기사에는 유희열 라디오 이야기가 없고, 라디오 코너는 스포츠경향 기사로 확인된다."
sources = ["https://sports.khan.co.kr/article/201012222028563", "https://sports.khan.co.kr/article/201103202038133", "https://www.jjan.kr/article/20101216379451"]

[[slang]]
name = "천조국"
aliases = ["천조국 클라스", "천조국 스케일"]
category = "인터넷·커뮤니티"
year = "미확인 (위키백과가 인용한 2011년 동아일보 기사에서 사용)"
origin = "우리말샘은 '국방 예산이 천조 원이라는 뜻'으로 미국을 이르는 말(千兆國)로 풀이한다. 중국 왕조가 스스로를 일컫던 천조국(天朝國)과 소리가 같은 말이며, 처음 쓴 사람이나 사이트는 미확인이다."
meaning = "엄청난 경제력과 국방비를 가진 미국을 과장해 부르는 말로, 규모가 압도적일 때 '천조국 클라스'처럼 쓴다."
use_when = "미국식 초대형·대용량 물건이나 스케일이 큰 상황에 감탄하는 장면에 맞다."
food_fit = "초대형 버거, 양동이만 한 콜라, 대용량 팝콘 같은 미국식 음식 캐릭터가 등장할 때 '천조국 클라스' 대사로 쓰기 좋다."
fame = 4
fame_evidence = "우리말샘에 표제어로 실려 있다. 위키백과 단독 문서도 2011년 동아일보 기사를 인용해 인터넷 신조어로서의 용법을 서술한다."
caution = "실존 국가를 가리키는 말이므로 군사·정치 풍자로 흐르지 않게 '스케일 큰 미국 음식' 정도로만 쓰는 편이 안전하다. 특정 버거 체인 같은 상표를 그대로 그리지 않도록 주의한다."
verified = "partial"
risk_checked = true
notes = "인터넷에서 미국을 가리키는 용법은 중국 왕조 자칭(天朝)이 아니라 '국방비 천조 원(千兆)'에서 왔다고 우리말샘은 풀이한다. 처음 쓰인 시점과 장소는 미확인이며, 인용된 동아일보 기사 원문은 열어 보지 못했다(사이트 접근 불가)."
sources = ["https://ko.wikipedia.org/wiki/천조국", "https://opendict.korean.go.kr/search/searchResult?query=%EC%B2%9C%EC%A1%B0%EA%B5%AD"]

[[slang]]
name = "추구미"
aliases = ["오늘 내 추구미", "내 추구미"]
category = "인터넷·커뮤니티"
year = "2023 (밈 유행 2023~2024)"
origin = "'추구하는 미(美)'의 줄임말로, 자신이 닮고 싶은 이미지나 스타일을 뜻한다. 2023년 5월 기사에서 이미 트위터와 블로그에서 아이돌 사진에 '오늘의 추구미'라는 말을 붙이는 용례가 소개되었다. 최초 사용자는 미확인이다."
meaning = "내가 되고 싶은 모습이나 따라 하고 싶은 분위기를 가리킨다. '이번 학기 추구미는 A+'처럼 목표를 가리키는 농담으로도 쓴다."
use_when = "캐릭터가 동경하는 대상을 보며 '저게 내 추구미'라고 말하는 장면, 이상과 현실의 차이를 보여 주는 장면에 어울린다."
food_fit = "평범한 식빵이 화려한 크루아상을 보며 '내 추구미'라고 하거나, 컵라면이 고급 파스타를 추구미로 삼는 식의 이상과 현실 대비 개그로 쓸 수 있다."
fame = 4
fame_evidence = "커리어 매체 커리어트(2023.5.8)와 위픽레터가 Z세대 대표 신조어로 다뤘다. 썸트렌드 언급량 수치(2023년 12월 손민수 추월, 2024년 3월 10배 증가)는 제시된 출처에서 확인되지 않았다."
caution = "특정 실존 인물을 '추구미'로 지목해 그리면 초상권 문제가 생길 수 있으므로 가상의 캐릭터나 음식끼리 비교한다."
verified = "partial"
risk_checked = true
notes = "제시된 출처에 썸트렌드 수치가 없어 fame_evidence의 수치는 미확인이다. 2023년 5월 이전부터 쓰였다는 점은 확인되었으나 2024년 크게 유행했다는 근거는 이번에 확인하지 못했다. 검색 한도 소진으로 추가 확인은 하지 못했다."
sources = ["https://www.careet.net/1075", "https://letter.wepick.kr/post/2237"]

[[slang]]
name = "취향저격"
aliases = ["취저"]
category = "인터넷·커뮤니티"
year = "미확인 (iKON 동명 곡은 2015)"
origin = "취향을 정확히 맞혔다는 뜻의 유행어다. 2015년 9월 15일 아이콘(iKON)이 같은 제목의 곡을 발표했지만, 말 자체가 처음 쓰인 곳과 시점은 미확인이다."
meaning = "어떤 대상이 자기 취향에 꼭 들어맞을 때 쓰는 말로, 줄여서 '취저'라고도 한다."
use_when = "캐릭터가 딱 원하던 것을 보고 심장에 화살을 맞은 듯 반응하는 컷에 쓴다."
food_fit = "신메뉴나 토핑 조합을 본 음식 캐릭터가 '완전 취저'라며 반하는 장면이나, 과녁 위에 음식이 꽂히는 연출에 쓰기 좋다."
fame = 4
fame_evidence = "한국어 위키백과에 따르면 iKON '취향저격'은 음원차트에서 장기간 1위를 했고, 2015년 9월 음악중심과 인기가요에서 1위를 했다. 말 자체의 확산 근거는 따로 확인하지 못했다."
caution = "일반 어휘로 쓰면 문제는 없다. iKON 곡의 가사나 안무, 멤버 초상은 인용하지 않는다. iKON '취향저격'을 작사·작곡한 당시 리더 비아이(B.I)는 2019년 마약 의혹으로 팀을 탈퇴했고, 2021년 9월 마약류관리법 위반으로 1심에서 징역 3년, 집행유예 4년을 선고받았다. 일반 어휘로만 쓰고, 곡 제목 로고나 'iKON'·'사랑을 했다' 같은 곡·그룹 연상 연출은 하지 않는다."
verified = "partial"
