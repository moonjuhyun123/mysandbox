caution = "실존 인물(퍼거슨)의 얼굴과 이름을 쓰면 초상권·퍼블리시티권 문제가 생길 수 있어 대사만 차용하는 편이 안전하다. 맨유 엠블럼 같은 구단 상표는 쓰지 않는다. 퍼거슨은 2026년 5월 올드 트래퍼드에서 몸이 안 좋아 병원으로 옮겨졌고, 8월에는 보호 부츠를 신고 지팡이를 짚은 채 경기장에 나타났다는 보도가 있었다. 그를 떠올리게 하는 고령·건강 관련 농담(노인 캐릭터가 쓰러지는 연출 등)은 피한다."
