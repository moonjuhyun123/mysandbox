sources = ["https://namu.moe/w/%ED%95%9C%EC%A7%80%EC%9A%B0", "https://namu.moe/w/%EB%84%88%EB%A1%9C%20%EC%A0%95%ED%96%88%EB%8B%A4"]
caution_sources = ["https://animenewsnetwork.com/news/2015-08-28/the-pokemon-company-sues-organizers-of-pokemon-themed-party-for-copyright-infringement/.92213", "https://www.digitaltrends.com/gaming/pokemon-company-sues-fan-over-party/", "https://www.pcgamer.com/gaming-industry/the-pokemon-company-criticises-trump-administrations-use-of-its-imagery-in-political-memes-says-pokemon-is-apolitical-trump-spokesman-uses-decade-old-clinton-post-to-accuse-them-of-bias", "https://nintendowire.com/news/2026/03/06/the-pokemon-company-responds-to-white-house-pokopia-meme-denies-involvement/"]

[[classic]]
name = "너 내 동료가 돼라"
aliases = ["내 동료가 되어라", "너 내 도도도독", "김도독"]
category = "기타"
year = "원작 연도 미확인 (『원피스』 초반부터 사용), 르세라핌 '도도도독' 파생 밈 2023년 8월"
origin = "『원피스』에서 루피가 동료로 삼고 싶은 인물에게 건네는 권유 대사로, 처형 직전의 조로에게 밧줄을 풀어 줄 테니 동료가 되라고 한 장면이 대표 예이다. 르세라핌 정규 1집 수록곡 'Fire in the belly'의 김채원 파트에 쓰였고, 2023년 8월 13일 FLAME RISES 콘서트에서 김채원이 '너 내 도도도독'으로 버벅인 장면이 '김도독' 밈이 되었다."
meaning = "상대를 자기 편으로 끌어들이고 싶을 때 반쯤 강제로 권유하는 말이다. 사람을 모으거나 영입할 때 장난스럽게 쓴다."
use_when = "새 멤버를 영입하는 장면, 맛있는 것을 발견하고 내 것으로 만들고 싶은 장면, 손을 내밀며 동료를 모집하는 컷에 맞다."
food_fit = "라면 캐릭터가 달걀이나 김치에게 손을 내밀며 '너 내 동료가 돼라'를 외치고, 토핑이 하나씩 합류하는 구성에 잘 맞다. 밀짚모자 대신 냄비 뚜껑을 쓰는 식으로 바꿀 수 있다."
fame = 4
fame_evidence = "나무위키(미러)에 단독 문서가 있고, 김성현의 스타크래프트 중계 패러디와 SNL 코리아 '두덕리 온라인 2' 스케치 패러디가 정리되어 있다. 김채원의 '도도도독'은 빠르게 퍼져 별명이 될 정도였다."
caution = "루피, 밀짚모자 해적단 디자인은 원작 저작권 대상이다. '도도도독' 파생 밈은 실존 아이돌 김채원의 실수 장면에서 나왔으므로 본인을 그리거나 조롱하는 식으로 쓰지 말고, 콘서트 영상과 음원도 쓰지 않는다. 2025년 7~10월 『원피스』의 밀짚모자 해적단 해골 깃발이 인도네시아, 네팔, 필리핀, 마다가스카르, 페루 등에서 Z세대 반정부 시위의 상징으로 쓰였다. 국내에서도 2025년 10월 3일 광화문 방면 보수단체 집회에서 이 깃발이 보도되었다. 그러므로 이 대사와 함께 해적 깃발, 밀짚모자 해골 마크, 깃발을 드는 연출을 쓰지 않고, 시위나 정치 맥락과 엮지 않는다. 김채원 '도도도독' 장면에 대해서는 본인이 사과나 사용 중단을 요청했다는 보도는 찾지 못했다. 다만 실수 장면을 놀리는 연출은 계속 피한다."
verified = "verified"
risk_checked = true
notes = "파생 밈 시기는 2023년 8월 13일 FLAME RISES 일요일 콘서트로 확인했다. 원작 첫 등장 화수와 정규 1집 발매일은 출처에서 확인하지 못했다."
sources = ["https://namu.moe/w/%EB%84%88%20%EB%82%B4%20%EB%8F%99%EB%A3%8C%EA%B0%80%20%EB%8F%BC%EB%9D%BC"]
caution_sources = ["https://en.wikipedia.org/wiki/Straw_Hat_Pirates%27_Jolly_Roger", "https://www.cbc.ca/1.7640717", "https://fortune.com/2025/09/24/gen-z-revolution-protest-one-piece-pirate-flag-jolly-roger/", "https://www.inews24.com/view/1893744", "https://www.khan.co.kr/article/202510201717001/", "https://maily.so/trendaword/posts/e9o0k605z8w"]

