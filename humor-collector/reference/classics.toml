caution = "유해진의 얼굴과 광고 화면은 쓰지 않고 문구만 패러디한다. 광고주가 확인되지 않았으므로 특정 카드사 로고나 상품명은 넣지 않는다. 2026년 10월 현재 유해진은 주연 영화 '암살자(들)'의 역사 왜곡 논란(1974년 육영수 여사 피격 사건 묘사)에 휘말려 있다. 보수단체가 자택 앞에서 규탄 집회를 열었고, 정치인이 그의 외모를 비하해 논란이 됐다. 정치적으로 민감한 상황이므로 논란이 가라앉을 때까지 사용을 보류하는 것을 권한다. 쓰게 되더라도 유해진의 이름, 외모, 표정 흉내 등 그를 떠올리게 하는 요소는 전혀 넣지 말고, 일반 문구로만 쓴다."
verified = "partial"
risk_checked = true
notes = "광고주 이름과 방영일은 여전히 미확인이다. 위키백과 목록상 유해진의 2015년 카드 광고는 삼성카드뿐이지만, 이 문구가 나온 광고와 같은 것인지는 확인하지 못했다(웹 검색 한도 소진). 원래 메모의 fame 4는 5로 올렸다."
sources = ["https://m.seoul.co.kr/news/2015/07/13/20150713500273", "https://kbmaeil.com/article/201809210232457", "https://ko.wikipedia.org/wiki/유해진"]
