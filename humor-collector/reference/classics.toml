meaning = "양꼬치에는 칭따오 맥주가 어울린다는 말로, 찰떡같이 어울리는 조합을 가리킬 때 쓴다."
use_when = "음식과 술의 궁합을 말하는 장면, 엉터리 외국어로 아는 척하는 장면, '~엔 ~' 형식으로 짝꿍을 소개하는 장면에 어울린다."
food_fit = "양꼬치와 맥주병 캐릭터가 어깨동무하는 컷에 그대로 쓸 수 있다. '치킨엔 콜라'처럼 다른 음식 짝꿍으로 바꿔 패러디하기도 좋다."
fame = 5
fame_evidence = "레이디경향(2015.7.1)이 '양꼬치엔 칭타오가 된 남자' 인터뷰를 냈고, 텐아시아(2015.6.12)는 캐릭터 변형 패러디와 광고 모델 발탁을 보도했다. 위키백과에도 2015년 칭다오 맥주 CF 출연이 적혀 있다."
caution = "'칭따오'는 실제 맥주 상표이고, 정상훈은 방송에서 이 문구의 상표 등록을 마쳤다고 밝혔다(텐아시아). 로고와 병 디자인은 그대로 그리지 않는다. 중국어 억양 흉내가 국적 비하로 보이지 않게 주의한다. 2023년 10월 중국 칭다오 3공장 '소변 맥주' 영상 논란 이후 국내에서 불매가 일어 편의점 매출이 20~40% 줄었다는 보도가 있다(더팩트, 머니투데이). 실제 상표명을 넣으면 이 사건이 떠오르거나 브랜드 조롱으로 읽힐 수 있으므로 '양꼬치엔 ○○' 식으로 바꾸거나 맥주 상표를 특정하지 않는 편이 안전하다. 또 정상훈은 2022년 2월 쿠팡플레이 'SNL 코리아' 시즌2에서 수어 통역을 희화화했다는 비판을 받았고, 제작진이 사과하고 영상을 삭제했다(경향신문, 위키트리). 외국어나 수어처럼 언어를 우스꽝스럽게 흉내 내는 연출은 하지 않는다."
verified = "verified"
risk_checked = true
notes = "광고 모델 '재발탁' 보도는 열어 본 출처에서 확인하지 못했다. 코너명 '글로벌 위켄드 와이'는 텐아시아가 아니라 레이디경향 기사에서 확인했다. 캐릭터가 처음 나온 시기는 미확인이다."
sources = ["https://lady.khan.co.kr/entertainment/article/201506241548581", "https://www.tenasia.co.kr/article/2015061297924", "https://ko.wikipedia.org/wiki/정상훈"]
