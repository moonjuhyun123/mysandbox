meaning = "'효과는 굉장했다'는 어떤 수단이 상대에게 아주 잘 통했을 때 쓴다. '야생의 ○○이 나타났다'는 무언가가 갑자기 나타났을 때 쓴다."
use_when = "약점을 찌른 한마디나 공격이 제대로 먹힌 장면, 예상하지 못한 인물이 불쑥 등장하는 장면에 쓴다."
food_fit = "매운 고추 캐릭터 옆에서 아이스크림 캐릭터가 녹아내릴 때 '효과는 굉장했다!' 자막을 띄울 수 있다. 냉장고 문을 열었을 때 '야생의 ○○이 나타났다!' 자막을 넣어도 된다."
fame = 4
fame_evidence = "Know Your Meme에 따르면 영어 문구는 1998년 영어판에서 처음 쓰였고, 2000년대 말에서 2010년대 초에 웹 문화로 퍼졌다. 2008년 4chan에서 'A Wild X Appears!'와 함께 쓰였다는 기록도 있다. 국내 확산을 다룬 자료는 확인하지 못했다."
caution = "포켓몬스터는 닌텐도와 포켓몬컴퍼니 등의 상표권·저작권 대상이다. 포켓몬 캐릭터나 전투 화면 디자인은 쓰지 않고 문구 형식만 빌려 쓴다. 포켓몬컴퍼니는 팬게임·팬 커뮤니티에 DMCA 삭제 요청을 내고, 팬이 연 테마 파티를 상대로 소송까지 하는 등 권리 행사에 적극적이다. 2025년 9월 미국 국토안보부(DHS)가 이민자 단속 영상에 포켓몬 주제가를 썼을 때 회사는 허락한 적 없고 어떤 정치적 입장과도 무관하다고 밝혔다. 포켓몬을 연상시키는 연출을 정치·이민 단속·사람을 잡는 맥락과 엮지 않는다."
verified = "partial"
risk_checked = true
notes = "한국어판 문구의 정확한 표기와 국내 유행 시점은 미확인이다. 웹 검색 한도가 소진되었고 나무위키 접속도 차단되어 추가 확인을 하지 못했다."
sources = ["https://knowyourmeme.com/memes/its-super-effective", "https://ko.wikipedia.org/wiki/포켓몬스터_금·은"]
caution_sources = ["https://www.thewrap.com/pokemon-company-pushes-back-dhs-ice-raids-video-theme-song-use/", "https://kval.com/news/nation-world/not-involved-pokemon-international-company-calls-out-white-house-for-using-its-imagery-in-maga-post-trump-administration-make-american-great-again-intellectual-property", "https://www.techdirt.com/2024/03/28/site-that-listed-information-about-3rd-party-pokemon-fan-games-shuts-down-under-threat", "https://www.digitaltrends.com/gaming/pokemon-company-sues-fan-over-party/"]

