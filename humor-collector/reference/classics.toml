notes = "방영 기간(2020.5.29~2026.6.26), 채널A 편성, 출연진은 확인했다. 의미가 부정적으로 바뀌었다는 서술은 위키백과에 있지만 그 문단에 출처 경고가 붙어 있다. 일반 용법이 퍼진 시점은 미확인이다."
