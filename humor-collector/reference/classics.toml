caution = "원곡 음원은 쓰지 않는다. 특정 틱톡커나 아이돌의 영상, 얼굴, 의상을 그대로 따라 그리지 않고 동작만 패러디한다. 국내에서 크게 퍼진 '공중부양 슬릭백' 영상의 주인공은 대구의 중학생(미성년자)으로 보도되었으므로 그 인물을 특정하거나 닮게 그리지 않는다. 원곡으로 거론되는 라킴(Lakim)의 곡 제목 'A Pimp Named Slickback'에는 '포주(pimp)'라는 단어가 들어가므로 곡명도 노출하지 않는다."
