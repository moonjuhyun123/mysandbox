caution = "크루원 디자인과 'Among Us'는 이너슬로스의 저작물이자 상표이므로 그대로 복제하지 말고 실루엣 패러디 정도로만 쓴다. 이너슬로스 팬 창작 정책은 Among Us IP(캐릭터 이미지와 게임 내용 포함)를 마케팅 자료에 넣는 것, 제3자 IP와 함께 쓰는 것, 공식 제휴처럼 보이게 하는 것을 금지한다. 브랜드형 계정의 음식 캐릭터 만화는 이 세 가지에 모두 해당할 수 있다. 크루원 실루엣(우주복과 바이저 모양), 'Among Us/어몽어스', '임포스터/크루원', 'sus/아모구스' 같은 고유 표현과 배경 연출은 쓰지 않는다. '우리 중에 배신자가 있다', '회의해서 범인을 지목한다' 같은 일반적인 상황만 빌린다."
