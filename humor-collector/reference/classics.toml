fame_evidence = "우리말샘에 '맛잘알'이 명사로 실려 있고, 마이데일리(2020년 6월)와 지디넷코리아(2020년 8월, '맛잘알의 민족') 용례가 있다. '맛알못'은 우리말샘 표제어가 아니고 참여자 제안만 있다."
caution = "특별한 초상권이나 상표 문제는 없다. 실제 식당이나 브랜드 메뉴를 맛알못의 예로 들지 않는다."
verified = "partial"
risk_checked = true
notes = "카테고리 '음식 유행어'는 허용 목록의 '음식'으로 바꿨다. 우리말샘에 '맛알못'은 정식 표제어가 아니다(참여자 제안 1건). 최초 사용처는 확인하지 못했다."
sources = ["https://opendict.korean.go.kr/search/searchResult?query=맛잘알", "https://opendict.korean.go.kr/dictionary/view?sense_no=1520849", "https://opendict.korean.go.kr/search/searchResult?query=맛알못"]

