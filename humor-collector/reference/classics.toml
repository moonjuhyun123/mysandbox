origin = "'겉은 바삭, 속은 촉촉'의 앞글자를 딴 말이다. 나무위키는 월드 오브 워크래프트 유저들이 벼락을 맞고 죽은 가로쉬를 통닭에 빗댄 데서 줄임말이 퍼졌다고 적었으나, 다른 출처로는 확인하지 못했다."
