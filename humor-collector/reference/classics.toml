verified = "partial"
risk_checked = true
notes = "맨시티 인수 시점(2008년 9월)은 위키백과로 확인했다. 한국에서 부자의 대명사가 된 시작점과 계기는 확인하지 못했고, 별칭 '만수르 세트'도 근거를 찾지 못했다. 웹 검색 한도가 소진되고 나무위키가 403으로 막혀 추가 확인을 하지 못했다."
