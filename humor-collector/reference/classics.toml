[[slang]]
name = "참교육"
aliases = ["참교육 시전", "참교육 당하다"]
category = "인터넷·커뮤니티"
year = "미확인 (속어 의미 확산 시점 미확인)"
origin = "본래 '참된 교육'이라는 뜻의 말로, 전교조가 1989년 결성 때부터 민족·민주·인간화 교육을 '참교육'으로 주창했다. 인터넷에서는 무례한 상대를 따끔하게 응징한다는 속어로 바뀌어 쓰이며, 이 의미가 퍼진 시점과 커뮤니티는 미확인이다."
meaning = "잘못한 상대에게 혹독하지만 마땅한 응징이나 교훈을 준다는 뜻이다. '참교육 시전', '참교육 당했다' 꼴로 쓴다."
use_when = "새치기나 반칙을 한 캐릭터가 당하는 사이다 결말, 건방진 캐릭터가 한 방에 깨지는 마지막 컷에 어울린다."
food_fit = "새치기한 음식 캐릭터가 청양고추의 매운맛에 혼쭐나거나, 편식하는 아이를 채소 캐릭터가 맛으로 혼내주는 결말로 쓸 수 있다."
fame = 5
fame_evidence = "영어 위키낱말사전에 속어 뜻이 올라 있다. 같은 제목의 네이버 웹툰(채용택·한가람)이 넷플릭스 드라마로 만들어져 2026년 6월 공개됐을 만큼 말 자체가 대중적이다."
caution = "전교조 구호에서 온 말이라 정치적 연상이 생길 수 있으니 교사·노조와 엮지 않는다. 동명 웹툰과 넷플릭스 드라마의 로고·장면은 저작권 대상이며, 폭력을 미화하지 않도록 응징은 가볍게 그린다. 2026년 6월 5일 공개된 넷플릭스 시리즈 '참교육'은 원작 웹툰의 체벌·폭력 미화와 인종차별·혐오 표현 문제로 제작 단계부터 논란이 됐고, 전교조는 \"폭력은 참교육이 아니다\"라며 제작 중단을 요구했다. 공개 뒤에는 3화의 '가짜 미투' 설정이 미투 운동을 폄훼한다는 비판도 받았다. 지금 이 말은 해당 드라마와 그 논란을 바로 떠올리게 하므로 교사가 학생을 응징하는 구도, 성범죄 무고, 여성 인플루언서 응징 같은 설정은 쓰지 않는다. 드라마 화제에 편승하는 인상도 주지 않는다."
verified = "partial"
risk_checked = true
notes = "원뜻의 배경으로 전교조(1989년 결성)가 '참교육'을 이념으로 주창했다는 점과 동명 웹툰·드라마(2026.6 공개, 김무열 등 출연)가 있다는 점을 추가했다. 속어 의미의 최초 확산처는 확인하지 못했다."
sources = ["https://en.wiktionary.org/wiki/참교육", "https://ko.wikipedia.org/wiki/전국교직원노동조합", "https://ko.wikipedia.org/wiki/참교육"]
caution_sources = ["https://www.starnewskorea.com/movie/2026/06/05/2026060511525774251", "https://v.daum.net/v/5zCFfccn56", "https://enews.imbc.com/News/ViewAmp/503938"]

[[slang]]
