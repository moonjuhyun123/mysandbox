food_fit = "좋음. 아이스크림·냉면 캐릭터가 등장하자 분위기가 얼어붙는 시각 개그로 쓰기 좋다."
fame = 5
fame_evidence = "카카오 '2018 베스트' 투표(87만 4,481명 참여) 자주 사용한 신조어 1위(33%). tvN 코미디빅리그에 '갑분싸' 코너가 있었다."
caution = "말 자체는 무난하다. 나무위키에 극우 커뮤니티 게시판 유래설이 있으나 확인되지 않았고, 지금은 일반 어휘로 쓰인다. 다소 2018년 느낌이 나는 말이다."
verified = "partial"
risk_checked = true
notes = "유행·인지도는 카카오 자료로 확인. 최초 기원(게시판)은 미확인. 사용자 요청대로 '신조어' 묶음으로 분류할 것."
sources = ["https://namu.moe/w/%EA%B0%91%EB%B6%84%EC%8B%B8", "https://www.kakaocorp.com/page/detail/8639", "https://www.i-boss.co.kr/ab-2877-2969", "https://sports.khan.co.kr/article/201812281745003"]

[[slang]]
