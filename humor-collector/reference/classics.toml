meaning = "어디서나 들리는 중독성 CM송이다. 'OO은 에듀윌' 틀로 아무 말이나 끝에 붙여 부른다."
use_when = "시험 준비 컷, 합격 기원 컷, 머릿속에서 노래가 떠나지 않는 컷에 쓴다."
food_fit = "수험생 책상 위 컵라면 캐릭터가 '합격은~' 하고 흥얼거리거나, '야식은 OO~'로 개사하는 장면에 쓴다."
fame = 4
fame_evidence = "'수능 금지곡'으로 불렸고 개그콘서트 패러디, 금영노래방 신곡 등록으로 화제가 됐다는 보도가 있다."
caution = "서경석·이혜리 초상과 원곡 멜로디·상표는 그대로 쓰지 않는다. 교육 광고 홍보처럼 보이지 않게 개사 틀만 빌린다. 에듀윌은 '합격자 수 1위' 광고로 2022년 공정위 과징금 2억8600만 원을, 응답자 10명뿐인 설문을 근거로 한 '10명 중 9명 단기합격' 광고로 2024년 시정명령과 과태료를 받았다. 2023년에는 합격 환급금이 늦게 지급된다는 논란도 있었다. 따라서 '합격 보장', '1위', '단기합격'처럼 결과를 약속하는 문구와 엮지 않는다."
verified = "partial"
risk_checked = true
notes = "첫 TV 광고는 2014년, 출연자는 서경석으로 확인했다. 가사가 정확히 '합격은 에듀윌'인지는 원문으로 확인하지 못했고, 공식 명칭은 '에듀윌 합격송', 태그라인은 '에듀윌은 합격이다'로 보인다."
sources = ["https://v.daum.net/v/20230515000016487", "https://www.newsfc.co.kr/news/articleView.html?idxno=35280", "https://www.daehannews.kr/news/article.html?no=440648"]
