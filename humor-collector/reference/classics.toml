meaning = "값에 비해 품질이나 양, 만족이 얼마나 좋은지를 뜻한다."
use_when = "캐릭터가 메뉴나 물건을 고르며 따지는 장면, 또는 '가성비 대 가심비'로 맞붙는 장면에 쓴다."
food_fit = "편의점 도시락 캐릭터와 오마카세 캐릭터가 가성비와 가심비를 두고 맞붙는 식으로 쓸 수 있다."
fame = 5
fame_evidence = "위키백과 '대한민국의 인터넷 신조어 목록'에 중앙일보 2017년 칼럼을 출처로 실려 있다. 파생어 '가심비'가 생길 만큼 일상어로 자리 잡았다."
caution = "이미 일상어여서 밈으로서 웃음을 주는 힘은 약하다. 실제 브랜드나 가게 이름을 넣어 비교하면 비방 소지가 있다."
verified = "partial"
risk_checked = true
notes = "뜻은 정확하다. 파생어 '가심비'(2018)를 추가했다. 밈이라기보다 일상어에 가깝다. 중앙일보 원문은 접속이 막혀 직접 확인하지 못했다. 카테고리를 '기타'로 고쳤다. 동아일보 원문과 '트렌드 코리아 2018' 관련설은 페이지 접근이 막히고 검색 한도가 소진되어 확인하지 못했다."
sources = ["https://ko.wikipedia.org/wiki/대한민국의_인터넷_신조어_목록", "https://www.donga.com/news/article/all/20180104/88018182/1", "https://opendict.korean.go.kr/search/searchResult?query=가심비"]

[[slang]]
