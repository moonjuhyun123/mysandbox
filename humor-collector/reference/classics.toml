[[classic]]
name = "치킨은 살 안 쪄요, 살은 내가 쪄요"
aliases = ["살은 내가 쪄요", "치킨은 살 안 쪄요"]
category = "광고·CF"
year = "2017 (4월 제3회 배민신춘문예 대상)"
origin = "배달의민족이 연 '제3회 배민 신춘문예'(2017)의 대상 수상작이다. 응모작 5만8286편 가운데 뽑혔고 상품은 치킨 365마리 자유이용권이었으며(아주경제 2017.4.11), 이후 배민 광고에도 쓰였다."
meaning = "먹은 음식은 죄가 없고 살찐 건 나라는 자기 합리화다."
use_when = "야식을 먹은 뒤 체중계에 오르는 컷, 음식을 감싸 주는 컷에 쓴다."
food_fit = "체중계 위에서 우는 사람 옆에서 치킨이 '저는 살 안 쪄요'라고 결백을 주장하는 장면에 쓴다."
fame = 4
fame_evidence = "여러 매체가 대상작으로 보도했고, 배민 특유의 위트 있는 마케팅 사례로 소개됐다(소비자평가)."
caution = "수상자는 일반인이니 이름을 쓰지 않는다. 배민 로고는 피하고, 다이어트나 외모 비하로 흐르지 않게 한다. 배민은 2020년 주문 건당 수수료(정률제)로 바꿀 때 앱 삭제를 앞세운 '탈배민' 운동을 겪었고, 2025년 4월 포장 주문 수수료(6.8%)를 받기 시작했을 때도 점주들의 반발을 샀다. 자영업자 사이에 반감이 큰 만큼, 음식 브랜드 계정에서는 배민을 떠올리게 하는 색이나 글꼴을 함께 쓰지 않는다."
verified = "verified"
risk_checked = true
notes = "연도는 2015년 무렵이 아니라 2017년이고, 제3회 배민신춘문예 대상 수상작으로 확인했다."
sources = ["https://www.ajunews.com/view/20170411135156182", "https://www.foodbank.co.kr/news/articleView.html?idxno=51495", "https://www.sportsseoul.com/news/read/501413", "http://www.iconsumer.or.kr/news/articleView.html?idxno=4961"]
