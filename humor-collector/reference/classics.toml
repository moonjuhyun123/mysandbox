caution = "워너브러더스와 원작자의 저작권 캐릭터이므로 외형을 그대로 그리지 않는다. 실존 인물을 암시하는 용도로 쓰지 말고 음식이나 사물에만 적용한다. 원작자 J.K. 롤링의 트랜스젠더 관련 발언을 둘러싸고 해리 포터 작품과 상품을 불매하자는 요구가 이어지고 있다. 이 요구는 2025년 HBO 드라마 제작과 오디오북 때까지 계속됐으므로, 20~30대 독자 일부에게는 해리 포터를 떠올리게 하는 것 자체가 부정적일 수 있다. 워너브러더스는 해리 포터 상표권을 적극적으로 행사해 왔다. 2025년 12월 영국 특허청은 워너의 이의를 받아들여, 해리 포터 연상을 노린 'Lumous' 상표 출원을 악의적 출원으로 보고 거절했다. 워너는 해리 포터 상품점 Whimsic Alley를 상대로 소송을 낸 뒤 합의하기도 했다. 그러므로 '볼드모트'는 제품명, 이벤트명, 해시태그 같은 상업적 표지로 쓰지 않고 대사 속 비유로만 쓴다. 국내 언론이 특정 정치인을 '볼드모트'에 빗댄 사례도 있어(데일리안 2020.7, 이상직 의원), 실존 인물을 떠올리게 하는 맥락에는 쓰지 않는다."
