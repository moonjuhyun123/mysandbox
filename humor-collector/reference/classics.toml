origin = "유튜브 채널 '박병남'에 올라온 '대파파기인터뷰' 영상이다. 대파밭에서 농민이 인터뷰하듯 말하다가 뒤로 넘어져 다리를 버둥거린다(댓글 '뒤로 넘어갈 걸 준비한 사람 같다', '본인을 심으시네'). 인물이 누구인지, 무슨 말을 했는지, 촬영 경위는 미확인이다."
meaning = "진지하게 말하다 허무하게 무너지는 반전 개그이자, '농사는 망해도 웃음은 잃지 않는다'는 해탈 밈이다."
use_when = "캐릭터가 진지하게 각오나 인터뷰를 하다가 마지막 컷에서 뒤로 꽈당 넘어지는 반전."
food_fit = "대파 캐릭터가 동료 대파들이 심긴 밭 앞에서 인터뷰하다 뒤로 넘어져 '스스로 심기는' 셀프 패러디. 채소값 폭락 소재와 잘 맞는다."
fame = 3
fame_evidence = "2022.4.13 에펨코리아(조회 약 7천), 2022.4.27 여성시대(조회 약 3.8만), 2022.10 루리웹, 2023.8 여성시대 재업로드가 확인됐고 GTA5 패러디 영상도 있다. 언론 보도는 확인하지 못했다."
