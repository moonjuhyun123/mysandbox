[[classic]]
name = "MZ오피스 / 맑은 눈의 광인(맑눈광)"
aliases = ["MZ오피스", "맑눈광", "맑은 눈의 광인", "젊꼰", "젊은 꼰대", "업무 중 에어팟"]
category = "예능"
year = "2022 (밈 유행 2022 말~2023)"
origin = "쿠팡플레이 'SNL 코리아' 시즌3의 간판 코너 'MZ오피스'. 김아영이 업무 중 에어팟을 끼고 눈을 동그랗게 뜬 Z세대 인턴을 연기해 '맑은 눈의 광인'이라는 별명을 얻었다. 주현영은 '젊꼰' 선배 역이다. 업무 중 에어팟 장면은 2023.1.1 김슬기 호스트 회차에 나왔다."
meaning = "해맑은 표정으로 거침없이 선을 넘는 신입과 선배 사이의 세대 차이를 그린다. '맑눈광'은 해맑은 얼굴로 엉뚱한 소리를 하는 사람을 가리키는 일반 표현이 됐다."
use_when = "사무실 배경 컷, 이어폰을 낀 채 무표정으로 할 말을 다 하는 캐릭터가 나올 때."
food_fit = "에어팟을 낀 신입 마카롱이 동그란 눈으로 선배 떡에게 '이거 끼고 해야 능률 올라가는데요?'라고 말하는 장면."
fame = 4.5
fame_evidence = "공식 유튜브 클립이 300만~400만 회에 육박했고, 박해수 회차 하이라이트는 약 424만 회를 기록했다(2023.1 기준). 업무 중 이어폰 착용을 두고 온라인 토론이 벌어졌고, '90년생이 온다' 저자 임홍택도 의견을 냈다."
caution = "김아영·주현영은 실존 배우이므로 얼굴·의상을 그대로 옮기지 말고 '이어폰 낀 해맑은 신입' 콘셉트만 쓴다. SNL 방송 화면은 쿠팡플레이 저작물이다. 젊은 직원, 특히 젊은 여성을 조롱한다는 비판과 '여자들 기싸움' 지적이 있었으니 세대·성별을 비하하는 방향은 피한다. 김아영은 2024년 10월 19일 SNL 코리아 시즌6에서 한강 작가를 연기하며 외모를 희화화했다는 비판을 받았다. 같은 회차의 뉴진스 하니 패러디(지예은)도 외국인 말투 조롱 논란이 됐다. 실존 인물의 외모나 말투를 흉내 내는 방향은 피한다. 또 '맑눈광' 캐릭터는 퍼시스 광고처럼 김아영이 직접 출연한 상업 협업에 쓰였다. 브랜드 계정이 김아영을 떠올리게 하는 모습으로 쓰면 허락 없이 광고를 흉내 낸 것처럼 보일 수 있다."
verified = "verified"
notes = "연구자가 낸 레이디경향 기사(2023.3.24)는 화보 기사여서 조롱 논란 근거가 되지 못한다. 논란 근거는 다음(v.daum.net, 2023.1.7) 기사다. 시즌3 첫 방송일은 미확인."
sources = ["https://enews.imbc.com/News/ViewAmp/369887", "https://v.daum.net/v/20230107154505706?x_trkm=t", "https://lady.khan.co.kr/entertainment/article/202303240721011"]
caution_sources = ["https://www.twig24.com/news/world/2024/10/20/20241020500056", "https://www.sidae.com/article/2024102015500352737", "https://lady.khan.co.kr/entertainment/article/202303240721011"]

[[classic]]
name = "능력자 김종국 (호랑이·꾹관장)"
aliases = ["능력자 김종국", "능력자", "스파르타쿡스", "꾹이", "김국종", "꾹광 케미", "맨날 괴롭히는 형", "꾹관장", "근육맨 김종국", "스파르타 꾹관장", "호랑이 체육관"]
category = "예능"
year = "2010 (별명 생김), 이후 2021년까지 런닝맨에서 계속 쓰임"
origin = "2010년 SBS '런닝맨' 이름표 뜯기 미션에서 압도적인 힘으로 상대를 잡아 '능력자' 별명을 얻음(회차 미확인). 2018년 7월 29일 방송에서는 좀도둑 7명을 혼자 모두 잡았음. 이광수와는 2013년 9월 29일 '나 맨날 괴롭히는 형' 폭로, 2020년 6월 28일 초능력전에서 이광수·하하가 손잡고 김종국 이름표를 뗀 장면 등으로 앙숙 케미를 보였음. 2021년 9월 19일 571회 '꾹관장과 국가대표'에서는 스파르타식 '호랑이 체육관' 관장으로 나왔음."
meaning = "혼자서 여럿을 압도하는 최강의 힘센 캐릭터. 꾹광 구도는 힘센 형과 계속 덤비다 당하는 동생의 티격태격."
use_when = "힘센 캐릭터가 한 명씩 차례로 제압할 때, 여럿이 덤벼도 혼자 이기는 장면, 스파르타식 운동 코치 컷."
food_fit = "근육질 닭가슴살·단백질바 캐릭터가 다른 음식들의 이름표를 차례로 뜯거나, '닭가슴살 관장'이 군것질 캐릭터들을 단련시키는 장면."
fame = 4.5
fame_evidence = "에스콰이어가 이 별명으로 '예능인 김종국'을 설명함. OSEN(2016)은 '누가 뭐래도 절대 변치 않는 능력자'로 소개함. 이광수 하차(2021.6.13) 때 김종국의 '남은 인생은 꼭 함께 가자' 편지도 보도됨(텐아시아)."
caution = "실존 인물이고 SBS 방송 화면은 저작권이 있으니 얼굴, 실명, 캡처는 쓰지 말고 '능력자', '이름표 뜯기' 같은 콘셉트만 빌릴 것. 이광수와의 구도를 실제 괴롭힘처럼 그리지 말 것."
verified = "verified"
notes = "'7대1 대결'은 2018년 7월 29일 방송에서 좀도둑 7명을 모두 잡은 것임. '호랑이 vs 기린' 구도에서 김종국을 '호랑이'라고 부르는 표현은 열어본 기사에서 확인되지 않아 별칭에서 뺌. 확인된 것은 꾹관장의 '호랑이 체육관' 설정뿐이고, 2016년 7월 24일 기사에는 '기린팀'이라는 팀명만 나옴. 런닝맨 밖의 근육·운동 이미지도 명성에 보탬이 되므로 점수를 5에서 4.5로 낮춤."
sources = ["https://www.esquirekorea.co.kr/article/1886513", "https://www.ajunews.com/view/20180730070321296", "https://www.osen.co.kr/article/G1110331961", "https://www.ajunews.com/view/20130930000060", "https://sports.khan.co.kr/article/202006291117003", "https://www.tenasia.co.kr/article/2021061442804", "https://www.tenasia.co.kr/article/2016072499694", "https://programs.sbs.co.kr/programTemplate/amp/vod/runningman/22000426762"]

[[classic]]
name = "까나리카노 (까나리 액젓 복불복)"
aliases = ["까나리 액젓 벌칙", "까나리 복불복", "까나리카노 복불복", "까나리카노", "까나리 액젓", "까나리카노 vs 아메리카노"]
category = "예능"
year = "2007~ 까나리 액젓 벌칙(최초 회차 미확인). '까나리카노'는 늦어도 2014년 시즌3에서 '트레이드마크'로 언급됨"
origin = "KBS2 '1박2일'의 대표 벌칙인 까나리 액젓을 색이 같은 아메리카노에 섞은 '까나리카노' 복불복이다. 2014년 10월 5일 방송분 기사에 이미 '1박2일의 트레이드마크'로 나왔다. 2015년 6월 7일 방송에서는 김주혁이 아메리카노를 고르고도 까나리카노를 마신 척 발연기를 했고, 2019년 12월 8일 시즌4 첫 회에서는 아메리카노 50잔과 까나리카노 50잔을 섞은 100잔 복불복이 나왔다."
meaning = "겉보기엔 똑같은데 하나만 끔찍한 맛인 음료 뽑기."
use_when = "똑같아 보이는 것들 사이에 함정이 섞인 상황. 한 모금 마시고 얼굴이 일그러지는 리액션."
food_fit = "커피나 음료 캐릭터와 아주 잘 맞음. 아메리카노 캐릭터들 사이에 까나리카노 캐릭터가 숨어 있는 컷."
fame = 4.5
fame_evidence = "텐아시아(2019.12.8)는 '1박2일의 필수 코스', 2014년 기사는 '트레이드마크'로 소개함. 2025년 2월 라디오스타 900회에서 김종민이 18년 동안 까나리 액젓을 한 번도 안 먹었다고 말하고 김구라와 까나리와 아메리카노를 구별하는 대결을 함."
caution = "출연자 실명·얼굴과 KBS 방송 화면은 그대로 쓰지 말 것. 2015년 발연기 장면의 김주혁은 2017년 세상을 떠났으므로 그 장면 패러디는 피할 것. 시즌2(2012) 이후는 나영석 PD 연출이 아님. 2014~2015년 시즌3 까나리카노 회차의 고정 멤버 정준영은 2020년 9월 집단 성폭행 등으로 징역 5년이 확정됐다. 2019.12.8 시즌4 첫 회 '100잔 복불복' 멤버 중 라비는 뇌전증을 연기한 병역비리로 징역 1년·집행유예 2년이 확정됐고, 김선호는 2021년 사생활 논란으로 하차했다. 이 회차들의 장면이나 멤버 구도는 재현하지 말고 '색이 같은 음료 복불복'이라는 장치만 쓸 것."
verified = "verified"
notes = "김종민 발언 기사는 2026년 6월이 아니라 2025년 2월 4일 기사(라디오스타 900회 예고)임. '까나리카노'는 2015년보다 앞선 2014년 10월 기사에 이미 나옴. 텐아시아 원문에는 딘딘 '원샷'이라는 표현이 없고 까나리카노를 다 마셨다고만 나옴. 2023~2025년 '겨자떡·소금어묵' 언급은 확인하지 못함."
sources = ["https://www.tenasia.co.kr/article/2014100606494", "https://www.tenasia.co.kr/article/2015060834114", "https://www.tenasia.co.kr/article/2019120802874", "https://www.hankookilbo.com/news/article/201912051224311822", "https://www.insight.co.kr/news/490955"]
caution_sources = ["https://news.tf.co.kr/read/ogmeta/1814922.htm", "https://sports.khan.co.kr/article/202308101541003", "https://www.heraldk.com/article/2026032705234940036", "https://www.tenasia.co.kr/article/2021102495964"]

[[classic]]
name = "야외취침 (잠자리 복불복)"
aliases = ["잠자리 복불복", "야외취침 확정", "실내취침 vs 야외취침", "야외취침", "실내취침"]
category = "예능"
year = "2007~ (1박2일 시즌1부터 시즌4까지 계속. 첫 회차 미확인)"
origin = "KBS2 '1박2일'(2007년 8월 5일 첫 방송)에서 잠자리 복불복에 지면 한겨울에도 텐트와 침낭으로 밖에서 자야 하는 벌칙이다. 2011년 1월 30일 방송 강원 홍천 편에서는 스태프와의 아이스크림 복불복에 진 멤버 5명 전원이 영하 20도에서 야외취침을 했고, 제작진은 사상 가장 추운 야외취침이었다고 밝혔다."
meaning = "게임에 진 사람은 추운 바깥에서 잔다."
use_when = "혼자 쫓겨나거나 소외되는 상황, 추위에 덜덜 떠는 컷."
food_fit = "냉장고에 자리가 없어 밖에서 자게 된 음식 캐릭터('실온 취침' 패러디)."
fame = 4.5
fame_evidence = "인사이트는 나영석 PD가 고안한 복불복과 그로 인한 야외 취침·낙오·계곡 입수가 1박2일을 국민 예능으로 만들었다고 설명함. 위키백과에 야야 취침·반반 취침 같은 변형까지 정리될 만큼 정착된 장치임."
caution = "출연자 얼굴·실명과 KBS 방송 화면은 그대로 쓰지 말 것. 시즌1은 이명한·나영석 등이 연출했고, 시즌2(2012~) 이후는 나영석 PD 연출이 아님. 시즌1(2007~2012) 멤버였던 이수근은 2013년 상습도박으로 징역 6개월·집행유예 1년을 선고받고 하차했다. MC몽은 2010년 병역 의혹으로 하차했고, 이후 위계공무집행방해로 유죄가 확정됐다. 2011년 홍천 편 등 시즌1 명장면을 멤버 구도째 재현하지 말고 '지면 밖에서 잔다'는 벌칙 설정만 빌릴 것."
verified = "verified"
notes = "첫 회 충북 영동 편(2007.8.5·8.12)에 야외취침이 있었다는 내용은 확인하지 못함. 홍천 편은 2011년 1월 30일 방송이며 멤버 전원이 야외취침했음. 나영석 PD 관련 주의는 '시즌3 이후'가 아니라 '시즌2 이후'가 정확함. 2023년 텐아시아 기사는 열어보지 못함."
sources = ["https://www.starnewskorea.com/broadcast-drama/2011/01/30/2011013018592196612", "https://www.insight.co.kr/news/134804", "https://ko.wikipedia.org/wiki/1%EB%B0%95_2%EC%9D%BC"]
caution_sources = ["https://m.ekn.kr/view.php?key=93242", "https://www.segye.com/newsView/20131111000476", "https://www.newdaily.co.kr/site/data/html/2010/09/17/2010091700066.html", "https://www.osen.co.kr/article/G1109405050"]

