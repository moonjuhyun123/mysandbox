[[classic]]
name = "트민남 (전현무)"
aliases = ["트민남", "트렌드에 민감한 남자", "트렌드 절단남"]
category = "예능"
year = "미확인(2024년 7월 기사에서 사용 확인, 2026년 '트렌드 절단남' 변형)"
origin = "전현무가 '나 혼자 산다' 등 예능에서 유행하는 장소, 음식, 활동을 바로 따라 하며 스스로 내세운 '트렌드에 민감한 남자'의 줄임말이다. 2026년 2월에는 그가 두쫀쿠를 언급한 뒤 열풍이 식었다며 '트렌드 절단남'이라는 변형이 보도됐다."
meaning = "유행을 누구보다 빨리 따라 하는 사람, 또는 유행에 집착하는 사람을 가리킨다."
use_when = "유행 음식이나 핫플을 쫓아다니는 캐릭터, 그가 손대면 유행이 끝난다는 반전 장면에 맞다."
food_fit = "탕후루, 두쫀쿠 같은 유행 디저트를 섭렵하는 캐릭터나, 그 캐릭터가 언급하자마자 유행 음식들이 시드는 장면에 아주 잘 맞는다."
fame = 4
fame_evidence = "2024년 텐아시아, 2026년 인사이트와 엑스포츠뉴스가 모두 전현무의 대표 캐릭터로 소개했다."
caution = "전현무는 실존 인물이라 얼굴을 그리지 않는다. 2026년 9월 '나 혼자 산다' 알마티 여행 편 조작 의혹 보도가 있어 당분간 그를 직접 떠올리게 하는 사용은 피하고, '트민남'이라는 일반 표현으로만 쓴다. MBC 프로그램 로고도 쓰지 않는다. 전현무는 2025년 12월 2016년 '나 혼자 산다'의 차 안 수액 장면이 다시 알려져 의료법 위반 혐의로 고발됐고, 경찰이 수사에 착수했다. 대한의사협회는 의료기관 밖에서 주사를 맞는 것은 기본적으로 안 된다고 지적했다. 알마티 편 조작 의혹은 2026년 10월까지도 보도가 이어졌다(제작진은 스태프 항공권 사전 준비를 인정함). 그러니 주사, 링거, 피로 회복, '즉흥 여행' 소재와 '트민남'을 엮지 않는다."
verified = "partial"
risk_checked = true
notes = "최초 사용 시점은 확인하지 못했다. '트렌드 절단남'은 엑스포츠뉴스가 아니라 2026년 2월 인사이트 기사에서 확인했다. '트민녀' 별칭은 출처에서 확인되지 않아 뺐다."
