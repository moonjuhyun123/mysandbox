caution = "맥도날드 상표·로고와 원곡 가사·멜로디를 그대로 쓰지 말고 재료를 나열하는 구조만 패러디한다. 리메이크 가수의 초상은 쓰지 않는다."
verified = "verified"
notes = "원곡 연도는 '미확인'이 아니다. 한국판은 2011.12.28 TV광고로 시작했고(이투데이), 1974년은 미국 원형 광고의 연도다(뉴데일리·위키백과). '더블 빅맥송' 리메이크는 2026년이 아니라 2025.10.21 발표다. 매장에서 부르면 공짜로 주는 이벤트는 2013년에 시작했다."
sources = ["https://www.etoday.co.kr/news/view/524747", "https://biz.newdaily.co.kr/site/data/html/2016/09/23/2016092310001.html", "https://www.insight.co.kr/news/525253", "https://ko.wikipedia.org/wiki/빅맥송"]

