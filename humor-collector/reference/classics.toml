fame_evidence = "방송 뒤 '이효리 명언'으로 널리 회자됐고, 2022년 텐아시아가 대표 명언으로 다뤘으며, 2026년 9월 사과 소식도 일간스포츠 등에서 기사화됐다."
caution = "이효리, 이경규, 강호동은 실존 인물이라 얼굴을 그리지 않는다. 장면 속 아이는 일반인이므로 재현하지 않는다. JTBC 방송 화면도 쓰지 않는다. 장면 속 이경규는 2025년 6월 처방약(공황장애 약)을 먹고 운전한 혐의로 2025년 10월 벌금 200만 원에 약식기소됐고, 법원도 같은 액수의 약식명령을 내렸다. 그러니 '훌륭한 사람'과 대비되는 어른을 이경규처럼 그리거나, 약이나 운전 소재와 엮지 않는다."
