[[classic]]
name = "관짝소년단 (Coffin Dance)"
aliases = ["Coffin Dance", "관짝 댄스", "관짝밈", "가나 장례 댄스"]
category = "일반인 영상"
year = "2017 BBC 소개 / 2020 세계적 유행"
origin = "가나 그레이터아크라주 프람프람의 운구 업체(Nana Otafrija Pallbearing and Waiting Service, 대표 벤저민 아이두)가 관을 메고 춤추는 장례 퍼포먼스다. 2017년 7월 BBC가 처음 널리 소개했고, 2020년 2~3월 틱톡에서 EDM곡 'Astronomia'와 합쳐져 사고 영상 뒤에 붙는 밈으로 전 세계에 퍼졌다."
meaning = "위험하거나 무모한 행동 직후 또는 직전에 등장시켜 '이제 끝났다(관짝 행)'를 암시하는 블랙유머."
use_when = "무모한 도전을 하는 캐릭터 뒤에서 관을 멘 무리가 춤추며 대기하는 결말 컷."
food_fit = "유통기한 지난 우유나 시커멓게 탄 토스트를 젓가락이나 식재료 운구단이 관에 메고 춤추며 나간다."
fame = 4
fame_evidence = "틱톡 코리아 공식 뉴스룸이 2020년 6월 '#관짝밈'을 소개했다. DI today는 국내 커뮤니티 확산을 보도했고, 2020년 8월에는 의정부고 졸업사진 패러디가 기사화될 만큼 학생층까지 퍼졌다."
caution = "실존 인물(가나 운구단)이 나오고 장례와 죽음을 소재로 한다. 2020년 의정부고 졸업사진의 얼굴 검게 칠하기(블랙페이스) 패러디가 인종차별 논란을 빚었으므로 피부색 표현이나 분장은 절대 하지 말고 음식 캐릭터로만 그린다. 실제 사고나 사망 뉴스에 붙이지 않는다. 'Astronomia' 음원은 저작권이 있다."
verified = "verified"
notes = "원조 업체명(Nana Otafrija), 대표(벤저민 아이두), 지역(프람프람), 2020년 'Astronomia' 결합을 보충했다. '방탄소년단 이름을 빌린 별명'이라는 설명은 확인한 출처에 없어 미확인이다(이름의 말장난상 그럴듯하지만 명명 경위는 출처가 없다). DI today는 이 밈을 '1일 1깡', '사딸라'와 함께 언급했지만 '밈 전성시대의 대표 사례'라고 규정한 표현은 직접 확인하지 못했다."
sources = ["https://en.wikipedia.org/wiki/Coffin_Dance", "https://ko.wikipedia.org/wiki/관짝소년단", "https://newsroom.tiktok.com/ko-kr/coffin-meme", "https://ditoday.com/?p=38773", "https://www.kyeonggi.com/article/202008111135068"]

