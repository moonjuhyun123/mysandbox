[[classic]]
name = "파묘 '험한 것' / 김고은 대살굿 장면"
aliases = ["험한 것", "험한 것이 나왔다", "김고은 굿", "대살굿"]
category = "드라마·영화"
year = "2024"
origin = "영화 '파묘'(장재현 감독, 2024.2.22 개봉)에서 무덤을 판 뒤 영화 후반부에 나오는 정체불명의 존재를 영화 홍보와 기사에서 '험한 것'이라 불렀다. 무당 이화림(김고은)이 신들린 듯 칼춤을 추는 대살굿 장면도 크게 화제가 됐다. '험한 것'이 어떤 인물의 대사인지, 원문이 무엇인지는 미확인이다."
meaning = "'험한 것'은 정체 모를 무섭고 불길한 것을 부르는 말로 응용된다."
use_when = "냉장고 깊숙이에서 정체불명의 반찬통을 꺼내는 컷, 굿하듯 칼춤을 추며 액막이하는 컷."
food_fit = "유통기한 지난 반찬통이나 곰팡이 핀 빵을 '험한 것'으로 그리는 컷. 시험 전날 떡 캐릭터가 액막이 굿을 하는 컷."
fame = 4
fame_evidence = "파묘는 32번째 천만 영화로, 2024년 4월 기준 1,095만 명을 모았다(위키백과). 스포츠경향(2024.2.21)과 보그 코리아도 '험한 것'이라는 표현을 썼다. 다만 이 표현이 밈으로 유행했다는 기사는 확인하지 못했다."
caution = "김고은 초상과 영화 장면은 쓰지 않는다. 대살굿은 돼지 같은 동물을 바치는 굿이니 고기 캐릭터를 제물로 그리지 않는다. 무속을 비하하지 않고, 일본 정령 설정이 민족 비하로 번지지 않게 한다. 개봉 당시 '건국전쟁'의 김덕영 감독이 '반일주의를 부추기고 좌파가 몰린다'고 공격해 진영 논쟁이 붙었으니 정치·이념 맥락과 엮지 않는다. 대살굿 장면은 실제 돼지 사체를 써서 동물보호단체 카라가 동물학대 문제를 제기했고 제작사가 답변했으니, 칼질이나 제물 장면은 패러디하지 않는다. 얼굴과 몸에 한자를 쓴 장면은 중국 누리꾼의 조롱과 한중 감정싸움으로 번졌으니 한자 문신 모티프도 피한다."
verified = "partial"
risk_checked = true
notes = "굿 장면을 '대살굿'으로 특정했다. '험한 것'은 영화 홍보와 기사에서 쓰인 표현으로 확인됐지만, 어떤 인물의 대사인지와 밈으로 유행했는지는 미확인이다. 파묘 관련 밈으로 확인된 것은 '파 문 고양이' 짤처럼 고양이 '묘'를 비튼 말장난이다."
sources = ["https://sports.khan.co.kr/article/202402210722003", "https://ko.wikipedia.org/wiki/파묘_(영화)", "https://www.vogue.co.kr/2024/02/22/%ed%97%98%ed%95%9c-%ea%b2%83%ec%9d%98-%ec%9d%b4%ec%95%bc%ea%b8%b0-%ed%8c%8c%eb%ac%98-%ea%b4%80%ec%a0%84-%ed%8f%ac%ec%9d%b8%ed%8a%b8/", "https://v.daum.net/v/UvUQMNqyqn"]
caution_sources = ["https://www.sedaily.com/article/13847769", "https://m.seoul.co.kr/news/life/2024/03/04/20240304500066", "https://v.daum.net/v/20240401190905957", "https://www.vegannews.co.kr/news/article.html?no=19980", "https://sports.khan.co.kr/article/202403130000013"]

