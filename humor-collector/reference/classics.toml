[[classic]]
name = "달인 - \"16년 동안 ~해 오신 달인\" / \"안 해 봤으면 말을 하지 마세요\""
aliases = ["달인", "16년 달인", "김병만 달인", "안 해봤으면 말을 하지 마세요", "5만 7천여 가지"]
category = "예능"
year = "2007.12~2011.11 (2008년 유행어, 특집 2013·2017·2019·2025)"
origin = "KBS2 개그콘서트 '달인'(2007.12.9~2011.11.13)은 개콘 역사상 단일 최장수 코너다. 류담이 \"16년 동안 ~해 오신 달인\"이라고 소개하면 김병만이 엉터리 실력을 뽐냈고, 노우진은 수제자로 나왔다. 의심을 받으면 달인이 \"~해 봤어요? 안 해 봤으면 말을 하지 마세요\"로 막았다. 2025.12.14에는 홈커밍 특집이 방송됐다."
meaning = "별것 아닌 실력을 거창하게 포장하거나, 의심하는 상대의 말을 막을 때 쓴다."
use_when = "한 우물만 판 캐릭터를 소개하는 첫 컷이나, 장인 흉내를 내다 망하는 반전 컷에 쓴다."
food_fit = "'16년 동안 면만 뽑아 오신 수타의 달인 짜장면 선생' 같은 소개 자막."
fame = 4
fame_evidence = "전북일보 '2008 대중문화發 유행어' 기사에 '안 해봤으면 말을 하지 마세요'가 실렸다. 이투데이(2010.12)는 '3년째 사랑받는' 코너로 소개했다. 머니투데이(2025.12.12)는 김병만이 출연하는 개콘 특집 편성을 보도했다."
caution = "김병만, 류담, 노우진은 실존 인물이라 초상을 그대로 쓰지 않는다. KBS 영상과 캡처도 쓰지 않는다. 소개 멘트의 구조만 빌린다. 김병만은 2024~2025년 사생활 분쟁이 크게 보도됐다. 전처와 서로 고소했고(폭행·사기 등, 보도상 양측 모두 혐의없음 또는 불기소 의견), 전처 딸 파양 소송은 2025.8 인용됐으며, 같은 달 혼외자 2명을 인정했고 2025.9 재혼했다. 달인 패러디를 결혼, 이혼, 자녀, 보험, 돈 소재와 엮지 않는다. '안 해 봤으면 말을 하지 마세요'를 사생활 해명처럼 읽히는 맥락에도 쓰지 않는다."
verified = "verified"
notes = "방영 기간(2007.12.9~2011.11.13)과 출연진은 맞다. 2007년에 시작해 2008년에 처음 유행한 코너라 출발점은 2010년 이전이다. 다만 2011년까지 방영됐고 이후 특집(2025.12.14 홈커밍 포함)으로 다시 불려 나와 범위 안으로 본다. '1000회 특집 재방영'은 나무위키의 특집 목록(2019)으로만 확인했다. 숫자 표기는 '57,000'보다 대사 원문인 '5만 7천여 가지'가 정확하다."
sources = ["https://namu.moe/w/57000", "https://www.jjan.kr/article/20081214292565", "https://www.etoday.co.kr/news/view/387047", "https://www.mt.co.kr/entertainment/2025/12/12/2025121211287228195"]
caution_sources = ["https://www.heraldk.com/article/2025080716551497650", "https://v.daum.net/v/20241112113445700", "https://www.ytn.co.kr/_ln/0103_202411201423111574", "https://www.mt.co.kr/entertainment/2025/12/12/2025121211287228195"]

