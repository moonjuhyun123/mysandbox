[[classic]]
name = "고뤠?"
aliases = ["고뤠에??", "김준현 고뤠"]
category = "예능"
year = "2011~2012"
origin = "개그콘서트 '비상대책위원회'에서 김준현이 자기 작전을 송병철에게 지적받으면 머쓱하게 내뱉던 말이다. 나무위키에 따르면 처음엔 \"그지?\", \"그래?\"였는데 회차가 거듭되며 \"고뤠?\"로 과장됐다. 처음 쓴 회차는 미확인이다."
meaning = "지적을 받자마자 굵은 목소리로 순순히 수긍하는 리액션이다."
use_when = "큰소리치다가 반박을 듣고 바로 꼬리를 내리는 컷에 쓴다."
food_fit = "왕만두나 통삼겹 캐릭터가 지적을 받고 굵게 \"고뤠?\" 하는 장면."
