[[slang]]
name = "미친 존재감 (미존개오)"
aliases = ["미친 존재감", "미존", "미존개오", "미친 존재감 개화동 오렌지족"]
category = "예능"
year = "2010"
origin = "'미친 존재감'은 2010년 봄 이미 분량은 적어도 눈에 띄는 조연(추노의 성동일 등)을 가리키는 신조어였다(주간경향 2010.4.6). 무한도전 정형돈은 2010년 1월부터 '미존개오(미친 존재감 개화동 오렌지족)'로 불렸다(경향신문 2012). 누가 처음 썼는지는 미확인이다."
meaning = "비중이 작은데도 눈에 확 띄는 존재."
use_when = "조연인데 시선을 강탈하는 캐릭터를 소개하는 컷에서."
food_fit = "짜장면 위 완두콩 한 알이나 비빔밥 위 계란 노른자 캐릭터에 '미친 존재감' 자막을 단다."
fame = 4
fame_evidence = "2010년 주간경향이 유행 현상을 다뤘다. 미디어스(2011.2)는 2010년 정형돈을 미존개오로 평가했다. '미친 존재감'은 지금도 기사 제목에 흔히 쓰인다. '미존개오'는 상대적으로 덜 알려졌다."
caution = "'미존개오'는 정형돈 개인의 별명이다. 일반 표현인 '미친 존재감' 위주로 쓴다. '미친 존재감'이라는 표현을 직접 문제 삼은 보도는 찾지 못했다. 다만 '미친'이라는 말이 정신장애 낙인이라는 지적은 있다. 2022년 정신장애인 단체가 영화 '범죄도시2'의 '미친놈' 등 대사가 편견을 키운다며 국가인권위원회에 진정했다. 눈이 돌아간 얼굴처럼 정신질환을 떠올리게 하는 그림과 함께 쓰지 않는다. 가능하면 '존재감 폭발' 같은 대체 표현도 함께 검토한다."
verified = "partial"
risk_checked = true
notes = "'미친 존재감'이 정형돈에게서 시작됐다는 근거는 없다. 2010.4에 이미 조연 배우를 가리키는 유행어였다. 헬스코리아뉴스(2011.9.4) 기사는 '미존여오'가 아니라 '미존개오를 만든 고마운 동네'라는 기사다."
sources = ["https://weekly.khan.co.kr/article/201004061747041", "https://www.khan.co.kr/article/201210192113265", "https://www.mediaus.co.kr/news/articleView.html?idxno=16074", "https://www.hkn24.com/news/articleView.html?idxno=80593"]
caution_sources = ["https://www.newsis.com/view/NISX20220707_0001935017", "https://brunch.co.kr/@ragony/623"]

[[slang]]
