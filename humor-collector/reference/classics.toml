food_fit = "머리에 떡볶이 모양이 달린 출출세포가 다이어트 세포를 제압한다."
fame = 4
fame_evidence = "511화 연재, 단행본 13권, 드라마화, 모바일 게임 4종이 있었다(위키백과). 드라마 방영 때 'OO는 귀여워서 비밀번호 없어도 통과' 패러디가 트위터에서 유행했다(캐릿 2021.10.15)."
caution = "원작 세포 캐릭터 그림은 저작권이 있다. 캐릭터 디자인은 쓰지 말고 '머릿속 세포 회의' 설정만 빌린다. '출출 세포', '사랑 세포', '응큼 세포' 같은 원작 세포 이름은 2022년 7월 뚜레쥬르(CJ푸드빌)가 도넛·빵 협업 제품에 쓴 라이선스 캐릭터다. 2019년에는 휠라 협업 굿즈에도 쓰였다. 2026년 4월 드라마 시즌3(티빙·tvN)가 나오면서 원작과의 연상도 다시 강해졌다. 음식 캐릭터 브랜드 계정에서 '출출세포', '출출이', '사랑세포' 같은 원작 세포 이름이나 '유미의 세포들' 제목을 쓰면 공식 협업으로 오인되거나 라이선스 식품 상품과 겹칠 수 있다. 세포 이름은 새로 짓고(예: '배고픔 담당') '머릿속 회의' 구도만 빌린다."
verified = "verified"
risk_checked = true
notes = "'○○세포'라는 말 자체는 이 웹툰보다 먼저 쓰였다. '연애세포'는 2013.5.3 노컷뉴스 칼럼에 나오고, 2010~2012년 같은 이름의 네이버 웹툰도 있었다. 이 작품은 '머릿속 세포 회의' 설정을 대중화했다고 보는 것이 정확하다."
sources = ["https://ko.wikipedia.org/wiki/유미의_세포들", "https://www.careet.net/524", "https://www.nocutnews.co.kr/news/1029725"]
caution_sources = ["https://cjnews.cj.net/?p=29135", "https://www.webtoonguide.com/ko/board/news-column/8904", "https://www.wikitree.co.kr/articles/1131134"]

# 신조어·유행어: 특정 장면 없이 일상어처럼 쓰는 말. 대사 속 말투로 쓸 수 있음.
[[slang]]
name = "1도 모르겠다"
aliases = ["1도 없다", "1도", "1도 몰으갰습니다", "1도 없어"]
category = "예능"
year = "2014 (밈 유행 2014~2018)"
origin = "헨리가 MBC 《일밤-진짜 사나이》 군내 퀴즈에서 '모라고 하는지 1도 몰으갰습니다'라고 답안을 적은 장면에서 퍼졌다(정확한 회차와 방송일은 미확인). 2018년 11월 JTBC 《한끼줍쇼》에서 강호동이 헨리를 이 말의 창시자로 소개했다."
meaning = "'하나도'를 숫자 '1도'로 바꿔 쓴 말장난으로, '전혀 ~않다'는 뜻이다."
use_when = "설명을 듣고 하나도 이해하지 못한 장면, 혹은 무언가가 전혀 남아 있지 않음을 강조하는 컷에 맞다."
food_fit = "레시피 설명을 듣고 멍해진 라면 캐릭터가 '1도 모르겠다'고 하거나, 제로 음료 캐릭터가 '당 1도 없음'을 자랑하는 식으로 쓸 수 있다."
fame = 5
fame_evidence = "위키백과 신조어 목록에 유래와 함께 실려 있다. 2018년 에이핑크가 '1도 없어'라는 곡을 냈고, 같은 해 예능에서 창시자 이야기가 다시 다뤄졌다(세계일보 2018.11.22)."
caution = "헨리는 실존 인물이므로 얼굴, 군복 차림, 말투를 흉내 내는 연출은 피하고 일반화된 표현만 쓴다. 방송 장면 캡처는 MBC 저작물이다. 헨리는 2022년 3월 '친중' 행보 논란에 휩싸였다. 마포경찰서 학교폭력 예방 홍보대사로 위촉되자 반대 여론이 일었고, 이후 올린 사과문 때문에 여론이 더 나빠졌다(데일리안, 이투데이). '창시자 헨리'를 언급하거나 그를 떠올리게 하는 연출은 하지 말고, 이미 일반화된 '1도 모르겠다'라는 표현으로만 쓴다."
verified = "partial"
risk_checked = true
notes = "카테고리 '신조어'는 허용 목록에 없어 유래를 따라 '예능'으로 바꿨다. 답안 원문 표기는 '모라고 하는지 1도 몰으갰습니다'이다. 방송 회차와 날짜, 그리고 2010년부터 쓰였다는 설은 확인하지 못했다(검색 한도 소진)."
sources = ["https://ko.wikipedia.org/wiki/대한민국의_인터넷_신조어_목록", "http://www.segye.com/newsView/20181122002393", "https://www.starnewskorea.com/stview.php?no=2014121214395198582"]
caution_sources = ["https://www.dailian.co.kr/news/view/1095235/", "https://www.etoday.co.kr/news/view/2115867"]

[[slang]]
name = "꽃길만 걷자 (꽃길만 걷게 해줄게)"
aliases = ["꽃길만 걷게 해줄게", "꽃길", "꽃길 걷자"]
category = "예능"
year = "2016 (밈 유행 2016)"
origin = "Mnet '프로듀스 101' 5회(2016년 2월 19일 방송)의 첫 순위 발표식에서 1위를 한 김세정이 어머니에게 앞으로 꽃길만 걷게 해 주겠다고 말한 데서 유행했다. 같은 해 11월 23일 지코가 프로듀싱한 솔로곡 '꽃길'이 나왔다."
meaning = "앞으로 좋은 일만 있기를 바란다는 덕담이자 응원 표현이다."
use_when = "합격, 데뷔, 졸업, 이직처럼 새 출발을 축하하거나 응원하는 장면에 맞는다."
food_fit = "식용꽃이 깔린 길을 걸어가는 디저트 캐릭터나, 꽃 모양 케이크 위로 걷는 장면에 \"꽃길만 걷자\"라는 대사를 붙일 수 있다."
fame = 5
fame_evidence = "영문 위키백과에는 김세정이 이 발언 뒤로 방송과 매체에서 'Flower Way(꽃길)'의 아이콘으로 불린다고 적혀 있다. 솔로곡 '꽃길'은 가온 디지털 차트 2위에 올랐고, 국문 위키백과는 이를 가온 다운로드 주간 2위로 적고 있다."
caution = "실존 연예인 김세정의 얼굴이나 포즈를 그대로 따라 그리지 않는다. 방송 화면(CJ ENM 계열 Mnet)과 노래 가사·음원은 저작권이 있으므로 쓰지 않고, 일반 관용구인 '꽃길만 걷자'만 대사로 쓴다. 프로듀스 시리즈는 2019년 투표 조작 사건이 있었으므로 프로그램 자체를 패러디하는 것은 피하는 편이 무난하다."
verified = "verified"
risk_checked = true
notes = "첫 순위 발표가 5회(2016.2.19)이고 김세정이 1위였다는 점은 영문 위키백과로 확인했다. 발언의 한국어 원문 문구는 미확인이며, 영문 위키백과는 'I will only let you walk on the flower road from now on'으로 옮겼다. 차트 성적은 영문 위키백과가 가온 디지털 차트 2위, 국문 위키백과가 가온 다운로드 주간 2위(월간 9위)로 서로 다르게 적고 있다."
sources = ["https://en.wikipedia.org/wiki/Kim_Se-jeong", "https://en.wikipedia.org/wiki/Produce_101_(season_1)", "https://ko.wikipedia.org/wiki/김세정"]

[[slang]]
name = "악마의 편집"
aliases = ["악편"]
category = "예능"
year = "2010~2011 (슈퍼스타K2·3 시기 대중화)"
origin = "Mnet '슈퍼스타K' 시리즈의 자극적이고 몰입도 높은 편집 방식을 가리키며 퍼진 말이다. 2011년 9월 연합뉴스는 '슈퍼스타K 3'를 다루며 '악마의 편집'으로 불리는 편집이 인기의 일등 공신이자 논란거리라고 보도했다. 처음 쓴 사람은 미확인이다."
meaning = "앞뒤를 잘라 출연자를 오해하게 만들거나, 결정적 순간에 끊어 궁금하게 만드는 편집."
use_when = "말이나 장면이 왜곡돼 억울해졌을 때 쓴다."
food_fit = "남은 피자 한 조각만 찍혀 '혼자 다 먹은 놈'이 된 캐릭터가 '이건 악마의 편집이야!'라고 외치는 컷."
fame = 5
fame_evidence = "연합뉴스(2011.9.20, 전북일보 게재)가 이 표현으로 기사를 썼다. 텐아시아(2016.2.17)는 슈퍼스타K를 '악마의 편집이라는 말을 대중화시킨' 프로그램으로 언급했다. 지금도 일상어로 널리 쓰인다."
caution = "피해 사례로 거론되는 슈퍼스타K 출연자(일반인 포함)는 언급하지 말고 표현만 쓴다."
verified = "verified"
risk_checked = true
notes = "출처가 비어 있어서 2011년 연합 기사와 2016년 텐아시아 기사로 보강했다. 2010년 슈퍼스타K2 출연자 사례가 계기였다는 위키 서술이 있지만 2차 자료라 미확인으로 둔다."
sources = ["https://www.jjan.kr/articleAmp/20110919412004", "https://www.tenasia.co.kr/article/2016021788204", "https://thewiki.kr/w/악편"]

[[slang]]
name = "허당 (이승기)"
aliases = ["허당기", "허당 캐릭터"]
category = "예능"
year = "2007~2008 (시즌1, 정확한 회차·방송일 미확인)"
origin = "'1박 2일' 시즌1에서 '엄친아' 이미지의 이승기가 말을 잘 못 알아듣는 등 허술한 모습을 보이자 김C가 '허당'이라고 불러 공식 캐릭터가 됐다. 나무위키는 울진 편 김C 발언이 유명하지만, 첫 합류한 평창 편에서 강호동이 먼저 허당이라고 했다고 서술한다."
meaning = "겉으로는 완벽해 보이는데 실속 없이 허술함."
use_when = "잘난 척하다 어설프게 실수할 때."
food_fit = "겉은 바삭하고 완벽한데 속은 텅 빈 공갈빵 캐릭터."
fame = 4.5
fame_evidence = "엑스포츠뉴스 2017 10주년 기사에서 대표 캐릭터로 소개됐다. 나무위키는 '거의 일반 어휘화하여 자연스럽게 사용되고 있는 단어'라고 서술한다."
caution = "'허당'은 일반 단어처럼 써도 되지만 이승기의 실명과 얼굴은 넣지 말 것. 원래는 '허탕·헛방'을 뜻하는 강원도 사투리이고 지금도 표준어가 아니다. 이승기의 장인은 2025년 4월 코스닥 상장사 주가조작 혐의로 구속·기소됐다. 앞서 다른 주가조작 사건에서는 대법원이 유죄 취지로 파기환송했다. 이승기는 2025년 4월 처가와의 절연을 공개적으로 밝혔고, 본인이 연루됐다는 보도는 없다. '허당'을 쓸 때 돈·주식·처가 소재와 엮지 말고 이승기를 떠올리게 하는 설정도 피할 것."
verified = "partial"
risk_checked = true
notes = "작명자는 김C로 알려졌지만 나무위키는 평창 편의 강호동이 먼저라고 서술한다. 원래 뜻은 강원도 사투리 '허탕·헛방'이다. 울진 편 방송일은 미확인. 2007년에 생긴 말이지만 2010년 이후에도 일반 어휘로 계속 쓰여서 범위에 넣었다."
sources = ["https://www.xportsnews.com/article/879931", "https://namu.moe/w/%ED%97%88%EB%8B%B9", "https://ko.wikipedia.org/wiki/1%EB%B0%95_2%EC%9D%BC"]
caution_sources = ["https://www.ajunews.com/view/20250429114226471", "https://m.seoul.co.kr/news/2025/05/16/20250516500219", "https://www.fnnews.com/news/202406161302514009"]

[[slang]]
name = "그린라이트 (마녀사냥)"
aliases = ["그린라이트를 켜줘", "그린라이트다", "그린라이트 켜졌다"]
category = "예능"
year = "2013 (방송 2013.8~2015.12)"
origin = "JTBC 마녀사냥(2013.8.2~2015.12.18, 신동엽·성시경·허지웅·유세윤 진행)의 코너 '그린라이트를 켜줘'에서 유래했다. 시청자 사연 속 이성의 행동이 호감 신호인지 착각인지 MC들이 판정하던 코너이다."
meaning = "상대가 나에게 호감이 있다는 신호, 또는 일이 잘될 조짐을 뜻한다."
use_when = "썸 상대의 애매한 행동을 친구들이 분석하는 장면, 고백 직전에 기대에 부푼 장면에 어울린다."
food_fit = "오이·브로콜리 같은 초록 음식 캐릭터의 머리에 초록불이 켜지거나, 신호등 소품의 초록불을 누르는 연출이 가능하다."
fame = 4
fame_evidence = "위키백과 마녀사냥 문서에 코너명과 판정 방식이 실려 있다. 호감 신호를 뜻하는 일상어로 지금도 쓰인다(사용 빈도는 판단)."
caution = "JTBC 프로그램 로고·방송 화면과 진행자(실존 인물)의 얼굴은 쓰지 않는다. 원 프로그램이 성인 연애 토크였으므로 성적 맥락은 빼고 '호감 신호'라는 뜻으로만 쓴다."
verified = "verified"
risk_checked = true
notes = "틀린 내용은 없다. 웹 검색 한도에 걸려 유행어 확산을 다룬 별도 기사는 확인하지 못했다."
sources = ["https://ko.wikipedia.org/wiki/마녀사냥_(텔레비전_프로그램)"]

[[slang]]
name = "금쪽이"
aliases = ["금쪽같은 내새끼", "우리 집 금쪽이", "우리 팀 금쪽이"]
category = "예능"
year = "2020 (일반 용법 확산 시점 미확인)"
origin = "채널A 《요즘 육아 금쪽같은 내새끼》(2020.5.29~2026.6.26, 오은영·신애라·정형돈 등 출연)가 사연 속 아이를 익명으로 '금쪽이'라 부른 데서 나왔다. 위키백과 각주에 따르면 1화에서만 본명을 썼다."
meaning = "원래는 금쪽같이 귀한 자식을 뜻하지만, 방송 이후 손이 많이 가고 문제 행동을 하는 사람(주로 아이)을 가리키는 말로 바뀌었다."
use_when = "한 캐릭터가 떼를 쓰거나 사고를 쳐서 다른 캐릭터들이 상담·훈육하는 장면, 직장이나 모임의 말썽꾼을 부르는 장면에 맞다."
food_fit = "늘 터지는 라면 수프나 금방 무르는 바나나처럼 말썽 많은 식재료를 '냉장고 금쪽이'로 부르고 상담해 주는 구도로 쓸 수 있다."
fame = 4
fame_evidence = "프로그램이 6년 동안 287회까지 방영되었다. 위키백과는 '금쪽이'라는 호칭이 부정적 의미로 바뀌어 출연 아동에게 낙인이 되었다고 서술할 만큼 이 말이 일반화되었다."
caution = "실제 출연 아동을 떠올리게 하거나 조롱하는 쓰임은 피해야 한다. 위키백과도 아동 낙인 문제를 지적한다. 오은영 등 출연자의 얼굴이나 방송 화면을 쓰면 초상권·저작권 문제가 생기므로 이름 없이 '상담 장면' 구도만 빌리는 편이 안전하다. 2023년 7월 서이초 교사 사망 사건 이후 '금쪽이'류 육아 프로그램은 교권 추락의 원인으로 지목됐다. 오은영도 '금쪽이'가 버릇없는 아이를 가리키는 말처럼 쓰이는 데 우려를 나타냈다(서울신문, 텐아시아, 이투데이). 교사·학부모 갈등이나 '문제아'를 놀리는 소재로 쓰지 말고, 귀여운 말썽꾸러기 정도의 가벼운 뜻으로만 쓴다."
