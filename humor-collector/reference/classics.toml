origin = "2007년 5월 7일 네이버 지식iN의 '이 새의종류가무엇인가요???' 질문에 흐릿한 새 사진이 올라왔고, '화질구지네요...'라는 답변이 달린 데서 시작되었다. 이 글이 '성지순례' 대상이 되며 퍼졌고, 저화질 사진에 '제목.hwajilguji'를 붙이는 식으로 정착했다."
meaning = "사진이나 영상의 화질이 매우 나쁘다는 뜻이다."
use_when = "흐릿하게 찍힌 사진, 알아볼 수 없는 인증샷이나 CCTV 장면에 쓴다."
food_fit = "맛집 인증 사진이 흔들려서 음식 캐릭터가 뭉개져 보이고, 본인은 '화질구지'라며 억울해하는 컷으로 쓸 수 있다."
fame = 4
fame_evidence = "2010년 11월 17일 아시아경제가 성지순례 현상을 보도했다. 2016년 네이버 국어사전 인기 신조어 검색 4위에 올랐고(연합뉴스 2016년 12월 27일), 2021년 6월 5일 한국일보도 다루었다."
caution = "원글의 질문자와 답변자는 일반인이므로 원글 캡처나 아이디를 쓰지 않는다. 단어 자체는 무해하다."
