origin = "KBS2 '개그콘서트'가 부활한 2023.11.12에 시작한 코너 '소통왕 말자 할매'. 할머니로 분장한 김영희가 처음에는 방청석을 돌며 \"크게 말하라고!!\"를 외치는 불통 캐릭터였다가, 관객 사연에 즉석 훈수를 두는 크라우드 워크 형식으로 바뀌었다. 2026.1.19 스핀오프 '말자쇼'가 첫 방송했고 정규 편성됐다."
meaning = "할머니가 시원하게 해 주는 인생 상담이자 사이다 훈수다. \"새벽 3시에 깬다고? 그럼 새벽 3시에 자라\" 같은 단칼 답변이 대표적이다."
use_when = "고민을 털어놓자 단칼에 정리해 주는 상담 컷, 상대가 작게 말할 때 '크게 말하라고!' 하고 되묻는 컷."
food_fit = "오래 묵은 김치나 청국장 할매가 젊은 디저트들의 연애 고민을 듣고 귀를 대며 '크게 말하라고!' 한 뒤 단칼에 정리해 주는 장면."
fame = 4
fame_evidence = "김영희가 이 캐릭터로 '2025 KBS 연예대상' 대상 후보에 올랐고 '올해의 예능상'을 받았다(더팩트). '말자쇼'는 2026.3.2 방송에서 닐슨 전국 3.1%로 올해 최고 시청률이자 오후 10시 예능 1위를 기록했다(머니투데이)."
caution = "김영희는 실존 코미디언이므로 분장한 얼굴을 그대로 그리지 말고 '할머니 상담가' 콘셉트만 빌린다. KBS 방송 화면은 저작물이다. 사연 속 실제 방청객의 이야기는 가져오지 않는다."
verified = "verified"
notes = "'2025 KBS 연예대상을 받았다'는 틀렸다. 대상 후보에 올랐고 '올해의 예능상'을 받았다. 코너는 2025.5.18까지 방송한 뒤 쉬었다가 2025.8.10에 다시 시작했다. 20~30대 체감 인지도를 보여 주는 클립 조회수 근거는 미확인."
sources = ["https://www.mt.co.kr/entertainment/2026/01/22/2026012209447294290", "https://www.mt.co.kr/entertainment/2026/03/03/2026030309187260410", "https://news.tf.co.kr/read/ogmeta/2283221.htm"]

[[classic]]
name = "이광수 (기린·배신의 아이콘·아시아 프린스·꽝손)"
aliases = ["기린 이광수", "기린", "배신 기린", "배신의 아이콘", "배신광수", "아시아 프린스", "아시아 프린스 이광수", "꽝손", "런닝맨 공식 꽝손", "광바타"]
category = "예능"
year = "2010~2013년 SBS 런닝맨 방송 중 형성(2010.7 첫 방송, '아시아 프린스'는 2013년 2월부터), 밈 유행 2010년대 전반"
origin = "SBS '런닝맨'(2010~2021.6.13 출연)에서 이광수에게 붙은 별명들이다. '기린'은 190cm대 큰 키와 긴 얼굴, 약골 이미지에서 나왔고, 미션 중 거짓말과 배신을 일삼아 '배신의 아이콘'이 됐다. 2013년 2월 17·24일 방송된 마카오·베트남 아시아 레이스 특집에서 현지 팬들이 열광하면서 '배신 기린'이 '아시아 프린스'로 불리게 됐다(본인은 2025년에 베트남에서 처음 생긴 별명이라고 말함). 날달걀 복불복에서 날달걀을 계속 골라 '공식 꽝손'이 됐다(연도·회차·달걀 개수 미확인)."
meaning = "키 크고 길쭉한데 허당이고, 동료를 배신하고, 늘 꽝을 뽑는 불운한 캐릭터를 가리킨다. 해외에서 이유 없이 인기 많은 '프린스' 이미지로도 쓴다."
use_when = "길쭉한 캐릭터가 나오거나, 친구를 배신하는 반전이 있거나, 뽑기·복불복에서 혼자 꽝을 뽑을 때 쓴다."
food_fit = "대파·바게트·빼빼로·아스파라거스를 '기린'으로 쓰거나, 날달걀 복불복에서 혼자 날달걀을 깨는 계란 캐릭터로 쓴다. 해외에서만 인기 많은 K-푸드를 '아시아 프린스'로 패러디할 수도 있다."
fame = 4
fame_evidence = "OSEN(2016.1.22)은 '기린'과 '배신의 아이콘'을, 텐아시아(2018.4.18)는 '기린'·'꽝손'·'배신의 아이콘'을 대표 별명으로 소개했다. 엑스포츠뉴스(2013.2.26)는 '배신 기린'에서 '아시아 프린스'로 바뀐 과정을 보도했고, 마리끌레르(2021.4.27 하차 기사)도 별명들을 정리했다. 2025년 주연 영화 제목이 '나혼자 프린스'다."
caution = "실존 연예인의 별명이라 실명·초상·닮은 캐리커처는 초상권·퍼블리시티권 문제가 생길 수 있다. 성격 패러디로만 쓰고 런닝맨 방송 화면(SBS 저작권)은 쓰지 말 것. 키나 얼굴을 비하하는 느낌이 나지 않게 할 것."
verified = "partial"
notes = "날달걀 복불복의 연도(2013)·회차·'30개 중 1개'·'20개 중 1개 첫 타자'는 확인하지 못했다(마리끌레르에는 연도·개수가 없음). '배신전과 12범'과 '남양주의 기린'은 열어본 출처에서 확인하지 못해 별칭에서 뺐다. 메트로신문(2015) 웨이보 500만 팔로어는 페이지 오류(503)로 확인하지 못해 출처에서 뺐다. 아시아 레이스 방송일은 엑스포츠뉴스 본문의 '17일과 24일'과 기사 날짜(2013.2.26)로 미루어 본 것이다. 키는 2018년 기사에 190cm, 2025년 기사에 192cm로 나온다. '날달걀 복불복'은 별명이 아니라 게임 이름이라 별칭에서 뺐다. 웹 검색 한도가 소진돼 추가 검색은 하지 못했다."
sources = ["https://www.tenasia.co.kr/article/2018041820494", "https://www.osen.co.kr/article/G1110331961", "https://www.xportsnews.com/article/301578", "https://www.marieclairekorea.com/?p=221745", "https://www.tenasia.co.kr/article/2025111041374", "https://ko.wikipedia.org/wiki/이광수_(배우)"]

