fame_evidence = "2021~2022년 서울시 미디어허브, 파이낸셜뉴스, 한경 매거진 등 다수 언론이 MZ세대 유행어로 보도함."
caution = "분류: 신조어. 일반 단어라 권리 문제 없음."
verified = "partial"
risk_checked = true
notes = "뜻과 확산 시기는 확인됐으나 최초 사용 시점·출처는 미확인."
sources = ["https://mediahub.seoul.go.kr/archives/2006903", "https://www.fnnews.com/news/202207291030495988", "https://magazine.hankyung.com/job-joy/article/202211212467d"]

[[slang]]
name = "멘붕"
aliases = ["멘탈붕괴", "멘탈 붕괴"]
category = "기타"
year = "2011~2012 (2012년 대표 유행어, 이후 일상어로 정착)"
origin = "'멘탈 붕괴'의 줄임말. 인터넷 커뮤니티에서 퍼진 뒤 2011~2012년 예능 자막 등으로 확산됐고 2012년 대표 인터넷 유행어로 꼽혔다. 최초 사용처는 미확인."
meaning = "[신조어] 정신이 무너질 만큼 당황하거나 충격받은 상태."
use_when = "예상 못 한 일로 캐릭터가 얼어붙거나 패닉에 빠지는 컷의 대사나 효과 글자."
food_fit = "아이스크림이 녹거나 라면이 불어버린 순간 \"멘붕\" 한마디, 금 간 표정 연출과 잘 맞는다."
fame = 5
fame_evidence = "2012년 연도별 유행어 정리 기사에서 2012년 대표어로 소개, 2017년 뉴스 최다 등장 신조어 분석에서 '스펙'과 함께 언급, 2013년 칼럼은 일상어가 됐다고 평가."
caution = "분류: 신조어. 특정 인물·영상 유래가 아닌 일반 단어라 초상권·저작권 문제 없음."
verified = "partial"
risk_checked = true
notes = "최초 방송 사용처는 위키에서도 무한도전(2011-12-03)설과 1박2일(2012-01-23)설이 엇갈려 미확인."
sources = ["https://www.asiatoday.co.kr/kn/view.php?key=651817", "https://mobile.busan.com/view/busan/view.php?code=20171019000027", "https://peoplepower21.org/magazine/1039092"]

[[slang]]
name = "밀당"
aliases = ["밀고 당기기", "밀당의 고수", "밀당하다"]
category = "기타"
year = "2009 무렵 연예 기사 등장 (2010년대 정착)"
origin = "'밀고 당기기'의 줄임말이다. 연인이나 썸 관계의 심리전을 뜻한다. 티브이데일리 2009.12.1 기사 \"'히어로' 이준기, 알고보니 '밀당'의 고수?\"가 위키백과 각주로 달려 있다. 처음 쓴 사람은 미확인이다."
meaning = "관심을 보였다가 거리를 두었다가 하며 상대의 마음을 끌어당기는 심리전을 뜻한다."
use_when = "썸 타는 두 캐릭터의 연락이나 데이트 장면, 혹은 메뉴나 할인을 두고 줄다리기하는 장면에 쓴다."
food_fit = "수타면 반죽을 밀고 당기는 장면, 밀대와 밀가루 말장난, 피자 치즈가 길게 늘어나는 장면과 잘 어울린다."
fame = 5
fame_evidence = "2009년 연예 기사 제목에 쓰였고, 이후 연애 용어로 일상화되었다. 2010년대 확산에 관한 구체적인 언론 근거는 추가로 확인하지 못했다."
caution = "출처 기사 속 실존 연예인(이준기)이나 드라마는 언급하지 않는다. 일반 연애 용어로만 쓴다."
verified = "partial"
risk_checked = true
notes = "티브이데일리 기사는 위키백과 각주로만 확인했고 원문은 열지 못했다. 처음 쓴 사람과 시점은 미확인이다."
sources = ["https://ko.wikipedia.org/wiki/대한민국의_인터넷_신조어_목록"]

[[slang]]
name = "불금"
aliases = ["불타는 금요일"]
category = "기타"
year = "미확인 (주 5일 근무제 도입 이후 등장, 2010년 이후 유행 여부 미확인)"
origin = "'불타는 금요일'의 줄임말이다. 위키백과는 주 5일 근무제와 함께 등장한 신조어라고 설명하며, 처음 쓴 사람과 시기는 미확인이다. 국립국어원 우리말샘에 '불금(불金)'으로 실려 있다."
meaning = "한 주의 마지막 근무일인 금요일 밤을 신나게 불태우며 논다는 뜻이다."
use_when = "금요일 퇴근 직후 들뜬 장면, 주말 전날 밤의 술자리나 야식 장면에 맞다."
food_fit = "치킨과 맥주 캐릭터가 금요일 밤에 몸에 불을 붙인 듯 신나게 노는 장면, 또는 숯불구이나 불닭 캐릭터가 '진짜 불금'이라며 말장난하는 컷으로 쓸 수 있다."
fame = 5
fame_evidence = "위키백과에 독립 문서(불타는 금요일)가 있고, 국립국어원 우리말샘에 표제어로 올라 있을 만큼 일상어가 되었다."
caution = "일반어라 권리 문제는 거의 없다. 과음을 미화하는 연출은 피하는 편이 안전하다. 밈이라기보다 일상 신조어에 가까워 개그 효과는 약하다."
verified = "partial"
risk_checked = true
notes = "카테고리 '신조어'를 '기타'로 바꿨다. 위키백과는 주 5일 근무제와 함께 등장했다고만 쓰고 있어, 2010년 이후에 유행했는지는 확인하지 못했다(검색 한도 소진). 다만 20~30대가 지금도 널리 쓰는 말이다."
sources = ["https://ko.wikipedia.org/wiki/불금", "https://opendict.korean.go.kr/search/searchResult?query=불금"]

[[slang]]
name = "소확행"
aliases = ["소소하지만 확실한 행복"]
category = "기타"
year = "1990년대 하루키 수필 (국내 유행 2018)"
origin = "일본 작가 무라카미 하루키가 수필에서 쓴 '소확행(小確幸)'에서 나왔다. 위키백과는 『うずまき猫のみつけかた』를 출처로 든다. 국내에서는 2018년 SNS를 중심으로 크게 유행했다."
meaning = "크고 불확실한 성공 대신 일상의 작지만 확실한 행복을 추구한다는 뜻이다."
use_when = "고된 하루 끝에 작은 즐거움으로 위로받는 장면, 거창한 계획보다 사소한 행복을 고르는 결말 장면에 맞는다."
food_fit = "퇴근길 붕어빵 한 봉지, 컵라면 마지막 국물, 갓 지은 밥 냄새처럼 음식 캐릭터 자체가 누군가의 소확행이 되는 장면을 만들 수 있다."
fame = 5
fame_evidence = "인크루트 '2018 유행어 설문조사'에서 최고의 유행어로 뽑혔다(매일신문 2018.12.24). 닐슨코리아는 2018년 1~7월 소확행 언급량이 월평균 8천여 건이며 7개월 연속 늘었다고 분석했다(2018.8.23)."
caution = "일반 용어여서 권리 문제는 적다. 하루키 책의 문장이나 표지를 그대로 옮겨 쓰면 안 된다."
verified = "verified"
risk_checked = true
notes = "기원이 미확인이라고 했으나 위키백과에 따르면 무라카미 하루키의 수필에서 나온 말이다. 하루키가 레이먼드 카버의 'A Small, Good Thing'에서 따왔다는 설명도 있다. 정확한 수필 발표 연도와 '트렌드 코리아 2018' 선정 여부는 미확인이다."
sources = ["https://www.imaeil.com/page/view/2018122413365425381", "https://www.nielsen.com/news-center/2018/press-release-20180822/", "https://ko.wikipedia.org/wiki/소확행"]

[[slang]]
name = "손가락 하트"
aliases = ["핑거 하트", "Korean Finger Heart", "소심한 브이"]
category = "기타"
year = "2000년대 중반 사용 시작 (2010년대 대중화, 2010년대 후반 세계 확산)"
origin = "엄지와 검지를 엇갈려 작은 하트를 만드는 포즈이며, 처음 만든 사람은 미확인이다. 한국어 위키백과는 2000년대 중반 대중적 사용이 시작되었다고 쓰고, 2011년 보도에서는 '소심한 브이'로 소개되었다."
meaning = "작고 귀엽게 애정이나 고마움을 표시하는 제스처이다. 사진 포즈나 팬서비스로 널리 쓴다."
use_when = "고마움·애정 표현, 셀카·단체 사진, 팬서비스, 마지막 컷의 훈훈한 마무리 장면에 쓴다."
food_fit = "새우·게 캐릭터가 집게로 손가락 하트를 만들거나, 프레첼·감자튀김 두 가닥을 엇갈려 하트를 만드는 연출에 어울린다."
fame = 5
fame_evidence = "한국어 위키백과는 이 포즈가 한류·K팝을 타고 2010년대 후반 세계적으로 통용되었다고 쓴다. 2021년 유니코드 14.0에 'Hand with Index Finger and Thumb Crossed'(U+1FAF0) 이모지로 등록되었다(영문 위키백과)."
caution = "누구나 쓰는 일반 제스처라 권리 문제는 적다. 다만 2018년 남북정상 사진 등 정치인 사진을 패러디하지는 않는다. 엄지와 검지를 모은 손 모양은 '남혐 집게손'이라는 공격을 여러 번 받았다(2021년 GS25 포스터, 2023년 넥슨 메이플스토리 일러스트 수정, 2026년 6월 LG전자 영상 삭제). 그래서 캐릭터 손을 그릴 때 엄지와 검지가 집게처럼 벌어진 모양이 되지 않게 한다. 두 손가락을 분명히 엇갈리게 그리고 하트 기호를 함께 넣어 손가락 하트로 바로 읽히게 한다."
verified = "verified"
risk_checked = true
notes = "카테고리 '포즈'는 허용 목록에 없어 '기타'로 바꿨다. 지드래곤의 원조 주장은 YTN(2016.10.9) 보도로 확인했다. 영문 위키백과는 1990년대 '소심한 브이'와 김혜수를 초기 사례로 들어 기원 설명이 출처마다 다르다. 2010년 이전에 시작되었지만 2010년대에 대중화되어 지금도 쓰이므로 범위에 든다."
sources = ["https://ko.wikipedia.org/wiki/손가락_하트", "https://en.wikipedia.org/wiki/Finger_heart"]
caution_sources = ["https://www.khan.co.kr/article/202105041757011", "https://www.segye.com/newsView/20231203504359", "https://pressian.com/pages/articles/2024062117272107685", "https://www.newsspace.kr/mobile/article.html?no=14148"]

[[slang]]
name = "아재개그"
aliases = ["부장님 개그", "여기 있새우"]
category = "기타"
year = "2016 (2016년 12월 기사가 이미 핫트렌드로 소개)"
origin = "아저씨 세대의 썰렁한 말장난, 곧 '부장님 개그'가 '아재 개그'로 불리며 친근한 개그 코드로 자리 잡았다. 2016년 12월 27일 기사는 셰프 오세득을 '아재개그의 창시자로 불리는' 인물로 소개했지만 프로그램 이름은 적지 않았다. 이 말을 처음 쓴 사람은 미확인이다."
meaning = "비슷한 발음을 이용한 썰렁한 말장난을 뜻한다. 듣는 사람이 '썰렁하다'고 반응하는 것까지가 웃음 포인트다."
use_when = "캐릭터가 회심의 말장난을 던지고 주변이 얼어붙는 장면, 4컷 마지막의 반전 대사에 쓴다."
food_fit = "'여기 있새우', '새우는 깡이 있고 고래는 밥이라 새우가 이긴다'처럼 원래 음식 이름 말장난이 많아 음식 캐릭터와 가장 잘 맞는다."
fame = 5
fame_evidence = "2016년 12월 27일 기사가 '아재'를 문화 전반의 핫트렌드로 다루며 정유년(2017년) 핫 키워드로 꼽았다."
caution = "'새우깡'(농심)과 '고래밥'(오리온)은 상표이므로 포장 디자인은 그리지 말고 이름 말장난 정도로만 쓴다. 오세득 등 실존 인물의 얼굴은 쓰지 않는다. 2026년 5월 오세득 셰프를 지목한 10억 원대 사기·제주 농장 탈취 의혹이 SNS에서 퍼졌다. 본인은 허위라며 법적 대응을 밝혔고 다툼이 진행 중이다. 그러므로 '아재개그 창시자 오세득'처럼 그의 이름을 쓰거나 원조로 소개하지 않는다."
verified = "partial"
risk_checked = true
notes = "기사는 '아재'를 2016년이 아니라 정유년(2017년) 핫 키워드로 선정했다고 썼다. 기사 날짜는 2016.12.27이다. '여기 있새우'는 '새우가 여기 있어요'의 변형이고, 새우깡·고래밥 말장난은 별개의 예시다. 오세득은 2015년 JTBC '냉장고를 부탁해'에 출연했지만, 아재개그를 한 프로그램이 이것인지는 미확인이다."
sources = ["https://www.sidae.com/article/2016122017528099046", "https://ko.wikipedia.org/wiki/오세득"]
caution_sources = ["https://v.daum.net/v/20260526170248048", "https://www.hankyung.com/article/2026052697807", "https://www.heraldk.com/article/2026052617021167288"]

[[slang]]
name = "엄친아 / 엄친딸"
aliases = ["엄마 친구 아들", "엄마 친구 딸", "엄마친구아들"]
category = "기타"
year = "2004~2005 (2008년 유행어, 2024년 드라마로 재조명)"
origin = "박종원 작가의 웹툰 〈골방환상곡〉(2004년 블로그 게재, 2005년부터 네이버 연재)의 '엄친아' 편에서 나온 말. 2008년 올해의 유행어로 꼽혔고, 2024년 tvN 드라마 〈엄마친구아들〉 제목으로 다시 화제가 됐다."
meaning = "[신조어] 엄마가 비교 대상으로 드는, 공부·외모·집안 다 갖춘 완벽한 남(딸이면 엄친딸)."
use_when = "늘 비교당하는 캐릭터 옆에 모든 게 완벽한 캐릭터가 등장할 때."
food_fit = "평범한 라면 옆의 프리미엄 한우, 편의점 김밥 옆의 오마카세 초밥처럼 '엄친아 음식' 비교 구도로 쓰기 좋다."
fame = 5
fame_evidence = "2008년 서울신문 올해의 유행어 기사, 웹툰 관련 기사들이 '대명사가 된 말'로 소개, 2024년 tvN 드라마 제목, 사회학 칼럼·경제학 논문('엄친아 효과')에도 쓰임."
caution = "분류: 신조어. 단어 자체는 자유롭게 써도 되지만 드라마 〈엄마친구아들〉 포스터·배우 이미지나 웹툰 그림 차용은 금지."
verified = "verified"
risk_checked = true
notes = "2010년 이전에 생긴 말이지만 계속 일상어로 쓰이고 2024년 드라마로 재조명돼 범위 안으로 판단. 연재 시작 시점은 기사마다 2005년, 2005년 12월로 조금 다름."
sources = ["https://byline.network/2019/08/13-64", "https://www.sidae.com/article/2012101100358033976", "https://m.seoul.co.kr/news/2008/12/26/20081226500017", "https://enews.imbc.com/News/ViewAmp/424881", "https://www.vogue.co.kr/?p=520510"]

[[slang]]
name = "오히려 좋아"
aliases = ["오히려 좋아요"]
category = "기타"
year = "미확인 (2021년 무렵 일상어로 확산)"
origin = "리그 오브 레전드 게임 방송인이 게임 중 아이템이 사라지자 \"오히려 좋아요\"라고 한 데서 시작됐고, 침착맨이 자주 쓰면서 게임을 안 하는 사람들에게까지 퍼졌다는 설명이 있다. 원작자 이름과 날짜는 미확인."
meaning = "[신조어] 손해나 실수를 오히려 잘됐다며 태연하게 긍정으로 받아넘기는 말."
use_when = "일이 꼬였는데 캐릭터가 태연하게 정신승리하는 반전 컷."
food_fit = "라면에 물을 너무 많이 부었을 때 \"오히려 좋아, 국물 라면\" 같은 대사로 음식 실수와 아주 잘 맞는다."
fame = 5
fame_evidence = "마케팅 매체 DIGITAL iNSIGHT 칼럼과 트렌드 뉴스레터가 유행어에서 일상어로 넘어갔다고 분석했고, 같은 제목의 노래도 나왔다고 소개됨."
caution = "분류: 신조어. 침착맨이 연상되는 말이므로 단어만 쓰고 인물 얼굴·캐리커처는 쓰지 말 것. 2026년 9월 침착맨이 라이브 방송에서 떡볶이(펄볶이)를 먹으며 여성 흉내 목소리로 '맛이 참 썩을 년'이라고 말했다. 이 발언이 여성혐오 논란을 일으켰고, 영상은 사과 없이 편집됐다. 음식 캐릭터 만화는 그 장면을 떠올리게 할 수 있으니 침착맨을 연상시키는 연출이나 패러디는 완전히 배제한다. 음식 맛을 성별 비하어로 표현하는 대사도 쓰지 않는다. 말 자체는 일반어로만 쓴다."
verified = "partial"
risk_checked = true
notes = "침착맨이 원조가 아니라 다른 게임 방송인이 원작자라는 설명이 있으나 그 방송인 이름과 시점은 미확인."
sources = ["https://ditoday.com/?p=59601", "https://maily.so/trendaword/posts/72nznnxkzp5"]
caution_sources = ["https://m.go.seoul.co.kr/news/life/2026/09/28/20260928500153", "https://isplus.com/article/view/isp202609300167"]

[[slang]]
name = "욜로 (YOLO)"
aliases = ["YOLO", "욜로족", "욜로 라이프", "인생은 한 번뿐"]
category = "기타"
year = "2011 (영미권 유행), 국내 유행 2016~2017"
origin = "'You Only Live Once'의 약자로, 드레이크의 2011년 노래 'The Motto' 가사로 영미권에서 퍼졌다(위키백과). 국내에서는 2017년 tvN '윤식당' 등 방송가의 '욜로 열풍'으로 확산되었으나 뒤에는 과소비를 부추긴다는 역풍을 맞았다."
meaning = "미래를 위해 참기보다 지금 한 번뿐인 인생을 즐기자는 태도를 뜻한다."
use_when = "다이어트나 저축을 포기하고 충동적으로 즐기기로 하는 장면, 앞뒤 재지 않고 일을 저지르는 장면에 맞는다."
food_fit = "유통기한이 임박한 우유가 '어차피 한 번 사는 인생'이라며 마지막 날을 즐기거나, 다이어트 중인 캐릭터가 야식 치킨 앞에서 '욜로!'를 외치는 장면에 쓸 수 있다."
fame = 5
fame_evidence = "경향신문 2017년 결산에 '연초 방송가는 욜로 정신에 충실했다'는 문장이 있다. 서울신문(2017.4.11)은 방송가의 욜로 열풍을, 시사저널과 연합뉴스는 2017년 욜로 현상을 보도했다(위키백과 인용)."
caution = "일반 용어여서 권리 문제는 적다. 과소비를 부추긴다는 비판이 있었던 말이라 소비 미화로 읽히지 않게 쓰는 편이 낫다. 말을 퍼뜨린 드레이크는 2024년 켄드릭 라마의 디스곡 'Not Like Us'에서 소아성애 의혹 가사로 공격을 받았다. 그가 UMG를 상대로 낸 명예훼손 소송은 2025년 10월 기각되었고 항소 의사를 밝힌 상태다. 그러므로 드레이크나 'The Motto' 가사를 인용하거나 언급하지 않고 일반어로만 쓴다."
