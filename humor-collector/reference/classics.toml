meaning = "버터를 듬뿍 넣고 겉에 소금을 뿌린 빵을 사려고 줄을 서고 맛집을 찾아다니는 빵 유행을 뜻한다."
use_when = "빵집 앞 오픈런 장면, 줄 서서 겨우 산 빵을 자랑하는 장면, 짠맛과 고소한 맛의 조합에 감탄하는 장면에 어울린다."
food_fit = "소금빵 캐릭터가 인기 스타처럼 줄 선 손님을 맞거나, 소금 알갱이를 왕관처럼 얹고 등장하는 장면으로 쓸 수 있다."
fame = 4
fame_evidence = "2022년 5월 7일 아시아경제는 MZ세대 빵지순례에서 소금빵 맛집 방문이 필수 코스가 되었고 인스타그램 '#소금빵' 게시물이 10만 건에 이른다고 보도했다. 위키백과는 소금빵이 주요 베이커리의 필수 메뉴가 되었다고 적는다."
caution = "특정 베이커리의 상호나 포장을 그대로 쓰지 않는다. 실존 인물 문제는 없다. 2025년 8~9월 경제 유튜버 슈카의 팝업 '990원 소금빵'이 자영업 빵집 반발로 큰 논란이 되었고 팝업 영업이 중단되었다. 그러니 '소금빵이 원가에 비해 비싸다'처럼 빵값이나 동네 빵집을 저격하는 대사와 실존 유튜버를 연상시키는 연출은 피한다."
verified = "verified"
risk_checked = true
notes = "'시오빵' 명칭은 위키백과 본문에는 없고 아시아경제 기사에 나온다. 일본 원조 개발 연도인 2003년은 위키백과에만 있으며 각주가 없다."
