caution = "주현영은 실존 인물이므로 초상은 쓰지 않는다. 쿠팡플레이 영상은 캡처해 쓰지 않는다. '사회초년생 여성을 희화화했다'는 논란이 있었으므로 성별을 특정하지 않은 신입 일반으로 그린다. 처음에 대선 후보 패러디로 기획됐던 캐릭터이므로 정치와 엮지 않는다. 주현영은 SNL에서 김건희 여사를 두 차례(2021.12, 2022.1) 패러디했다. 그래서 2024년 10월 무렵 '김 여사 풍자 때문에 하차했다'는 정치 음모론이 퍼졌고, 본인과 소속사는 이를 부인했다. 주기자 밈을 영부인, 정권 풍자, '하차 외압' 같은 소재와 엮지 않는다."
verified = "verified"
notes = "논란은 '세대 희화화'라기보다 '사회초년생 여성 희화화' 논란이었다(뉴시스). 뉴시스 기사에는 조회수와 유행어가 없고, 수치는 나무위키 기준이다. 캐릭터는 처음에 대선 후보 패러디로 기획됐다가 96년생 또래 인물로 바뀌었다(뉴시스). 시즌1 2회의 정확한 방송일은 확인하지 못했다."
sources = ["https://namu.moe/w/주기자", "https://mobile.newsis.com/view/NISX20211022_0001623678", "https://www.vogue.co.kr/2021/09/17/%ec%9d%b8%ed%84%b4-%ea%b8%b0%ec%9e%90-%ec%a7%88%eb%ac%b8-%ec%a7%80%ec%a0%81-%ec%95%94%ed%8a%bc-%ea%b0%90%ec%82%ac%ed%95%a9%eb%8b%88%eb%8b%a4/"]
