[[slang]]
name = "카공족"
aliases = ["카페 공부족"]
category = "인터넷·커뮤니티"
year = "미확인 (2019년 조선일보 기사에서 다룸)"
origin = "'카페에서 공부하는 족(族)'을 줄인 말로, 카페를 공부 공간으로 쓰는 사람을 가리킨다. 2019년 8월 31일 조선일보 기사(고성민·권유정)가 음료 한 잔으로 오래 머무는 카공족 논란을 보도했다. 처음 쓰인 시점은 미확인이다."
meaning = "음료 한 잔을 시켜 두고 카페에서 오랜 시간 공부하는 사람을 가리킨다."
use_when = "시험 기간의 카페 풍경이나, 자리를 오래 차지한 손님과 사장님이 눈치 싸움을 하는 장면에 맞는다."
food_fit = "아이스 아메리카노 캐릭터가 얼음이 다 녹을 때까지 노트북 앞에 앉아 있거나, 케이크들이 콘센트 자리를 두고 다투는 장면으로 쓸 수 있다."
fame = 4
fame_evidence = "조선일보 2019.8.31 기사 '카페 興亡은 1시간42분…아아 1잔 시켜놓고 5시간 카공족·촬영족 논란'이 위키백과 각주로 달려 있다."
caution = "카페 업주와 손님 사이의 갈등 소재이므로 어느 한쪽도 조롱하지 않게 그린다. 실제 카페 프랜차이즈의 로고와 컵 디자인은 피한다."
verified = "partial"
risk_checked = true
notes = "조선일보 기사의 제목·기자·날짜는 위키백과 각주로 확인했다. 기사 원문은 접속이 막혀 열지 못했다. '아아 한 잔에 5시간'은 기사 제목에서 따온 표현일 뿐 굳어진 별칭이 아니어서 뺐다. 처음 쓰인 시점은 미확인이다."
sources = ["https://ko.wikipedia.org/wiki/대한민국의_인터넷_신조어_목록", "http://news.chosun.com/site/data/html_dir/2019/08/31/2019083100788.html"]

[[slang]]
name = "쿠크다스 멘탈"
aliases = ["멘탈 쿠크다스", "유리멘탈", "두부멘탈"]
category = "인터넷·커뮤니티"
year = "미확인 (2010년대 초중반 '멘붕·유리멘탈' 유행 뒤 퍼진 것으로 보이며, 2018년 칼럼에 이미 유행어로 소개됨)"
origin = "특정 방송이나 사건에서 나온 말이 아니다. 크라운제과 과자 쿠크다스가 얇아서 잘 부서지는 데 빗대어, 쉽게 무너지는 정신력을 가리키는 인터넷 신조어다. 처음 쓴 사람과 시점은 미확인이다. '멘탈' 용법은 해외축구 갤러리·게임 커뮤니티에서 퍼졌다는 위키 서술이 있다."
meaning = "작은 일에도 바스러질 만큼 약한 멘탈을 말하며, 유리멘탈·두부멘탈과 같은 뜻이다. 반대말은 강철멘탈이다."
use_when = "사소한 말 한마디나 실수에 캐릭터가 크게 상처받거나 멘붕에 빠지는 장면에서 쓴다. 자조 대사(\"나 쿠크다스 멘탈이라고…\")로 쓰기 좋다."
food_fit = "아주 잘 맞는다. 과자 캐릭터가 \"내 멘탈 쿠크다스야\" 하며 부스러지는 연출이 바로 나오고, 다른 음식 캐릭터 대사에도 그대로 쓸 수 있다."
fame = 4
fame_evidence = "일상 대화에서 흔히 쓰이는 표현이다. 지역신문 칼럼(고양신문 2018)과 시사캐스트 칼럼 제목에 쓰였고, 외국인 한국어 Q&A(HiNative)에도 질문이 올라와 있다. 나무위키에는 여초 커뮤니티에서 더 많이 쓴다는 서술이 있다는 검색 요약이 나왔다."
caution = "쿠크다스는 크라운제과의 상표이므로 실제 포장 디자인이나 로고를 그대로 그리지 말고, 일반 웨이퍼 과자 형태로 그리는 것이 안전하다. 대사에 단어만 쓰는 것은 문제가 적다. 실존 인물 초상권이나 방송 영상 저작권 문제는 없다. 다만 실제 정신건강 문제를 희화화하는 맥락은 피한다."
verified = "partial"
risk_checked = true
notes = "[신조어] 사용자 요청에 따라 신조어로 따로 분류해 주세요. 스키마에 신조어 카테고리가 없어서 일단 인터넷·커뮤니티로 두었습니다. 인지도는 3에서 4로 올렸습니다. 일상에서 널리 쓰이고 대사 말투로 바로 쓸 수 있는 신조어이기 때문입니다. 정확한 발생 시점과 최초 사용처는 확인하지 못했습니다(미확인). 나무위키와 HiNative 본문은 403으로 직접 열지 못해, 그 내용은 검색 결과 요약으로만 확인했습니다."
sources = ["http://www.mygoyang.com/news/articleView.html?idxno=48635", "http://www.sisacast.kr/news/articleView.html?idxno=72046", "https://thewiki.kr/w/멘탈", "https://hinative.com/questions/18842316", "https://namu.wiki/w/%EC%BF%A0%ED%81%AC%EB%8B%A4%EC%8A%A4", "https://brunch.co.kr/@huiyeon814/26"]

[[slang]]
name = "탕진잼"
aliases = ["탕진하는 재미"]
