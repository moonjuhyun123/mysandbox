category = "인터넷·커뮤니티"
year = "생성 시점 미확인 (2014 언론 등장, 2015~2016 확산)"
origin = "'국가'와 '히로뽕'을 합친 말이다. 디시인사이드 역사 갤러리에서 검증되지 않은 자국 미화 주장을 비꼬던 데서 나왔다고 알려져 있다(시점 미확인). 2014.9 동아일보 기사에 등장했고, 2015.9.4 디시인사이드 국뽕 갤러리가 개설되었다."
meaning = "지나친 자국 찬양을 비꼬는 말이다. 요즘은 한국이 해외에서 인정받을 때 벅차오르는 감정('국뽕 차오른다')을 가리키기도 한다."
use_when = "한국 음식이나 문화가 해외에서 인기를 끈다는 소식에 캐릭터가 감격하는 장면에 쓴다."
food_fit = "김치, 떡볶이, 김밥 캐릭터가 외국 마트 진열대나 해외 반응을 보고 가슴이 웅장해지는 장면으로 쓸 수 있다."
fame = 5
fame_evidence = "위키백과에 2015.9.4 국뽕 갤러리 개설(국민일보), 2016년 니혼게이자이의 '국뽕·헬조선' 확산 보도(매일경제), 2017.9.29 오마이뉴스 기사가 실려 있다."
caution = "'뽕'은 마약(히로뽕)에서 온 말이다. 타국 비하나 민족 비교로 흐르지 않게 한다. 대통령 연설 비판 등 정치적 맥락에서도 쓰인 말이라 정치 소재와는 결합하지 않는다."
verified = "partial"
risk_checked = true
notes = "위키백과는 '국뽕 신드롬'을 2017년의 일로 적고 있지 않다. 2017년은 대부분 각주의 접속 날짜이므로 '2017년 국뽕 신드롬'은 오독이다. 언론 등장은 2014.9(동아일보)가 더 이르다."
sources = ["https://ko.wikipedia.org/wiki/국뽕", "https://ko.wikipedia.org/wiki/대한민국의_인터넷_신조어_목록"]

[[slang]]
name = "금수저·흙수저 (수저계급론)"
aliases = ["금수저", "흙수저", "은수저", "수저계급론"]
category = "인터넷·커뮤니티"
year = "2015"
origin = "부모의 재력에 따라 계층을 금·은·동·흙수저로 나누는 말로, 2015년 국내 온라인 커뮤니티에서 널리 쓰이기 시작했다(위키백과, 경향신문 2015.11.17 사설 인용). 영어 관용구 'born with a silver spoon in one's mouth'에서 온 것으로 추정된다. 처음 올라온 커뮤니티와 날짜는 미확인이다."
meaning = "부모의 재력이 자녀의 계층을 정한다는 자조 섞인 말이다. 금수저는 부잣집 출신, 흙수저는 가난한 집 출신을 뜻한다."
use_when = "타고난 조건 차이를 비교하는 장면(비싼 재료와 싼 재료), 출발선이 다르다고 한탄하는 장면, 집안 자랑이나 신세 한탄 대사에 어울린다."
food_fit = "숟가락을 그대로 소품으로 쓸 수 있다. 한우나 트러플 캐릭터는 금수저를, 라면이나 두부 캐릭터는 흙수저를 물고 있는 대비 컷이 자연스럽다."
fame = 5
fame_evidence = "한 아르바이트 포털이 만 19~29세 청년 989명에게 한 설문에서 2015년 신조어 1위였다(44%, 매일신문 2015.12.28). 텐아시아의 '2015 모바일 10대 유행어'와 이투데이의 2015년 결산 칼럼에도 들어 있다."
caution = "특정 계층을 깎아내리는 것으로 읽히지 않게 자조하는 톤으로 쓴다. 흑백요리사의 '흑수저·백수저'(2024)와는 다른 말이니 섞어 쓰지 않는다."
verified = "partial"
risk_checked = true
notes = "매일신문 조사는 '한 아르바이트 전문 포털'이 만 19~29세 청년 989명에게 한 설문이다. 2015년 온라인 커뮤니티에서 퍼졌다는 것은 확인했지만 처음 올라온 곳은 미확인이다. 웹 검색 한도가 다 차서 추가 확인은 하지 못했다."
sources = ["https://www.imaeil.com/page/view/2015122809060609250", "https://www.tenasia.co.kr/article/2015122901794", "https://www.etoday.co.kr/news/view/1257711", "https://ko.wikipedia.org/wiki/수저계급론"]

[[slang]]
name = "꿀잼 / 노잼"
aliases = ["꿀잼", "노잼", "핵노잼", "핵꿀잼"]
category = "인터넷·커뮤니티"
year = "미확인"
origin = "'꿀'과 '재미'에서 온 '잼'을 합쳐 매우 재미있다는 뜻으로 쓰는 신조어다. 반대말은 노잼이다. 처음 생긴 시점과 장소는 미확인이다."
meaning = "꿀잼은 매우 재미있음, 노잼은 재미없음을 뜻한다. '핵-'을 붙이면 뜻이 강해진다."
use_when = "무언가를 보고 반응하는 리액션 컷이나, 썰렁한 농담에 '노잼'으로 받아치는 장면에 쓴다."
food_fit = "'꿀'과 '잼'을 그대로 살려 꿀단지와 잼병 캐릭터가 등장할 수 있다. 노잼은 잼을 바르지 않은 맨 식빵으로 표현할 수 있다."
fame = 5
fame_evidence = "한국어·영어 위키낱말사전에 신조어로 실려 있다. 영어판에는 반대말 노잼과 파생어 핵꿀잼이 실려 있다. 위키백과 신조어 목록에는 없다."
caution = "특별한 주의 사항은 없다. 일반 신조어다."
verified = "partial"
risk_checked = true
notes = "영어 위키낱말사전은 '꿀잠'과 영어 'cool'의 영향 가능성을 적고 있지만 근거가 없는 추정이다. 생성과 유행 시점은 미확인이다(웹 검색 한도 소진으로 추가 검색 불가)."
sources = ["https://ko.wiktionary.org/wiki/꿀잼", "https://en.wiktionary.org/wiki/꿀잼"]

[[slang]]
name = "꿀팁"
aliases = ["꿀팁 대방출", "생활 꿀팁"]
category = "인터넷·커뮤니티"
year = "미확인 (2010년대)"
origin = "'아주 좋은'을 뜻하는 접두적 표현 '꿀'과 '팁(tip)'을 합친 말로, 알아두면 유용한 요령을 가리킨다. 처음 쓴 사람과 시점은 미확인이다."
meaning = "매우 유용한 정보나 생활 요령을 뜻한다. '꿀잼', '꿀템'처럼 '꿀'이 좋다는 뜻으로 붙는 말 중 하나다."
use_when = "캐릭터가 요리법·보관법·생활 요령을 알려주는 장면, 정보 공유 콘셉트 컷에 어울린다."
food_fit = "꿀 캐릭터가 '진짜 꿀이 주는 팁'이라며 요령을 알려주는 말장난이나, 음식 보관·조리 요령을 알려주는 정보 컷에 바로 쓸 수 있다."
fame = 5
fame_evidence = "영어·한국어 위키낱말사전 모두 속어로 올라 있다. 결산 기사 근거는 이번에도 확보하지 못해, 점수는 일상 사용 빈도를 바탕으로 한 판단이다."
caution = "일반 어휘라 특별한 민감성은 없다. 상표 등록 여부는 미확인이므로 특정 브랜드 로고처럼 꾸미지 않는다."
verified = "partial"
risk_checked = true
notes = "분류 '신조어'는 허용 목록에 없어 '인터넷·커뮤니티'로 바꿨다. 한국어 위키낱말사전은 '매우 유용한 정보', 표준어 미등재 명사로 적고 있다. 최초 사용 시점은 이번에도 확인하지 못했다(웹검색 한도 소진)."
sources = ["https://en.wiktionary.org/wiki/꿀팁", "https://ko.wiktionary.org/wiki/꿀팁"]

[[slang]]
name = "나락 (나락 가다)"
aliases = ["나락 갔다", "나락으로 가다", "나락송", "나락퀴즈쇼"]
category = "인터넷·커뮤니티"
year = "미확인 (인터넷 유행 시기와 2021년 감스트 유래설은 확인하지 못함)"
origin = "'나락'은 불교에서 지옥을 이르는 말(奈落, 산스크리트어 naraka)이며, '나락으로 떨어지다'라는 관용구가 원래 있었다. 인터넷에서는 논란 등으로 평판이 바닥까지 떨어진 상태를 '나락 갔다'고 하며, 피식대학 정기 콘텐츠 중 '나락퀴즈쇼'가 있다. 감스트 발언이 '나락송'이 되었다는 유래와 그 시기는 미확인이다."
meaning = "잘못이나 실수로 인기나 평판이 한순간에 바닥으로 떨어진 상태를 뜻한다."
use_when = "한 번의 실수로 이미지가 무너지는 장면, 잘나가던 캐릭터가 갑자기 몰락하는 컷에 맞다. 말 한마디 잘못해 분위기가 싸해지는 순간에도 쓴다."
food_fit = "유행이 끝난 디저트 캐릭터가 진열대에서 밀려나며 '나락 갔다'고 말하는 컷이 어울린다. 아이스크림 캐릭터가 녹아 바닥으로 흘러내리는 모습을 '나락'으로 표현할 수도 있다."
fame = 5
fame_evidence = "원래 있던 관용구가 인터넷 유행어로 굳었고, 인기 유튜브 채널(피식대학)의 정기 코너 이름이 될 만큼 일반화되었다. 20~30대가 일상적으로 쓰는 표현이라는 점은 검증자의 판단이다."
caution = "위키백과에 따르면 감스트가 2019년 결성한 크루 '나락즈'는 성희롱 사건을 일으켰다. 그러니 유래 인물이나 방송은 언급하지 말고 일반 표현으로만 쓴다. 피식대학 '나락퀴즈쇼'의 이름과 포맷은 그대로 쓰지 않으며, 실존 연예인의 논란을 '나락' 소재로 삼지 않는다. 피식대학은 2024년 3월 '나락퀴즈쇼'에서 세븐틴을 폄하하는 질문으로 비판받았다(텐아시아 2024.3.22). 2024년 5월에는 경북 영양군 편 영상에서 \"할매 맛이다\", \"공무원이고 여기 발령 받으면…\" 같은 지역 비하 발언으로 논란이 됐다(스포츠경향 2024.5.16). 그러니 '나락' 밈을 피식대학 출연자의 말투나 콘텐츠 형식과 엮지 않는다. 특정 지역, 직군, 연령을 깎아내리는 소재로도 쓰지 않는다."
verified = "partial"
risk_checked = true
notes = "'2021년 5월 감스트 방송 발언이 나락송으로 밈화'는 확인하지 못했다. 위키백과 감스트 문서에는 2019년 크루 '나락즈'와 2021.3.16 손흥민 부상 관련 욕설 논란만 있고, '나락송'은 나오지 않는다. 나락퀴즈쇼가 피식대학 정기 콘텐츠인 것은 확인했지만, 시작 시기와 '더 널리 알렸다'는 평가는 미확인이다."
sources = ["https://ko.wiktionary.org/wiki/나락", "https://opendict.korean.go.kr/search/searchResult?query=나락", "https://ko.wikipedia.org/wiki/감스트", "https://ko.wikipedia.org/wiki/피식대학"]
caution_sources = ["https://www.tenasia.co.kr/article/2024032295174", "https://sports.khan.co.kr/article/202405161438003", "https://www.fnnews.com/news/202405201529011560"]

[[slang]]
name = "남사친 / 여사친"
aliases = ["남자사람친구", "여자사람친구"]
category = "인터넷·커뮤니티"
year = "미확인 (2017년 한겨레 기사에서 다룸)"
origin = "'남자 사람 친구', '여자 사람 친구'의 줄임말로, 연애 감정 없이 성별만 다른 친구를 뜻한다. 한겨레 ESC 2017년 9월 6일 기사 '남사친, 여사친...사랑과 우정 사이'(유선주)에서 다루었다. 처음 쓰인 시점은 미확인이다."
meaning = "이성이지만 연애 대상이 아닌 친구 관계를 가리킨다."
use_when = "친구 사이인지 썸인지 애매한 관계나, 연인이 상대의 이성 친구를 신경 쓰는 장면에 맞는다."
food_fit = "떡볶이와 순대처럼 늘 붙어 다니는 두 음식에게 \"둘이 사귀어?\"라고 묻자 \"그냥 남사친이야\"라고 답하는 장면으로 쓸 수 있다."
fame = 5
fame_evidence = "위키백과 신조어 목록에 실려 있고, 한겨레 2017.9.6 기사가 각주로 달려 있다."
caution = "연애·질투 소재가 남녀 갈등 구도로 흐르지 않도록 가볍게 다룬다. 2021년 대선 때 이재명 후보가 남성 청년이 '여사친'과 경쟁해야 한다는 취지로 말한 것이 젠더 갈등을 부추긴다는 비판 기사로 다뤄졌다. 그러니 남녀가 일자리나 기회를 두고 다투는 구도로는 쓰지 않는다."
verified = "partial"
risk_checked = true
notes = "한겨레 기사의 제목·기자·날짜는 위키백과 각주로 확인했다. 기사 원문은 접속이 막혀 열지 못했다. 기원 시점은 미확인이다."
sources = ["https://ko.wikipedia.org/wiki/대한민국의_인터넷_신조어_목록", "http://www.hani.co.kr/arti/specialsection/esc_section/809966.html"]
caution_sources = ["https://nocutnews.co.kr/news/5681473"]

[[slang]]
name = "넘사벽"
aliases = ["넘을 수 없는 4차원의 벽", "넘을 수 없는 사차원의 벽"]
category = "인터넷·커뮤니티"
year = "2009 무렵 (2010년대 일상어로 정착)"
origin = "'넘을 수 없는 사차원의 벽'의 줄임말인 인터넷 신조어다. 2009년 9월 뉴스엔 기사 제목에 이미 쓰였으나, 처음 쓴 곳과 만든 사람은 미확인이다."
meaning = "도저히 따라잡을 수 없을 만큼 수준 차이가 큰 상대나 격차를 뜻한다."
use_when = "주인공이 라이벌과의 실력·인기 차이를 실감하는 장면에 맞다. 줄이 길게 늘어선 맛집과 텅 빈 가게를 비교하는 장면에도 어울린다."
food_fit = "인기 메뉴 캐릭터 앞에 거대한 벽을 그리고 '넘사벽' 자막을 넣을 수 있다. 신메뉴가 원조 메뉴를 까마득히 올려다보는 구도로도 쓸 수 있다."
fame = 5
fame_evidence = "2012년 1월 마이데일리가 박명수를 '넘사벽'이라 표현했다. 위키백과 '대한민국의 인터넷 신조어 목록'은 2009년 뉴스엔 기사와 2010년 조선일보 기사를 출처로 든다."
caution = "특정 인물이나 저작물과 관계없는 일반 어휘라 권리 문제는 거의 없다."
verified = "partial"
risk_checked = true
notes = "'2010 무렵'보다 이른 2009년 9월 기사에 이미 쓰였다(위키백과 인용 출처 기준). 처음 쓴 곳은 여전히 미확인이다. 나무위키는 접속이 막혔고 웹 검색 한도가 다 차서 더 확인하지 못했다."
sources = ["https://mydaily.co.kr/page/view/2012012107165501114", "https://ko.wikipedia.org/wiki/대한민국의_인터넷_신조어_목록"]

[[slang]]
name = "답정너"
aliases = ["답은 정해져 있고 너는 대답만 하면 돼", "답정"]
category = "인터넷·커뮤니티"
year = "2014 무렵 유행 (시작 시점 미확인)"
origin = "'답은 정해져 있고 너는 대답만 하면 돼'의 줄임말로, 원하는 대답이 정해진 채 질문하는 사람을 가리킨다. 시작된 곳과 시기는 미확인이며, 2014년에는 대표 신조어로 언론에 소개됐다."
meaning = "상대에게 묻는 척하지만 사실은 자기가 원하는 대답만 듣고 싶어 하는 상황을 뜻한다."
use_when = "'나 살쪘어?', '뭐 먹을래? (근데 난 이미 정함)'처럼 정해진 답을 유도하는 대화 컷에 쓴다."
food_fit = "메뉴를 고르는 장면에서 '아무거나'라더니 결국 특정 음식만 고집하는 캐릭터와 잘 맞는다. 다른 음식들이 눈치껏 정답을 맞히는 연출도 된다."
fame = 5
fame_evidence = "아주경제 2014년 12월 17일 기사가 그해 신조어로 '답정너'를 소개했다. 20~30대에게는 일상어 수준이다."
caution = "특별한 저작권·인물 문제는 없다. 특정 성별을 '답정너'로 묘사하면 성별 갈등으로 읽힐 수 있으니 피한다."
verified = "partial"
risk_checked = true
notes = "뜻과 2014년 유행은 확인했지만 시작된 곳과 시기는 확인하지 못했다."
sources = ["https://www.ajunews.com/view/20141217144431235"]

[[slang]]
name = "대프리카"
aliases = ["대구+아프리카", "Daefrica"]
category = "인터넷·커뮤니티"
year = "2014 (밈 유행 2014)"
origin = "대구와 아프리카를 합친 말로, 영문 위키백과에 따르면 2014년 대구의 고온을 계기로 온라인 커뮤니티에서 생긴 뒤 언론과 방송으로 퍼졌다."
meaning = "아프리카처럼 몹시 더운 여름철 대구를 비유하는 말이며, 넓게는 '살인적인 더위'를 가리킨다."
use_when = "폭염 속에서 캐릭터들이 녹거나 익어버리는 여름 에피소드에 쓴다."
food_fit = "아이스크림이 녹고, 달걀이 길바닥에서 저절로 프라이가 되고, 버터가 흘러내리는 장면에 '대프리카' 표지판을 세우면 된다. 치맥 같은 대구 명물 음식 캐릭터와도 잘 어울린다."
fame = 5
fame_evidence = "우리말샘에 '아프리카의 날씨처럼 지나치게 더운 여름철 대구를 비유적으로 이르는 말'이라는 일반어로 올라 있다. 영문 위키백과 Daegu 문서에도 언론·방송에서 쓰인 신조어로 나온다."
caution = "특정 지역을 소재로 하므로 대구를 깎아내리는 투로 쓰지 않는다. 아프리카를 더위의 대명사로 쓰는 표현이라 고정관념으로 느끼는 독자가 있을 수 있다."
verified = "verified"
risk_checked = true
notes = "한국어 위키백과의 '대프리카'는 대구광역시 문서로 넘어가는 넘겨주기만 확인했고, 본문 설명과 '대한민국의 신조어' 분류는 확인하지 못했다. 영문 위키백과에는 온라인 커뮤니티에서 처음 생겼다는 내용이 추가로 있다."
sources = ["https://en.wikipedia.org/wiki/Daegu", "https://opendict.korean.go.kr/search/searchResult?query=대프리카", "https://ko.wikipedia.org/wiki/대프리카"]

[[slang]]
name = "딸바보"
aliases = ["아들바보"]
category = "인터넷·커뮤니티"
year = "2010 무렵 (최초 사용 미확인)"
origin = "'딸만 아는 바보'의 줄임말이다. 티브이데일리 2010.12.16 연말결산 기사가 그해 핵심 키워드로 꼽았으며, 처음 쓴 사람과 매체는 미확인이다."
meaning = "딸을 지극히 아끼고 딸 일이라면 무엇이든 하는 아버지(부모)를 뜻한다."
use_when = "아빠 캐릭터가 딸 사진을 자랑하거나 딸의 부탁에 무조건 넘어가는 장면에 어울린다."
food_fit = "큰 빵 아빠가 작은 빵 딸을 안고 '딸바보' 머리띠를 하거나, 딸 몫으로 가장 좋은 토핑을 몰아주는 연출이 가능하다."
fame = 5
fame_evidence = "2010년 연말결산 기사에 핵심 키워드로 꼽혔다(위키백과 각주로 확인). 현재는 표준어처럼 널리 쓰이는 말이다."
caution = "특정 인물이나 저작물과 연결되지 않은 일반 신조어라 사용 부담이 적다. 대중문화 비평에서는 '딸바보' 아빠 이미지가 딸을 보호하고 소유할 대상으로 보는 가부장적 시선을 가린다는 비판이 있다. 2018년 미투 때는 예능 〈아빠를 부탁해〉의 '딸바보' 아빠들이 잇따라 고발되기도 했다. 그러니 딸을 '지켜야 할 공주'처럼 그리지 말고, 실존 '딸바보' 연예인이나 그 프로그램은 떠올리게 하지 않는다."
verified = "partial"
risk_checked = true
notes = "2010년 기사는 위키백과 각주로만 확인했고 원문은 열지 못했다. 최초 사용처는 미확인이다."
sources = ["https://ko.wikipedia.org/wiki/대한민국의_인터넷_신조어_목록"]
caution_sources = ["https://ebook-product.kyobobook.co.kr/dig/epd/sam/E000003155374"]

[[slang]]
name = "떡상 / 떡락"
aliases = ["떡상", "떡락"]
category = "인터넷·커뮤니티"
year = "2017~2018 (비트코인 열풍 때 확산)"
origin = "디시인사이드 비트코인 갤러리에서 쓰이기 시작해 인터넷 전반으로 퍼진 말이다. 2018년 한경 뉴스래빗은 비트코인 급등락 두 달 동안 이용자들이 '떡상과 떡락 사이에서 존버와 가즈아를 외쳤다'고 보도했다. 최초 게시글과 정확한 시점은 미확인."
meaning = "떡상은 급상승, 떡락은 급락을 뜻한다. 주가, 인기, 조회수, 기분 등 무엇이든 확 오르내릴 때 쓴다."
use_when = "인기·가격·기분이 갑자기 치솟거나 곤두박질치는 장면의 대사나 그래프 소품."
food_fit = "아주 좋음. 떡 캐릭터가 실제로 위로 솟구치는 '떡상' 말장난이 바로 된다. 가래떡 모양 주식 그래프도 가능."
fame = 5
fame_evidence = "경제 뉴스와 유튜브 제목에서도 쓰일 만큼 퍼져 폭등·폭락을 대신하는 말이 됐다(한경 뉴스래빗 2018 등)."
caution = "코인·주식 투자 권유처럼 보이지 않게 할 것. 실존 거래소·종목 로고는 쓰지 말 것. 코인·주식 리딩방 사기에서 '떡상'이 미끼 문구로 쓰인다는 경고가 있다. 그래서 '떡상 보장', 수익 인증 화면, 거래소 가입 유도처럼 보이는 장면은 넣지 않는다."
verified = "partial"
risk_checked = true
notes = "비트코인 갤러리 기원은 여러 출처가 일치하지만 정확한 최초 시점은 미확인. 사용자 요청대로 '신조어' 묶음으로 분류할 것."
sources = ["https://namu.moe/w/%EB%96%A1%EC%83%81", "https://www.hankyung.com/amp/201802139740G", "https://thewiki.kr/w/떡상", "https://www.bloomberg.com/news/articles/2018-08-20/bitcoiners-favorite-lingo-falls-by-the-wayside-as-prices-fizzle"]
caution_sources = ["https://www.lawtalk.co.kr/posts/141199", "https://www.khan.co.kr/article/202508102056005/"]

[[slang]]
name = "리즈 시절"
aliases = ["리즈", "리즈 갱신"]
category = "인터넷·커뮤니티"
year = "2000년대 중반 축구 커뮤니티에서 발생(정확한 연도 미확인), 일반어로 퍼진 시점 미확인(2019년 BBC 소개)"
origin = "위키백과에 따르면 다음 카페 '아이러브사커'에서 앨런 스미스의 리즈 유나이티드 시절을 두고 단 '리즈 시절 ㅎㄷㄷ' 댓글을 디시인사이드 이용자들이 비꼬면서 퍼졌다. 골닷컴(2019.6.20)은 이 말이 퍼디낸드·스미스가 박지성과 맨유에서 함께 뛰던 시기에 국내 축구팬 사이에서 생겼다고 보도했다."
meaning = "외모·인기·실력이 절정에 올라 가장 좋았던 시기, 곧 전성기를 이르는 말이다."
use_when = "과거 사진과 현재 모습을 비교하는 장면, 캐릭터가 '나도 한때는…' 하며 전성기를 회상하는 장면에 맞다."
food_fit = "갓 튀긴 바삭한 시절의 치킨이 눅눅해진 지금을 보며 '리즈 시절' 사진을 꺼내 보는 회상 컷으로 쓰기 좋다."
fame = 5
fame_evidence = "우리말샘에 '전성기'라는 뜻으로 표제어가 실려 있다. 골닷컴은 2019년 BBC가 각국의 독특한 축구 표현 8개 가운데 하나로 '리즈 시절'을 소개했다고 보도했다."
caution = "말 자체는 자유롭게 쓸 수 있으나 앨런 스미스 등 실존 선수의 사진이나 이름은 넣지 않는 편이 안전하다. 실존 연예인의 과거·현재 사진을 비교하는 패러디는 초상권 문제가 생길 수 있다."
verified = "partial"
risk_checked = true
notes = "골닷컴 기사를 보면 발생 시기는 스미스와 박지성이 함께 맨유에서 뛴 2005~2007년 무렵으로 좁혀지지만, 정확한 연도는 미확인이다. 2000년대에 생긴 말이라 2010년 이후 일반어로 퍼진 시점은 확인하지 못했다. 다만 2019년 BBC 소개와 우리말샘 등재로 지금도 널리 쓰인다는 점은 확인된다. 웹 검색 한도가 소진되어 추가 검색은 하지 못했다."
sources = ["https://ko.wikipedia.org/wiki/리즈_시절", "https://www.goal.com/kr/%EB%89%B4%EC%8A%A4/%E8%8B%B1-bbc-%ED%95%9C%EA%B5%AD%EC%9D%98-%EB%A6%AC%EC%A6%88-%EC%8B%9C%EC%A0%88-%EC%9C%A0%ED%96%89%EC%96%B4%EC%97%90-%EC%A3%BC%EB%AA%A9/q5yd8j6s5qab14dhdu92ozksl", "https://opendict.korean.go.kr/search/searchResult?query=%EB%A6%AC%EC%A6%88%20%EC%8B%9C%EC%A0%88"]

[[slang]]
name = "먹방"
aliases = ["mukbang", "먹는 방송", "먹방러"]
category = "인터넷·커뮤니티"
year = "2000년대 중후반 인터넷 방송, 2010년대 초 대중화, 2021 OED 등재"
origin = "'먹는 방송'의 줄임말. 한 논문은 2005년 나우콤 W플레이어(2006년 아프리카TV로 개편)에서 처음 등장했다고 보며, 2010년대 초 아프리카TV BJ들의 먹는 방송이 인기를 끌며 널리 퍼졌다. 이 말을 처음 쓴 BJ는 미확인(나무위키는 MC태현 설을 소개)."
meaning = "음식을 먹는 모습을 보여 주는 방송이나 영상, 또는 맛있게 많이 먹는 모습 자체를 말한다."
use_when = "한 캐릭터가 카메라 앞에서 음식을 잔뜩 먹는 장면, 또는 음식 캐릭터가 '먹방' 소리에 겁먹는 반전 개그."
food_fit = "아주 좋음. 음식 캐릭터 입장에서 '먹방 촬영'은 공포라는 반전 설정으로 쓰기 쉽다."
fame = 5
fame_evidence = "2021년 9월 옥스퍼드 영어사전에 'mukbang'으로 한국어 26개 단어와 함께 등재됐다."
caution = "실존 먹방 유튜버(쯔양, 히밥 등)의 얼굴·말투·채널 로고를 닮게 그리지 말 것. 2026년 9월 유튜브가 섭식장애·폭식 조장 기준으로 먹방 유튜버들의 수익 창출을 정지한 일이 보도됐다. 2024년에는 중국 먹방 스트리머가 생방송 도중 숨졌다. 폭식 과시, 체중 수치, '먹고 토하기'를 떠올리게 하는 연출은 피한다. 쯔양은 '먹토' 허위 제보 피해자로, 제보자가 2026년 2월 명예훼손으로 약식기소됐다. 따라서 실존 먹방러에 대한 루머를 패러디하지 않는다."
verified = "verified"
risk_checked = true
notes = "처음 쓴 사람은 미확인. 이전 메모처럼 일상 어휘가 됐지만, 사용자 요청대로 '신조어' 묶음으로 분류해 쓸 수 있다."
sources = ["https://namu.moe/w/%EB%A8%B9%EB%B0%A9", "https://www.koreascience.kr/article/JAKO202029462557773.page", "https://www.ytn.co.kr/_ln/0104_202109111010013838", "https://www.dailian.co.kr/news/view/1040348/", "https://www.khan.co.kr/article/201404181857565/amp"]
caution_sources = ["https://www.dailian.co.kr/news/view/1693738", "https://sbsstar.net/article/N1008485601/tzuyang-eatandvomit-claim-was-fake-college-classmate-fined-7-million-won-in-summary-indictment"]

[[slang]]
name = "빌런 (OO 빌런)"
aliases = ["OO 빌런", "빌런 등장", "국밥 빌런", "오피스 빌런"]
category = "인터넷·커뮤니티"
year = "미확인 (속어 뜻의 언론 용례는 2018년 9월이 가장 이르다)"
origin = "영어 villain(악당)에서 온 말이다. 중앙일보 기사(2018.9)는 네티즌들이 무언가에 지나치게 매달려 괴짜 같은 행동을 하는 사람을 빌런이라 부른다고 설명했다. 이후 '국밥 빌런'(2020), '오피스 빌런' 같은 합성어가 우리말샘에 올랐고, 국립국어원 새말모임은 2024년 6월 '악당'으로 다듬었다."
meaning = "남에게 민폐를 끼치거나 무언가에 지나치게 집착해 별난 행동을 하는 사람을 가리킨다. 'OO 빌런'처럼 앞에 집착 대상이나 장소를 붙여 쓴다."
use_when = "식당, 지하철, 회사에 민폐 캐릭터나 집착 캐릭터가 등장하는 컷에 '오늘의 빌런 등장' 식으로 쓴다."
food_fit = "우리말샘에 오른 '국밥 빌런'(모든 것을 국밥값으로 환산하는 사람)처럼 음식 이름이 그대로 수식어가 된다. 민트초코 빌런, 부먹 빌런처럼 음식 취향 갈등 소재와 잘 맞는다."
fame = 5
fame_evidence = "우리말샘에 '빌런', '국밥 빌런', '오피스 빌런'이 표제어로 올라 있고 2018~2021년 여러 언론 용례가 있다. 국립국어원이 2024년 순화어를 정할 만큼 일상어가 됐다."
caution = "'지하철 빌런'처럼 실존 일반인을 찍은 원본 게시물을 재현하면 초상권과 사생활 문제가 생길 수 있으므로 가상의 캐릭터로만 쓴다. 단어 자체에는 저작권이나 상표 문제가 없다. 하홍규의 논문 「정신장애와 공존의 사회학: '지하철 빌런'과 지하철 같이 타기」(횡단인문학 21호, 2025.10)는 '지하철 빌런'이라 불린 사건들에서 대중과 언론이 정신 문제가 있다고 여겨지는 사람에게 낙인을 찍는다고 비판했다. 그러니 이상 행동, 정신질환, 노인을 떠올리게 하는 인물은 '빌런'으로 그리지 않는다. 음식 캐릭터의 사소한 집착을 다루는 가벼운 용법(예: 국밥 빌런)에만 쓴다."
verified = "partial"
risk_checked = true
notes = "속어 뜻이 퍼진 시점을 중앙일보 2018년 9월 용례로 보강했다. 2017년 3월 용례는 영화 속 악당이라는 본래 뜻이다. 처음 쓰인 곳은 확인하지 못했다. 국밥 빌런과 2024년 순화어 정보를 더했다."
sources = ["https://en.wiktionary.org/wiki/빌런", "https://opendict.korean.go.kr/search/searchResult?focus_name_top=query&query=빌런", "https://opendict.korean.go.kr/dictionary/view?sense_no=1390249&viewType=confirm", "https://opendict.korean.go.kr/dictionary/view?sense_no=1525599&viewType=confirm"]
caution_sources = ["https://scholarworks.sookmyung.ac.kr/item/9a5ae95a-2f3d-4fff-a635-0c8ddc20effe"]

[[slang]]
name = "손발이 오그라든다 / 오글거리다"
aliases = ["오글오글", "오글거려", "손발 오그라듦"]
category = "인터넷·커뮤니티"
year = "2009년 이전부터 (2009년 연말 기사 등장, 2010년대에 일상어로 굳음)"
origin = "낯 뜨거운 장면을 보면 손발이 오그라든다는 표현에서 '오글오글', '오글거리다'가 나왔다. 2009년 12월 연합 기사는 '꽃보다 남자'의 '손발이 오그라드는 여러 장면'을 언급했다. 2013년 1월 숨피 기사는 '오글오글'을 그 줄임말로 소개했다. 디시인사이드 '방법' 할머니 짤에서 나왔다는 설은 미확인이다."
meaning = "말이나 행동이 지나치게 느끼하거나 유치해서 보는 사람이 민망해진다는 뜻이다."
use_when = "캐릭터가 느끼한 고백이나 자기애 넘치는 대사를 할 때 옆 캐릭터가 손발을 오그리는 리액션에 쓴다."
food_fit = "버터나 치즈처럼 '느끼한' 캐릭터가 대사를 하면, 구운 오징어처럼 몸이 말려 오그라드는 캐릭터로 시각적 말장난을 만들 수 있다."
fame = 5
fame_evidence = "2009년 연말 결산 기사와 2013년 영문 한국어 슬랭 해설 기사(숨피)에 실렸다. 지금은 일상어처럼 쓰인다."
caution = "일반 표현이라 부담이 적다. 원조로 거론되는 짤은 확인되지 않았으므로 짤은 패러디하지 말고 표현만 쓴다."
verified = "partial"
risk_checked = true
notes = "'방법' 할머니 짤 기원설은 확인하지 못했다. 2009년 기사에는 '오글'이라는 단어 없이 '손발이 오그라드는'만 나온다. 2010년 이전부터 쓰여 범위 경계에 있다. 다만 줄임말 '오글거리다'가 2010년대에 일상어로 굳어 지금도 쓰이므로 유지를 제안한다."
sources = ["https://www.jjan.kr/article/20091220337183", "https://www.soompi.com/article/468678wpp/do-you-know-your-korean-slang-part-1"]

[[slang]]
name = "심쿵"
aliases = ["심장이 쿵", "심쿵사", "심쿵주의"]
category = "인터넷·커뮤니티"
year = "2014 무렵 유행 (시작 시점 미확인)"
origin = "'심장이 쿵'의 줄임말로, 심장이 뛸 만큼 놀라거나 설레는 순간을 뜻한다. 처음 쓰인 곳과 시기는 미확인이며, 2014년에는 대표 신조어로 언론에 소개됐다."
meaning = "귀엽거나 멋진 것을 보고 심장이 쿵 내려앉을 만큼 설렌다는 뜻이다."
use_when = "캐릭터가 이상형이나 귀여운 것을 보고 가슴을 부여잡는 컷, 또는 하트가 튀어나오는 연출에 쓴다."
food_fit = "갓 나온 치즈가 쭉 늘어나는 모습에 다른 음식 캐릭터가 '심쿵'하며 쓰러지는 연출이 맞는다. 하트 모양 초콜릿이나 딸기 캐릭터와도 잘 어울린다."
fame = 5
fame_evidence = "아주경제는 2014년 12월 17일 기사에서 '각종 신조어가 인터넷과 SNS를 점령한 올해'라며 '심쿵'을 소개했다. 위키낱말사전에도 한국어 속어로 올라 있다."
caution = "특별한 저작권·인물 문제는 없다. 일반 단어라 상표로 등록된 상품명과 겹치지 않는지만 확인한다."
verified = "partial"
risk_checked = true
notes = "뜻과 2014년 유행은 확인했지만 시작된 곳과 시기는 확인하지 못했다. 아주경제 기사는 한국야쿠르트의 연말 부적 홍보 기사다."
sources = ["https://www.ajunews.com/view/20141217144431235", "https://ko.wiktionary.org/wiki/심쿵"]

[[slang]]
name = "썸 / 썸 탄다"
aliases = ["썸남", "썸녀", "썸 타다", "썸씽"]
category = "인터넷·커뮤니티"
year = "2014 (노래 '썸' 발매 2014년 2월 7일)"
origin = "정기고와 씨스타 소유가 부른 '썸'이 2014년 2월 7일 발매돼 2014년 가온 연간 디지털 차트 1위에 올랐다. 이 곡을 계기로 '썸 탄다'가 사귀기 전 애매한 호감 관계를 뜻하는 말로 널리 퍼졌다. 단어 자체가 처음 쓰인 시기는 미확인이다."
meaning = "연인 사이는 아니지만 서로 호감이 있어 아슬아슬한 관계를 뜻한다."
use_when = "두 캐릭터가 서로 눈치를 보며 설레는 컷, 또는 '우리 무슨 사이야?' 같은 애매한 관계를 다룰 때 쓴다."
food_fit = "치킨과 맥주, 떡볶이와 순대처럼 늘 같이 다니는 음식 짝꿍이 '우리 썸 타는 거야?'라고 묻는 연출이 자연스럽다."
fame = 5
fame_evidence = "매일신문 2014년 유행어 결산(2014.12.11)에서 노래 '썸' 때문에 '썸 탄다'가 유행했다고 소개했다. 아주경제 2014년 12월 기사도 그해 신조어로 '썸'을 꼽았다."
caution = "노래 가사나 음원을 그대로 쓰면 저작권 문제가 생긴다. '썸 탄다'라는 말만 쓰고 실존 가수의 모습은 그리지 않는다. 소유는 2025년 10월 델타항공 기내 인종차별 주장과 이에 맞선 만취 목격담으로 공방이 있었고, 소유는 루머에 법적 대응하겠다고 밝혔다. 진위가 확인되지 않은 사안이므로 소유를 떠올리게 하거나 기내·음주 상황과 엮는 연출은 하지 않는다."
verified = "verified"
risk_checked = true
notes = "노래 발매일(2014년 2월 7일)과 가온 연간 1위 기록을 보완했다. '썸'이라는 단어가 노래 이전부터 쓰였는지와 그 시점은 미확인이다."
sources = ["https://www.imaeil.com/page/view/2014121107075920342", "https://www.ajunews.com/view/20141217144431235", "https://ko.wikipedia.org/wiki/썸_(노래)"]
caution_sources = ["https://www.heraldk.com/article/2025102002342129069", "https://www.hankyung.com/article/2025110170897"]

[[slang]]
name = "아무 말 대잔치"
aliases = ["아무말"]
category = "인터넷·커뮤니티"
year = "미확인 (2017년 기사에 트위터발 신조어로 소개, 2016~2017년경 유행 추정)"
origin = "아시아경제 2017년 6월 16일 신조어사전 기사는 이 말이 트위터에서 시작된 신조어라고 설명한다. 처음 쓴 사람과 정확한 시기는 미확인이다."
meaning = "주변 상황이나 맥락을 생각하지 않고 생각나는 대로 말을 쏟아내는 것, 또는 당황해서 횡설수설하는 것을 뜻한다."
use_when = "당황한 캐릭터가 변명을 늘어놓는 장면이나, 여럿이 모여 맥락 없는 말을 주고받는 혼돈의 컷에 맞다."
food_fit = "몰래 먹다 들킨 떡볶이 캐릭터가 아무 말을 쏟아내며 변명하거나, 회식 테이블 위 음식들이 취해서 아무말 대잔치를 벌이는 장면으로 쓸 수 있다."
fame = 5
fame_evidence = "위키백과 신조어 목록에 실려 있고, 2017년 주요 경제지가 신조어사전 기사로 다뤘다."
caution = "일반화된 표현이라 저작권이나 상표 문제는 거의 없다. 실존 인물의 실제 발언을 '아무말'로 조롱하는 식으로는 쓰지 않는다."
verified = "partial"
risk_checked = true
notes = "카테고리 '신조어'를 '인터넷·커뮤니티'로 바꿨다. 아시아경제(2017.6.16)는 트위터에서 나온 말이라고 설명한다. 위키백과가 인용한 경남일보 기사는 제목이 이 말과 관련이 없다. 최초 사용자와 시기는 미확인이다."
sources = ["https://ko.wikipedia.org/wiki/대한민국의_인터넷_신조어_목록", "http://view.asiae.co.kr/news/view.htm?idxno=2017061608300220839"]

[[slang]]
name = "어장관리"
aliases = ["어장관리 당하다", "어장 속 물고기"]
category = "인터넷·커뮤니티"
year = "미확인 (언론 용례는 2010년 8월이 가장 이르고, 그 이전에 생겼을 가능성이 있다)"
origin = "물고기를 기르는 어장(漁場) 관리에 빗대어, 사귀는 것처럼 굴면서 여러 이성을 동시에 붙잡아 두는 행동을 이르는 말이다. 처음 쓴 사람과 시점은 미확인이며, 우리말샘 용례는 스포츠경향(2010.8), 뉴스엔(2011.2), 파이낸셜뉴스(2020.6) 기사다."
meaning = "연인도 친구도 아닌 애매한 상태로 여러 사람을 동시에 붙잡아 두는 행동이다. 당하는 쪽은 스스로를 '어장 속 물고기'라고 자조한다."
use_when = "썸이나 연애 에피소드에서 한 캐릭터가 여러 상대에게 애매하게 연락할 때, 기대했다가 실망한 캐릭터가 자조할 때 쓴다."
food_fit = "생선이나 해산물 캐릭터를 횟집 수조나 어장에 넣는 비주얼 말장난이 자연스럽다. 수조 속 물고기 캐릭터가 '나 어장 속 물고기였네'라고 깨닫는 컷이 가능하다."
fame = 5
fame_evidence = "우리말샘에 비유적 뜻이 실려 있고 2010년부터 2020년까지 언론 용례가 이어진다. 같은 제목의 대중가요(브로맨스, 2016)도 나와 2010년 이후에도 널리 쓰였음을 보여 준다."
caution = "'어장녀', '어장남'처럼 성별을 묶어 비난하면 젠더 갈등 소재로 번질 수 있으므로 피한다. 실존 인물을 지목하지 않는다."
verified = "partial"
risk_checked = true
notes = "뜻과 2010~2020년 언론 용례를 우리말샘으로 확인했다. 2010년 이전에 생겼는지는 확인하지 못했지만, 2010년 이후에도 널리 쓰여 범위 조건은 충족한다고 판단했다. 한국어 위키백과 '어장관리' 문서는 말뜻이 아니라 브로맨스의 2016년 싱글을 다룬다."
sources = ["https://en.wiktionary.org/wiki/어장관리", "https://opendict.korean.go.kr/search/searchResult?focus_name_top=query&query=어장관리", "https://opendict.korean.go.kr/dictionary/view?sense_no=770614&viewType=confirm", "https://ko.wikipedia.org/wiki/어장관리"]

[[slang]]
name = "웃프다"
aliases = ["웃픈", "웃퍼"]
category = "인터넷·커뮤니티"
year = "미확인 (우리말샘 신문 용례로 2016년 9월 이전부터 쓰인 것은 확인)"
origin = "'웃기다(우습다)'와 '슬프다'를 합친 인터넷 신조어로, 우리말샘에는 형용사로 올라 있다. 처음 쓴 곳과 시기는 미확인이다."
meaning = "겉으로는 우습지만 실제 처지는 좋지 않아 슬픈 상황을 이르는 말이다."
use_when = "웃긴 상황이 마지막 컷에서 짠한 현실로 뒤집히는 자조형 결말에 쓴다. 웃으면서 눈물 흘리는 표정과 함께 자막으로 넣기 좋다."
food_fit = "녹아내리는 아이스크림이나 불어 터진 라면 캐릭터가 웃으면서 우는 표정으로 쓰기 좋다. 할인 스티커가 붙은 마감 떨이 도시락의 독백에도 맞는다."
fame = 5
fame_evidence = "우리말샘에 형용사로 실려 있고, 매일경제와 스포츠한국(둘 다 2016년 9월) 기사 용례가 있다. 일반 기사와 일상 대화에서도 널리 쓰인다."
caution = "특별한 초상권이나 상표 문제는 없다. 다만 실제 사고나 피해 사례에 '웃프다'를 붙이면 조롱으로 읽힐 수 있으니 피한다."
verified = "partial"
risk_checked = true
notes = "카테고리 '채팅 유행어(반응어)'는 '인터넷·커뮤니티'로 바꿨다. 뜻과 사전 등재는 확인했지만 최초 사용처와 연도는 확인하지 못했다(검색 한도 소진, 나무위키 접근 불가)."
sources = ["https://opendict.korean.go.kr/search/searchResult?query=웃프다", "https://opendict.korean.go.kr/dictionary/view?sense_no=1368160"]

[[slang]]
name = "이불킥"
aliases = ["이불킥 각", "자다가 이불킥", "이불킥 방지"]
category = "인터넷·커뮤니티"
year = "2014 무렵 유행 (시작 시점 미확인)"
origin = "창피한 기억이 떠올라 누운 채 이불을 걷어차는 행동을 가리키는 말이다. 시작된 곳과 시기는 미확인이며, 2014년에는 방탄소년단 1집 수록곡 제목(2014년 8월)과 기업 홍보 문구로 쓰일 만큼 대중화돼 있었다."
meaning = "과거의 흑역사나 실수가 떠올라 부끄러워 몸부림치는 상황을 뜻한다."
use_when = "밤에 누워 낮의 실수를 떠올리고 이불을 걷어차는 마지막 컷, 또는 술자리 다음 날 후회하는 장면에 쓴다."
food_fit = "김밥이나 부리토, 롤케이크 캐릭터가 김·또띠아·시트를 이불처럼 덮고 발을 차는 연출이 잘 맞는다. 이불 속 만두소 캐릭터가 몸부림치는 장면도 된다."
fame = 5
fame_evidence = "방탄소년단 정규 1집 'DARK&WILD'(2014.8.20)에 '이불킥'이라는 곡이 실렸다. 2014년 12월 한국야쿠르트 연말 부적에도 '이불킥 방지' 문구가 쓰였다."
caution = "특별한 저작권·인물 문제는 없다. 같은 제목의 노래 가사나 음원은 쓰지 않는다."
verified = "partial"
risk_checked = true
notes = "부적을 낸 회사는 한국야쿠르트(쿠퍼스 '간쿵방지' 부적)다. 방탄소년단 수록곡을 근거로 추가했다. 시작된 곳과 시기는 확인하지 못했다."
sources = ["https://www.ajunews.com/view/20141217144431235", "https://ko.wikipedia.org/wiki/이불킥"]

[[slang]]
name = "인싸 / 아싸 / 핵인싸"
aliases = ["인싸템", "자발적 아싸", "인싸력"]
category = "인터넷·커뮤니티"
year = "2000년대 대학가·커뮤니티, 2017~2018 대중화"
origin = "'아싸'(아웃사이더)는 2000년대 대학가와 디시인사이드에서 먼저 쓰였고, 그 반대말로 '인싸'(인사이더)가 생겼다. 2017년 전후 널리 퍼졌고, 2018년 카카오톡 투표 '자주 사용한 신조어' 3위(18%)였다. 최초 사용처는 미확인."
meaning = "인싸는 무리에 잘 어울리고 유행에 밝은 사람, 아싸는 무리 밖에서 혼자 지내는 사람, 핵인싸는 인싸 중의 인싸다."
use_when = "유행 음식을 든 캐릭터를 '핵인싸'로, 구석에서 혼자 노는 캐릭터를 '자발적 아싸'로 그릴 때."
food_fit = "좋음. 유행 디저트 캐릭터는 핵인싸, 아무도 안 찾는 반찬 캐릭터는 아싸 같은 식으로 대비시키기 쉽다."
fame = 5
fame_evidence = "카카오 2018 투표 3위, 2018 스포츠경향 신조어 목록에 '핵인싸' 수록, 매일신문은 2019년 '전 세대에 걸쳐 확산'이라고 보도했다."
caution = "아싸를 조롱하는 쪽보다는 자기 비하나 귀여운 대비로 쓰는 편이 안전하다. 특정 실존 인물을 아싸로 지목하지 말 것."
verified = "partial"
risk_checked = true
notes = "인싸가 2018년 '1위'였다는 근거는 없고 카카오 투표 3위였다. 최초 사용처는 미확인. 사용자 요청대로 '신조어' 묶음으로 분류할 것."
sources = ["https://namu.moe/w/%EC%9D%B8%EC%8B%B8", "https://www.kakaocorp.com/page/detail/8639", "https://www.imaeil.com/page/view/2019022113212039535", "https://sports.khan.co.kr/article/201812281745003"]

[[slang]]
name = "읽씹"
aliases = ["읽고 씹기", "카톡 1 안 없어짐", "안읽씹"]
category = "인터넷·커뮤니티"
year = "미확인 (카카오톡 확산 이후 2010년대, 2015년 기사에 사용)"
origin = "메시지를 읽고도 답하지 않는 '읽고 씹기'의 줄임말이다. 카카오톡은 상대가 읽으면 숫자 '1'이 사라져 읽었는지가 드러나고, 이 기능 때문에 널리 쓰였다. 처음 쓰인 시점은 미확인이다."
meaning = "메시지를 확인하고도 일부러 답장하지 않는 것을 뜻한다. '안읽씹'은 읽지도 않고 무시하는 것이다."
use_when = "고백이나 부탁 메시지를 보냈는데 '1'은 사라지고 답이 없어 애태우는 장면에 쓴다."
food_fit = "냉장고 문을 열어 보고도 안 꺼내 먹고 닫아 버리자 반찬 캐릭터가 '나 읽씹당했어'라고 하는 장면을 만들 수 있다. 단톡방 메뉴 투표에서 읽씹당하는 장면에도 쓴다."
fame = 5
fame_evidence = "마리끌레르 코리아(2015.10.7) 기사 소제목에 '대꾸 없는 읽씹'으로 쓰였다. 2026년 6월 갱신된 카카오톡 문화 안내 글(seoulstart)도 읽씹과 안읽씹을 설명한다."
caution = "카카오톡의 화면 디자인과 로고는 상표·디자인 권리 대상이다. 그대로 따라 그리지 말고 일반 말풍선과 숫자 '1' 정도로 바꿔 그린다."
verified = "partial"
risk_checked = true
notes = "seoulstart는 외국인 독자용 안내 사이트이며 2026년 6월 갱신으로 표기돼 있다. 용어가 처음 쓰인 시점은 확인하지 못했다."
sources = ["https://www.marieclairekorea.com/culture/lifestyle/2015/10/%EC%9D%B4%EB%B3%84-%EC%95%85%EB%8B%B4", "https://seoulstart.com/guides/kakaotalk-culture"]

[[slang]]
name = "존맛탱 (JMT)"
aliases = ["존맛", "JMT", "JMTGR(존맛탱구리)"]
category = "인터넷·커뮤니티"
year = "2000년대 중반 '존맛' 추정, 2018 전후 JMT로 대중화"
origin = "'존나 맛있다'를 줄인 '존맛'에 '탱'을 붙인 말이고, JMT는 그 초성을 로마자로 쓴 순화형이다. 2018년 10월 알바몬 20대 설문에서 '존맛·존맛탱·JMT'가 46.6%로 가장 많이 쓰는 신조어 1위였다. 최초 사용처는 미확인."
meaning = "아주 맛있다는 감탄사다."
use_when = "한 입 먹고 눈이 번쩍 뜨이는 리액션 컷의 대사로 쓴다."
food_fit = "아주 좋음. 음식 만화 리액션 대사로 가장 자연스럽다. 음식 캐릭터가 자기 자신을 'JMT'라고 자랑하는 식으로도 쓸 수 있다."
fame = 5
fame_evidence = "2018 알바몬 설문 1위(46.6%), 2018 스포츠경향 신조어 목록에 수록, 2019년 팔도 비빔면 광고 해시태그에도 쓰였다."
caution = "어원이 비속어('존나')라서 '존맛'보다 'JMT'나 '존맛탱'이 무난하다. 실존 상호 'JMT' 등과 혼동될 로고 디자인은 피할 것. 2023년 일본에서 '개존맛 김치'라는 상품명이 비속어라는 비판을 받았다. 제조사는 사과하고 이름을 바꾸겠다고 밝혔다. 2024년에는 해외 식당의 '존맛탱' 간판을 두고 우려가 보도됐다. 따라서 대사로만 가볍게 쓰고, 캐릭터 이름·상품명·제목 문구로는 쓰지 않는다. '개존맛'처럼 비속어가 더 센 변형도 피한다."
verified = "partial"
risk_checked = true
notes = "최초 등장 시점과 출처는 미확인. 이전 메모의 '밈으로 인식되지 않음'과 달리, 만화 대사용 신조어로는 쓸모가 크다. 사용자 요청대로 '신조어' 묶음으로 분류할 것."
sources = ["https://namu.moe/w/%EC%A1%B4%EB%A7%9B", "https://sports.khan.co.kr/article/201812281745003", "https://thewiki.kr/w/JMT", "https://www.koreadaily.com/article/20240723122507325"]
caution_sources = ["https://www.asiae.co.kr/en/article/2024101113443159332"]

[[slang]]
name = "존버"
aliases = ["존버 정신", "존버는 승리한다", "존버족"]
category = "인터넷·커뮤니티"
year = "미확인 (밈 유행 2017~2018)"
origin = "'X나 버틴다'의 줄임말로, 2017년 말 가상화폐 열풍 때 값이 떨어져도 팔지 않고 버티는 심리를 가리키며 널리 퍼졌다. 처음 쓰인 곳은 미확인이며, 위키백과는 '존나 버로우'에서 시작된 말이라고 적었으나 출처가 없다."
meaning = "상황이 나빠도 포기하지 않고 끝까지 버틴다는 뜻이다."
use_when = "힘든 상황(야근, 시험, 줄서기, 손해)을 꿋꿋이 버티는 장면이나 끝까지 버텨 결국 이기는 반전 장면에 맞는다."
food_fit = "냉장고 구석에서 끝까지 버티는 마지막 김치, 녹지 않으려 버티는 아이스크림, 가격 폭락에도 팔리기를 기다리는 과일 캐릭터에게 쓸 수 있다."
fame = 5
fame_evidence = "파이낸셜뉴스(2017.12.22)가 '존버'를 해외 'HODL'에 해당하는 국내 가상화폐 은어로 소개했다. 위키백과는 2010년대 말 유행어가 되었다고 적었다."
caution = "어원에 비속어('존나')가 들어 있어 계정 성격에 따라 순화해서 표기할지 고려해야 한다. 가상화폐나 주식 투자를 권하는 것처럼 보이지 않게 해야 한다. '존버 정신'은 이외수 작가(2022년 별세)가 대중화한 말로 알려져 있고, 장남은 그를 '존버의 창시자'라고 불렀다. 이외수는 2013년 혼외자 양육비 소송(같은 해 조정으로 종결)으로 논란을 겪었으므로 작가의 이름이나 어록 인용 형태로 쓰지 않는다. 위키류 자료는 스타크래프트 은어 '존나 버로우'를 어원으로 설명한다(검증된 출처는 아님)."
verified = "partial"
risk_checked = true
notes = "파이낸셜뉴스 기사 날짜는 2017.12.22 12:00로 표시된다. 위키백과가 제시한 '존나 버로우' 어원은 출처가 없어 확인하지 못했다. 작가 이외수의 '존버 정신' 관련 내용은 이번 조사에서 확인하지 못했다."
sources = ["https://www.fnnews.com/news/201712211600425225", "https://ko.wikipedia.org/wiki/존버"]
caution_sources = ["https://nocutnews.co.kr/news/5746448", "https://www.etoday.co.kr/news/view/555335", "https://view.asiae.co.kr/article/2013050609004519388", "https://thewiki.kr/w/존버"]

[[slang]]
name = "주작"
aliases = ["주작하다", "주작 아님", "주작 의심", "주작러"]
category = "인터넷·커뮤니티"
year = "미확인"
origin = "'없는 사실을 꾸며 만듦'이라는 뜻의 한자어 주작(做作)이 인터넷에서 조작·연출을 뜻하는 말로 널리 쓰이게 되었다. 처음 쓰인 커뮤니티와 시기는 미확인이다."
meaning = "사진, 영상, 사연, 후기 따위가 꾸며낸 가짜라고 의심하거나 비꼴 때 쓰는 말이다."
use_when = "너무 완벽하거나 믿기 힘든 장면을 보고 캐릭터가 의심하는 컷, 또는 연출이 들통나는 반전 컷에 쓴다."
food_fit = "광고 사진 속 햄버거와 실물 햄버거를 나란히 놓고 '이거 주작 아님?'이라고 하거나, 리뷰 별점을 몰래 조작하다 걸린 음식 캐릭터를 그리면 된다."
fame = 5
fame_evidence = "표준 뜻풀이 외에 우리말샘에 '주작러(做作←er): 없는 사실을 꾸며 만드는 사람', '주작되다' 같은 파생어가 따로 올라 있어 일상어로 자리 잡았음을 보여준다."
caution = "실존 방송, 유튜버, 업체를 주작이라고 지목하면 명예훼손 소지가 있어 가상의 상황에만 쓴다."
verified = "partial"
risk_checked = true
notes = "위키낱말사전에는 인터넷 은어 용법이 실려 있지 않고, 주작(朱雀)과 주작(做作) 두 뜻만 있다. 은어 용법의 근거는 우리말샘의 '주작러' 항목으로 바꾸었다. 기원 시기와 처음 쓰인 곳은 여전히 미확인이며 2010년 이후 범위인지도 확정하지 못했다."
sources = ["https://ko.wiktionary.org/wiki/주작", "https://opendict.korean.go.kr/search/searchResult?query=주작"]

[[slang]]
name = "중2병"
aliases = ["중이병", "흑염룡", "허세병", "흑역사", "흑역사 생성", "흑역사 소환", "백역사(반의어)"]
category = "인터넷·커뮤니티"
year = "일본 기원 1999, 국내 인터넷 유행 2011년 이전부터 (정확한 시점 미확인)"
origin = "1999년 일본 라디오 '이주인 히카루의 심야의 엄청난 힘'에서 진행자가 자신이 아직 중2병이라고 말한 데서 유래했다. 이후 한국 인터넷에 들어와 2011년 무렵에는 교육 칼럼에서도 다룰 만큼 퍼져 있었다. 유입 경로와 정확한 시기는 미확인이다."
meaning = "자신이 남과 다르고 특별하다고 착각해 허세를 부리는 사춘기식 행동을 가리킨다. '흑염룡이 날뛴다' 같은 오글거리는 대사가 대표적이다."
use_when = "캐릭터가 갑자기 어둠의 힘, 봉인된 능력 같은 과장된 대사를 하거나 혼자 멋있는 척하다 민망해지는 컷에 쓴다."
food_fit = "매운 고추나 흑마늘 캐릭터가 '내 안의 흑염룡이…'라며 붕대 감은 팔을 붙잡는 연출이 맞는다. 탄 음식 캐릭터가 '어둠에 물든 자'라고 허세를 부리는 장면도 된다."
fame = 5
fame_evidence = "2011년 교육신문 칼럼과 2013년 레이디경향 특집에서 이미 대중적인 인터넷 속어로 소개됐다. 20~30대 대부분이 아는 말이다."
caution = "사춘기 청소년을 비하하는 말로 쓰일 수 있으므로 특정 연령이나 실존 인물을 겨냥하지 않는다. 캐릭터의 자기 허세를 스스로 웃음거리로 삼는 식으로만 쓴다."
verified = "partial"
risk_checked = true
notes = "한교 기사는 2011년 11월 1일자 칼럼이고, 서울시교육감 발언은 기사에 없어 확인하지 못했다. '2011년 무렵 방송 뒤 유행'이라는 계기도 미확인이다. 레이디경향 기사 입력일은 2013년 7월 1일이다. 원작 방영 연도(1999년)는 위키백과 본문에 없고 일반 지식에 근거했다. 한국 유행 시점은 미확인이며, 2010년 이전부터 쓰였을 가능성이 있다."
sources = ["https://ko.wikipedia.org/wiki/중2병", "https://lady.khan.co.kr/education/article/201307081538511", "https://hangyo.com/mobile/article.html?no=76472", "https://ko.wikipedia.org/wiki/흑역사"]

[[slang]]
name = "찐"
aliases = ["찐이다", "찐친", "찐팬"]
category = "인터넷·커뮤니티"
year = "2019년 무렵 (2020년 1월 신조어 정리에 수록, 최초 시점 미확인)"
origin = "'진짜'를 강하게 발음한 말로, 매일신문 2020년 1월 20일 기사가 '진짜'라는 뜻의 초급 신조어로 소개했다. 처음 쓰인 곳과 사람은 미확인이다."
meaning = "진짜, 진정한이라는 뜻이다. '찐친', '찐팬'처럼 명사 앞에 붙여 쓴다."
use_when = "맛집이나 음식이 진짜 맛있다고 감탄하는 컷, 진짜 친구나 진짜 팬을 가리키는 컷에 맞는다."
food_fit = "찐빵, 찐감자, 찐만두 캐릭터가 '나 찐이야'라고 말하는 말장난으로 쓰기 좋다. 기사 예문도 '이 맛집이 찐이다'이다."
fame = 5
fame_evidence = "매일신문 2020년 1월 신조어 기사의 초급 항목 4개 가운데 첫 번째로 실렸다(예문 '이 맛집이 찐이다')."
