origin = "'할 말은 많지만 하지 않겠다'를 줄인 말이다. 처음 쓴 곳과 시기는 미확인이며, 우리말샘에는 2016년부터 2019년까지의 방송·신문 용례가 실려 있다."
meaning = "불만이나 하고 싶은 말이 많지만 꾹 참고 넘어가겠다는 뜻의 반응어다."
use_when = "어이없는 상황을 겪고도 말없이 참는 컷, 또는 마지막 컷에서 굳은 표정으로 넘어가는 결말에 쓴다."
food_fit = "입을 꾹 다문 만두나 김밥처럼 말린 캐릭터가 할많하않 표정을 짓는 연출이 잘 맞는다. 부먹 찍먹 논쟁에서 한쪽이 참고 넘어가는 장면에도 쓸 수 있다."
fame = 4
fame_evidence = "우리말샘에 실려 있고, KTV국민방송(2016년 6월), 더팩트(2017년 1월), 주간동아(2019년 9월) 용례가 있다."
caution = "특별한 초상권이나 상표 문제는 없다. 실제 인물이나 사건에 대한 불만을 암시하는 데 쓰지 않는다."
verified = "partial"
risk_checked = true
notes = "카테고리 '채팅 유행어(줄임말)'는 '인터넷·커뮤니티'로 바꿨다. 뜻과 용례 연도는 확인했지만 최초 사용처는 확인하지 못했다."
sources = ["https://opendict.korean.go.kr/search/searchResult?query=할많하않", "https://opendict.korean.go.kr/dictionary/view?sense_no=1368071"]

[[slang]]
name = "홍대병"
aliases = ["홍대병 걸렸다", "힙스터병"]
category = "인터넷·커뮤니티"
year = "미확인 (영어 위키낱말사전은 2016년부터로 기재, 2018년 기사에서 신조어로 소개)"
origin = "인디 문화의 상징인 지명 '홍대'에 '병(病)'을 붙여, 남들이 모르는 것만 즐기는 척하는 한국형 힙스터를 비꼬는 신조어다. 서울신문 나우뉴스 2018년 5월 29일 칼럼이 이렇게 설명했으나, 최초 사용처는 미확인이다."
meaning = "남들이 잘 모르는 것을 나만 안다는 자부심, 대중화되면 흥미를 잃는 태도를 뜻한다. 맛집이 방송에 나오면 단골이 발길을 끊는 행동이 대표적 예로 거론된다."
use_when = "나만 알던 가게나 음악이 유명해지자 실망하는 장면, 일부러 비주류 메뉴만 고르는 캐릭터를 묘사할 때 어울린다."
food_fit = "단골 맛집이 방송을 타자 '이제 안 간다'고 돌아서는 음식 캐릭터, 아무도 모르는 마이너 메뉴만 찾는 캐릭터로 자연스럽게 쓸 수 있다."
fame = 4
fame_evidence = "위키백과 '대한민국의 인터넷 신조어' 문서에 서울신문 나우뉴스 2018.5.29 기사를 근거로 실려 있다. 영어 위키낱말사전에도 올라 있다."
caution = "실존 대학인 홍익대학교와 홍대 상권 이름이 들어가므로 학교나 지역을 비하하는 연출은 피한다. 특정 취향을 조롱하기보다 가볍게 자조하는 톤이 안전하다."
verified = "partial"
risk_checked = true
notes = "위키백과 각주 기사는 서울신문 나우뉴스 '[김현회의 러시아 워] 홍대병과 문선민병'(2018.5.29)이다. 영어 위키낱말사전의 '2016년부터'에는 인용 근거가 없다. 분류는 '신조어'에서 '인터넷·커뮤니티'로 바꿨다."
sources = ["https://ko.wikipedia.org/wiki/대한민국의_인터넷_신조어", "https://nownews.seoul.co.kr/news/newsView.php?id=20180529601004", "https://en.wiktionary.org/wiki/홍대병"]

[[slang]]
name = "화질구지"
aliases = ["제목.hwajilguji"]
category = "인터넷·커뮤니티"
