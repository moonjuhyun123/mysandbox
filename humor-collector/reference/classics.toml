origin = "축구·야구 등 스포츠 온라인 커뮤니티에서 응원 팀의 부진을 사실로 비꼬는 말로 시작되어 2016년 무렵 온라인 전반에 놀이처럼 퍼졌다(아시아경제 2016.10.3). 팩력배, 팩트폭격 같은 파생어도 생겼다."
meaning = "상대가 감추고 싶은 사실을 그대로 지적해 말문을 막는 것을 뜻한다. 돌직구와 비슷하다."
use_when = "한 캐릭터가 핑계를 대자 다른 캐릭터가 사실만으로 반박해 쓰러뜨리는 장면, 거울이나 영수증 같은 '증거'가 등장하는 장면에 맞는다."
food_fit = "'오늘만 먹을 거야'라는 캐릭터에게 영양성분표가 '이번 주 다섯 번째'라고 팩폭하거나, 라면이 '너 사실 물 조절 실패했지'라고 지적하는 장면에 쓸 수 있다."
fame = 5
fame_evidence = "아시아경제(2016.10.3, 다음 뉴스 게재)가 '팩력배'가 온라인에 퍼지는 현상을 다뤘고, 헬스장 광고 문구로도 쓰였다고 전했다."
caution = "외모·체형·학력처럼 실제 사람의 약점을 겨냥하면 언어폭력이나 비하로 읽힐 수 있다. 칼로리·체중 팩폭은 외모 비하로 흐르지 않게 다뤄야 한다."
verified = "verified"
risk_checked = true
notes = "출처 기사는 다음 뉴스에 실린 아시아경제(부애리 기자, 2016.10.3) 기사다. 기사는 '해외축구 갤러리'가 아니라 '축구, 야구 등 스포츠 온라인커뮤니티'에서 시작했다고 적었다. 특정 갤러리 기원설은 미확인이다."
sources = ["https://v.daum.net/v/ilAMTk1F9l"]

[[slang]]
name = "현타"
aliases = ["현실 자각 타임", "현타 온다"]
category = "인터넷·커뮤니티"
year = "미확인"
origin = "'현실 자각 타임'의 줄임말로, 헛된 꿈이나 망상에 빠져 있다가 실제 처지를 깨닫고 무기력함과 허무함을 느끼는 순간을 뜻한다. 국립국어원 우리말샘에 명사로 올라 있으며, 최초 사용처와 시기는 미확인이다."
meaning = "들떠 있다가 갑자기 현실을 깨닫고 허무해지는 순간을 이르는 말이다."
use_when = "한껏 꾸민 뒤 거울을 보는 순간, 쇼핑 후 카드 명세서를 확인하는 순간, 다이어트 중 야식을 다 먹고 난 직후에 쓴다."
food_fit = "다이어트를 결심한 캐릭터가 치킨을 다 먹고 빈 상자 앞에서 현타가 오는 장면이나, 공들여 장식한 케이크가 무너지는 순간에 쓸 수 있다."
fame = 5
fame_evidence = "우리말샘에 명사로 등재되어 있다(뜻풀이 1개, 전문가 감수 1건). 일상 사용 빈도를 보여 주는 출처는 확인하지 못했다."
caution = "특별한 위험은 적다. 일반 어휘이므로 저작권이나 초상권 문제가 없다."
verified = "partial"
risk_checked = true
notes = "우리말샘 페이지에 등재일과 신어 여부가 표시되지 않아 미확인이다. '단톡방에서 흔히 쓰인다'는 내용은 출처로 확인되지 않은 판단이며, 2010년 이후 유행 여부도 검색 한도가 소진되어 확인하지 못했다."
sources = ["https://opendict.korean.go.kr/search/searchResult?query=현타"]

[[slang]]
name = "혜자 vs 창렬"
aliases = ["혜자스럽다", "창렬하다", "혜자", "창렬", "가성비 갑"]
category = "인터넷·커뮤니티"
year = "2009~2010"
origin = "배우 김혜자가 2010년 10월 GS25와 낸 '김혜자 도시락'이 가성비가 좋다는 평을 받으며 '혜자'가 됐다. '창렬'은 2009년 편의점 즉석식품 '김창렬의 포장마차'의 낮은 가성비를 조롱하면서 쓰이기 시작했다(위키백과)."
meaning = "혜자는 값에 비해 알찬 것, 창렬은 겉보기나 값에 비해 부실한 것을 뜻한다."
use_when = "양 많은 도시락과 질소 과자를 비교하는 컷, 가성비 평가 대사."
food_fit = "반찬이 꽉 찬 도시락 캐릭터가 '혜자'라고 칭송받고, 바람만 든 과자 봉지 캐릭터와 대비된다."
fame = 5
fame_evidence = "위키낱말사전에 2010년부터 쓰인 속어로 올라 있고, 위키백과 신조어 목록에도 실려 있다. 15년 넘게 상품 리뷰에서 일상어로 쓰인다."
caution = "두 말 모두 실존 연예인 이름에서 왔다. 위키백과에는 김창렬이 이미지 타격을 이유로 업체를 고소했고 이 은어 때문에 활동명도 바꿨다고 나온다. '창렬'은 쓰지 말고 '혜자'나 '가성비 갑' 위주로 쓰는 것을 권한다."
verified = "verified"
risk_checked = true
notes = "도시락 출시는 2010년 10월로 확인됐다(위키백과 김혜자). 위키백과에 따르면 '창렬'은 원래 1990년대 학생 비속어에서 나왔고, 2009년 제품 출시 뒤 가성비 조롱의 뜻으로 바뀌었다."
sources = ["https://en.wiktionary.org/wiki/혜자", "https://ko.wikipedia.org/wiki/대한민국의_인터넷_신조어_목록", "https://ko.wikipedia.org/wiki/김혜자", "https://ko.wikipedia.org/wiki/김창렬"]

[[slang]]
name = "OO 갑(甲)"
aliases = ["갑(甲)", "~갑", "가성비 갑"]
category = "인터넷·커뮤니티"
year = "2011년 이전 (2011년 3월 24일 전자신문 소개, 최초 사용 시점 미확인)"
origin = "위키백과에 따르면 KIA 타이거즈 팬이 '神'을 '申'으로 잘못 쓴 팻말 사진을 누군가 '甲'으로 읽고 댓글을 단 데서 퍼졌다. 사진이 찍힌 시기·장소와 처음 댓글을 쓴 사이트는 미확인이다."
meaning = "어떤 분야에서 으뜸인 사람·사물·현상을 가리키며, '종결자'와 비슷하게 쓰인다. '가성비 갑'처럼 명사 뒤에 붙여 칭찬할 때 쓴다."
use_when = "한 캐릭터가 압도적으로 뛰어나다고 치켜세우는 장면, 순위를 매기는 장면, 리뷰나 평가를 하는 장면에 맞는다."
food_fit = "'가성비 갑', '바삭함 갑' 같은 팻말을 든 음식 캐릭터나 리뷰 별점 패러디로 쓰기 좋다."
