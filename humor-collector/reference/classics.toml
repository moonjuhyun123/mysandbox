origin = "SBS '런닝맨'(2010~2021.6.13 출연)에서 이광수에게 붙은 별명들이다. '기린'은 190cm대 큰 키와 긴 얼굴, 약골 이미지에서 나왔고, 미션 중 거짓말과 배신을 일삼아 '배신의 아이콘'이 됐다. 2013년 2월 17·24일 방송된 마카오·베트남 아시아 레이스 특집에서 현지 팬들이 열광하면서 '배신 기린'이 '아시아 프린스'로 불리게 됐다(본인은 2025년에 베트남에서 처음 생긴 별명이라고 말함). 날달걀 복불복에서 날달걀을 계속 골라 '공식 꽝손'이 됐다(연도·회차·달걀 개수 미확인)."
meaning = "키 크고 길쭉한데 허당이고, 동료를 배신하고, 늘 꽝을 뽑는 불운한 캐릭터를 가리킨다. 해외에서 이유 없이 인기 많은 '프린스' 이미지로도 쓴다."
use_when = "길쭉한 캐릭터가 나오거나, 친구를 배신하는 반전이 있거나, 뽑기·복불복에서 혼자 꽝을 뽑을 때 쓴다."
food_fit = "대파·바게트·빼빼로·아스파라거스를 '기린'으로 쓰거나, 날달걀 복불복에서 혼자 날달걀을 깨는 계란 캐릭터로 쓴다. 해외에서만 인기 많은 K-푸드를 '아시아 프린스'로 패러디할 수도 있다."
fame = 4
fame_evidence = "OSEN(2016.1.22)은 '기린'과 '배신의 아이콘'을, 텐아시아(2018.4.18)는 '기린'·'꽝손'·'배신의 아이콘'을 대표 별명으로 소개했다. 엑스포츠뉴스(2013.2.26)는 '배신 기린'에서 '아시아 프린스'로 바뀐 과정을 보도했고, 마리끌레르(2021.4.27 하차 기사)도 별명들을 정리했다. 2025년 주연 영화 제목이 '나혼자 프린스'다."
caution = "실존 연예인의 별명이라 실명·초상·닮은 캐리커처는 초상권·퍼블리시티권 문제가 생길 수 있다. 성격 패러디로만 쓰고 런닝맨 방송 화면(SBS 저작권)은 쓰지 말 것. 키나 얼굴을 비하하는 느낌이 나지 않게 할 것."
verified = "partial"
