[[classic]]
name = "리치언니 (박세리)"
aliases = ["리치 언니", "박세리 플렉스"]
category = "예능"
year = "2020년(나 혼자 산다·노는 언니 출연 시기, 별명이 처음 붙은 회차는 미확인)"
origin = "골프 선수 출신 박세리가 2020년부터 MBC '나 혼자 산다'(첫 출연 2020년 5월 22일), E채널 '노는 언니', '쓰리박' 등에서 대용량 식자재 펜트리, 통 큰 주문과 선물을 보여 주며 얻은 별명이다. 별명이 처음 붙은 프로그램과 회차는 미확인이다."
meaning = "씀씀이와 스케일이 남다른, 넉넉하게 베푸는 사람을 이르는 말이다."
use_when = "한 캐릭터가 장보기나 주문을 남들보다 몇 배로 크게 하는 컷, 후배에게 통 크게 한턱내는 컷에 맞는다."
food_fit = "치킨을 반반 대신 프라이드와 양념을 한 마리씩 시키는 캐릭터, 창고형 마트에서 박스째 사는 감자 캐릭터에게 '리치 언니 모드' 자막을 붙일 수 있다."
fame = 4
fame_evidence = "비즈한국 2021년 3월 9일 기사가 예능 속 박세리를 '리치 언니'로 소개했고, 아주경제 2021년 12월 인터뷰 제목과 2023년 4월 '개는 훌륭하다' MC 합류 기사 제목에도 이 별명이 수식어로 쓰였다."
caution = "실존 인물이므로 박세리의 얼굴이나 이름을 캐릭터에 쓰지 말고 '리치 언니'라는 호칭과 대용량 콘셉트만 빌린다. 방송 화면은 MBC·E채널 저작물이다. 박세리는 인터뷰에서 '리치'를 재산이 아니라 나눔의 여유라는 뜻으로 받아들인다고 했으니 재산 과시로만 쓰지 않는다. 2024년 부친 관련 재단 고소 논란이 보도된 것으로 알고 있으나 이번 검증에서 출처는 미확인이며, 가족이나 돈 분쟁 소재와 엮지 않는다. 기존 문구의 '출처 미확인'은 이제 확인됐다. 박세리희망재단은 2023년 9월 부친 박준철 씨를 사문서위조 혐의로 고소했고, 박세리는 2024년 6월 기자회견에서 부친의 채무 문제가 배경이라며 눈물을 보였다. 대전지법은 2025년 12월 박준철 씨에게 징역 10개월, 집행유예 2년을 선고했다(1심). 그러니 아버지, 빚, 도장, 재단 소재는 물론, 돈을 퍼 주는 사람이 손해를 보는 식의 개그와 '리치 언니'를 엮지 않는다."
verified = "partial"
risk_checked = true
notes = "카테고리를 '예능'으로 바꿨다. 아주경제 기사 날짜는 2021년 12월 6일이다. 출연 프로그램과 '나 혼자 산다' 첫 출연일(2020년 5월 22일)은 확인했으나 별명이 처음 붙은 회차는 확인하지 못했다. 이번 턴은 웹 검색 한도가 소진되었고 나무위키가 403으로 막혀 추가 확인을 하지 못했다."
sources = ["http://bizhankook.com/articles/21521.html", "https://www.ajunews.com/view/20211201151338470", "https://ko.wikipedia.org/wiki/박세리", "https://en.wikipedia.org/wiki/Pak_Se-ri"]
caution_sources = ["https://isplus.com/article/view/isp202512170121", "https://m.seoul.co.kr/news/2024/06/18/20240618500205", "https://www.segye.com/view/20240612501745"]

[[classic]]
name = "토토가 (토요일 토요일은 가수다)"
aliases = ["토토가", "토토가 소환"]
category = "예능"
year = "2014-2015"
origin = "무한도전 연말 특집 '토요일 토요일은 가수다'. 준비편은 2014.12.20, 무대 1부는 12.27, 2부는 2015.1.3에 방송됐다. 터보, 김현정, 쿨, 조성모, 소찬휘, 이정현, 지누션, 엄정화, 김건모, S.E.S.(유진 대신 서현) 등 90년대 가수가 무대에 섰다."
meaning = "추억의 것을 다시 무대에 올린다는 뜻. 복고와 레트로 소환을 가리키는 말로 쓰인다."
use_when = "옛날 유행템이 돌아왔을 때나 추억의 무언가가 다시 등장하는 컷에서."
food_fit = "추억의 과자와 문방구 불량식품이 90년대 의상을 입고 '토토가' 무대에 서는 패러디 배경."
fame = 4
fame_evidence = "1부 시청률은 19.8%(닐슨 전국)로 그해 무한도전 최고였고, 검색 결과 기준 2부는 22.2%였다. 방송 직후 터보 '러브 이즈'가 지니 실시간 차트 1위에 올랐다(아주경제 2014.12.28)."
caution = "실존 가수의 얼굴이나 무대를 재현하지 않고 '90년대 무대' 분위기만 빌린다. 노래 가사는 저작권이 있으니 인용하지 않는다. 방송 화면은 캡처해서 쓰지 않는다. MBC는 '토토가' 명칭을 적극적으로 관리한다. 2015년 '토토가' 이름을 쓰던 클럽에 이의를 제기해 이름을 '토토가요'로 바꾸고 로고를 교체하게 했다. 같은 해 법원은 MBC의 가처분 신청을 받아들여 '토요일 토요일은 즐거워' 유사 공연 제목 사용을 금지했다(OSEN 2015.3.28, 4.14). 그러니 게시물 제목, 해시태그, 캠페인명에 '토토가'를 쓰지 않고 '90년대 소환 무대' 같은 일반 표현으로 바꾼다. 출연자 가운데 김건모는 2019년 성폭행 의혹이 제기됐다가 2021년 검찰 무혐의(불기소)로 끝났고, 슈는 2019년 해외 상습도박으로 징역 6월에 집행유예 2년을 받았다. 특정 출연자를 떠올리게 하는 의상, 춤, 소품 묘사도 피한다."
verified = "verified"
risk_checked = true
notes = "2014.12.20 준비편(15.3%)을 추가하고 출연 가수 명단을 보완했다. S.E.S.는 유진 대신 서현이 함께했다. 2부 22.2%는 검색 결과로만 확인했다. 20대 초반은 방송 당시 어려 체감도가 조금 낮을 수 있어 fame을 4로 조정했다."
sources = ["https://www.khan.co.kr/article/201412291533241", "https://m.ekn.kr/view.php?key=115126", "https://www.ajunews.com/view/20141228151848518"]
caution_sources = ["https://www.osen.co.kr/article/G1110126731", "https://www.osen.co.kr/article/G1110111942", "https://www.tenasia.co.kr/article/2015010553244", "https://www.mt.co.kr/society/2019/02/19/2019021904418230249", "https://www.nocutnews.co.kr/news/5010743", "https://m.dailian.co.kr/news/view/859582", "https://isplus.com/article/view/isp202512090045"]

