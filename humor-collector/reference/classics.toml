name = "이광수 하차(2021, 부상 후 컨디션 문제)"
reason = "부상·건강 관련이라 웃음 소재로 부적절."

[[excluded]]
name = "'가카는 절대 그럴 분이 아니다' (나는 꼼수다)"
reason = "정파성 정치 밈이고, 코미디 프로그램 출처도 아니다."

[[excluded]]
name = "웃찾사 '형님 뉴스' (\"남자가 남자다워야 남자지\")"
reason = "성역할 소재이고, 현재 인지도가 4 미만이라 판단했다."

[[excluded]]
name = "피식대학 '메이드 인 경상도' 영양 편"
reason = "2024년 지역 비하 논란으로 영상이 비공개 처리되고 사과문이 나왔다."

[[excluded]]
name = "개그콘서트 '용감한 녀석들'"
reason = "도입부가 자살 시도 설정이고, 인지도가 3~4 경계다."

[[excluded]]
name = "웃찾사 '화상고' (\"호이짜\")"
reason = "방영 당시 시청률은 높았지만 학교폭력 콘셉트에 '다 죽여버리겠다' 같은 대사가 있고, 현재 인지도가 3~4 경계다."

[[excluded]]
name = "개그콘서트 '네가지'"
reason = "외모·지역 콤플렉스 소재다. 대표 유행어 '고뤠?'만 별도 후보로 채택했다."

[[excluded]]
name = "개그콘서트 '데프콘 (썸) 어때요'"
reason = "실존 연예인과 외모가 닮았다는 소재이고, 전 국민 인지도는 3~4 경계다."

[[excluded]]
name = "비상계엄·탄핵 정국 밈 (총구 잡은 장면, 의사봉 장면 등)"
reason = "정당·정치 밈. 뉴시스 2024 결산에 실렸지만 정치적 입장이 갈리는 소재."

[[excluded]]
name = "2025 대선 관련 밈"
reason = "정당·정치 밈."

[[excluded]]
name = "2026 월드컵 탈락 AI 밈 (감독 조롱, '고대 나와야 국대' 등)"
reason = "실존 감독·선수를 조롱하는 분노성 밈. 일본 팬 조롱 맞대응은 국가 비하로 번질 소지."

[[excluded]]
name = "쉬었음 청년·전업자녀·캥(거루족)"
reason = "2026 언급량 2위 밈이지만 청년 실업 등 사회적 처지를 조롱할 소지가 있음."

[[excluded]]
name = "리센느 원이의 '무섭노' 발언"
reason = "2026년 7월 일베 용어 논란. '거제 야호'만 쓰고 이 표현은 쓰지 말 것."

[[excluded]]
name = "콜드플레이 키스캠 불륜 밈 (2025)"
reason = "식별 가능한 일반인의 사생활을 조롱하는 밈."

[[excluded]]
name = "김종국 런닝맨 결혼 발표"
reason = "개그가 아니라 연예인 사생활 소식"

