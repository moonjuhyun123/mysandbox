fame = 4
fame_evidence = "연합뉴스 2010년 대중문화 유행어 결산(2010.12.17, 전북일보 게재)에 실렸고, 김성주는 '60초의 사나이'라는 별명을 얻었다(텐아시아 2014.5.28). 이 프로그램은 케이블 사상 최고 시청률 18.1%를 기록했다."
caution = "방송 화면과 김성주 얼굴은 쓰지 말고 멘트와 상황만 패러디한다. 2019년 엠넷 '프로듀스' 투표 조작 수사 때 경찰이 '슈퍼스타K' 시리즈의 투표 자료도 확보했다는 보도가 있었다. 슈퍼스타K에 대한 최종 수사 결과는 확인되지 않았다. '결과 발표 미루기' 패러디는 괜찮지만, 투표나 결과 조작 농담과 함께 쓰지 않는다."
