food_fit = "꼬치에 꿰인 어묵이나 떡꼬치, 숟가락이 꽂힌 밥공기가 '내 검을 뽑아줄 신부를 찾아'. SNL 코리아8(2016.12.17)에서도 김준현이 숟가락이 꽂힌 '먹깨비'로 패러디했다."
