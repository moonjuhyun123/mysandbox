caution = "품종명이라 상표 문제는 크지 않을 것으로 보이나 확인하지는 못했다. 일본 품종의 한국 내 무단 재배 논란이 일본 언론에 보도된 바 있으므로 한일 비교나 비하 소재로 쓰지 않는다. 2026년 6월 일본 정부가 해외 무단 재배를 감시하고 국제 소송 같은 법적 대응을 맡을 신품종 권리보호 전담기관을 세운다고 보도되었다. 품종 유출 문제가 아직 진행 중이므로 '훔쳐 온 포도' 같은 농담도 피한다. 2024년 태국에서 중국산 샤인머스캣의 잔류농약이 기준을 넘었다는 발표로 수입이 일시 중단되었고, 2022년 국내에서는 생장조절제 괴담이 돌았다. '농약 포도', '호르몬 포도' 같은 안전성 농담은 재배 농가를 비방하는 것으로 읽힐 수 있으니 쓰지 않는다."
