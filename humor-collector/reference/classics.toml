fame = 5
fame_evidence = "위키백과 츤데레 문서는 서찬휘《키워드 오덕학》(2017) 245~246쪽을 근거로 '2010년대 들어, 특히 2015년을 기점으로' 사용이 크게 늘었다고 적는다. 예능 자막 등에서도 일상적으로 쓰인다(구체 근거는 추가 확인하지 못함)."
caution = "일본 서브컬처에서 온 용어다. 특정 애니메이션 캐릭터의 외형(트윈테일 등 상징적 디자인)을 그대로 따라 하지 않는다."
verified = "partial"
risk_checked = true
notes = "한국 확산 시점은 단행본 각주로 확인했다. 2002년 일본 기원은 출처가 달려 있지 않다. 대중적 인지도를 감안해 fame을 4에서 5로 올렸다."
sources = ["https://ko.wikipedia.org/wiki/츤데레"]

