sources = ["https://www.wikitree.co.kr/articles/230203", "https://www.osen.co.kr/article/G1110219376", "https://www.vogue.co.kr/2024/09/13/%eb%b2%a0%ed%85%8c%eb%9e%912-1%ed%8e%b8%ec%9d%98-%ea%b0%80%ec%98%a4%eb%a5%bc-%eb%ac%b4%eb%84%88%eb%9c%a8%eb%a6%ac%ea%b3%a0-%eb%b0%98%ec%84%b1%ed%95%98%eb%8a%94-2%ed%8e%b8/"]
