caution = "표기가 회차와 기사마다 다르다('힘든/어려운', '자꾸' 유무). 2016년 이후의 사용 빈도는 확인하지 못했다. 송중기·송혜교 초상과 KBS 화면은 쓰지 않는다."
verified = "verified"
notes = "대사는 1회('그 힘든 걸 해냅니다')와 15회 재회 장면('그 어려운 걸 자꾸 해냅니다') 두 곳에 나온다. OSEN 기사는 명대사 목록일 뿐, '방송계를 강타했다'는 문장은 그 기사에 없다. '~지 말입니다'와 '유시진 말투'는 별도 항목이라 별칭에서 뺐다."
