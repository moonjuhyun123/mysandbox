origin = "개그콘서트 '두분토론'(2010.6.20~2011.10.16)에 나온 대사다. '남하당' 대표 박영진이 '여당당' 김영희의 주장에 \"그럼 소는 누가 키울 거야, 소는?\"이라고 받아쳤고, 사회는 김기열이 맡았다."
meaning = "다들 딴짓하거나 큰소리만 칠 때 '그럼 할 일은 누가 하냐'고 핀잔을 주는 말이다."
use_when = "모두 놀러 가고 혼자 일하는 캐릭터가 외치는 컷에 쓴다."
food_fit = "목장 배경의 우유나 한우 캐릭터가 일을 미루는 반찬들에게 핀잔을 주는 장면."
fame = 4
fame_evidence = "전북일보 2010 유행어 정리 기사에 '소는 누가 키우냐~'가 실렸다. 텐아시아(2012.1.4)는 박영진이 한우 쇼핑몰 '우하하하'를 열었다며 이 유행어를 언급했다."
caution = "원래는 남녀 대결(남하당 대 여당당) 코너에서 남성우월 캐릭터가 하던 말이다. 남성 캐릭터가 여성 캐릭터에게 하는 구도나 성대결 맥락은 피하고, '할 일' 핀잔으로만 쓴다. 박영진과 김영희는 실존 인물이다. '두분토론'은 2026년 1월 개그콘서트에서 박영진·김영희의 부부 토론 형식으로 15년 만에 부활해 현재 방송 중인 KBS 코너다. 코너명, 당명(남하당·여당당), 토론 세트 구성은 그대로 베끼지 않는다. 박영진의 원래 캐릭터는 언론에서도 '가부장 꼰대 남성'으로 소개되니 성대결 금지 원칙을 지킨다. 상대역 김영희는 2018년 12월 모친의 '빚투' 논란으로 사과했고 2019년 피해자와 합의했다고 보도됐으니, 상대역을 떠올리게 하는 캐릭터나 빚 소재는 쓰지 않는다."
verified = "verified"
notes = "텐아시아 기사는 2020년이 아니라 2012.1.4 기사다. 내용은 박영진이 한우 쇼핑몰 '우하하하'를 열었다는 것이고, 쇼핑몰 이름에 유행어를 쓴 것은 아니다(소를 누가 키웠는지 공개하는 콘셉트). 2010년 기사에 실린 표기는 '소는 누가 키우냐~'이다."
sources = ["https://www.jjan.kr/article/20101216379451", "https://www.tenasia.co.kr/article/2020012308214", "https://namu.moe/w/두분토론"]
caution_sources = ["https://m.dailian.co.kr/news/view/1603273", "https://m.etnews.com/20260128000141", "https://www.segye.com/newsView/20260602501295", "https://sports.khan.co.kr/article/201901041145003", "https://www.dailian.co.kr/news/view/759174/"]

[[classic]]
name = "야, 안 돼~!"
