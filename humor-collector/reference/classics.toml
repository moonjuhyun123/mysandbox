caution = "라부부는 팝마트와 원작자의 저작권·상표권이 있는 캐릭터이므로 그대로 그리지 말고 '뾰족 이빨 인형' 같은 변형 패러디로 처리한다. 리사 등 실존 연예인의 사진이나 초상은 쓰지 않는다. 가짜 상품('짝퉁') 논란도 있었으니 특정 상품을 조롱하지 않는다. 팝마트는 IP를 매우 공격적으로 지킨다. 2025년 7월 미국에서 7-Eleven과 가맹점주를 '라푸푸(Lafufu)' 가품 판매로 상표·저작권·트레이드드레스 침해 소송을 냈다. 이름을 비튼 'LaBullBu' 운동화 업체도 제소했다. 2026년 3월에는 이용자가 올린 3D 모델을 문제 삼아 플랫폼 Bambu Lab까지 상하이에서 제소했다(이후 합의, 모델 삭제와 사과). 따라서 '라부부', '라푸푸'처럼 이름을 살짝 바꾼 말장난 명칭, 뾰족 이빨 9개, 토끼 귀 같은 핵심 실루엣, 블라인드 박스 포장 디자인을 모두 피한다. 패러디 캐릭터는 원형을 떠올릴 수 없을 만큼 바꾸고, 굿즈·상품화는 하지 않는다."
verified = "verified"
risk_checked = true
notes = "리사가 가방에 단 시점은 2025년이 아니라 2024년이다(한국경제). 로제가 착용했다는 내용은 출처에서 확인되지 않았다. 리셀가 '32만 원대'도 확인되지 않았으며, 출처상 수치는 69만5000원(2025년 6월, 크림)과 최고 100만 원이다. 검색 한도 소진으로 추가 확인은 하지 못했다."
