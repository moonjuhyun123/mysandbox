year = "미확인 (2018년 아시아경제 기사에서 소개)"
origin = "'텅 빈 통장'의 줄임말로, 월세·카드값·공과금 등이 빠져나가 통장에 돈이 거의 없는 상태를 뜻한다. 아시아경제 김민영 기자가 2018년 12월 23일 '2030 금융에세이'에서 신조어로 소개했다. 처음 쓰인 시점은 미확인이다."
meaning = "월급이 들어오자마자 빠져나가 잔고가 바닥난 상태를 자조적으로 이르는 말이다."
use_when = "월급날 직후 카드값이 빠져나가는 장면이나, 충동구매 뒤 잔고를 확인하는 장면에 맞는다."
food_fit = "배달 음식을 연달아 시킨 캐릭터가 텅 빈 통장을 보고 굳어 버리거나, 속이 텅 빈 공갈빵을 통장에 빗대는 장면으로 쓸 수 있다."
fame = 4
fame_evidence = "아시아경제 2018.12.23 기사가 이 말을 신조어로 소개하고, 위키백과 신조어 목록에도 실려 있다."
caution = "실제 은행 통장 디자인이나 로고를 그대로 그리지 않는다."
verified = "verified"
risk_checked = true
notes = "'월급 로그아웃'은 같은 말의 별칭이 아니라 비슷한 상황을 이르는 별개 표현이어서 별칭에서 뺐다. 처음 쓰인 시점은 미확인이다."
sources = ["http://view.asiae.co.kr/news/view.htm?idxno=2018122310174389232", "https://ko.wikipedia.org/wiki/대한민국의_인터넷_신조어_목록"]

[[slang]]
name = "폭풍OO (폭풍흡입·폭풍성장)"
aliases = ["폭풍흡입", "폭풍성장", "폭풍눈물", "폭풍 다이어트", "폭풍애교", "폭풍감량"]
category = "인터넷·커뮤니티"
year = "2011년 이전 (2011년 5월 칼럼에 이미 퍼진 말로 등장, 시작 미확인)"
origin = "'폭풍'을 '대단하다, 빠르다'는 뜻의 접두어처럼 붙이는 인터넷 말이다. 중앙일보 2011년 5월 31일 칼럼(심상복)이 폭풍성장·폭풍애교·폭풍감량을 예로 들며 인터넷에서 빠르게 퍼졌다고 썼다. 만든 사람과 시작 시점은 미확인이다."
meaning = "어떤 행동을 엄청난 기세로 빠르게 하는 모습을 뜻한다. '폭풍흡입'은 음식을 정신없이 먹어 치우는 모습이다."
use_when = "캐릭터가 허겁지겁 먹는 장면, 갑자기 부쩍 자란 장면, 펑펑 우는 장면에 쓴다."
food_fit = "음식 캐릭터가 다른 음식을 '폭풍흡입'하거나 자기가 폭풍흡입당할 위기에 놓이는 장면에 바로 쓸 수 있다. 부풀어 오르는 빵이나 팝콘은 '폭풍성장'과 잘 맞는다."
fame = 4
fame_evidence = "2011년 중앙일보 칼럼이 인터넷 이용자에게 널리 쓰이는 말로 다뤘다. 다만 이 칼럼에 '폭풍흡입'은 나오지 않고, 지금의 사용 빈도는 별도 출처로 확인하지 못했다."
caution = "특정 인물이나 저작물과 연결되지 않은 일반 표현이라 부담이 적다."
verified = "partial"
risk_checked = true
notes = "칼럼의 예시는 폭풍성장·폭풍애교·폭풍감량이며, '폭풍흡입'과 '폭풍눈물'은 이 출처에 없다. '2011년 무렵 퍼졌다'는 칼럼이 나온 시점일 뿐이고 시작 시점은 미확인이다. 검색 한도가 소진돼 기원을 더 확인하지 못했다."
sources = ["https://www.koreajoongangdaily.com/bilingual-news/stormy-winds-sweep-the-internet-in-korea/11361103"]

[[slang]]
name = "프로불편러"
aliases = ["불편러"]
category = "인터넷·커뮤니티"
year = "미확인 (언론 용례는 2016년 7월이 가장 이르다)"
origin = "'프로(professional)'와 '불편(不便)'에 '-러(-er)'를 붙인 말이다. 처음 쓴 사람과 시점은 미확인이며, 우리말샘 용례는 더피알(2016.7) 기사 하나다."
meaning = "매사에 불편함을 드러내 주위의 공감을 얻으려는 사람을 비꼬는 말이다. 과하게 예민하다는 비난으로 쓰이지만, 불편을 개선해 사회를 바꾼다는 긍정적 맥락에서도 언급된다."
use_when = "캐릭터가 아주 사소한 일에 하나하나 트집을 잡는 장면에 쓴다. 남을 지목하기보다 스스로를 '음식 취향 프로불편러'라고 자조하는 컷이 안전하다."
food_fit = "붕어빵에 붕어가 없다며 불평하는 식의, 음식에 대한 사소하고 무해한 트집에 맞는다. 부먹·찍먹처럼 취향 논쟁에서 캐릭터 스스로 불편러를 자처하는 연출이 자연스럽다."
fame = 4
fame_evidence = "우리말샘에 표제어로 올라 있고 2016년 언론 용례가 있다. 영어 위키낱말사전이 'social justice warrior'에 대응하는 속어로 실을 만큼 널리 쓰인다."
caution = "정당한 문제 제기를 깎아내리는 말로 쓰여 왔고 사회 논쟁에 자주 등장하므로, 실존 인물이나 특정 집단의 비판을 겨냥하면 반발을 살 수 있다. 무해한 음식 취향 소재와 자조형 대사로만 쓴다. 2021년 GS25 포스터 논란 때 '2030대 남성들도 프로불편러가 되면 상황을 바꿀 수 있다'는 발언이 보도되는 등, 이 말은 젠더 갈등 공방에서 쓰였다. 같은 시기 유통업계가 젠더 논란을 우려해 광고 자기검열을 강화했다는 보도도 있다. 따라서 브랜드 계정에서는 항의 댓글이나 비판하는 독자를 '불편러'로 부르는 연출(항의 댓글 패러디 등)을 하지 않는다."
verified = "partial"
risk_checked = true
