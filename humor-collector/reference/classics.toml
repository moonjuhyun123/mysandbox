[[classic]]
name = "두쫀쿠"
aliases = ["두바이 쫀득 쿠키", "두바이 쫀득쿠키", "dujjonku", "두케팅", "두쫀쿠 오픈런", "두쫀쿠 지도", "두바이 초콜릿(원류)"]
category = "음식"
year = "2025 하반기 확산, 2026년 1월 절정"
origin = "2022년부터 유행한 '두바이 초콜릿'을 변형한 쫀득 쿠키로, 마시멜로 반죽 안에 피스타치오 크림과 카다이프를 넣는다. 2025년 10월부터 검색량이 급증했고 2026년 1월 영하 13도 한파에도 오픈런이 이어졌다. 최초 개발처는 미확인이며, '몬트쿠키'가 먼저 시작했다는 보도가 있다."
meaning = "줄 서서 사는 유행 디저트의 대명사다. 구매 경쟁을 '두케팅'이라 부르고, 팔라펠 이모지를 두쫀쿠 이모지로 쓰고, '두쫀쿠 지도'를 돌려 보며 논다."
use_when = "오픈런, 품절, 한파 속 줄서기 컷. 유행에 뒤처질까 초조한 캐릭터, 4천 원이던 값이 1만 원대로 오른 걸 보고 기겁하는 컷."
food_fit = "두쫀쿠 캐릭터가 아이돌처럼 팬들을 줄 세우는 연출, 피스타치오·카다이프 캐릭터가 품귀로 몸값이 오르는 개그."
fame = 5
fame_evidence = "네이버 데이터랩 검색량이 2025년 10월 대비 2026년 1월 약 477% 늘었다(경기일보, 위키백과는 6배 이상). 장원영 인증과 안성재 셰프의 제작 영상이 화제가 됐고, CU 파생상품이 누적 수백만 개 팔렸다. 원조로 꼽힌 매장의 월매출 25억 원과 BBC 보도도 있다."
caution = "정점이 2026년 1월이라 지금(2026.11)은 '한때 대란'으로 쓰는 편이 자연스럽다. 원조 논란이 있으니 특정 매장이나 브랜드 이름은 넣지 않는다. 연예인 얼굴도 그리지 않는다. 2025년 11월부터 2026년 1월까지 두쫀쿠 관련 식품위생법 위반 신고가 19건 들어왔다(위생 관리 7건, 무허가 영업 7건). 식중독 증상과 곰팡이 의심 사례도 있었고, 집에서 만들어 중고거래로 판 1건은 고발됐다. 2026년 2월 식약처 점검에서는 두바이 쫀득 쿠키 1건에서 황색포도상구균이 기준치를 넘게 나왔다. 그러니 '먹고 탈 났다', '집에서 만들어 몰래 판다'처럼 위생이나 무허가 판매를 소재로 한 개그는 피한다."
verified = "partial"
risk_checked = true
notes = "검색량 증가폭은 경기일보 기준 477%(약 5.8배)이고, '6배'는 위키백과의 표현이다. NYT·Independent 보도, '유행이 식었다'는 보도, 설빙·던킨 파생상품은 이번에 출처를 확인하지 못했다(웹검색 한도 소진). 최초 개발처는 여전히 미확인이다."
sources = ["https://ko.wikipedia.org/wiki/두바이_쫀득_쿠키", "https://www.kyeonggi.com/article/20260103580038", "https://www.harpersbazaar.co.kr/article/1894649"]
caution_sources = ["https://biz.sbs.co.kr/amp/article/20000288885", "https://newneek.co/@newneek/article/38544", "https://www.insight.co.kr/news/544515"]

