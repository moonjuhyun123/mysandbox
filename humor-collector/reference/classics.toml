notes = "날달걀 복불복의 연도(2013)·회차·'30개 중 1개'·'20개 중 1개 첫 타자'는 확인하지 못했다(마리끌레르에는 연도·개수가 없음). '배신전과 12범'과 '남양주의 기린'은 열어본 출처에서 확인하지 못해 별칭에서 뺐다. 메트로신문(2015) 웨이보 500만 팔로어는 페이지 오류(503)로 확인하지 못해 출처에서 뺐다. 아시아 레이스 방송일은 엑스포츠뉴스 본문의 '17일과 24일'과 기사 날짜(2013.2.26)로 미루어 본 것이다. 키는 2018년 기사에 190cm, 2025년 기사에 192cm로 나온다. '날달걀 복불복'은 별명이 아니라 게임 이름이라 별칭에서 뺐다. 웹 검색 한도가 소진돼 추가 검색은 하지 못했다."
