food_fit = "녹아내린 아이스크림, 전기장판 위에 퍼진 찹쌀떡, 소파에 엎어진 식빵 캐릭터가 '이미 아무것도 안 하고 있지만 더 격렬하게…'라고 말하는 컷이 어울린다."
