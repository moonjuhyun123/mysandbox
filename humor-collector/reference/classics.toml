caution = "원래 정부의 무사안일을 풍자한 코너이고 청와대 초청 일화도 있어 정치 맥락은 빼고 대사만 쓴다. 김원효는 실존 인물이고, KBS 영상은 쓰지 않는다. 대통령 역을 맡았던 김준호는 2009년 불법 도박으로 자숙했고, 2019년 3월에는 내기 골프 의혹으로 모든 방송에서 하차했다. 대통령이나 상관 캐릭터를 도박, 내기, 골프 소재와 엮지 않는다."
verified = "verified"
notes = "대체로 맞다. 기사들은 김원효의 역할을 '본부장'으로 쓰고, 나무위키는 '경찰 치안감(본부장)'으로 적는다. 청와대 초청 행사는 2011.12.20 '송년의 밤'이다."
sources = ["https://www.imaeil.com/page/view/2011121817124019986", "https://seoul.co.kr/news/politics/2011/12/16/20111216500007", "https://www.khan.co.kr/article/201110262130595/amp", "https://namu.moe/w/비상대책위원회(개그콘서트)"]
