origin = "tvN '코미디빅리그'. 나무위키에 따르면 '호로록'은 이국주·신기루 팀 '더블패티' 시절(79금 라디오 2013.1~4, 돼지공화국 2013.5~8)에 나왔고, 식탐송은 '10년째 연애중'(2013.11~2015.3)에서 대중가요를 개사해 불렀다. 텐아시아(2014.10.6)는 두 유행어를 '10년째 연애중'에서 선보인 것으로 소개했다."
meaning = "면이나 국물을 맛있게 들이켜는 의성어이고, 식탐을 상징한다."
use_when = "면을 먹는 컷, 먹방 컷의 효과음."
food_fit = "면·국물 캐릭터의 효과음 그대로라 음식 소재와 매우 잘 맞는다."
fame = 4
fame_evidence = "매일신문은 2014년 연말 유행어 결산에서 '호로록 호로록~'을 그해 히트 유행어로 꼽았다(2014.12.11). 이국주는 2014년 한국갤럽 '좋아하는 예능인' 5위에 오르고 SBS 연예대상 뉴스타상을 받았다(나무위키)."
caution = "이국주는 실존 인물이므로 초상은 쓰지 않는다. 식탐송은 기존 대중가요를 개사한 것이라 원곡 저작권이 있다. 식탐을 체형 비하로 연결하지 않는다. 이국주는 2017년 3월, 남성 출연자에게 한 스킨십 개그가 성희롱이었다는 지적(배우 온시우)을 받으면서 크게 논란이 됐다. 이 논란은 외모 비하 악플에 법적 대응을 예고한 데서 시작됐다. 따라서 식탐 캐릭터가 상대 캐릭터에게 들이대거나 몸을 만지는 개그와는 엮지 않는다."
verified = "verified"
notes = "한국야쿠르트 광고에 식탐송이 쓰였다는 내용은 이투데이, 매일신문, 나무위키 광고 목록 어디에서도 확인하지 못했다. 이투데이 기사(2014.8.20)는 인기 상승만 다루고 식탐송의 출처 코너는 밝히지 않았다. '호로록'의 첫 등장은 '10년째 연애중' 이전의 더블패티 코너일 수 있다(나무위키 기준)."
sources = ["https://www.tenasia.co.kr/article/2014100688794", "https://www.imaeil.com/page/view/2014121107075920342", "https://www.etoday.co.kr/news/view/970677", "https://namu.moe/w/이국주"]
caution_sources = ["https://www.kukinews.com/article/view/kuk201703200078", "https://www.etnews.com/20170321000176", "https://news.tf.co.kr/read/ogmeta/1682927.htm"]

[[classic]]
