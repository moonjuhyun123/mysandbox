caution = "셰익스피어 '헨리 4세 2부'의 'Uneasy lies the head that wears a crown'을 변형한 말로 흔히 소개되지만, 제작진 설명은 미확인이다. 배우 초상은 쓰지 않는다."
verified = "partial"
