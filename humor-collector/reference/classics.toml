fame_evidence = "노컷뉴스(2026.02.05)의 국립국어원 조사 보도에서 '얼굴 맛집'이 일상 표현의 예로 나왔다. 제주 지역 40~60대도 '맛집'을 '수준 높은 것'이라는 확장된 뜻으로 자주 쓰는 것으로 조사되었다."
