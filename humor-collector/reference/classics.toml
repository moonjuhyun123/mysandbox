caution = "특별한 위험 요소 없음. 실제 치킨 브랜드의 광고 문구·로고와 겹치지 않게 할 것."
verified = "partial"
risk_checked = true
notes = "뜻은 확인됐지만 유래(WoW 가로쉬 설)와 유행 시점은 나무위키 단독 서술이라 미확인. 사용자 요청대로 '신조어' 묶음으로 분류할 것."
sources = ["https://namu.moe/w/%EA%B2%89%EB%B0%94%EC%86%8D%EC%B4%89", "https://mirinae.io/blogs/?p=2536", "https://www.koreadaily.com/article/20240324190034151", "https://v.daum.net/v/20260217073218722"]

[[slang]]
name = "고구마 / 사이다"
aliases = ["고구마 전개", "고구마 백 개 먹은 느낌", "사이다 발언", "핵사이다"]
category = "인터넷·커뮤니티"
year = "2015~2016 무렵 (최초 시점 미확인)"
origin = "답답한 상황이나 사람을 목이 막히는 고구마에, 그 답답함을 시원하게 푸는 말이나 행동을 탄산 사이다에 빗댄 신조어입니다. 위키 신조어 목록은 2015년 10월 기사(사이다)와 2016년 기사(고구마)를 근거로 들지만, 최초 사용처는 미확인입니다."
meaning = "고구마는 목이 막히듯 답답한 상황이나 사람, 사이다는 그 답답함을 속 시원하게 뚫어주는 전개를 뜻합니다."
use_when = "1~3컷에서 답답하게 끌다가 4컷에서 통쾌하게 뒤집는 구성에 그대로 씁니다."
food_fit = "고구마 캐릭터는 늘 답답한 역할, 사이다 캐릭터는 시원하게 해결하는 해결사 역할로 바로 캐릭터화할 수 있습니다."
fame = 5
fame_evidence = "국립국어원 '2025년 국어 사용 실태 조사'(15~69세 3천 명, 2026.2.5 발표)에서 고구마를 '답답한 상황'이라는 뜻으로 쓴다는 응답이 56.8%, 사이다를 '속 시원한 해결'이라는 뜻으로 쓴다는 응답이 71.5%였습니다."
caution = "아주경제(2017)는 2016년 촛불집회 발언을 이 말이 퍼진 계기로 설명합니다. 정치적인 맥락은 빼고 일상 상황에만 쓰세요."
verified = "partial"
risk_checked = true
notes = "이 설문은 노컷뉴스가 직접 한 것이 아니라 국립국어원 조사(2026년 2월 발표)를 노컷뉴스가 보도한 것입니다. 같은 기사의 다른 대목에는 고구마 전국 평균이 50.5%로 적혀 있어 수치가 서로 맞지 않습니다. 정확한 기원은 미확인입니다."
sources = ["https://www.nocutnews.co.kr/news/6467516", "https://www.ajunews.com/view/20171215142623277", "https://ko.wikipedia.org/wiki/대한민국의_인터넷_신조어_목록"]

