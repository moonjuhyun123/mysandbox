caution = "결말은 최택이어서 '어남류'는 빗나간 예측이라는 뉘앙스도 있다. 실명이 들어간 말이니 '어차피 남편은 ○○' 패턴만 빌린다. 배우 초상과 방송 캡처는 쓰지 않는다. 류준열과 혜리는 응팔 이후 7년 동안 공개 연애하다 2023년 11월 결별했다. 2024년 3월 류준열·한소희 열애가 알려지자 혜리가 SNS에 '재밌네'라고 썼고, 이것이 '환승연애' 의혹으로 번졌다. 같은 시기 류준열은 그린피스 홍보대사인데 골프를 즐긴다는 이유로 '그린워싱' 비판도 받았다. 2025년 12월 응팔 10주년 때도 이 일이 다시 거론됐다. 그러니 '어남류'라는 단어나 류준열 이름은 자막·해시태그에 쓰지 않는다. 결별·환승·'재밌네'를 연상시키는 개그도 넣지 않는다."
verified = "verified"
notes = "맞수 유행어 '어남택'을 추가했다. 시청률 수치는 이번에 직접 확인하지 않아 근거에서 뺐다."
