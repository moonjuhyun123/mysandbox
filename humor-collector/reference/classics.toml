caution = "공유 초상과 드라마 의상은 쓰지 않고, 칼이 꽂힌 모습은 피 없이 귀엽게 그린다. 연예인 인증샷이나 정치인(안희정·정세균) 패러디 사례는 인용하지 않는다. 방영 당시 극 중 19세 고등학생 지은탁과 외견상 30대인 김신의 로맨스가 '원조교제 미화'라는 비판을 받았고, 이후 성인과 미성년자 로맨스 논쟁에서도 계속 사례로 거론됐다. '도깨비 신부' 설정은 학생 캐릭터와 성인 캐릭터의 연애로 그리지 말고, 성인끼리이거나 연애가 아닌 관계로 바꾼다."
verified = "verified"
notes = "위키백과 본문에는 검 설정이 없어 텐아시아(2016.12.11)로 확인했다. 케이블 최고 기록은 유료플랫폼 기준이며, 케이블플랫폼 기준으로는 '응답하라 1988'이 더 높다는 각주가 있다."
