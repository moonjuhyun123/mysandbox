[[classic]]
name = "침대는 가구가 아닙니다 과학입니다"
aliases = ["침대는 과학", "OO는 과학이다", "OO는 과학입니다"]
category = "광고·CF"
year = "1990년대 초 (1993년설이 있으나 이번에 재확인 실패, 미확인)"
origin = "에이스침대 TV 광고 카피입니다. 첫 방영 연도는 원문으로 확인하지 못했습니다(연구자가 출처로 든 메트로서울 기사는 접속 불가). 에이스침대는 2023년 하반기부터 2024년까지도 '침대=과학' 캠페인을 이어갔습니다."
meaning = "무엇이든 '~는 과학이다'라고 우기는 말투의 원조입니다. 억지스러운 확신을 표현할 때 씁니다."
use_when = "캐릭터가 억지 논리로 우기거나, 자기 취향을 '과학'이라고 단언하는 컷에 씁니다."
food_fit = "'라면에 계란은 요리가 아닙니다, 과학입니다', '탕수육 찍먹은 취향이 아닙니다, 과학입니다'처럼 바꿔 쓸 수 있습니다."
fame = 5
fame_evidence = "위키인용집 '침대' 항목에 에이스침대 CF 문구로 실려 있습니다. 주간경향(2018)은 '침대는 ( )입니다' 시험 문제에 학생들이 '과학'이라고 답했다는 일화를 소개했습니다. 광고주도 30년 가까이 같은 카피를 캠페인에 씁니다."
caution = "에이스침대 상표와 로고는 노출하지 마세요. 시험 일화는 주간경향 필자도 지어낸 이야기인지 모른다고 했으니 사실처럼 쓰지 마세요."
verified = "partial"
notes = "1993년은 연구자가 든 메트로서울 기사에만 근거한 연도인데, 그 기사가 503 오류로 열리지 않아 확인하지 못했습니다. 이투데이 기사는 2024년 '침대=과학' 캠페인(모델 박보검)에 관한 것이라 원조 광고 연도의 근거가 아닙니다."
sources = ["https://ko.wikiquote.org/wiki/침대", "https://weekly.khan.co.kr/article/201806191540161", "https://www.etoday.co.kr/news/view/2332214", "https://www.metroseoul.co.kr/article/20230919500008"]

