food_fit = "만두, 김밥, 수제버거 캐릭터가 '난 이태리 장인이 한땀 한땀 빚은 몸이야'라고 뽐낸다."
fame = 4
fame_evidence = "매일신문(2011.12.18)이 '이게 최선입니까'와 함께 잊히지 않는 말로 꼽았고, 스포츠경향(2010.12.26)은 기사 제목에 '한땀 한땀'을 썼다. '반짝이 트레이닝복'이 동대문과 쇼핑몰에서 2~10만 원에 팔렸고(스포츠경향), 엑스포츠뉴스(2020)도 패러디 열풍을 일으킨 명대사로 꼽았다."
