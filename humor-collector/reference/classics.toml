notes = "별칭을 기사 원문대로 고쳤다('참을 인이 세 번이면 호구 된다', '티끌 모아봤자 티끌이다', '젊어서 고생을 사서 하면 골병든다'). 카카오TV 클립은 열어 보지 못해 출처에서 뺐다. 2009년 장면이지만 2010년 이후에도 계속 쓰여 범위 안으로 봤다."
