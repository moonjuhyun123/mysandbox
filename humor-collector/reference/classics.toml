fame = 4
fame_evidence = "연합뉴스(매일신문 2011.12.18) 유행어 결산에 '애정남'의 '애매합니다잉~'이 실렸다. 정부 보도자료(문체부 누리집, 2011.11.24)는 최효종이 애정남을 패러디한 에너지 절약 영상 '에절남'을 화제로 소개했다."
caution = "최효종은 실존 인물이다. KBS 영상은 쓰지 않고 말투만 빌린다. 공동 출연자 신종령은 2017년 9월 술자리 폭행으로 특수폭행 혐의 현행범 체포, 이어 상해 혐의 구속영장 신청까지 보도됐다. 나무위키에는 2017.11.21 징역 10개월, 집행유예 2년을 선고받았다고 적혀 있다(언론 원문으로는 교차 확인하지 못함). 코너 출연진을 연상시키는 캐릭터를 쓰지 않고, '쇠고랑'이나 '경찰 출동' 문구를 실제 폭행·체포 상황과 엮지 않는다."
verified = "verified"
notes = "매일신문 결산 기사에 실린 표현은 '쇠고랑'이 아니라 '애매합니다잉~'이다. 문체부 누리집 자료는 제목이 '목욕·샤워 기준 화제'이지만, 내용은 애정남을 패러디한 에너지 절약 영상 '에절남'이다. 이 자료는 코너 이름을 '애매한 것을 정리해주는 남자'로 적었다."
