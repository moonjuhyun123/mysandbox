fame_evidence = "40주년 팝업(2024.4~5, 성수동)에서 이 카피로 '일요일 캘린더 게임'을 운영했다(서울신문). 비즈워치가 2026.6 '[그때 그 광고] 42년째 일요일에 요리사가 되는 마법' 기사를 냈다."
caution = "농심 상표·패키지와 CM송 멜로디·가사는 그대로 쓰지 않는다. 광고처럼 보이면 협찬 오해가 생길 수 있으니 상표 없는 일반 짜장라면으로 그린다."
verified = "partial"
notes = "연도는 1988(문구)과 1990년대·1998(요리사 카피)로 확인됐지만 자료끼리 엇갈린다. 'SNS 게시물이 일요일에 가장 많다는 조사 보도'는 기사에서 확인되지 않았고 나무위키 서술일 뿐이다."
sources = ["https://m.seoul.co.kr/news/2024/04/30/20240430500018", "https://news.bizwatch.co.kr/article/consumer/2026/06/15/0028", "https://namu.moe/w/%EC%A7%9C%ED%8C%8C%EA%B2%8C%ED%8B%B0"]

[[classic]]
name = "니들이 게 맛을 알아?"
aliases = ["게맛을 알아", "게맛", "니들이 OO맛을 알아", "니들이 오징어 맛을 알아", "크랩버거 신구"]
category = "광고·CF"
year = "2002"
origin = "2002년 롯데리아 크랩버거 TV 광고(헤밍웨이 '노인과 바다' 패러디)에서 배우 신구가 한 대사다. 내레이션은 성우 유강진이 맡았다. 2019년 오징어버거 재출시 광고에 신구가 다시 나와 '니들이 오징어 맛을 알아?'로 패러디했다."
meaning = "'너희가 이 깊은 맛(진가)을 알아?'라는 어른의 허세다. 'OO맛을 알아' 틀로 끝없이 변형한다."
use_when = "맛 자랑이나 경험자 부심 컷, 선배가 후배에게 허세 부리는 컷, 세대 차이 개그."
food_fit = "게·크래미 캐릭터가 '니들이 내 맛을 알아?'라고 하는 셀프 패러디. 2019년 공식 패러디처럼 오징어 캐릭터 버전도 된다."
fame = 4
fame_evidence = "크랩버거는 출시 한 달 반 만에 550만 개가 팔렸다. 신구는 2014년 동원 리얼크랩스 광고에서 이 장면을 오마주했고, 롯데리아는 다른 브랜드나 방송의 패러디에 법적 대응을 하지 않았다. 비즈워치(2026.9)가 20년 넘은 유행어로 다시 소개했다."
caution = "실존 배우 신구의 얼굴은 그리지 않고, 롯데리아 로고와 제품명도 직접 드러내지 않는다. 20년 넘은 광고라 10대에게는 원본보다 'OO맛을 알아' 틀이 더 익숙할 수 있다."
verified = "verified"
notes = "550만 개는 '출시한 해'가 아니라 '출시 한 달 반 만'의 판매량이다. 크랩버거는 2004년쯤 판매가 중단됐다. 원본을 직접 본 세대가 제한적이라 fame을 5에서 4로 낮췄다."
sources = ["https://news.bizwatch.co.kr/article/consumer/2026/09/21/0028", "https://www.wikitree.co.kr/articles/479008"]

