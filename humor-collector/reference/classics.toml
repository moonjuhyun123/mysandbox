name = "대파파기 인터뷰 (대파 농사 아저씨 뒤로 넘어지는 영상)"
aliases = ["대파 농사 아저씨", "대파밭 아저씨", "대파농사 망한 농부 인터뷰", "대파파기인터뷰", "대파농사는 망했지만 웃음은 잃지 않는 영상"]
