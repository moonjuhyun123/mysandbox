caution = "실존 심사위원의 얼굴과 이름은 쓰지 않는다. 넷플릭스 IP라 화면 캡처는 쓰지 말고 말투만 패러디한다. 안성재가 운영하는 모수 서울에서 2026년 4~5월 '와인 바꿔치기' 논란이 있었다. 고객에게 2000년 빈티지를 안내하고 2005년 빈티지를 냈다는 내용이며, 매장(4.23)과 안성재 본인(5.6)이 사과했고 유튜브 채널도 잠정 중단했다. 2026년 1월에는 '두쫀쿠' 영상 논란도 있었다. 음식 브랜드 계정이므로 고급 레스토랑, 와인, 서비스 응대를 다루는 맥락에서는 이 밈을 쓰지 말고, 안성재가 보증하거나 협업한 것처럼 보이게 하지 않는다."
verified = "verified"
notes = "'나야, 들기름' 항목에 섞여 있던 것을 따로 뺐다. '나야 들기름'은 안성재가 아니라 최강록의 말이다. 한겨레 원문은 접속이 막혀 위키백과 각주로만 제목과 날짜를 확인했다. 정확한 대사는 미확인이다. 세계일보는 '채소의 익힘 정도', GQ는 '청경채의 익힘 정도'로 적었다. '김해준 안섬재 패러디', '갤럽 선호 프로그램 1위', '식당 예약 4,937% 증가', '시즌1 3주 연속 글로벌 1위'는 이번에 출처를 확인하지 못했다(한겨레·조선일보는 접속 불가, 웹검색 한도 소진)."
