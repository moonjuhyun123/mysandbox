verified = "verified"
risk_checked = true
notes = "'7대1 대결'은 2018년 7월 29일 방송에서 좀도둑 7명을 모두 잡은 것임. '호랑이 vs 기린' 구도에서 김종국을 '호랑이'라고 부르는 표현은 열어본 기사에서 확인되지 않아 별칭에서 뺌. 확인된 것은 꾹관장의 '호랑이 체육관' 설정뿐이고, 2016년 7월 24일 기사에는 '기린팀'이라는 팀명만 나옴. 런닝맨 밖의 근육·운동 이미지도 명성에 보탬이 되므로 점수를 5에서 4.5로 낮춤."
