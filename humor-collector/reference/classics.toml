caution = "윤후는 당시 미성년 출연자라 얼굴을 그리지 않는다. 농심 상표와 포장을 그대로 그리지 말고, 기생충 장면이나 배우 초상도 쓰지 않는다."
verified = "verified"
notes = "'한우' 채끝살인지는 확인한 기사(데일리안)에 나오지 않아 '채끝살'로만 적었다. 롯데마트 순위는 3월에 짜파게티가 1위, 4월에 너구리가 1위였다. 기생충의 '제시카 징글'과 '너는 계획이 다 있구나'는 따로 떨어진 밈인데, 이번에 출처를 확인하지 못해 이 항목에서 뺐다(웹검색 한도 소진)."
sources = ["https://www.xportsnews.com/article/402530", "https://www.khan.co.kr/article/201305080904581", "https://www.dailian.co.kr/news/view/870237/", "https://ko.wikipedia.org/wiki/짜파구리"]

