use_when = "한 캐릭터가 SNS에 올린 글이나 사진 때문에 곤란해지고, 옆 캐릭터가 팔짱을 끼고 한마디 하는 마지막 컷에 쓴다."
food_fit = "사진 찍고 업로드하느라 음식이 다 식거나 녹아버린 캐릭터, 혹은 맛집 리뷰를 올렸다가 악플을 받은 캐릭터에게 다른 음식이 'SNS는 인생의 낭비'라고 말하면 된다."
