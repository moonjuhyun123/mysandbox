food_fit = "무 캐릭터가 '무~야~호~'를 외치는 말장난, 알래스카에서 떠올린 연어 캐릭터, 할인이나 1+1 소식에 환호하는 음식들."
fame = 5
fame_evidence = "2019년 '오분순삭' 재업로드와 2020년 에펨코리아 무리뉴 합성 이후 '무야호 리믹스'(590만 회), '무야호마이트'(760만 회) 등 패러디가 쏟아졌다. 경향신문(2021.3)은 지상파 자막 등장까지 보도했고, 2022년 최규재 씨 방한도 기사화됐다."
caution = "실존 일반인(최규재 씨)이므로 얼굴을 닮게 그리지 말고 대사와 포즈만 빌린다. 본인은 2022년 사인지를 직접 만들어 다니는 등 밈을 즐겁게 받아들였다. MBC 방송 화면 캡처는 쓰지 않는다."
verified = "verified"
notes = "정형돈의 수습 멘트는 위키백과 기준 '그만큼 신나신다는 거지~'이다(연구자 표기 '신나시는 거지'와 다름). 리믹스 조회수 433만은 2021.3 기사 시점, 590만은 그 뒤 수치다. 재유행은 2021년이 아니라 2019~2020년에 시작됐다. '2026년 근황 화제'는 출처를 확인하지 못해 뺐다."
sources = ["https://ko.wikipedia.org/wiki/%EB%AC%B4%EC%95%BC%ED%98%B8", "https://www.khan.co.kr/article/202103141850001", "https://www.mt.co.kr/entertainment/2022/11/17/2022111720401042666"]

