verified = "partial"
notes = "'딱지 한 판 하실래요?'가 극 중 실제 대사라는 근거는 찾지 못했다. 그래서 이름을 장면명으로 바꾸고 원래 이름은 별칭으로 옮겼다. 확인된 문구는 시즌2 홍보 영상의 '저랑 게임 한 번 하시겠습니까?'다. 공유의 배역명은 '딱지남(양복남)', 기사 속 통칭은 '딱지맨'이다."
sources = ["https://en.wikipedia.org/wiki/Squid_Game_season_1", "https://jjan.kr/article/20211007741607", "https://gogumafarm.kr/?p=32558", "https://www.newsis.com/view/NISX20241209_0002989399", "https://www.huffingtonpost.kr/news/articleView.html?idxno=233745"]
caution_sources = ["https://www.washingtonexaminer.com/?p=2311580", "https://v.daum.net/v/20210930115400780", "https://www.dazeddigital.com/film-tv/article/54516/1/uk-council-squid-game-violent-challenges-viral-tiktok-netflix-red-green-light", "https://news.bloomberglaw.com/ip-law/netflix-wins-dismissal-of-squid-game-suit-by-filmmaker-1"]

