caution = "소니·넷플릭스 IP이므로 캐릭터 디자인을 베끼지 말고 장면만 오마주한다. 라면 장면 따라하기 챌린지에서 화상 입원 보도가 있었으니 뜨거운 라면 따라하기 묘사는 피한다. 넷플릭스는 2025년 8월부터 미국에서 'KPop Demon Hunters' 상표를 출원했다. 2026년 8월 18일에는 메탈 밴드 Demon Hunter 측이 넷플릭스를 상대로 상표 소송을 냈다. 그러니 제목, 로고, '케데헌'이라는 표기는 쓰지 않는다. 라면과 김밥 장면은 이미 농심(신라면 컵 캐릭터 패키지 등)과 CU(통째로 먹는 케데헌 김밥)의 공식 협업 상품이 됐다. 음식 브랜드 계정이 이 장면을 따라 하면 비공식 협업이나 앰부시 마케팅으로 보일 수 있으니, 해당 제품 포장이나 장면 구도를 연상시키지 않게 한다."
verified = "verified"
notes = "'골든'은 '핫100 상위권'이 아니라 1위였고, 애니메이션 가수 최장 1위 기록을 세웠다. 2026년 아카데미와 그래미 수상도 추가했다. 김밥 챌린지는 주로 해외 이용자 사이에서 퍼졌다고 보도됐고, 더팩트 기사에는 김밥 챌린지 언급이 없다."
sources = ["https://ko.wikipedia.org/wiki/케이팝_데몬_헌터스", "https://en.wikipedia.org/wiki/KPop_Demon_Hunters", "https://en.wikipedia.org/wiki/Golden_(Huntrix_song)", "https://www.wikitree.co.kr/articles/1069670", "https://news.tf.co.kr/read/ogmeta/2225634.htm", "https://biz.sbs.co.kr/amp/article/20000253390"]
