use_when = "음식 조합을 자랑하거나 취향 논쟁에서 서로를 맛알못이라고 몰아가는 컷에 쓴다. 의외의 조합이 맛있다고 밝혀지는 반전에도 맞는다."
food_fit = "음식 캐릭터 만화에 가장 바로 들어맞는다. 떡볶이 캐릭터가 '치즈 추가는 맛잘알'이라며 으스대거나, 탕수육이 부먹파를 맛알못이라고 부르는 장면에 쓸 수 있다."
