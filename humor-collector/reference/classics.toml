notes = "게임·스트리머 유래는 나무위키 서술이라 정확한 최초 사용은 미확인. 사용자 요청대로 '신조어' 묶음으로 분류할 것(목록에 없는 카테고리라 인터넷·커뮤니티로 둠)."
sources = ["https://namu.moe/w/%EA%B5%AD%EB%A3%B0", "https://www.yugacrew.com/yugawiki/%EA%B5%AD%EB%A3%B0", "https://bravo.etoday.co.kr/view/atc_view/19416"]

[[slang]]
name = "국뽕"
