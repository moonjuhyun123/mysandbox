origin = "쿠팡플레이 'SNL 코리아' 리부트 시즌1(2021.9.4 시작)의 'Weekend Update'. 주현영이 시즌1 2회(하지원 편)부터 앵커 안영미 옆에서 긴장한 인턴기자 '주기자'를 연기했고, 날카로운 추가 질문을 '좋은 질문? 지적? 아무튼 감사합니다'로 얼버무렸다."
