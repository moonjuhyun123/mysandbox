origin = "일본 인터넷에서 2002년 무렵 본격적으로 쓰이기 시작한 말이다. 처음엔 츤츤(퉁명)하다가 나중에 데레데레(수줍음)해지는 상황을 뜻했다(위키백과, 이 부분은 각주 없음)."
meaning = "겉으로는 퉁명스럽고 무심하지만 속으로는 상대를 챙기는 성격을 뜻한다."
use_when = "\"너 주려고 산 거 아니거든\" 하면서 몰래 챙겨 주는 장면에 쓴다."
