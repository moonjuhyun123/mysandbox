sources = ["https://m.seoul.co.kr/news/2026/02/25/20260225500013", "https://www.heraldk.com/article/2026031718135534865", "https://www.mt.co.kr/thebio/2026/03/09/2026030918175046688", "https://www.nocutnews.co.kr/news/6486750", "https://www.tenasia.co.kr/article/2026032390084"]
