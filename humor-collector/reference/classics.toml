caution = "일반 용어여서 권리 문제는 적다. 특정 실존 회사의 근무 환경을 비꼬지 않도록 해야 한다."
verified = "partial"
risk_checked = true
notes = "사람인 2016년 조사 10위는 확인했다. '2018년 무렵 핵심 키워드가 되었다'는 부분은 확인한 자료에 연도가 없어 미확인이다. 일상어로 널리 쓰여 인지도는 5로 올렸다."
