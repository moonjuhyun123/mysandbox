caution = "사람을 낮잡아 부르는 속어이다. 실존 인물이나 특정 독자를 겨냥하지 말고 캐릭터끼리 주고받는 가벼운 농담으로만 쓴다."
verified = "partial"
risk_checked = true
notes = "뜻과 준말 관계는 위키낱말사전으로 확인했다. 기원 시점과 커뮤니티는 미확인이다. 나무위키는 접속이 차단되었고 검색 한도도 소진되어 더 확인하지 못했다. 위키백과 신조어 목록에는 이 말이 실려 있지 않다."
sources = ["https://ko.wiktionary.org/wiki/관종"]

