fame_evidence = "OSEN(2016.3.1)은 기사 제목을 '김은숙표 대사에 또 설렜지 말입니다'로 달고, 유시진의 '~지 말입니다'를 대표 대사로 꼽았다. 노컷뉴스(2016.4.15)는 '~지 말입니다' 식 다나까 말투 등 각종 유행어가 탄생했다고 썼다. 위키백과 각주의 기사 제목 \"'별그대' 넘었지 말입니다\"에도 쓰였다."
caution = "실제 군대 말투에서 온 표현이라 드라마 고유 대사는 아니다. 군인이나 군대를 비하하는 쪽으로 흐르지 않게 하고, 배우 초상은 쓰지 않는다. 2016년 박근혜 대통령이 '태양의 후예'가 애국심 고취와 국가관 확립에 교육 효과가 있다고 말해 군대 미화 논란이 일었다. 같은 해 4·13 총선 때는 이 드라마를 패러디해 군복을 입고 총을 겨눈 합성 포스터('박근혜 잡을 저격수')가 논란 끝에 삭제되고 사과로 이어졌다. 군복이나 총기 이미지와 정치·선거 문구를 함께 쓰지 않는다. 참고로 국방부는 2016년 3월부터 병영에서 '~요' 말투도 쓸 수 있게 했으니 '군대는 무조건 다나까'라는 식으로 단정하지 않는다."
verified = "verified"
