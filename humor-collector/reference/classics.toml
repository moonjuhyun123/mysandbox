[[classic]]
name = "○○, 너로 정했다!"
aliases = ["피카츄, 너로 정했다", "I choose you"]
category = "기타"
year = "1999 (한국어판 애니 방영 시작), 2017년 극장판 『포켓몬스터 너로 정했다!』 한국 개봉"
origin = "『포켓몬스터』에서 지우(한지우)가 포켓몬을 내보낼 때 쓰는 전용 대사 'XXX, 너로 정했다!'이다. 일본판은 '君に決めた!', 북미판은 'I choose you!'이며, 20주년 기념 극장판 제목으로도 쓰였다."
meaning = "여럿 중 하나를 골라 내보내거나 선택을 선언할 때 쓴다. 메뉴, 옷, 사람 등 무엇을 고르든 비장하게 지목하는 말이 된다."
use_when = "메뉴판 앞에서 오래 고민하다 하나를 고르는 장면, 대표 선수를 뽑는 장면, 몬스터볼을 던지듯 무언가를 던지며 지목하는 컷에 맞다."
food_fit = "배달 앱 앞에서 고민하던 캐릭터가 치킨을 가리키며 '치킨, 너로 정했다!'를 외치는 컷에 딱 맞다. 도시락 통을 볼처럼 던져 반찬 캐릭터를 내보내는 연출도 가능하다."
fame = 4
fame_evidence = "극장판은 한국에서 누적 509,555명, 누적 매출 약 38억 원(2018년 2월 25일 기준)을 기록했다. 한지우 문서에 전용 대사로 정리되어 있다."
caution = "몬스터볼 디자인, 피카츄, 지우 외형은 상표권과 저작권 대상이므로 쓰지 않고, 대사와 던지는 동작만 빌린다. 포켓몬 컴퍼니는 2015년 팬 파티 포스터에 피카츄를 넣은 주최자를 저작권 침해로 제소했다. 2025년 9월 미 국토안보부와 2026년 3월 백악관의 포켓몬 정치 밈에는 허가한 적 없으며 정치와 무관하다고 공개 반박했다. 브랜드 계정 게시물의 캡션과 해시태그에 '포켓몬', '피카츄', '지우'를 넣지 않는다. '○○, 너로 정했다'로 정치인이나 정당, 시사 이슈를 지목하는 풍자에도 쓰지 않는다."
verified = "partial"
risk_checked = true
