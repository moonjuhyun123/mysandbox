year = "2014 (밈 유행 2016~2017)"
origin = "2014년 웹툰 '즐거우리 우리네 인생' 78화의 대사 '돈을 쓰고 돌아다니는 건 신나고 재밌는 것 같아! 탕진잼!'에서 처음 나왔다고 위키백과가 한겨레21(2016)을 인용해 적었다. 서울신문 2017년 2월 기사는 '시발비용'보다 먼저 쓰인 말로 소개했다."
meaning = "일상생활에 지장이 없는 범위에서 푼돈을 마음껏 쓰며 느끼는 재미를 이른다."
use_when = "소소한 쇼핑을 몰아서 하는 장면, 월급날 작은 사치를 즐기는 장면, 영수증이 길게 늘어지는 장면에 어울린다."
food_fit = "편의점 간식 캐릭터들이 줄줄이 장바구니에 담기며 '오늘은 탕진잼'을 외치거나, 디저트 가게를 순회하는 캐릭터의 대사로 쓸 수 있다."
fame = 4
fame_evidence = "위키백과 단독 항목이 있고, 2019년 Foreign Policy 기사 'Why Young Koreans Love to Splurge'에 tangjinjaem으로 소개되었다. 신조어 목록에도 서울신문 2017년 기사와 함께 실려 있다."
caution = "단어 자체는 자유롭게 쓸 수 있으나 원조 웹툰의 그림이나 장면을 그대로 옮기지 않는다. 과소비 미화로 읽히지 않게 가볍게 쓴다."
verified = "verified"
risk_checked = true
notes = "최초 등장 출처(한겨레21 2016 인용)를 보충했다. 정확한 유행 시점은 미확인이며, 2016~2017년 기사 용례로 추정했다."
sources = ["https://ko.wikipedia.org/wiki/탕진잼", "https://ko.wikipedia.org/wiki/대한민국의_인터넷_신조어_목록", "http://www.seoul.co.kr/news/newsView.php?id=20170211500003", "https://foreignpolicy.com/2019/07/04/why-young-koreans-love-to-splurge/"]

[[slang]]
name = "텅장"
aliases = ["텅 빈 통장"]
